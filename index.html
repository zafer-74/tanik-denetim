<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tanık Denetim">
<meta name="application-name" content="Tanık Denetim">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151B" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tanık Denetim Saha Kaydı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tek sütun, telefon öncelikli saha formu — sabit üst başlık + alt sekme çubuğu; içerik 16px kenar boşluğu, 720px azami genişlik */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F6F7F4; --line:#D6DAD3;
  --ink:#18212B; --muted:#5B6570; --accent:#F0B429; --accent-ink:#1A1405; --steel:#27415E;
  --u:#237A4B; --u-bg:#E3F2E9; --ud:#B8322A; --ud-bg:#FBE6E3; --g:#4F6481; --g-bg:#E6EBF2; --kd:#7A6A55; --kd-bg:#EFEAE2;
  --warn:#9A5B00; --warn-bg:#FFF3D6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151B; --surface:#18202A; --surface-2:#1F2833; --line:#2E3A47;
  --ink:#E6EBF0; --muted:#9AA6B2; --accent:#F2BB3D; --accent-ink:#1A1405; --steel:#8FB3D9;
  --u:#5CC98A; --u-bg:#16301F; --ud:#F07A6F; --ud-bg:#3A1C19; --g:#9DB2CF; --g-bg:#1F2A3A; --kd:#C9B79C; --kd-bg:#2E2920;
  --warn:#F2C063; --warn-bg:#33280F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#18202A; --surface-2:#1F2833; --line:#2E3A47;
  --ink:#E6EBF0; --muted:#9AA6B2; --accent:#F2BB3D; --accent-ink:#1A1405; --steel:#8FB3D9;
  --u:#5CC98A; --u-bg:#16301F; --ud:#F07A6F; --ud-bg:#3A1C19; --g:#9DB2CF; --g-bg:#1F2A3A; --kd:#C9B79C; --kd-bg:#2E2920;
  --warn:#F2C063; --warn-bg:#33280F; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px} /* iOS yakınlaştırmasını önler */
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--ud);border-color:color-mix(in srgb,var(--ud) 40%,var(--line))}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:10px}
.icon-btn svg{width:22px;height:22px}

/* ---------- Ana ekran ---------- */
.home-top{padding-block:20px 8px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--steel);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px;color:var(--bg)}
.home-top h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em}
.home-top p{margin:0;color:var(--muted);max-width:60ch}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:fit-content}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.cloud .dot{background:var(--u)}
.chip.local .dot{background:var(--warn)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.sec-title h2{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em}
.list{display:flex;flex-direction:column;gap:10px}
.audit-card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.audit-card .code{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--steel)}
.audit-card h3{font-size:16px;font-weight:600;grid-column:1/-1}
.audit-card .meta{grid-column:1/-1;color:var(--muted);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.audit-card .bar{grid-column:1/-1;margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:start}
.pill.y{background:var(--u-bg);color:var(--u)} .pill.s{background:var(--warn-bg);color:var(--warn)} .pill.n{background:var(--ud-bg);color:var(--ud)} .pill.o{background:var(--surface-2);color:var(--muted)}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.eq-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.eq-grid{grid-template-columns:1fr 1fr}}
.eq{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.eq .code{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:62px;color:var(--steel);letter-spacing:.02em}
.eq .nm{font-weight:600;line-height:1.25}
.eq .cnt{font-size:12.5px;color:var(--muted);font-weight:400}
.eq .plus{margin-left:auto;color:var(--muted);flex:none}
.install{margin-top:6px;padding:10px 12px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);font-size:14px;max-width:60ch}
.home-tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 40px}

/* segment progress bar */
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .bu{background:var(--u)} .bar .bud{background:var(--ud)} .bar .bg{background:var(--g)} .bar .bkd{background:var(--kd)}

/* ---------- Denetim ekranı ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:6px;padding-block:6px 4px}
.top-title{min-width:0;flex:1}
.top-title .code{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--steel)}
.top-title h1{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap}
.top-prog{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.top-prog .bar{flex:1}
.top-prog .counts{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh);padding-inline:4px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ud);color:#fff;font-size:11px;display:grid;place-items:center}
.page{padding-block:14px calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}

/* form alanları */
.group{margin-bottom:22px}
.group h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
.fields{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{border:0;background:transparent;padding:4px 0;outline:none;width:100%;min-height:32px}
.field input[readonly]{color:var(--muted)}
.field .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.field .row .btn{min-height:36px;padding:0 12px;font-size:13.5px}
.field:focus-within{background:var(--surface-2)}
textarea{resize:vertical}

/* çeklist */
.sec-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,88px));z-index:15;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.sec-nav::-webkit-scrollbar{display:none}
.sec-chip{flex:none;display:flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.sec-chip b{font-family:var(--f-display);font-size:17px}
.sec-chip small{color:var(--muted);font-weight:500}
.sec-chip.done{border-color:color-mix(in srgb,var(--u) 50%,var(--line))}
.sec-chip.done small{color:var(--u)}
.filter{flex:none;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:14px}
.sec-head{padding:18px 2px 8px;scroll-margin-top:calc(var(--toph,88px) + 60px)}
.sec-head .l{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;color:var(--accent)}
.sec-head h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;color:var(--ink);margin-top:2px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:calc(var(--toph,88px) + 64px)}
.item[data-s="U"]{border-left-color:var(--u)} .item[data-s="UD"]{border-left-color:var(--ud)} .item[data-s="G"]{border-left-color:var(--g)} .item[data-s="KD"]{border-left-color:var(--kd)}
.item-h{display:flex;gap:10px;align-items:baseline}
.item-h .no{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--steel);min-width:34px}
.item-h h3{font-size:15.5px;font-weight:600;line-height:1.3;min-width:0}
.item .exp{margin:0;color:var(--ink);opacity:.86;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .exp.open{display:block}
.more{border:0;background:none;padding:0;color:var(--steel);font-weight:600;font-size:13px;align-self:flex-start;min-height:28px}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"][data-v="U"]{background:var(--u);border-color:var(--u);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="UD"]{background:var(--ud);border-color:var(--ud);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="G"]{background:var(--g);border-color:var(--g);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="KD"]{background:var(--kd);border-color:var(--kd);color:var(--surface)}
.item-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-tools .btn{min-height:38px;padding:0 12px;font-size:13.5px;font-weight:500}
.item-tools .ts{margin-left:auto;font-size:12px;color:var(--muted)}
.note{width:100%;min-height:72px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:10px 12px}
.need{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:8px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{position:relative;flex:none;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* özet */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font-family:var(--f-display);font-weight:700;letter-spacing:.05em;font-size:14px;color:var(--muted)}
thead th.cu{color:var(--u)} thead th.cud{color:var(--ud)} thead th.cg{color:var(--g)} thead th.ckd{color:var(--kd)}
tfoot td{font-weight:700;background:var(--surface-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.finding{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ud);border-radius:var(--r);padding:10px 12px}
.finding.kd{border-left-color:var(--kd)}
.finding .no{font-family:var(--f-display);font-weight:700;color:var(--steel)}
.finding p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.sonuc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sonuc button{min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.sonuc button[aria-pressed="true"][data-v="Yeterli"]{background:var(--u);border-color:var(--u);color:var(--surface)}
.sonuc button[aria-pressed="true"][data-v="Şartlı Yeterli"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sonuc button[aria-pressed="true"][data-v="Yetersiz"]{background:var(--ud);border-color:var(--ud);color:var(--surface)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.refs{display:flex;flex-direction:column;gap:10px}
.refs div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.refs b{display:block;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase;font-size:14px;color:var(--steel);margin-bottom:3px}
.refs p{margin:0;font-size:14px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.legend b{font-family:var(--f-display);font-size:16px}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r);background:var(--ud-bg);color:var(--ink)}
.confirm .row{display:flex;gap:8px}

/* arama */
mark{background:color-mix(in srgb,var(--accent) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.search-btn{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.search-btn svg{width:18px;height:18px}
.search-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;min-height:46px}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:10px 0}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar .clr{border:0;background:var(--surface-2);border-radius:999px;min-height:32px;padding:0 12px;font-size:13px;font-weight:600}
.searchbar:focus-within{border-color:var(--steel)}
.sr-count{font-size:13px;color:var(--muted);margin:8px 2px 0}
.list-search{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,88px) + 54px);z-index:14;background:var(--bg);padding-block:0 8px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.res .rh{display:flex;gap:8px;align-items:baseline}
.res .code{font-family:var(--f-display);font-weight:700;color:var(--steel);font-size:14px;white-space:nowrap}
.res .no{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.res .t{font-weight:600;font-size:14.5px;min-width:0}
.res .fm{font-size:12.5px;color:var(--muted);margin-top:2px}
.res p{margin:6px 0 0;font-size:13.5px;color:var(--ink);opacity:.86}
.res .ref{margin-top:4px}

/* bilgi kopyalama */
.cover-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.cover-actions .btn{font-size:14px;padding:0 10px}
.banner{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r);background:var(--g-bg);margin-bottom:12px}
.banner p{margin:0;font-size:14px}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.banner .btn{min-height:40px;font-size:14px}
.sheet.tall{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--steel);margin:10px 0 2px}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 2px;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--steel)}
.chk .l{font-size:14px;font-weight:500}
.chk .v{grid-column:2;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chk.off{opacity:.5}
.chk.grp{border-top:0;padding-top:4px}
.chk.grp .l{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.chips button{min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:13.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--bg)}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 4px;margin-top:6px}

/* rapor (F701-056) */
.form-id{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px 14px;border-radius:var(--r);background:var(--steel);color:var(--bg)}
.form-id b{font-family:var(--f-display);font-size:22px;letter-spacing:.03em;white-space:nowrap}
.form-id span{font-size:13px;line-height:1.3;opacity:.9}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.crit-h{display:flex;gap:10px;align-items:baseline}
.crit-h .n{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);min-width:22px}
.crit-h h3{font-size:15px;font-weight:600;line-height:1.3;min-width:0;flex:1}
.tech{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.rseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rseg button{min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted)}
.rseg button[aria-pressed="true"][data-v="Y"]{background:var(--u);border-color:var(--u);color:var(--surface)}
.rseg button[aria-pressed="true"][data-v="YD"]{background:var(--ud);border-color:var(--ud);color:var(--surface)}
.rseg button[aria-pressed="true"][data-v="UD"]{background:var(--kd);border-color:var(--kd);color:var(--surface)}
.auto-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.auto-line .tag{padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.auto-line .tag.edited{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.linkbtn{border:0;background:none;color:var(--steel);font-weight:600;font-size:12.5px;padding:4px 0;min-height:28px}
.crit textarea{width:100%;min-height:86px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:10px 12px;font-size:14px}
.toggle{display:flex;align-items:center;gap:10px;min-height:32px}
.toggle input{width:22px;height:22px;accent-color:var(--steel)}
.info-row{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 14px;border-top:1px solid var(--line)}
.info-row:first-child{border-top:0}
.info-row span{font-size:13px;color:var(--muted)}
.info-row b{font-weight:500;overflow-wrap:anywhere}

.sheet-back{position:fixed;inset:0;z-index:55;background:rgba(8,10,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px}
.sheet b{font-family:var(--f-display);font-size:20px}
.sheet .fname{overflow-wrap:anywhere;font-weight:500}

/* foto görüntüleyici & toast */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.94);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;gap:8px;align-items:center;color:#EDEFF2}
.viewer .vbar span{flex:1;font-size:14px}
.viewer .btn{background:#222a33;border-color:#39434f;color:#EDEFF2}
.viewer input{width:100%;margin-top:10px;background:#1b222b;border:1px solid #39434f;color:#EDEFF2;border-radius:9px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .15s}.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}

<script>
const FORMS = [{"code": "1.A.1.1", "name": "Köprülü Kren", "method": "Kapsam Kodu: 1.A.1.1   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 15011 · TS ISO 4306-1 · TS EN 13001 serisi · ISO 9927-1 · TS ISO 4309 · TS EN 14492-2", "refTitle": "1.A.1.1 Köprülü Kren — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.1.1 – Köprülü Kren"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (tek kirişli / çift kirişli köprülü kren; alttan/üstten askılı)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Anma Kapasitesi (t) - Kaldırma Mekanizması Sayısı ve Kapasiteleri"}, {"row": 24, "label": "Açıklık (m) - Kaldırma Yüksekliği (m) - Kumanda Tipi (askılı kumanda / kabin / telsiz)"}, {"row": 25, "label": "Görev Sınıfı (U/Q sınıfı veya mekanizma grubu) - Kullanım Yeri"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.1.1 Köprülü Kren) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Kalibreli test ağırlıkları veya kalibreli yük hücresi (dinamometre) ve kaldırma aparatları (statik test için anma yükünün %125'i, dinamik test için en az %110'u vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1 / ISO 9927-1 Ek C"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Etiket ve işaret bilgileri", "d": "Kren üzerindeki üretici etiketinde (üretici adı-adresi, tip, üretim yılı, anma kapasitesi, görev sınıfı, halat/zincir bilgisi, güç kaynağı, kaldırma hızı) bilgiler okunaklı olarak mevcut mu ve rapordaki tanımlama bilgileriyle bire bir örtüşüyor mu? Kayıtlar rapora yazıldı mı?", "ref": "TS EN 14492-2 md.7.3 / TS EN 15011 md.7.4"}, {"row": 18, "no": "B2", "t": "2. Anma kapasitesi işaretlemesi", "d": "Anma kapasitesi (örn. \"50 t\" veya \"RC 50 t\") kren üzerinde açıkça işaretli mi? Her kaldırma mekanizmasının kapasitesi en azından sabit yük kaldırma aparatı (kanca bloğu) üzerinde işaretli mi? Kirişin belirli bölgelerinde veya farklı çalışma modlarında düşük kapasite varsa bu bölgeler/kapasiteler yapı üzerinde işaretli mi? Birden fazla kaldırma mekanizmasında izin verilen birlikte kullanım kombinasyonları (örn. H1+H2 / H3) kumanda veya kiriş üzerinde işaretli mi?", "ref": "TS EN 15011 md.7.4"}, {"row": 19, "no": "B3", "t": "3. Görev sınıfı ve tasarım ömrü verisi", "d": "Krenin imalatçı tarafından belirtilen sınıflandırması (U ve Q sınıfı / mekanizma grubu) belgelerden tespit edilip rapora yazıldı mı? Toplam çalışma döngüsü ve kalan tasarım ömrü bilgisi (döngü sayacı veya çalışma saati kaydı varsa) kaydedildi mi; tasarım ömrünün dolduğu veya yaklaştığı durumda imalatçı/yetkili kişi değerlendirmesi var mı?", "ref": "TS EN 15011 md.7.1, Ek A / ISO 9927-1 md.5.6.1, 5.7"}, {"row": 20, "no": "B4", "t": "4. Kullanım kılavuzu ve imalatçı talimatları", "d": "Türkçe kullanım/bakım kılavuzu krende veya kullanıcıda mevcut mu? Kılavuzdaki model/seri numarası krenle uyumlu mu; muayene yöntem ve aralıkları, bileşen değiştirme kriterleri, aşınma limitleri, güvenlik tertibatlarının (kapasite sınırlayıcı vb.) orijinal ayar değerleri ve muayene sonrası test talimatları içeriyor mu? Kılavuz yoksa yetkili kişi tarafından hazırlanmış muayene talimatı var mı?", "ref": "TS EN 15011 md.7.2, 7.3.3 / ISO 9927-1 md.4.2"}, {"row": 21, "no": "B5", "t": "5. Seyir defteri, bakım ve muayene kayıtları", "d": "Seyir defteri/sürekli çalışma kaydı mevcut mu ve güncel mi (son periyodik ve sık denetim özetleri, son 90 günden az olmamak üzere günlük ön işletme kontrolleri, arıza/onarım/parça değişimi kayıtları, imzalı)? Önceki periyodik kontrol raporundaki uygunsuzlukların giderildiği kayıtlarla doğrulandı mı?", "ref": "ISO 9927-1 md.10.1, 10.2, 10.3 / md.5.3"}, {"row": 22, "no": "B6", "t": "6. Periyodik kontrol aralığı ve muayene türü", "d": "Önceki periyodik muayenenin tarihi kontrol edilerek muayene aralığının 12 ayı aşmadığı doğrulandı mı? Üç ayda bir yapılan sık denetim (servis) kayıtları var mı? Kren 5 yaşını aştıysa gelişmiş periyodik denetim veya büyük denetim rejiminin uygulanıp uygulanmadığı, ithal/yeniden hizmete alınan ve kayıtsız krenlerde büyük denetim gerekliliği değerlendirildi mi?", "ref": "ISO 9927-1 md.5.3 / 5.4 / 5.6.1 / 5.7"}, {"row": 23, "no": "B7", "t": "7. Önemli değişiklik/onarım ve olağanüstü olay bilgisi", "d": "Çarpışma, aşırı yükleme, yangın, güvenlik cihazı arızası gibi olağanüstü olay veya taşıyıcı yapı, kaldırma mekanizması, kumanda sistemi, kapasite değişikliği gibi onarım/modifikasyon olup olmadığı sorgulanıp kaydedildi mi? Varsa olağanüstü denetim yapıldı mı; anma kapasitesi değişmişse tasarım değişikliği kabul edilerek büyük denetim ve yeni krenler için yük testi uygulandı mı?", "ref": "ISO 9927-1 md.5.5 / md.11"}, {"row": 24, "no": "B8", "t": "8. Kullanım koşulları ve ekipmana özgü veriler", "d": "Krenin kullanım yeri/ortamı (kapalı-açık, sıcak, aşındırıcı ortam), kaldırma mekanizması sayısı, kumanda tipi (askılı, kabin, telsiz), halat tipi/çapı/yapısı/kategori numarası (RCN), varsa doğrudan mı dolaylı mı etkili kapasite sınırlayıcı kullanıldığı, ana kiriş için imalatçının verdiği hesaplanmış sapma değeri ve konumu tespit edilip kaydedildi mi? Krene erişimin (yürüyüş yolu, merdiven, kabin girişi) rapordaki tanıma uygunluğu doğrulandı mı?", "ref": "TS EN 15011 md.7.3.2, 5.5.1 / TS ISO 4309 md.5.3.1, 6.2.2"}, {"row": 25, "no": "B9", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 26, "no": "B10", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 27, "no": "B11", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 29, "no": "C1", "t": "Muayene öncesi güvenlik önlemleri", "d": "Muayeneye başlamadan önce kontrol istasyonunda 'muayene devam ediyor' uyarısı asıldı mı? Elektrikli kısımlar incelenirken enerji kesilip kilitlenip etiketlendi mi? Aynı yolda başka kren varsa muayene edilen krenin hareket ettirilmesini önleyecek tedbir alındı mı? Yükseklikte çalışmada düşmeye karşı korunma sağlandı, kıstırma/ezilme bölgelerine girişte önlem alındı mı?", "ref": "ISO 9927-1 Ek C (a-o)"}, {"row": 30, "no": "C2", "t": "Yük testi öncesi kaldırma aparatlarının kontrolü", "d": "Yük testinden önce test yükünün ve sapan/kaldırma aparatlarının hasarsız ve güvenli olduğu, yükün güvenli bağlandığı kontrol edildi mi? Test yükünün gerçek (kalibreli) kütlesi belgelendi mi?", "ref": "ISO 9927-1 Ek C (m)"}, {"row": 31, "no": "C3", "t": "Yapısal/taşıyıcı elemanlar (kiriş, uç kirişler)", "d": "Ana kiriş, uç taşıyıcılar (kafa kirişleri), araba çerçevesi ve bağlantılarda (kaynak dikişleri, cıvata/perçin bağlantıları) çatlak, kalıcı deformasyon, korozyon, gevşeklik gözle ve gerekiyorsa çekiçleme testi/tahribatsız muayene ile kontrol edildi mi? Şüpheli kritik bölgelerde MT/PT uygulandı mı?", "ref": "ISO 9927-1 md.6.1, 6.2 / TS EN 15011 md.5.2.2"}, {"row": 32, "no": "C4", "t": "Kanca ve kanca bloğu", "d": "Kancada çatlak, ağız açıklığında açılma, aşınma, burulma/deformasyon, kanca somunu-emniyet kilidi ve kanca yatağının serbest dönüşü kontrol edildi mi? Kancanın aşınma limiti imalatçı/standart sınır değerine göre değerlendirilip ölçüm değeri kaydedildi mi? Kanca bloğu ve kancada anma kapasitesi işareti okunaklı mı?", "ref": "TS EN 15011 md.7.3.3, 7.4 / TS EN 14492-2 md.5.6"}, {"row": 33, "no": "C5", "t": "Halat: görünür kopuk tel sayısı", "d": "Halat tüm uzunluğu boyunca (uzun halatta çalışma uzunluğu artı tamburda en az beş sargı) kontrol edilip kopuk teller sayıldı mı? Halat kategori numarasına (RCN) göre 6d ve 30d uzunluktaki ıskarta kopuk tel sayısı (Tablo 3; çok katmanlı tamburda ayrı sütun) ile karşılaştırıldı mı? Vadi teli kopuğu (bir sarım boyunda 2 veya daha fazla), sonlandırmada 2 veya daha fazla kopuk tel ve lokalize gruplaşma ıskarta kriteri olarak değerlendirildi mi?", "ref": "TS ISO 4309 md.5.3.3, 6.2.1, 6.2.2, 6.2.4 (Tablo 2-3)"}, {"row": 34, "no": "C6", "t": "Halat çapı ölçümü", "d": "Halat çapı, kesiti çevreleyen dairenin birbirine dik iki ölçümünün ortalaması olarak kumpasla ölçüldü mü ve referans çapla karşılaştırılıp nominal çapın yüzdesi olarak azalma hesaplandı mı? Tek katmanlı halatta ıskarta sınırı: çelik çekirdekli halatta %7,5, lif çekirdekli halatta %10, dönmeye dayanıklı halatta %5 (referans çapa göre) aşılmadı mı; belirgin yerel azalma (çekirdek arızası) yok mu? Ölçüm değeri kaydedildi mi?", "ref": "TS ISO 4309 md.3.2, 3.3, 6.4.1, 6.4.2, 6.4.3 (Tablo 5)"}, {"row": 35, "no": "C7", "t": "Halat: korozyon, deformasyon ve hasar", "d": "Halat yüzeyi temizlenerek korozyon (dış/iç/aşınma korozyonu), dalgalılık (düz halatta boşluk d/3, kasnak-tambur arası d/10 ve üzeri ıskarta), sepet deformasyonu, çekirdek/tel çıkıntısı, yerel çap artışı (çelik çekirdekte %5, lif çekirdekte %10 ve üzeri araştırma), yassılaşma, bükülme/kıvrım, ısı veya elektrik arkı hasarı gözle kontrol edildi mi? Ciddi bozulmalarda halat ıskartaya ayrıldı mı?", "ref": "TS ISO 4309 md.6.6, 6.7.2-6.7.10 (Tablo 6)"}, {"row": 36, "no": "C8", "t": "Halat sonlandırmaları ve bağlantı noktaları", "d": "Halat uç bağlantısı (soket, kama, yüksük, kelepçe), tambura bağlantı ve denge kasnağı çevresinde kopuk tel, çatlak, korozyon, kayma ve doğru montaj kontrol edildi mi? Sonlandırmada gevşek tel olup olmadığı sonda ile denendi mi? Halat kenarların üzerinden geçmeden tambura sabit ve halat kılavuzları ile temas ederek hasar görmüyor mu?", "ref": "TS ISO 4309 md.5.3.3, 5.3.4 / TS EN 14492-2 md.5.7.5-5.7.9"}, {"row": 37, "no": "C9", "t": "Halat tamburu ve kasnaklar", "d": "Kanca en alt konumundayken tamburda halat sabitleme noktası öncesinde en az iki tam sargı kalıyor mu? Tambur oluğunda aşınma/hasar, flanş yüksekliği (en üst halat katından en az 1,5 x halat çapı), kasnak oluklarında aşınma, kasnak ve tamburun yataklarında serbest dönüşü, halatın oluktan çıkmasını önleyen koruma ve kasnak koruyucuları kontrol edildi mi?", "ref": "TS EN 14492-2 md.5.7.2, 5.7.4, 5.7.6 / TS ISO 4309 md.4.8"}, {"row": 38, "no": "C10", "t": "Zincirli kaldırma ünitesi (varsa)", "d": "Zincirli kaldırma ünitesi varsa zincirde bakla ve bağlantı deformasyonu, aşınma, uzama, çatlak, zincir kılavuzu ve zincir ankrajı kontrol edildi mi? Uzama/aşınma ölçümü imalatçının sınır değerine göre yapılıp kaydedildi mi?", "ref": "TS EN 15011 md.7.3.3 / TS EN 14492-2 md.5.8"}, {"row": 39, "no": "C11", "t": "Kaldırma freni (servis ve varsa yedek fren)", "d": "Fren balata/disk/kampana aşınması ve ayar durumu imalatçı sınırlarına göre kontrol edildi mi? Fren; kumanda nötre döndüğünde, acil durdurmada ve güç kesildiğinde otomatik devreye giriyor mu? Sadece güçle serbest bırakılan tipte olup yağ/toz girişine karşı korunmuş mu? Yedek fren varsa servis freniyle sıralı çalıştığı test edildi mi?", "ref": "TS EN 15011 md.5.4.2.1-5.4.2.3, 6.3.2.1 / TS EN 14492-2 md.5.4"}, {"row": 40, "no": "C12", "t": "Kaldırma freni yük altında denemesi", "d": "Anma yüküyle nominal hızda indirme sırasında acil durdurma çalıştırılarak fren testi yapıldı mı? Yük kaymadan durdu, kaldırma mekanizmasında veya frende mekanik hasar oluşmadı mı? Yükün daha küçük olduğu durumda daha yüksek indirme hızı sağlanıyorsa o yük/hız kombinasyonu da denendi mi?", "ref": "TS EN 15011 md.6.3.2.4"}, {"row": 41, "no": "C13", "t": "Köprü ve araba yürüyüş frenleri", "d": "Köprü ve araba yürüyüş hareketlerinde fren, hareketi yavaşlatıp durduruyor ve istenmeyen hareketi önlüyor mu? Yürüyüş motoru/fren kontrolü yüksüz ve yükle nominal hızda denenip durma mesafesi ve savrulma gözlendi mi?", "ref": "TS EN 15011 md.5.4.2.1, 5.4.4.1, 6.3.2.1"}, {"row": 42, "no": "C14", "t": "Dişli kutuları ve tahrik elemanları", "d": "Redüktör ve dişli kutularında yağ seviyesi, yağ sızıntısı, anormal ses/titreşim/ısınma, kaplin ve bağlantı elemanlarında gevşeklik/aşınma kontrol edildi mi? Açık dişliler ve zincir tahrikleri personel çalışma alanında koruyucu ile kapatılmış mı?", "ref": "TS EN 15011 md.5.4.7, 5.6.2.6, 7.3.3"}, {"row": 43, "no": "C15", "t": "Tekerlekler, ray ve raydan çıkma koruması", "d": "Köprü ve araba tekerleklerinde flanş ve tekerlek yüzeyi aşınması, çatlak, yatak sesi; ray ve ray bağlantılarında aşınma, gevşeklik, kaçıklık kontrol edildi mi? Aşınma ölçümleri imalatçı/standart sınır değerine göre değerlendirilip kaydedildi mi? Raydan çıkma halinde krenin/arabanın düşmesini önleyen yanal/dikey kılavuz veya tutucular (tekerlek flanş yüksekliğinin %70'inden fazla kalkmaya karşı) mevcut mu?", "ref": "TS EN 15011 md.5.4.4.5, 5.4.6.1, 7.3.3"}, {"row": 44, "no": "C16", "t": "Uç durdurucular ve tamponlar", "d": "Köprü ve araba yolu uçlarında mekanik uç durdurucular ve tamponlar mevcut, hasarsız ve sağlam bağlanmış mı? Sadece sürtünmeli cıvata bağlantısıyla sabitlenmiş uç durdurucularda pozitif kilitleme veya yedek tedbir var mı? Aynı yolda birden fazla kren varsa krenler arası tamponlar mevcut mu?", "ref": "TS EN 15011 md.5.4.4.7, 5.5.3.3"}, {"row": 45, "no": "C17", "t": "Kaldırma üst/alt hareket sınırlayıcıları", "d": "Kaldırma üst ve alt limit anahtarları yüksüz olarak yavaş hızda yaklaşılıp fiilen çalıştırılarak denendi mi? Sınırlayıcı çalışınca hareket durdu ve yalnızca ters yönde hareket mümkün mü? Alt sınırlayıcı halatın tamburda minimum bağlantısını koruyor mu? Elektromekanik sınırlayıcılarda pozitif açmalı tip kullanılmış mı?", "ref": "TS EN 15011 md.5.5.3.1, 6.3.2.1 / TS EN 14492-2 md.5.2.4.1"}, {"row": 46, "no": "C18", "t": "Yedek (ikinci) üst sınırlayıcı", "d": "Krende ikinci (yedek) kaldırma üst sınırlayıcısı varsa birinci sınırlayıcının bağlantısı kesilerek hem düşük hem yüksek hızda hareket ettirilip yedek sınırlayıcının durdurduğu doğrulandı mı? Devreye girdikten sonra yalnızca reset işlemiyle ve ters yönde hareket mümkün mü? Test sonunda birinci sınırlayıcı eski çalışma ayarına döndürüldü mü?", "ref": "TS EN 15011 md.5.5.3.2, 6.3.1, 6.3.2.1"}, {"row": 47, "no": "C19", "t": "Köprü ve araba yürüyüş limitleri, çarpışma önleme", "d": "Köprü ve araba yürüyüş hareketlerinin ucundaki sınırlayıcılar ve (varsa) yavaşlatma sınırlayıcıları tampon konumuna önce yavaş hızda yaklaşılarak denendi mi? Aynı yolda birden fazla kren varsa veya tampon enerjiyi karşılamıyorsa çarpışma önleme sistemi çalışıyor mu?", "ref": "TS EN 15011 md.5.5.3.1, 5.5.3.3, 6.3.2.1"}, {"row": 48, "no": "C20", "t": "Anma kapasitesi sınırlayıcının varlığı ve ayarı", "d": "Güç tahrikli ve anma kapasitesi 1 000 kg ve üzeri kren/kaldırma mekanizmasında kapasite sınırlayıcı var mı? Sınırlayıcı türü (doğrudan veya dolaylı etkili) belirlenip orijinal ayar değerleri (imalatçı belgesi/etiketi) ile mevcut ayarın uyumu doğrulandı mı; mühür/kilit bozulmamış ve by-pass edilmemiş mi? Değişken kapasiteli/çok kaldırma mekanizmalı krenlerde sınırlayıcı ve göstergeler buna göre çalışıyor mu?", "ref": "TS EN 15011 md.5.5.1.1, 5.4.3.2-5.4.3.4, 7.3.3 / ISO 9927-1 md.6.3, 12"}, {"row": 49, "no": "C21", "t": "Kapasite sınırlayıcı ayar değerleri", "d": "Dolaylı etkili sınırlayıcıda tetikleme faktörünün genel olarak 1,1 veya altında olduğu; doğrudan etkili sınırlayıcıda ayar değiştirilmeden anma kapasitesinin 1,1 katı yükün kaldırılabildiği ve sınırlayıcının sürtünmeli/pnömatik tipte 1,6 katı, hidrolik tipte 1,4 katı (mRC x φDAL) değerini aşan yüke izin vermediği belgeden/ölçümden doğrulandı mı?", "ref": "TS EN 15011 md.5.5.1.2, 5.5.1.3 / TS EN 14492-2 md.5.2.2.2"}, {"row": 50, "no": "C22", "t": "Anma kapasitesi göstergesi ve uyarıları", "d": "Anma kapasitesinin yük konumuna göre değiştiği krenlerde kapasite göstergesi çalışıyor mu; anma kapasitesinin %90'ında görsel uyarı ve aşırı yükte görsel veya sesli uyarı veriyor mu? Ekran ve göstergelerin doğruluğu bilinen yükle kontrol edildi mi?", "ref": "TS EN 15011 md.5.5.2.1, 5.7.6 / ISO 9927-1 md.6.3"}, {"row": 51, "no": "C23", "t": "Acil durdurma tertibatları", "d": "Acil durdurma (kırmızı, sarı zeminli, kendinden kilitlemeli mantar başlı buton) tüm kumanda istasyonlarında ve gerekli yerlerde (makine dairesi dahil) mevcut mu? Her hareket için ve acil durdurmanın her konumunda ayrı ayrı denendi mi; devreye girince tüm hareketler durdu ve reset yapılmadan yeniden kalkış olmadı mı? Telsiz kumandada verici üzerindeki durdurma fonksiyonu denendi mi?", "ref": "TS EN 15011 md.5.3.5.2, 5.3.5.3, 6.3.2.1"}, {"row": 52, "no": "C24", "t": "Kumanda elemanları ve kumanda istasyonu", "d": "Kumanda elemanları (askılı kumanda/kabin/telsiz) hasarsız mı, hareket yönleri ve fonksiyonlar buton üzerinde veya yakınında işaretli mi, buton renkleri uygun mu (başlat yeşil, durdur siyah, bekle-çalış beyaz, reset mavi, acil durdurma kırmızı)? Hareket yalnızca kumandanın nötr konumundan başlatılabiliyor, bırakıldığında otomatik nötre dönüp hareket duruyor mu? Kabinli krende kabin sağlamlığı, camlar, giriş ve acil tahliye yolu uygun mu?", "ref": "TS EN 15011 md.5.3.5.2, 5.6.1, 5.6.2.1"}, {"row": 53, "no": "C25", "t": "Elektrik donanımı ve besleme sistemi", "d": "Pano, kablolar, iletken bara/kablo sepeti (festoon) ve akım toplayıcılar (kayıcı fırça) hasarsız ve gerilimli kısımlara temasa karşı korumalı mı? Ana şalter, koruma/topraklama bağlantısı süreklilik ve izolasyon direnci ölçümü yapıldı, motor akımı tasarım değeriyle orantılı mı? Koruma by-pass tertibatı özel alet veya anahtar gerektiren korumalı yapıda mı?", "ref": "TS EN 15011 md.5.3.2, 5.3.3, 5.3.4.2, 6.3.2.3"}, {"row": 54, "no": "C26", "t": "Güvenlik ile ilgili kontrol fonksiyonları", "d": "Güvenlikle ilgili kontrol fonksiyonları (motor besleme fazlarından ikisinin kesilmesinde frenin devreye girmesi, telsiz kumandada iletişim kaybı/verici durdurma düğmesinde hareketin durması) fiilen veya imalatçı talimatına göre denenerek doğrulandı mı? Kombine başlat-durdur kontrolleri hareket tahriklerinde kullanılmıyor mu? Acil durdurma reset işlemi hareketi kendiliğinden yeniden başlatmıyor mu?", "ref": "TS EN 15011 md.5.3.4.1, 5.3.4.3, 5.7.4 / TS EN 14492-2 md.5.4"}, {"row": 55, "no": "C27", "t": "Erişim yolları, korkuluklar ve koruyucular", "d": "Bakım ve kontrol noktalarına erişim yolları (merdiven, yürüyüş platformu, korkuluk, kapı/kilitleme) mevcut, sağlam ve güvenli mi? Yüksekten düşmeye karşı ankraj noktaları var mı? Hareketli parçalar arasında ezilme/kesilme riskine karşı koruyucular ve halat/kasnak geçiş koruyucuları yerinde mi? Kren ile bina/engel arasındaki açıklıklar tavsiye edilen değerlere (uç taşıyıcı-bina arası 50 mm, kalıcı engellere 500 mm, erişim yolu olmayan yerde 100 mm) uygun mu?", "ref": "TS EN 15011 md.5.6.2.1-5.6.2.6"}, {"row": 56, "no": "C28", "t": "Aydınlatma ve acil durum aydınlatması", "d": "Kabin (en az 200 lx), makine odası (en az 100 lx), elektrik odası (en az 100 lx) ve gerekli çalışma istasyonlarında (en az 50 lx) aydınlatma yeterli mi? Lüksmetreyle ölçüm yapıldı mı? Binilebilir operatörlü krende sahada acil aydınlatma yoksa akülü acil çıkış aydınlatması var mı?", "ref": "TS EN 15011 md.5.6.3"}, {"row": 57, "no": "C29", "t": "Uyarı işaretleri ve sesli uyarı cihazı", "d": "Krende uyarı etiket ve işaretleri (kontrast renkli, ömürlü, okunaklı) mevcut mu? Operatörün çalıştıracağı sesli uyarı cihazı (korna) çalışıyor mu? Sıcak yüzey ve yangın söndürücü gereken yerlerde (kabin, makine ve elektrik odası) koruma/işaretleme ve söndürücü var mı?", "ref": "TS EN 15011 md.5.7.1, 5.7.2, 5.7.5, 5.4.8.1, 5.4.8.3"}, {"row": 58, "no": "C30", "t": "Yüksüz fonksiyon testi", "d": "Kren tüm hareketleri (kaldırma, araba, köprü) hareket aralığının tamamı boyunca yüksüz olarak nominal hıza kadar çalıştırıldı mı? Hareketlerin düzgün olduğu, frenlerin etkin çalıştığı, sınırlayıcı ve gösterge ayarlarının doğru olduğu, anormal ses/titreşim/ısınma olmadığı doğrulandı mı? Tamponlara önce yavaş hızda yaklaşıldı mı?", "ref": "TS EN 15011 md.6.3.2.1 / ISO 9927-1 md.6.4"}, {"row": 59, "no": "C31", "t": "Statik yük testi", "d": "Güç tahrikli kaldırma mekanizmalı krende statik test yükü yerden 100 mm ile 200 mm yukarıda asılı tutularak uygulandı mı? Test yükü en az anma kapasitesinin %125'i (Yönetmelik Ek-III 2.2.1: statik 1,25) veya tasarımdaki φ2 faktörü x kaldırma yükünden büyük olan değer mi? Test kritik araba konumlarında (açıklık ortası, uç konumlar) ve gerekli süre boyunca uygulanıp test sırasında hareketler ayrı ayrı yapıldı mı? Kırık, kalıcı deformasyon, bağlantılarda gevşeme veya hasar belirtisi yok mu?", "ref": "TS EN 15011 md.6.3.2.2 / ISO 9927-1 md.6.6"}, {"row": 60, "no": "C32", "t": "Dinamik yük testi", "d": "Dinamik test anma kapasitesinin en az %110'u ile yapıldı mı (Yönetmelik Ek-III 2.2.1: dinamik 1,1)? Her hareketin tekrarlanan başlatılıp durdurulması ve kullanım amacına uygun birleşik hareketler yapıldı; acil durdurma ve tampon çarpması dinamik test sırasında uygulanmadı mı? Test boyunca çalışma düzgünlüğü, fren etkinliği, sınırlayıcı/gösterge doğruluğu ve motor akımı izlendi mi?", "ref": "TS EN 15011 md.6.3.2.3 / ISO 9927-1 md.6.6"}, {"row": 61, "no": "C33", "t": "Aşırı yük sınırlayıcı performans testi", "d": "Kapasite sınırlayıcının koruma performansı, anma kapasitesinin %110 ile %125'i arasında bir yükün gevşek halat toplandıktan sonra ön germesiz, kontrol sisteminin izin verdiği azami hızda kaldırılarak sınırlayıcı tetikleme noktasına kadar çıkılarak denendi mi? Sınırlayıcı kaldırmayı durdurdu, sonrasında tahrik/taşıyıcı yapıda hasar ve bağlantılarda gevşeme yok mu? Doğrudan etkili sınırlayıcıda test için ayar değiştirilmedi mi?", "ref": "TS EN 15011 md.6.3.2.3, 5.5.1.2, 5.5.1.3"}, {"row": 62, "no": "C34", "t": "Kiriş sapması ölçümü", "d": "Krenin yük testi sonrası ana kiriş orta noktası sapması ölçüldü mü (yüksüz ve anma yüklü halde kirişin altından sabit zemine olan mesafe farkı, kren mümkün olduğunca ray desteklerine yakın konumda, konum kaydedilerek)? Ölçülen sapma imalatçının verdiği hesaplanmış tasarım değeriyle karşılaştırılıp standarttaki kabul toleransı içinde olduğu doğrulandı ve değer kaydedildi mi?", "ref": "TS EN 15011 md.6.3.2.5, 7.3.2"}, {"row": 63, "no": "C35", "t": "Test sonrası muayene ve ayarların geri alınması", "d": "Testler sonrası taşıyıcı yapı, kaynak/cıvata bağlantıları, kanca, halat, fren, tekerlek ve ray kısımları kalıcı deformasyon, çatlak, gevşeme, sızıntı veya hasar yönünden yeniden gözle kontrol edildi mi? Test kolaylığı için devre dışı bırakılan veya ayarı değiştirilen tüm sınırlayıcılar yeniden etkinleştirilip öngörülen çalışma ayarlarına döndürüldü mü? Test sonuçları kaydedildi mi?", "ref": "TS EN 15011 md.6.3.1, 6.3.2.2, 6.3.2.3 / ISO 9927-1 md.5.4"}, {"row": 64, "no": "C36", "t": "Uygunsuzlukların kaydı ve rapor", "d": "Tespit edilen kusurlar ve zararlı koşullar (çatlak, şiddetli korozyon, halat ıskarta kriterleri, aşınma limiti aşımı vb.) ile bunlardan etkilenebilecek diğer bileşenler yazılı rapora işlendi mi? Sonraki periyodik muayenede özel dikkat gerektiren bileşenler ve halat için bir sonraki muayenenin azami zaman aralığı belirtildi mi? Güvenlik sorunları giderilmeden krenin kullanıma verilmeyeceği açıkça bildirildi mi?", "ref": "ISO 9927-1 md.5.1, 5.4, 10.3 / TS ISO 4309 md.5.3.5"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 66, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 67, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 68, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 69, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 70, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 71, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 72, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 73, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 74, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 76, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 77, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 78, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 79, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 80, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 81, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 82, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 83, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 84, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 85, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 86, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 87, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 88, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 15011 — Vinçler - Köprü ve portal vinçler"], ["Standart 2", "TS ISO 4306-1 — Vinçler - Sözlük - Bölüm 1: Genel (sınıflandırma ve terimler)"], ["Standart 3", "TS EN 13001 serisi — Vinçler - Genel tasarım"], ["Standart 4", "ISO 9927-1 — Vinçler - Denetimler - Bölüm 1: Genel (TS ISO 9927-1)"], ["Standart 5", "TS ISO 4309 — Vinçler - Çelik halatlar - Bakım ve onarım, muayene ve ıskarta"], ["Standart 6", "TS EN 14492-2 — Vinçler - Motorlu vinçler ve kaldırma tertibatları (kaldırma ünitesi/hoist gerektikçe)"], ["Yük / fonksiyon testi notu", "Statik test: TS EN 15011 md.6.3.2.2'ye göre yük yerden 100-200 mm kaldırılıp asılı tutulur; test yükü anma kapasitesinin en az %125'i veya tasarımdaki φ2 x kaldırma yükünden büyük olan değerdir, kritik araba konumlarında (açıklık ortası, uç konumlar) uygulanır. Dinamik test: anma kapasitesinin en az %110'u ile md.6.3.2.3'e göre tüm hareketlerin tekrarlı başlatılıp durdurulmasıyla yapılır; aşırı yük sınırlayıcı performansı %110-%125 arası yükle denenir; fren testi anma yükü + nominal hızda acil durdurma ile yapılır (md.6.3.2.4); kiriş sapması yük testlerinden sonra ölçülür (md.6.3.2.5). Yönetmelik Ek-III 2.2.1 (azami yılda bir işletme kapasitesi ile kontrol; azami 3 yılda bir veya önemli bakım-onarım sonrası statik 1,25 ve dinamik 1,1) ile uyumludur; standart statik yük için φ2 tabanlı daha yüksek bir değere işaret edebildiğinden bu durumda tasarım verisi esas alınmalıdır. ISO 9927-1 md.5.4 periyodik muayene aralığını en fazla 12 ay, sık denetimi 3 ay olarak belirler; md.6.5 yük testinde test yükünün anma kapasitesini aşmamasını, ulusal mevzuat gerektiriyorsa aşılabileceğini söyler; statik/dinamik testler ISO 4310'a göre yapılır (metin sağlanmadı)."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) TS EN 15011 md.6.3.2.5 sapma kabul toleransı Türkçe çeviride 'bu 10 veya 5 mm (hangisi daha büyükse)' biçiminde bozuk; yüzde ifadesi kaybolmuş olabilir, bu nedenle sayısal değer çeklistte yazılmadı. 2) md.6.3.2.2 doğrudan etkili sınırlayıcı için statik yük ifadesi çeviride belirsiz; çeklistte sadece genel kural yazıldı. 3) Kanca, tekerlek-ray, fren balatası ve zincir aşınma limitleri için sayısal sınır değer metinde yok (md.7.3.3 sadece imalatçının limit vermesini ister); 'imalatçı/standart sınır değerine göre' denildi. Ray toleransı için ISO 12488-1 ve zincir/kanca için ilgili standart metinleri sağlanmadı. 4) TS ISO 4306-1 metni verilmediği için standart adı çeviri tahminidir; sınıflandırma detayı ve ISO 4310 (statik/dinamik test kodu) doğrulanamadı. 5) Halat ıskarta değerleri: Tablo 3'te M5-M8 mekanizma sınıfı için dipnot d (listelenen sayının iki katı) çeviride yerleşimi net değil; çeklistte RCN'ye göre Tablo 3'e atıf yapıldı, tek tek sayısal değer yazılmadı (yalnızca çap azalması %7,5/%10/%5, dalgalılık d/3 ve d/10, çap artışı %5/%10 yazıldı, bunlar metinde doğrulandı). 6) md.5.6.2.1 boşluk değerleri (500/100/50 mm) 'tavsiye edilir' niteliğinde ve çeviri madde işaretleri karışık; çeklistte tavsiye olarak yazıldı. 7) md.5.4.2.3 ve TS EN 14492-2 md.5.4 fren tork katsayıları (%60 fazla, 1,8 x ML x η) tasarım gerekliliğidir, sahada ölçülemeyeceği için çeklistte yer almadı. 8) TS EN 15011 standardı 'yayımlandığı tarihten sonra imal edilen' krenler için geçerlidir (md.1); eski krenlerde uygulamada ISO 9927-1 ve imalatçı belgeleri esas alınmalıdır. 9) Standart adlarının Türkçe karşılıkları verilen BS çevirisinden alındı; TSE resmi başlıkları farklı olabilir."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B9"], ["A8", "A9"], [], ["A4", "A12", "A13", "B4", "B5"], ["B1", "B2", "B3", "B6", "B7", "B8"], ["C2", "C30", "C31", "C32", "C33", "C35"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36"], ["D1", "B11"], ["D2", "D5", "E3", "E5", "E11", "B10"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.3.2", "name": "Yükleyici Kren", "method": "Kapsam Kodu: 1.A.3.2   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 12999 · TS ISO 9927-1 · TS ISO 4309", "refTitle": "1.A.3.2 Yükleyici Kren — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.3.2 – Yükleyici Kren"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (araç üstü hidrolik yükleyici kren / bom tipi: teleskopik-mafsallı)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı (vinç ve montajcı plakası)"}, {"row": 23, "label": "Nominal Kapasite (kg) / Maks. Net Kaldırma Momenti (kNm)"}, {"row": 24, "label": "Maks. Hidrolik Uzanım / Toplam Erişim (m) - Bom Sayısı"}, {"row": 25, "label": "Montaj Edilen Araç Plaka/Şasi No - Stabilizatör Tipi (manuel/hidrolik)"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.3.2 Yükleyici Kren) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Kalibre test ağırlıkları (kalibre yük hücresi/dinamometre ile birlikte; nominal kapasitenin 1,25 ve 1,1 katını karşılayacak), manometre/hidrolik basınç ölçer, uzunluk ölçer (şerit metre/lazer metre) ve kumpas (halat çapı), kronometre vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1 / ISO 9927-1 Ek C"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Üretici ve montajcı plakaları", "d": "Üretici plakasında üretici, üretim yılı, seri no ve tip; montajcı plakasında montajcı adı-adresi, kurulum yılı, vinç seri no ile araç şasi/tescil no okunup kaydedildi mi? Plakalar kalıcı, hava koşullarına dayanıklı ve okunaklı mı; vinç seri no ile teknik dosya/kılavuz uyumu doğrulandı mı?", "ref": "TS EN 12999 md.7.3.1 / 7.3.2 / 7.3.3"}, {"row": 18, "no": "B2", "t": "2. Kullanım kılavuzu ve yük diyagramları", "d": "Kullanım kılavuzu (kontrol sembolleri, sınırlama/gösterge cihazları, uyarı işaretleri, boşaltma/hizmet koşulları, maks. eğim, çalışma öncesi-sonrası kontroller) vinçle birlikte mi ve bu vinç modeline mi ait? Tüm bom konfigürasyonları için nominal kapasite yük tablosu kılavuzda mevcut mu?", "ref": "TS EN 12999 md.7.2.1 / 7.2.3.1 / 7.2.3.3 / 7.2.3.4 / 7.3.4.1 b)"}, {"row": 19, "no": "B3", "t": "3. Nominal kapasite yük plakası", "d": "Yük plakası tüm sabit kumanda yerlerinden açıkça görülüyor mu? En iç konumdaki yük (maks. çalışma yükü), uzanım-kapasite değerleri, bom resmi, kapasitenin bağlı olduğu koşullar (stabilizatör konumu, dönüş sektörü) ve kanca/bağlantı noktası 'Max XXX kg' işaretleri okunup kayıt altına alındı mı?", "ref": "TS EN 12999 md.7.3.4.1 a) / 7.3.4.2"}, {"row": 20, "no": "B4", "t": "4. Montaj ve stabilite dokümantasyonu", "d": "Montajcının test raporu (uygulanan stabilite test yükü/basıncı, yarıçap ve dönüş açıları) ve değişken stabilizatör açılımı için nominal kapasite belgeleri mevcut, vinçle birlikte ve şasi/montaj çerçevesi bilgileriyle uyumlu mu? Test raporu ile yük plakası kapasiteleri karşılaştırıldı mı?", "ref": "TS EN 12999 md.6.2.6 / 6.2.7 / 7.2.2.1"}, {"row": 21, "no": "B5", "t": "5. Önceki muayene, bakım ve onarım kayıtları", "d": "Bir önceki periyodik kontrol raporu, seyir defteri, bakım/onarım/değişiklik (bom, silindir, sınırlayıcı, halat vb.) kayıtları ve olağanüstü olay (aşırı yük, çarpma, güvenlik cihazı arızası) kayıtları incelendi mi? Muayene aralığının 12 ayı aşmadığı ve tekrarlayan arızalar kontrol edildi mi?", "ref": "ISO 9927-1 md.5.4 / 5.5 / 10.2 / 10.3"}, {"row": 22, "no": "B6", "t": "6. Elektronik sınırlayıcı ayar kayıtları", "d": "Elektronik nominal kapasite sınırlayıcının tüm yeni ayarları (kalibrasyon, parametre değişikliği) kayıt altında mı? Kalibrasyonu yetkili kişi tarafından yapılmış mı ve son kalibrasyon tarihi/yöntemi kaydedildi mı?", "ref": "TS EN 12999 md.5.6.2.5 / ISO 9927-1 md.12"}, {"row": 23, "no": "B7", "t": "7. Donanım konfigürasyonu tespiti", "d": "Vincin bom sistemi (teleskopik/mafsallı, manuel uzatma, 3. bom), makara/vinç (halat) varlığı, stabilizatör tipi (manuel/hidrolik/uzaktan kumandalı), kumanda yerleri (yer, yüksek koltuk, platform, uzaktan kumanda), hidrolik uzanım ve maks. hidrolik erişim tespit edilip kaydedildi mi?", "ref": "TS EN 12999 md.3.1 / 5.4 / 5.8.1 / 5.6.1.1"}, {"row": 24, "no": "B8", "t": "8. Değişiklik ve kapasite değişikliği", "d": "Nominal kapasitenin veya konfigürasyonun değiştirilip değiştirilmediği sorgulandı mı? Değişiklik varsa bunun tasarım değişikliği sayıldığı ve yük testinin tasarım standardına/yönetmeliğe göre yapılması gerektiği dikkate alındı mı?", "ref": "ISO 9927-1 md.11"}, {"row": 25, "no": "B9", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 26, "no": "B10", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 27, "no": "B11", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 29, "no": "C1", "t": "Stabilizatör (destek ayağı) yapısı", "d": "Stabilizatör kirişleri, silindirleri, ayak plakaları ve bağlantı/pimleri deformasyon, çatlak, kaynak hasarı, yağ sızıntısı ve aşınma açısından gözle kontrol edildi mi? Ayak tabanı yer basıncını dağıtacak şekilde sağlam mı; ayaklardaki maks. zemin yükü işareti okunabilir mi?", "ref": "TS EN 12999 md.5.4.1.2 / 7.3.7 / ISO 9927-1 md.6.1"}, {"row": 30, "no": "C2", "t": "Stabilizatör uzatma göstergesi ve seviye", "d": "Stabilizatör uzatmalarının tam uzadığını gösteren gösterge çalışıyor mu? Her sabit stabilizatör kumanda yerinde operatörün görebileceği seviye göstergesi (su terazisi) var ve okunaklı mı?", "ref": "TS EN 12999 md.5.4.1.3 / 5.6.1.5"}, {"row": 31, "no": "C3", "t": "Stabilizatör kilitleri (çalışma/taşıma)", "d": "Manuel uzatmalarda iki ayrı taşıma kilidi (biri otomatik: yaylı kam/mandal) mevcut, yaylı klipsli pimlerle istenmeden çıkmaya karşı korunuyor ve kilitli/kilitsiz konumu görülebiliyor mu? Kilitler fiilen devreye alınıp çıkarılarak denendi mi?", "ref": "TS EN 12999 md.5.4.3.2 / 5.4.1.3"}, {"row": 32, "no": "C4", "t": "Hidrolik stabilizatör kilitleme ve kapama", "d": "Hidrolik stabilizatör uzatmalarında nötr konumda kapalı kumanda valfi ile otomatik hidrolik/mekanik taşıma kilidi var mı? Silindir kuvvetini taşıyamıyorsa çalışma konumunda mekanik kilit takılı mı? Stabilizatör silindirlerinde yük tutma valfi (hat kopma emniyeti) mevcut mu?", "ref": "TS EN 12999 md.5.4.3.3 / 5.4.1.3 / 5.5.6.1"}, {"row": 33, "no": "C5", "t": "Stabilizatör kumanda yeri ve görüş", "d": "Her stabilizatör fonksiyonunun kumandası, operatörün hareketleri engelsiz görebileceği yerde mi? Asılı yükle stabilizatör çalıştırılabiliyorsa iki aşamalı kumanda var mı? Uzaktan kumandalıysa uzatma/geri çekme öncesi net görüşü tespit eden cihaz çalışıyor mu?", "ref": "TS EN 12999 md.5.8.1 / Ek C md.C.2.4"}, {"row": 34, "no": "C6", "t": "Taşıma konumu emniyeti ve uyarı", "d": "İlk bomun taşıma konumunda istiflenmediğini algılayan sistem (ör. açı sensörü) ve sürüş konumundan görülebilen-duyulabilen uyarı cihazı çalışıyor mu? Stabilizatörlerin taşıma konumunda kilitli/uzatılmış olduğunu bildiren uyarı fiilen denendi mi (sessize alma yalnız onay düğmesi veya park freni ile mi)?", "ref": "TS EN 12999 md.5.4.3.1 / 5.6.1.4 / 5.6.1.6"}, {"row": 35, "no": "C7", "t": "Kolon, bom sistemi ve çevirme", "d": "Kolon, döner tabla, bomlar, mafsallar, bom uzatmaları ve bom kaynak/bağlantı bölgeleri çatlak, kalıcı deformasyon, korozyon ve aşınma açısından gözle ve gerekirse tahribatsız muayene (PT/MT) ile kontrol edildi mi? Çevirme mekanizması ve dişli/yatak boşluğu, cıvata bağlantıları kontrol edildi mi?", "ref": "ISO 9927-1 md.6.1 / 6.2 / 5.7 / TS EN 12999 md.5.5.8"}, {"row": 36, "no": "C8", "t": "Manuel bom uzatmaları", "d": "Manuel bom uzatmalarında geri çekilmiş ve uzatılmış konum için çekme durdurucuları ve mekanik kilitleme araçları mevcut ve çalışıyor mu? Uzatmalar 'Maks XXX kg' işaretli mi?", "ref": "TS EN 12999 md.5.4.2 / 7.3.4.2"}, {"row": 37, "no": "C9", "t": "Araç montajı ve montaj çerçevesi", "d": "Montaj çerçevesi, şasiye bağlantı cıvataları/bağlantı elemanları ve şasi bölgesi çatlak, gevşeme ve deformasyon açısından kontrol edildi mi? Motor vinç kumandasından çalıştırılabiliyorsa aracın hareket etmesini önleyen tertibat var mı? Vinç ile araç arasında ezilme/sıkışma bölgesi bırakılmamış mı?", "ref": "TS EN 12999 md.5.10.2.1 / 5.10.2.3 d)"}, {"row": 38, "no": "C10", "t": "Kanca ve emniyet mandalı", "d": "Kanca deformasyon (ağız açıklığı artışı), çatlak, aşınma ve dönme yatağı açısından kontrol edildi mi? Yükün istenmeden ayrılmasını önleyen emniyet mandalı veya kanca şekli mevcut, mandal yayı çalışıyor mu? Kanca bağlantı noktası kapasite işaretleri okunuyor mu?", "ref": "TS EN 12999 md.5.4.5 / 7.3.4.1 a)"}, {"row": 39, "no": "C11", "t": "Vinç (halat) mekanizması ve tambur", "d": "Varsa güç tahrikli vinç, tambur, kasnak ve halat yönlendirmesi hasar, aşınma ve doğru sarım açısından kontrol edildi mi? Tambur freni/yük tutma fonksiyonu yük altında kaymadan tutuyor mu?", "ref": "TS EN 12999 md.5.4.4 / TS EN 14492-2"}, {"row": 40, "no": "C12", "t": "Tel halat kırık tel ve çap ölçümü", "d": "Halat, sonlandırma ve kasnaktan geçen bölümler dahil boydan boya incelendi mi? Görünür kırık tel sayısı 6d ve 30d uzunluğunda sayılıp Tablo 3/4 ıskarta değerleriyle, çap ölçümü kumpasla nominal çapla karşılaştırılıp Tablo 5 ile (çelik özlü tek katmanlı halatta nominal çapın %7,5'i, dönmeye dirençli halatta %5) değerlendirildi mi?", "ref": "ISO 4309 md.6.2 / 6.4.1 (Tablo 2-5)"}, {"row": 41, "no": "C13", "t": "Halat deformasyon, korozyon ve sonlandırma", "d": "Halatta dalgalılık, sepet deformasyonu, çekirdek çıkıntısı, düzleşme, bükülme/sıkışma, ısı/ark hasarı, korozyon (Tablo 6) ve yerel çap artışı (çelik özlüde %5, fiber özlüde %10 ve üzeri) kontrol edildi mi? Sonlandırma ve yüksük çatlak/kayma açısından bakıldı mı; tam halat kırılması veya lokal çap azalması ıskarta olarak değerlendirildi mi?", "ref": "ISO 4309 md.6.5 / 6.6 / 6.7 / 5.3.4"}, {"row": 42, "no": "C14", "t": "Hidrolik sistem: genel ve rezervua
