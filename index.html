izleniyor ve yeterli (500 mm boşluk sağlıyor) mu? Çukur erişim kapısı açıldığında hareketin engellendiği denendi mi?", "ref": "TS EN 81-41 md.5.6.2 / 5.6.4 / 5.6.6 / 5.6.7 / 5.1.4.2.1 / 6.3.1 m)"}, {"row": 59, "no": "C32", "t": "Taşıyıcı içi: tırabzan, ayak koruyucu, ışık (81-41)", "d": "Taşıyıcıda en az bir yan duvarda tırabzan var mı (kavrama kesiti 30-45 mm, duvarla aralık en az 35 mm, hareketli yüzeye bitişikse en az 100 mm, üst kenar yüksekliği zeminden 900 ± 25 mm)? Her taşıyıcı eşiğinin altında, giriş genişliği boyunca uzanan ve yüksekliği en az yukarı yönlü kilit açma bölgesi kadar olan ayak koruyucu var mı? Zemin kaymaz mı? Aydınlatma taşıyıcı zemininde, kumandalarda ve kat kapıları çevresinde lüksmetreyle en az 50 lx ölçüldü mü; acil aydınlatma (en az 1 saat, 5 lx) devreye giriyor mu?", "ref": "TS EN 81-41 md.5.9.7 / 5.9.3 / 5.9.4 / 5.5.4.1 / Ek D.1 k)"}, {"row": 60, "no": "C33", "t": "Bina arayüzü ve açıklıklar (81-40 Ek C)", "d": "Taşıyıcının hareketli erişilebilir parçası ile bina yapısı arasında hareket yönünde en az 100 mm açıklık var mı; yoksa hassas kenar/yüzey bulunuyor veya sürekli pürüzsüz yüzeye olan açıklık en fazla 10 mm mi? Halka açık tekerlekli sandalye merdiven asansöründe platform üzerindeki perde/baş üstü engele açıklık en az 1 400 mm mi? Biniş noktalarında en az 50 lx aydınlatma ve bakım için priz var mı? Ölçümler şerit metre/lüksmetre ile yapılıp kaydedildi mi?", "ref": "TS EN 81-40 md.6.4.1 f) / Ek C.1 / C.2 / C.4"}, {"row": 61, "no": "C34", "t": "Acil durum alarmı ve iki yönlü sesli iletişim", "d": "Taşıyıcıdaki alarm/iletişim cihazı kolay tanınıyor ve erişilebilir mi; basıldığında dışarıdan yardım çağrılabiliyor ve iki yönlü sesli iletişim kuruluyor mu? Normal besleme kesilince yedek güç kaynağının (en az 1 saat süreli) devrede olduğu, alarm düğmesinin sarı renkli ve çan sembollü (81-40'ta ayrıca 'ALARM' ibareli) olduğu fiilen denendi mi? 81-41'de kuyu içi/çukurdaki çalışma alanı ile kabin arasında iletişim düzeni kontrol edildi mi?", "ref": "TS EN 81-40 md.5.5.16.1 / 7.4.2 / Ek F.1 g) / TS EN 81-41 md.5.5.16 / 7.3.4 / Ek D.1 g)"}, {"row": 62, "no": "C35", "t": "Acil durum/manuel çalıştırma ve kurtarma", "d": "Acil durum kumanda cihazı (el sarma tekerleği düz ve jant telsiz; yön etiketli) çalıştırılarak taşıyıcının kurtarma seviyesine getirildiği gösterildi mi? El ile freni bırakma gerekiyorsa gereken kuvvet/tork sınırları (81-40 el sarmada direnç torku 5 Nm'den fazlaysa fren serbest bırakma aracı; 81-41 kuvvet 30 N'den fazlaysa fren serbest bırakma aracı) kontrol edildi mi? Acil elektrikli çalışmada hızın en fazla 0,05 m/s, kumandanın basılı tutmalı olduğu ve normal kumandaların yanlışlıkla çalışmasına karşı elektrikli güvenlik cihazı bulunduğu doğrulandı mı? 81-41'de taşıyıcının en yakın kata getirilmesinin en fazla 15 dakika sürdüğü ve işlemin kuyu dışından tam kontrolle yapıldığı görüldü mü?", "ref": "TS EN 81-40 md.5.4.3 / 7.4.4 / 6.4.1 j) / TS EN 81-41 md.5.4.3.1 - 5.4.3.3 / 7.4.1 / 7.4.2"}, {"row": 63, "no": "C36", "t": "Hidrolik acil indirme valfi ve el pompası (81-41)", "d": "Hidroliklerde elle çalıştırılan acil indirme valfi kuyu dışında, kazara çalışmaya karşı korumalı mı, sürekli manuel kuvvet gerektiriyor mu ve indirme hızı 0,15 m/s'yi aşmıyor mu? Valf yanında 'TEHLİKE — Acil Durum İndirme Valfi' yazısı var mı? Taşıyıcıya emniyet tertibatı takılıysa yukarı yönlü el pompası kalıcı olarak monte ve 2,3 x tam yük basıncına ayarlı tahliye valfli mi? Hidrolik değilse KD.", "ref": "TS EN 81-41 md.5.4.9.16.1 / 5.4.9.16.2 / 7.4.3"}, {"row": 64, "no": "C37", "t": "İşaretlemeler, uyarı yazıları ve semboller", "d": "Taşıyıcı üzerinde nominal yük (81-41'de ayrıca maksimum kişi sayısı; harf boyu en az 10 mm büyük / 7 mm küçük) okunuyor mu? Halka açık kullanımda her biniş noktasında en az 50 mm yüksekliğinde Uluslararası Erişim Sembolü (ISA) var mı? Acil durum manuel çalıştırma adım adım talimatı acil cihazın yanında sergileniyor mu; varsa tavan üstü uyarı etiketi (en az 300 mm) ve eşik ayak koruyucusunda 'ASANSÖR BOŞLUĞUNA DÜŞME TEHLİKESİ...' yazısı ile mal taşınmaz işareti (halka açık platformda) mevcut mu?", "ref": "TS EN 81-40 md.7.4.1 / 7.4.3 / 7.4.4 / TS EN 81-41 md.7.3.2 / 7.3.5 / 7.4.1 / 7.6 / 7.7"}, {"row": 65, "no": "C38", "t": "Yüksüz fonksiyon testi (tam seyir)", "d": "Taşıyıcı yüksüz olarak tüm seyir boyunca (katlanır ray bölümleri ve koltuk dönüşü dahil, mümkünse) her iki yönde tam sürüş yapılıp titreşim, gürültü, takılma, hareketin düzgünlüğü, durak seviyelemesi, kapı/bariyer ve limit anahtarı çalışması gözlendi mi? Nominal hız kat edilen mesafe/süre ile ölçülerek 0,15 m/s'yi aşmadığı (81-40'ta A referans noktasında) kaydedildi mi? Tüm elektrikli güvenlik cihazlarının ve bekleme/uyarı sinyallerinin çalıştığı doğrulandı mı?", "ref": "TS EN 81-40 md.5.1.5 / 6.4.1 a) - p) / TS EN 81-41 md.5.1.5 / 6.3.1 a) - e)"}, {"row": 66, "no": "C39", "t": "Dinamik ve statik yük testleri", "d": "Yük testi kalibre ağırlıklarla, platform güvenli konumdayken ve testin sürüş güvenliği alınarak yapıldı mı? Dinamik test: nominal hızda maksimum çalışma yükü ile tam seyir yapıldı, hatasız tamamlandı mı (81-41'de maksimum çalışma yükü = kişi nominal yükü + aşırı yük)? Statik test: nominal yükün 1,25 katı (81-41'de %25 aşımlı 1,25 statik katsayı) taşıyıcıya konularak beklendi, yük kaldırıldıktan sonra kalıcı deformasyon olmadığı ölçüm/gözle doğrulandı mı? Yük değerleri ve bekleme süresi kaydedildi mi? Kişi kaldıran ekipmanda işletme kapasitesi belirlenemeyeceğinden (Yönetmelik Ek-III 2.2.1.2) yük değeri olarak nominal/maksimum çalışma yükü esas alındı ve yöntem üretici talimatıyla uyumlu mu?", "ref": "TS EN 81-40 md.6.4.1 m) / md.5.3.1.1 / TS EN 81-41 md.6.3.1 p) / q) / md.5.1.9"}, {"row": 67, "no": "C40", "t": "Test sonrası kontrol ve sonuç kaydı", "d": "Test sonrasında taşıyıcı, süspansiyon elemanları, kılavuz ray ve bağlantıları, fren, emniyet tertibatı, hidrolik bağlantılar ve kapı/bariyer donanımı kalıcı deformasyon, çatlak, gevşeme, sızıntı ve anormal ses açısından yeniden kontrol edildi mi? Tüm ölçüm değerleri (durma mesafesi, kuvvetler, yalıtım direnci, yük değerleri) rapora işlendi, uygunsuzluklar sınıflandırıldı ve hizmete dönüşten önce güvenlik cihazlarının resetlendiği, ekipmanın normal çalışmaya döndüğü doğrulandı mı? Periyodik muayenede Ek F/Ek D listesindeki tüm bileşenlere (kilitler, elektrik güvenlik devreleri, topraklama, süspansiyon, tahrik/fren, emniyet tertibatı, alarm, hassas kenarlar, kılavuzlar) bakıldığı teyit edildi mi?", "ref": "TS EN 81-40 md.6.4.2 / Ek F.1 / TS EN 81-41 md.6.3.2 / Ek D.1"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 69, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 70, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 71, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 72, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 73, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 74, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 76, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 77, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 79, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 80, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 81, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 82, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 83, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 84, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 85, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 86, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 87, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 88, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 89, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 90, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 91, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 81-40 — Asansörlerin yapımı ve montajı için güvenlik kuralları - Kişi ve yük taşımak için özel asansörler - Bölüm 40: Hareket kabiliyeti kısıtlı kişiler için tasarlanmış merdiven asansörleri ve eğimli kaldırma platformları (incelenen metin: EN 81-40:2020 Türkçe çevirisi)"], ["Standart 2", "TS EN 81-41 — Asansörlerin yapımı ve montajı için güvenlik kuralları - Kişi ve yük taşımak için özel asansörler - Bölüm 41: Hareket kabiliyeti kısıtlı kişilerin kullanımı için tasarlanmış dikey kaldırma platformları (incelenen metin: TS EN 81-41:2025-01 / EN 81-41:2024)"], ["Yük / fonksiyon testi notu", "Standartların periyodik yük testi için ayrı, sayısal bir katsayı/süre tanımlamadığı tespit edildi. 81-41 md.6.3.1 p) ve q): nominal hızda maksimum çalışma yüküyle dinamik test hatasız; nominal yükün 1,25 katıyla statik test kalıcı deformasyonsuz; md.5.1.9 taşıyıcı 1,25 statik test katsayısını (Tablo 3 yükü veya maksimum çalışma yükü, hangisi büyükse) taşımalı. 81-40 md.6.4.1 m): maksimum çalışma yükünün uyguladığı kuvvetleri kontrol etmek için statik ve dinamik test hatasız; emniyet tertibatı ve tahrik tasarımında nominal yük + %25 esas alınmıştır (md.5.3.1.1, 5.4.1.3). Aşırı yük algılama: 81-40 md.5.1.6.2 nominal yükün %25 aşımı (yalnız tekerlekli sandalye platformu), 81-41 md.5.1.7 nominal yük + 75 kg. Periyodik muayene aralığı Ek F.1 / Ek D.1'de (bilgilendirici) en fazla 12 aydır ve listedeki bileşenlere dikkat edilmesi istenir. Yönetmelik Ek-III md.2.2.1.2'ye göre kişi kaldıran ve karşı ağırlıklı/denge prensipli ekipmanda işletme kapasitesi belirlenemediğinden, Yönetmeliğin işletme kapasitesiyle yıllık yük testi bu ekipmanda uygulanamaz; yıllık kontrolde fonksiyon, güvenlik tertibatı ve aşırı yük algılama denenir. Azami 3 yılda bir veya önemli bakım-onarım sonrasında Ek-III md.2.2.1'deki statik 1,25 katsayısı standartla (81-41 md.6.3.1 q)) uyumludur; Yönetmeliğin dinamik 1,1 katsayısı 'standartta aksi yoksa' hükmüne tabidir; 81-41 md.6.3.1 p) ve 81-40 md.6.4.1 m) dinamik/statik testi 'maksimum çalışma yükü' ile tanımlar ve 1,1 değeri vermez, dolayısıyla tanık denetçisi enspektörün hangi yükü kullandığını ve gerekçesini sorgulamalıdır."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) Standartlar periyodik muayenede emniyet tertibatı/regülatör düşürme testini ve durma mesafesi testini ayrıca tarif etmez; md.6.4.1 (81-40) ve md.6.3.1 (81-41) ilk kullanım doğrulaması olup periyodikte uygulama yöntemi üretici talimatına bırakılmıştır (Ek F/Ek D yalnızca 'özellikle dikkat edilecek bileşenleri' sayar). 2) Halat/zincir atılma (reddetme) kriterleri ve zincir uzama sınırı standart metinde bulunmadı; 'üretici kılavuzu' denilmiştir. 3) Topraklama sürekliliği için sayısal değer metinde yok (EN 60204-1'e atıf). 4) 81-40 metni BS EN 81-40:2020 Türkçe çevirisidir (TS EN 81-40 numaralı çeviri değil); 81-41 metni TS EN 81-41:2025-01'dir ve md.1.4'e göre yayımından önce üretilmiş platformlara uygulanmaz, eski (2010) baskı değerleri farklı olabilir (ör. 2024'te aşırı yük 75 kg, kişi algılama ve 0,15 m/s hız). 5) 81-40 md.5.6.2.3 (emniyet kemeri dayanımı) ve Ek A.6 (0,4 m) çeviri metinlerinde bozuk; kullanılmadı. 6) 81-40 md.5.5.11 (RCD) ve Tablo 3 ile 81-41 Tablo 8 yalıtım direnci değerleri birbirinden farklıdır; maddelerde ayrı ayrı yazıldı. 7) Yönetmelik Ek-III Tablo-2 periyot değerleri metin dosyalarında yoktur; yazılmadı. 8) Kuvvet ve sınır değerlerinin birçoğu (kapı 3 000 N, kilit kavrama 7 mm, duvar 300 N/1 000 N) tip/üretici doğrulaması niteliğindedir; sahada ölçülemeyenler doküman/tip belgesi üzerinden sorgulanacak şekilde yazıldı. 9) C39 maddesindeki 'kişi taşıyan ekipmanda işletme kapasitesi ayrıca test aranmaz' ifadesi Yönetmelik Ek-III 2.2.1.2'ye dayanır, standartta yoktur."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B8"], ["A8", "A9"], [], ["A4", "A12", "A13", "B4", "B5"], ["B1", "B2", "B3", "B7"], ["C38", "C39", "C40"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39", "C40"], ["D1", "B10"], ["D2", "D5", "E3", "E5", "E11", "B6", "B9"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.13.1", "name": "Taşıt Kaldırma Donanımı", "method": "Kapsam Kodu: 1.A.13.1   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 1493", "refTitle": "1.A.13.1 Taşıt Kaldırma Donanımı — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.13.1 – Taşıt Kaldırma Donanımı"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (iki/dört kolonlu, makaslı, zemin içi pistonlu, mobil kolon)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal Yük (kg) ve Yük Dağılımı"}, {"row": 24, "label": "Tahrik Tipi (hidrolik / vidalı-somunlu / halat-zincir) ve Kolon/Kaldırma Ünitesi Sayısı"}, {"row": 25, "label": "Kaldırma Yüksekliği (mm) - Kaldırma/İndirme Hızı (m/s) - Araç Destek Tipi (tekerlek/şasi)"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.13.1 Taşıt Kaldırma Donanımı) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Kalibre test ağırlıkları/yük hücresi (nominal yükün %115 ve %150'sini sağlayacak), şerit metre/cetvel (12 m) ve kumpas, su terazisi/dijital eğim ölçer (1° ve 3° kontrolü), tork anahtarı (0-100 Nm), kuvvet ölçer/dinamometre (150-200 N ve nominal yükün %4 vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Ekipman tanımlama ve isim plakası", "d": "İsim plakası kalıcı ve okunaklı mı; imalatçı adı/adresi, makine tanımı, seri/tip, seri no ve imalat yılı okunup rapora aktarıldı mı? Bilgiler kullanım kılavuzu ve önceki raporla örtüşüyor mu?", "ref": "TS EN 1493 md.6.4"}, {"row": 18, "no": "B2", "t": "2. Nominal yük ve yük dağılımı işaretleri", "d": "Nominal yük (kg/ton), yük dağılımına bağlıysa izin verilen yük dağılımı, yüksüz ağırlık (mobil ise) ve yük taşıma cihazlarında seyahat yasağı uyarısı levha üzerinde okunup doğrulandı mı? Test yükü bu değerden türetildi mi?", "ref": "TS EN 1493 md.6.2 a) b) d) e)"}, {"row": 19, "no": "B3", "t": "3. Ekipman tipi ve tahrik sınıflandırması", "d": "Lift tipi (iki/dört kolonlu, makaslı, zemin içi pistonlu, mobil kolon, kısa/uzun kaldırma), araç destek tipi (tekerlek/şasi) ve tahrik türü (hidrolik, vidalı, halat/zincir) belirlenip hangi güvenlik tertibatlarının uygulanacağı buna göre planlandı mı?", "ref": "TS EN 1493 md.3.3 / md.6.3.1 c)"}, {"row": 20, "no": "B4", "t": "4. Kullanım kılavuzu ve bakım programı", "d": "Üretici kullanım kılavuzu sahada mevcut mu; güvenlik cihazlarının izlenmesi, bakım sıklığı, aşınan parça değişim kriterleri ve taşıma kolu izin verilen serbest boşluk test prosedürü kılavuzdan alındı mı?", "ref": "TS EN 1493 md.6.3.1 i) j) l) n)"}, {"row": 21, "no": "B5", "t": "5. Önceki kontrol ve bakım kayıtları", "d": "Güvenlik kontrollerinin bir yılı aşmayan aralıkla (ulusal mevzuat/çalışma koşulları daha kısa gerektirmiyorsa) yapıldığı; önceki rapor, arıza, parça değişimi, yakalama tertibatı devreye girme ve onarım kayıtları incelendi mi?", "ref": "TS EN 1493 md.6.3.1 k)"}, {"row": 22, "no": "B6", "t": "6. Kullanım ömrü değerlendirmesi", "d": "Kalan ömrün genel değerlendirmesinin (tercihen üretici yetkili nitelikli teknisyen) en geç 10 yıllık kullanımda yapılması şartı kontrol edildi mi; ekipman yaşı ile karşılaştırılıp sonuç kaydedildi mi?", "ref": "TS EN 1493 md.6.3.1 d)"}, {"row": 23, "no": "B7", "t": "7. Sertifika ve dokümanlar (halat, zincir, hortum)", "d": "Halat kopma kuvveti sertifikası, zincir minimum kopma yükü üretici sertifikası ve hortum test sertifikaları ile hidrolik/elektrik şemaları mevcut ve ekipmanla uyumlu mu?", "ref": "TS EN 1493 md.5.4 b) / md.4.7.5.2 / md.4.7.5.3 / md.5.3 d)"}, {"row": 24, "no": "B8", "t": "8. Kurulum yeri, zemin ve ankraj bilgileri", "d": "Kurulum yeri (iç/dış mekan, çukur üstü, mobil), zemin/temel durumu ve ankraj bilgileri (cıvata tipi/adedi) kılavuzdaki temel sağlamlığı bilgileriyle karşılaştırıldı mı; dış mekan ise izin verilen azami rüzgar hızı bilgisi var mı?", "ref": "TS EN 1493 md.6.3.1 f) i) k) / md.6.2 i)"}, {"row": 25, "no": "B9", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 26, "no": "B10", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 27, "no": "B11", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 29, "no": "C1", "t": "Yetkisiz kullanımın önlenmesi", "d": "Asansör devre dışı bırakıldıktan sonra yetkisiz kullanımı önleyen erişilebilir sabit cihaz (anahtarlı şalter/kilit) mevcut ve fiilen denendi mi?", "ref": "TS EN 1493 md.4.2"}, {"row": 30, "no": "C2", "t": "Yapısal elemanlar ve kaynaklar", "d": "Kolonlar, taşıyıcı kollar, platformlar, makas kolları, şasi ve bağlantı pimlerinde çatlak, kalıcı deformasyon, korozyon, kaynak dikişi hasarı ve gevşek bağlantı gözle kontrol edildi mi?", "ref": "TS EN 1493 md.4.7.1 / md.5.4 c)"}, {"row": 31, "no": "C3", "t": "Zemin ankrajı ve devrilme stabilitesi", "d": "Zemine ankrajlı liftlerde ankraj cıvatalarında gevşeme, kırık, çatlak ve zemin/temelde çatlak kontrol edildi mi; cıvata sıkma durumu üretici değerine göre doğrulandı mı? Zemine sabitlenmeyen (mobil) liftlerde devrilme dengesi için üretici koşulları sağlanıyor mu?", "ref": "TS EN 1493 md.4.7.6 / md.6.3.1"}, {"row": 32, "no": "C4", "t": "Yatay konum ve eğim sınırı", "d": "Tekerlek destekli karayolu lift platformlarında normal çalışmada boyuna eğim en fazla 1° mi; şasi destekli liftte nominal yükte kaldırma tertibatı eğimi yataydan 3° geçmiyor mu (ölçüm yapıldı mı)?", "ref": "TS EN 1493 md.4.7.1 / Ek G"}, {"row": 33, "no": "C5", "t": "Taşıma kolları ve toplama plakaları", "d": "Toplama plakaları ve ped uzantılarında devrilme/deformasyon, ayarlanabilir plakalarda dişli milin kendinden frenli olması ve sökülmesinin engellenmesi kontrol edildi mi; plaka yüksekliği ayarında gevşeklik var mı?", "ref": "TS EN 1493 md.4.9.2"}, {"row": 34, "no": "C6", "t": "Araç toplama pedleri", "d": "Toplama pedleri konik veya kübik, yükseklik/taban en büyük daire çapı oranı 1:1'i geçmiyor mu; ped ile taşıma tertibatı arasında kaymayı önleyen kilitleme/sürtünme yüzeyi sağlam mı, yıpranma/yağ kirliliği var mı?", "ref": "TS EN 1493 md.4.9.3"}, {"row": 35, "no": "C7", "t": "Taşıma kolu kilitleme sistemi (kol kilidi)", "d": "Kol kilidi otomatik mekanik olarak devreye giriyor mu; dikey hareketin ilk 300 mm'sinde çalışıp yük taşıyıcı hareketi boyunca kollara kilitleme sağlıyor mu; kilit 300 mm hareket üzerinde devre dışı durumda kilitlenemiyor mu; dişli/adımlı sistemde tamamen uzatılmış kol ucundaki adım aralığı toplama plakası çapını aşmıyor mu?", "ref": "TS EN 1493 md.4.9.4"}, {"row": 36, "no": "C8", "t": "Taşıma kolu serbest boşluk ölçümü", "d": "Tam uzatılmış teleskopik kolda toplam serbest boşluk, toplam kol uzunluğunun %10'unu ve 150 mm'yi aşmıyor mu (her iki yönde 150 N kuvvetle, üretici prosedürüne göre ölçülüp kaydedildi mi)?", "ref": "TS EN 1493 md.4.9.4 / md.6.3.1 l)"}, {"row": 37, "no": "C9", "t": "Kol uç durdurucuları ve uzatma kuvveti", "d": "Teleskopik kol uzayabilir parçalarında ayrılmayı önleyen uç durdurucular sağlam mı; kolu uzatmak için gereken el kuvveti 200 N'u aşmıyor mu?", "ref": "TS EN 1493 md.4.9.4 (Ek J)"}, {"row": 38, "no": "C10", "t": "Yuvarlanma önleyici (tekerlek durdurucu)", "d": "Tekerlek destekli liftlerde platform uçlarında tekerlek durdurucular mevcut, hasarsız ve devreye giriyor mu; platform 0,75 m dikey hareketten sonra otomatik devreye giriyor veya aktif konumda sabitlenebiliyor mu; yükseklik tekerlek çapının en az %10'u veya 0,1 m (hangisi büyükse) mi?", "ref": "TS EN 1493 md.4.9.5"}, {"row": 39, "no": "C11", "t": "Kumanda ve bas-çalış (hold-to-run)", "d": "Kumandalar tut-çalıştır tipinde mi (bırakınca hareket duruyor mu); yön işaretleri kumanda üzerinde/bitişiğinde kalıcı ve okunaklı mı; kumandalar istem dışı çalışmaya karşı korunmuş mu; sabit kumanda yerden 1,8 m'den yüksek değil mi?", "ref": "TS EN 1493 md.4.3.1 / md.4.3.4 / md.4.3.5 / md.4.4.2"}, {"row": 40, "no": "C12", "t": "Durdurma cihazı ve acil stop", "d": "Her kumanda istasyonunda bir kumandayla başlatılan tüm hareketleri durduran ayrı bir durdurma cihazı (veya acil durdurma/ana şalter) var ve başlatma kumandasına göre öncelikli mi; acil stop takılıysa fiilen denendi mi? (Raylı araç çoklu liftler dışında acil stop zorunlu değildir; yokluğu uygunsuzluk sayılmaz.)", "ref": "TS EN 1493 md.4.4.5 / md.4.4.6"}, {"row": 41, "no": "C13", "t": "Çoklu kaldırma ünitesi ve mobil/kablosuz kumanda", "d": "Çoklu kolonlu liftte tekil/tümü birlikte seçim kumandası çalışıyor, seçilmeyen ünitelerin hareketi engelleniyor mu; her kumanda hangi lifti kontrol ettiğini gösteriyor mu; kablosuz kumanda aynı anda tek asansöre eşleşiyor, eşleşme net ve bağlantı kaybı acil stopu etkilemiyor mu?", "ref": "TS EN 1493 md.4.4.4 / md.4.3.2 / md.4.4.3"}, {"row": 42, "no": "C14", "t": "Kaldırma-indirme hızı", "d": "Kaldırma ve indirme hızı karayolu araç liftlerinde 0,15 m/s'yi aşmıyor mu (kaldırma yüksekliği ve süre ölçülerek hız hesaplandı mı)? Kişinin yük altında durmasına izin verilen liftlerde hız 0,01 m/s'yi aşmıyor mu?", "ref": "TS EN 1493 md.4.6 / md.4.22.3"}, {"row": 43, "no": "C15", "t": "Üst ve alt sınır (limit) tertibatı", "d": "Taşıyıcı uç konuma ulaşmadan hareket duruyor mu; doğrudan taşıyan hidrolik silindirlerde mekanik durdurucu/taşma var mı; mekanik tahrikli liftlerde normal limit ve arıza halinde ek mekanik durdurucu/emniyet anahtarı var mı; üst limit/anahtar devreye girince yalnızca indirmeye izin verilip yeniden yükseltme engelleniyor mu?", "ref": "TS EN 1493 md.4.11"}, {"row": 44, "no": "C16", "t": "Kontrolsüz hareket önleme tertibatı", "d": "Taşıyıcının kontrolsüz hareketini önleyen otomatik cihaz, başlangıçtan itibaren en az ilk 500 mm dikey harekette (çukur üstü/tekerleksiz sistemlerde tam strok boyunca) etkin mi? Kaldırılmış konumda mekanik mandal/kilit fiilen yerine oturuyor mu?", "ref": "TS EN 1493 md.4.8.1 / md.4.18.3"}, {"row": 45, "no": "C17", "t": "Emniyet mandalı / yakalama tertibatı", "d": "Yakalama/mandal mekanizması sürtünmeye değil mekanik olarak kenetlenen parçalarla çalışıyor mu; aşınma, kırık, yay arızası ve kalıcı deformasyon var mı; tetiklenmiş mandalda deformasyon halinde üretici talimatı uygulandı mı; kaldırma elemanı kopmasında taşıyıcının 100 mm'den fazla alçalmayacağı doğrulandı mı?", "ref": "TS EN 1493 md.4.13 / md.4.18.3 / md.4.18.5 / md.4.7.5.1"}, {"row": 46, "no": "C18", "t": "Çelik halat kontrolü", "d": "Halat boyunun tamamı (görülebilir kısımlar) tel kopması, ezilme, kink, korozyon, çap azalması ve uç bağlantılarında (ek, pres, kama soket) hasar yönünden incelendi mi; çıkarma kriterleri üretici/halat standardına göre uygulandı mı; birden fazla halatta gerginlikler eşitlenmiş mi?", "ref": "TS EN 1493 md.4.7.5.2 / md.4.19.1 / md.4.8.3.3"}, {"row": 47, "no": "C19", "t": "Zincir kontrolü", "d": "Zincir baklaları ve bağlantılarında deformasyon, çatlak, korozyon ve uzama gözle kontrol edildi mi; uzama ölçümü üretici sınır değerine göre yapılıp kaydedildi mi; zincir çarklarında aşınma/raydan çıkma var mı; uç bağlantılar sağlam mı?", "ref": "TS EN 1493 md.4.7.5.3 / md.4.19.1"}, {"row": 48, "no": "C20", "t": "Halat/zincir makara koruması ve kıstırma noktaları", "d": "Makara ve zincir dişlilerinde raydan çıkma koruması yerinde mi (halat/zincir koruma ile makara arasından geçemiyor mu); halat/zincir kıstırma noktalarına erişimi önleyen koruyucular takılı mı?", "ref": "TS EN 1493 md.4.8.3.1 / md.4.8.3.2"}, {"row": 49, "no": "C21", "t": "Vidalı mil, taşıyıcı somun ve emniyet somunu aşınması", "d": "Taşıyıcı somun ile yüksüz emniyet somunu arasındaki mesafe (diş aşınması göstergesi) ölçülüp üretici sınır değeriyle karşılaştırıldı mı; emniyet somunu yüklenmemiş mi; mil uç durdurucuları, milde hasar/kir ve yağlama kontrol edildi mi?", "ref": "TS EN 1493 md.4.7.5.5 / md.4.19.1 / md.4.19.2"}, {"row": 50, "no": "C22", "t": "Kendinden frenli vida tersinmezlik testi", "d": "Kendinden frenli vidalı tahrikte, kaldırılmış ve durmuş konumda aşağı hareketi serbest bırakmak için gereken tork ölçüldü mü (periyodik kontrolde kabul sınırı 10 Nm); tork anahtarı yoksa aşağı komutu bırakıldıktan sonra atalet hareketi 3 dönüşü aşmıyor mu?", "ref": "TS EN 1493 Ek C (kendinden frenli vida test yöntemi b)"}, {"row": 51, "no": "C23", "t": "Hidrolik sistem ve basınç tahliye valfi", "d": "Basınç tahliye valfi devrenin ilk valfi mi, ayarı yalnızca aletle yapılabiliyor ve mühürlü/korumalı mı; ayar basıncı nominal yükteki çalışma basıncına göre %10 sınırı ve üretici değerinde mi (manometre bağlantısından okundu mu); basınç göstergesi bağlantısı, hava alma ve filtre mevcut mu?", "ref": "TS EN 1493 md.4.8.4.2 / md.4.8.4.3 / md.4.8.4.4 / md.4.8.4.5"}, {"row": 52, "no": "C24", "t": "Hidrolik sızıntı, hortum ve boru durumu", "d": "Silindir, hortum, boru ve bağlantılarda dışarı sızıntı, çatlak, şişme ve sürtünme hasarı kontrol edildi mi; yağ seviyesi göstergesinde gerçek ve asgari seviye görülebiliyor mu; hortum/boru/kablolar hareket sırasında hasar görmeyecek şekilde monte mi?", "ref": "TS EN 1493 md.4.8.4.6 / md.4.19.3 / md.4.8.4.1"}, {"row": 53, "no": "C25", "t": "Sızıntı/kayma koruması ve indirme hızı sınırlaması", "d": "Hidrolik liftte sızıntıya karşı koruma (patlak hortum valfi/akış sınırlayıcı) çalışıyor mu; sızıntı durumunda indirme hızı normal indirme hızının 1,5 katını aşmıyor mu; herhangi bir sabit konumda ve 500 mm dikey harekete sonra taşıyıcı 100 mm'den fazla hareket etmiyor mu (ölçüldü mü)?", "ref": "TS EN 1493 md.4.14.1 / md.4.14.2"}, {"row": 54, "no": "C26", "t": "Kolonlar arası senkronizasyon (yükseklik farkı)", "d": "Çok üniteli liftte taşıyıcılar arası yükseklik farkı ölçüldü mü; istem dışı asenkronizasyon 50 mm'yi veya (daha büyükse) 1° eğimi aşmıyor mu; senkronizasyon hatasında sistem duruyor ve normal düzen tekrar kurma prosedürü uygulanıyor mu?", "ref": "TS EN 1493 md.4.15 c)"}, {"row": 55, "no": "C27", "t": "İstenmeyen bloke olma (gevşek halat/kilitlenme) koruması", "d": "Kaldırma elemanlarında gevşeme ya da ünitelerin senkron kaybı halinde indirme hareketini durduran cihaz Ek E yöntemiyle denendi mi (500 mm üzeri yükseklikte); asenkronizasyon en fazla 100 mm ve serbest düşme en fazla 50 mm ile sınırlı, durdurma sonrası yalnızca ters yönde hareket mümkün mü?", "ref": "TS EN 1493 md.4.12 / Ek E"}, {"row": 56, "no": "C28", "t": "Ayak ezilme koruması", "d": "Ayak sıkışma noktalarında 120 mm boşluk sağlanıyor mu veya inişte hareket tehlikeli konumdan 120 mm önce otomatik durup ek indirme kumandasıyla devam ediyor mu (durma geçersiz kılınamıyor mu)? Parmak sıkışma noktaları için 25 mm mesafe kontrol edildi mi?", "ref": "TS EN 1493 md.4.17.2 / md.4.17.3"}, {"row": 57, "no": "C29", "t": "Sesli uyarı", "d": "Sabit kumandadan tehlikeli alan tam görülemiyorsa sesli/görsel uyarı cihazı çalışıyor mu; ayak koruması için son 120 mm'lik inişte sesli uyarı devrede mi; tekerleksiz (çukur üstü) sistemlerde 25 mm altı durumda indirmeden 2 saniye önce başlayan ve tüm indirme boyunca süren akustik sinyal var mı?", "ref": "TS EN 1493 md.4.4.2 / md.4.17.3 (Ek C: en az 75 dB(A) çözüm örneği)"}, {"row": 58, "no": "C30", "t": "Kişi yük altında ise ek gereklilikler (varsa)", "d": "Kişinin araç altında durmasına izin veriliyorsa: kontrol yerinden operatör doğrudan görüş alanında mı; kaldırma/indirme hızı sınırı sağlanıyor mu; halat/zincir/somun kopması veya sızıntıda 20 mm'den fazla istem dışı alçalmayı önleyen yakalama tertibatı etkin mi; mobil kumandalı ise tehlikeli alan dışında sabit mutabakat (tut-çalıştır) kumandası var mı?", "ref": "TS EN 1493 md.4.22.1 / md.4.22.2 / md.4.22.3 / md.4.22.4"}, {"row": 59, "no": "C31", "t": "Mobil kolon lift: istem dışı hareket ve frenler", "d": "Mobil liftlerde fren/kilit ile istem dışı hareket engelleniyor mu (üretici eğim sınırından 2° fazlasında nominal yüklü durağan lift hareket etmiyor); elektrikli hareketli liftlerde otomatik fren çalışıyor mu; el tutamakları sağlam ve elle itme kuvveti hareketi başlatmak için 400 N, sürdürmek için 300 N'u aşmıyor mu?", "ref": "TS EN 1493 md.4.16.1 / md.4.16.2 / md.4.16.3 / md.4.16.5"}, {"row": 60, "no": "C32", "t": "Elektrik donanımı ve güç kesme", "d": "Ana şalter/güç kaynağı bağlantı kesme cihazı çalışıyor mu; kumanda kutusu ve dış mekandaki elektrikli parçalar en az IP 54 mi; kablo/pano/emniyet anahtarları sağlam mı; emniyet anahtarları tetiklenince normal çalışma engelleniyor mu; akü varsa sabitlenmiş mi?", "ref": "TS EN 1493 md.4.21.1 / md.4.21.2 / md.4.21.3 / md.4.21.4 / md.4.18.4"}, {"row": 61, "no": "C33", "t": "İşaretleme ve kullanım talimatı özeti", "d": "Nominal yük, yük dağılımı, besleme bilgileri, seyahat yasağı uyarısı ve kullanım talimatları özeti (yetkili kullanıcı, alanın engelsiz olması, altında durma yasağı vb.) lifte sabit ve okunaklı mı; kumanda yön işaretleri yerinde mi?", "ref": "TS EN 1493 md.6.2 / md.6.3.2 / md.6.4 / md.4.3.4"}, {"row": 62, "no": "C34", "t": "Yüksüz fonksiyon testi", "d": "Yüksüz olarak tüm hareketler (yükselme/alçalma, kol açma-kapama, senkron seçimi) tam strokta sorunsuz çalıştırıldı mı; limit, mandal, kol kilidi ve sesli uyarı fiilen denendi mi; anormal ses, titreşim, sarsıntı ve eğim yok mu?", "ref": "TS EN 1493 md.5.6.1 / md.5.6.4 b)"}, {"row": 63, "no": "C35", "t": "Kol kilidi yüksüz doğrulama testi", "d": "Tam uzatılmış kol ucuna, koluna dik yönde nominal yükün %4,5'i kadar yatay kuvvet uygulanırsa (en az 1500 N referansı) kol kilidi tutuyor mu; bekletme sonrası kilit hâlâ doğru çalışıyor mu (kanıt testi bekletmesi en az 5 dakikadır)?", "ref": "TS EN 1493 md.4.9.4 / Ek I"}, {"row": 64, "no": "C36", "t": "Nominal yükte fonksiyon testi", "d": "Nominal yükte tüm hareketler nominal hızda sorunsuz yapıldı mı; güvenlik cihazları (mandal, senkron, limit) doğru çalıştı mı; sızıntıya karşı koruma nominal yükün %40'ı ve %100'ü ile ayrı ayrı denendi mi; izin verilen azami hızlar aşılmadı mı?", "ref": "TS EN 1493 md.5.6.4 a)"}, {"row": 65, "no": "C37", "t": "Aşırı yük dinamik testi", "d": "Test yükü nominal yükün %115'i mi ve yük dağılımı md.4.7.4'e uygun mu; tüm hareketler güvenli kontrol ve uygun hızlanma/yavaşlamayla, önceki hareketin titreşimi sönünce yapıldı mı; farklı yük dağılımları için tüm hareketler her test yüküyle tekrarlandı mı; lift durabildi ve yükü taşıdı mı?", "ref": "TS EN 1493 md.5.6.2"}, {"row": 66, "no": "C38", "t": "Aşırı yük statik testi", "d": "Test yükü nominal yükün %150'si mi (yük dağılımı md.4.7.4'e uygun); lift her taşıyıcı ve destek yapıda maksimum gerilim doğuran konuma getirilerek denendi mi; test yükü kaldırıldıktan sonra kalıcı deformasyon yok mu (yönetmelik Ek-III 2.2.1'deki 1,25/1,1 katsayıları yerine bu standart katsayıları esas alındı mı)?", "ref": "TS EN 1493 md.5.6.3 / md.5.6.1"}, {"row": 67, "no": "C39", "t": "Test sonrası kontrol", "d": "Yük testi sonrasında yapısal elemanlar, kaynaklar, ankraj, halat/zincir, somun/mil, hidrolik bağlantılarda sızıntı, çatlak, kalıcı deformasyon ve gevşeme kontrol edildi mi; mandal ve kol kilidi normal işlevini koruyor mu; sonuçlar ölçüm değerleriyle raporlandı mı?", "ref": "TS EN 1493 md.5.6.3 / md.5.6.1 / md.4.7.5.1"}, {"row": 68, "no": "C40", "t": "Elektriksel testler ve sonuç kaydı", "d": "Elektrik testleri EN 60204-1'e göre yapıldı mı; gözlem, ölçüm ve fonksiyon testi sonuçları yapan kişi ve firma adıyla imzalı raporda kayıtlı mı?", "ref": "TS EN 1493 md.5.6.5 / md.5.2 / TS EN 60204-1"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 70, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 71, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 72, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 73, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 74, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 76, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 77, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 78, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 80, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 81, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 82, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 83, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 84, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 85, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 86, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 87, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 88, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 89, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 90, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 91, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 92, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 1493 — Araç asansörleri (TS EN 1493:2022, Aralık 2022; TÜRKAK L701-018 eşlemesi)"], ["Yük / fonksiyon testi notu", "TS EN 1493 md.5.6: aşırı yük dinamik testi nominal yükün %115'i (md.5.6.2), aşırı yük statik testi nominal yükün %150'si (md.5.6.3, kaldırma sonrası kalıcı deformasyon olmamalı), yük dağılımı md.4.7.4'e göre; nominal yükte fonksiyon testinde sızıntıya karşı koruma nominal yükün %40'ı ve %100'ü ile denenir (md.5.6.4). Standart, statik/dinamik test için bekleme süresi vermez (yalnızca Ek I kol kilidi kanıt testi 5 dakika); süre üretici prosedürüne göre alınmalıdır. Yönetmelik Ek-III 2.2.1 'standartta aksi yoksa 1,25/1,1' dediğinden, bu ekipmanda standardın 1,5 (statik) ve 1,15 (dinamik) katsayıları esas alınmalı; yıllık kontrolde işletme kapasitesi ile yük testi, üç yılda bir/önemli onarımda standart katsayılı test uygulanmalıdır. Kapasite yük dağılımına (taşıma kolu konumu) bağlı olduğundan md.6.2 b) izin verilen yük dağılımı esas alınmalıdır."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) TS EN 1493'te periyodik/olağan dışı muayene için ayrı bir ek yok; yalnızca md.6.3.1 k) (kontroller en fazla yıllık) ve l) (muayene, kol boşluğu test prosedürü) var, çeklist bu md ve Ek C örneklerinden türetildi. 2) md.4.8.4.2 basınç tahliye valfi %10 ifadesi çeviride belirsiz ('nominal yükte oluşan basıncın %10'undan daha fazla olmayan'); orijinaline (EN 1493) bakılmalı. 3) md.5.6.4 b) atıfı 'md.4.9.5' diyor ama kol kilidi md.4.9.4'tür (standart/çeviri hatası olabilir). md.4.18.1 acil stop için 'md.4.4.4' diyor, doğrusu md.4.4.5. 4) 10 Nm / 3 dönüş (kendinden frenli vida periyodik testi) ve 75 dB(A) Ek C bilgilendirici çözüm örnekleridir, normatif değildir; Ek C alt madde numarası doğrulanmadı. 5) Halat/zincir çıkarma (atılma) kriterleri, zincir uzama yüzdesi, somun aşınma sınırı standartta yoktur (üretici/ISO 4309 vb.). 6) Ankraj cıvatası sıkma torku ve hidrolik test bekleme süresi standartta yok. 7) Yük testi için standarttaki yük dağılımları md.4.7.4.2-4.7.4.3'te (tekerlek/şasi destekli normatif araçlar, Tablo 3) verilir; saha uygulamasında üretici yük dağılımı kullanılmalı, Tablo 3 değerleri bu çıktıya alınmadı."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B9"], ["A8", "A9"], [], ["A4", "A12", "A13", "B4", "B5", "B7"], ["B1", "B2", "B3", "B6", "B8"], ["C22", "C34", "C35", "C36", "C37", "C38", "C39", "C40"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39", "C40"], ["D1", "B11"], ["D2", "D5", "E3", "E5", "E11", "B10"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.16.1", "name": "Forklift (Yürüyüşü Güç Tahrikli Endüstriyel Araç)", "method": "Kapsam Kodu: 1.A.16.1   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN ISO 3691-1 · FEM 4.004 · TS ISO 5057 · TS ISO 5053-1 · İSG Genel Müdürlüğü", "refTitle": "1.A.16.1 Forklift (Yürüyüşü Güç Tahrikli Endüstriyel Araç) — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.16.1 – Forklift (Yürüyüşü Güç Tahrikli Endüstriyel Araç)"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (Forklift / Reach truck / Transpalet vb.)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Kapasite (kg) / Std. Yük Merkezi Mesafesi (mm)"}, {"row": 24, "label": "Azami Kaldırma Yüksekliği (mm) - Tahrik (Elektrikli / Dizel / LPG)"}, {"row": 25, "label": "Akü Ağırlığı (kg) / Voltaj (V) - Kullanım Yeri (kapalı / açık / karayolu)"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.16.1 Forklift (Yürüyüşü Güç Tahrikli Endüstriyel Araç)) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (kumpas, şerit metre/çelik metre, açıölçer, takometre, LPG gaz dedektörü, kronometre ve (kullanılıyorsa) kalibre yük hücresi) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1 / FEM 4.004 md.4"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "Etiket bilgilerinin okunması", "d": "Marka, model, imalat yılı, seri/üretim no, kapasite, en fazla kaldırma yüksekliği, standart yük merkezi mesafesi, akü ağırlık/voltaj değerleri ekipman üzerinden okunarak kaydediliyor mu?", "ref": "Rapor md.2.1"}, {"row": 18, "no": "B2", "t": "Eksik/okunamayan etiket", "d": "Etiket yok veya okunamıyorsa bu durum kusur olarak kayda alınıyor mu; katalogdan varsayım yapılarak boşluk doldurulmuyor mu?", "ref": "Kriterler md.1"}, {"row": 19, "no": "B3", "t": "Tespit edilen bilgilerin ölçülmesi", "d": "Çatal bıçak boyu, bıçak/sap kalınlıkları, bıçak-sap açısı, kaldırma aksesuarı boyutları, kaldırma yüksekliği fiilen ölçülerek mi kaydediliyor?", "ref": "Rapor md.2.2"}, {"row": 20, "no": "B4", "t": "Akü verisi karşılaştırması", "d": "Akü üzerindeki ağırlık ve voltaj değeri, ekipman etiketindeki değerlerle karşılaştırılıyor mu (denge ağırlığı ve stabilite etkisi)?", "ref": "Rapor md.2.2 / Kriter 16"}, {"row": 21, "no": "B5", "t": "Kaldırma aksesuarı değerlendirmesi", "d": "Çatal dışında aksesuar varsa tipi, kapasitesi, kalıcı deformasyonu ve yük diyagramına etkisi değerlendirilip ekipman tanımına yansıtılıyor mu?", "ref": "Kriterler md.1 / Kriter 14"}, {"row": 22, "no": "B6", "t": "Konum ve kullanım amacı", "d": "Kapalı alan / açık saha / karayolu kullanımı kayda alınıp; silecek-yıkayıcı, aydınlatma, lastik diş derinliği gibi kriterlerin uygulanabilirliği buna göre mi belirleniyor?", "ref": "TS EN ISO 3691-1 md.4.11.1.5"}, {"row": 23, "no": "B7", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 24, "no": "B8", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 25, "no": "B9", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 27, "no": "C1", "t": "1. Bilgi etiketi, yük diyagramı, ikazlar ve işaretlemeler", "d": "Bilgi etiketi, yük diyagramı ve risk ikazlarının varlığı, okunaklılığı, doğru renk ve kalıcılığı fiilen kontrol edildi mi? Yük diyagramının ekipman özellikleriyle tutarlılığı doğrulandı mı?", "ref": "FEM 4.004 5.7.1 / 3691-1 6.3.1.1-2"}, {"row": 28, "no": "C2", "t": "2. Yetkisiz kullanıma karşı koruma", "d": "Kilitlenebilir kapı, çalıştırma anahtarı, şifre vb. korumanın varlığı ve işlevselliği fiilen denenerek doğrulandı mı?", "ref": "TS EN ISO 3691-1 4.2.1"}, {"row": 29, "no": "C3", "t": "3. Çalışma aydınlatması ve görüş", "d": "Farlar, sinyaller, dikiz aynaları (ayar mekanizması, deformasyon), operatör görüş alanı; silecek-yıkayıcı varlığı ve çalışırlığı kontrol edildi mi? Kapalı alan istisnası doğru uygulandı mı?", "ref": "3691-1 4.10 / 4.11.1.4 / 4.11.1.5"}, {"row": 30, "no": "C4", "t": "4. Operatör kabin/platform alanı ve erişim", "d": "Koruyucu kafes (FOPS), yük sırtlığı, basamak-tutamak, koltuk sabitliği, emniyet kemeri kontrol edildi mi? Reach truck'ta kemerin opsiyonel olduğu doğru değerlendirildi mi?", "ref": "3691-1 4.1.5 / 4.7.2.2"}, {"row": 31, "no": "C5", "t": "5. İstenmeyen hareket ve istem dışı harekete geçirme", "d": "Operatör mevcudiyet sistemi (koltuk şalteri/ölü adam), nötr konumda çalıştırma emniyeti fiilen test edildi mi?", "ref": "TS EN ISO 3691-1 4.2 / 4.5"}, {"row": 32, "no": "C6", "t": "6. Kumandalar", "d": "Kumandaların işaretlenmesi, hareket yönü uygunluğu ve birden fazla fonksiyonun aynı anda çalışmadığı fiilen denenerek doğrulandı mı?", "ref": "3691-1 4.4.1 / 4.4.2"}, {"row": 33, "no": "C7", "t": "7. Yürüyüş sistemleri", "d": "Lastik/teker tipi tespit edilip; kauçuk lastikte 'Safety Line'/'60 J' aşınma çizgisi, karayolunda pnömatikte ≥1,6 mm diş derinliği, poliüretanda üretici aşınma değeri ölçütüyle değerlendirildi mi? Jant, bijon ve teker yükseklik farkı kontrol edildi mi?", "ref": "3691-1 4.7.5.1 / 4.7.5.2"}, {"row": 34, "no": "C8", "t": "8. Kızaklar (mast)", "d": "Mast profilleri, makara ve kızaklarda deformasyon, çatlak, aşınma ve yanal boşluk; mast bağlantı ve pimleri kontrol edildi mi?", "ref": "TS EN ISO 3691-1 4.6"}, {"row": 35, "no": "C9", "t": "9. Hidrolik bileşenler", "d": "Hortum, rakor, silindir ve pompa sızdırmazlığı; hortum dış hasarı, kılavuzlanması ve emniyet valfi varlığı kontrol edildi mi?", "ref": "3691-1 4.6.4.1 / 4.6.4.2"}, {"row": 36, "no": "C10", "t": "10. Koruma tertibatları", "d": "Hareketli aksam kapakları, mahfazalar ve sabitleme elemanları yerinde mi, deformasyon/çözülme var mı? Sökülmüş koruma tespit edildi mi?", "ref": "TS EN ISO 3691-1 4.1"}, {"row": 37, "no": "C11", "t": "11. Göstergeler ve ikaz cihazları", "d": "Korna, flaşör, geri hareket sesli ikazı, saat/şarj/yakıt göstergeleri fiilen çalıştırılarak kontrol edildi mi? Reach truck'ta geri hareket ses ikazının aranmayacağı biliniyor mu?", "ref": "3691-1 4.9 / Video Bilgilendirme md.4"}, {"row": 38, "no": "C12", "t": "12. Fren sistemleri", "d": "Servis freni ve park freni fiilen test edildi mi? Park freni testi; forkliftte normal çalışma konumunda, yaya kumandalı istif makinasında %5 eğimde uygulandı mı?", "ref": "3691-1 4.2.2.1 / 4.3 / Video Bilg. md.5"}, {"row": 39, "no": "C13", "t": "13. Kaldırma zinciri", "d": "Bakla ve bağlantılarda deformasyon gözle kontrol edildi mi? Uzama 6 zincir aralığında ölçülerek orijinal uzunluğun %3'ünü aşmadığı doğrulandı ve ölçüm değeri kaydedildi mi?", "ref": "Video Bilg. md.6 / Kriter 13"}, {"row": 40, "no": "C14", "t": "14. Çatal kollar ve/veya diğer aksesuarlar", "d": "Çatal kalınlığı kumpasla ölçülüp üretici değerinin %90'ının altında olmadığı; çatallar arası yükseklik farkının bıçak uzunluğunun %3'ünü aşmadığı şerit metre/kumpasla; bıçak-sap açısı, topuk aşınması, çatlak ve kilit pimi kontrol edildi mi?", "ref": "5.6.1 / 5.6.3 / 5.7.3 / Video Bilg. md.7-8"}, {"row": 41, "no": "C15", "t": "15. Güç sistemleri ve aksesuarları", "d": "LPG sistemi montaj ve sızdırmazlık kontrolü uygun yöntemle (köpük/dedektör) yapıldı mı? Yakıt deposu, egzoz, elektrik tesisatı ve kablo izolasyonu kontrol edildi mi?", "ref": "Kriter 15"}, {"row": 42, "no": "C16", "t": "16. Akü ve akü verileri", "d": "Akü sabitleme/kilit, kutup başları, kablo izolasyonu, akü ağırlığının ekipman için uygunluğu ve şarj alanı havalandırması değerlendirildi mi?", "ref": "Kriter 16"}, {"row": 43, "no": "C17", "t": "17. Fonksiyon testi", "d": "Yüksüz durumda tüm fonksiyonlar (kaldırma, indirme, eğim, sürüş, direksiyon, fren) çalıştırılarak test edildi; frenlerin çalışırlığı, bağlantılarda çözülme ve deformasyon olmadığı doğrulandı mı?", "ref": "TS EN ISO 3691-1 5.3"}, {"row": 44, "no": "C18", "t": "18. Yük testi", "d": "Yük diyagramı içinde kalan nominal yükte, bilgi plakasındaki yük merkezi mesafesi ve belirlenen kaldırma yüksekliğinde test yapıldı mı? Yük miktarı irsaliye/yük üzerindeki bilgi ile doğrulandı mı? Yüksüz mekanik dayanım testi kusursuz sonuçlandıktan sonra mı geçildi?", "ref": "FEM 4.004 5.6.1 / 5.5.3 / Video Bilg. md.9"}, {"row": 45, "no": "C19", "t": "19. Hidrolik sızıntı testi", "d": "Nominal yükte 10 dakika bekletme süresi fiilen tutuldu mu? Kaldırma silindiri kaçağı; üretici toleransı ya da <10.000 kg araçta 100 mm, >10.000 kg araçta 200 mm sınırına göre ölçüldü mü? 2500 mm kaldırma yüksekliğine denk yükte eğim (tilt) silindiri sızıntısı ayrıca değerlendirildi mi? Test sonrası sızıntı, çözülme ve deformasyon kontrolü yapıldı mı?", "ref": "FEM 4.004 5.5 / 3691-1 4.6.3.1 / 4.6.3.4"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 47, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 48, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 49, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 50, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 51, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 52, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 53, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 54, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 55, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 57, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 58, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 59, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 60, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 61, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 62, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 63, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 64, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 65, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 66, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 67, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 68, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 69, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN ISO 3691-1 — Endüstriyel araçlar - Güvenlik gereklilikleri ve doğrulama - Bölüm 1: Kendinden tahrikli endüstriyel araçlar"], ["Standart 2", "FEM 4.004 — Endüstriyel araçların periyodik muayenesi"], ["Standart 3", "TS ISO 5057 — Endüstriyel araçlar - Çatal kollu araçların çatal kollarının kullanımda muayenesi ve onarımı"], ["Standart 4", "TS ISO 5053-1 — Endüstriyel araçlar - Terimler ve sınıflandırma (L701-018 eşlemesi: md.3.3–3.9, 3.26, 3.33, 3.34)"], ["Standart 5", "İSG Genel Müdürlüğü — Kendinden Tahrikli Endüstriyel Araç (Forklift-Transpalet) Periyodik Kontrol Kriterleri ve Rapor Formatı"], ["Yük / fonksiyon testi notu", "Bakanlık kriterlerine göre yük testi, yük diyagramı içinde kalan nominal yükte, bilgi plakasındaki yük merkezi mesafesi ve belirlenen kaldırma yüksekliğinde yapılır (FEM 4.004 md.5.6.1). Hidrolik sızıntı testinde nominal yükte 10 dakika beklenir; kaldırma silindiri kaçağı üretici toleransı yoksa <10.000 kg araçta 100 mm, >10.000 kg araçta 200 mm ile sınırlıdır; eğim (tilt) silindiri 2500 mm kaldırma yüksekliğine denk yükte ayrıca değerlendirilir (FEM 4.004 md.5.5). Forkliftte kapasite yük diyagramına göre değiştiğinden test yükü diyagramdan alınır; Yönetmelik Ek-III md.2.2.1 katsayılı testi ekipmanın çalışma prensibi dikkate alınarak enspektörce belirlenir (md.2.2.1.1)."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "B ve C bölümleri, 3_Endüstriyel araçlar klasöründeki 'Forklift_Periyodik_Kontrol_Tanik_Denetim_Ceklisti.xlsx' içeriğinden aynen aktarılmıştır. A, D ve E bölümleri diğer ekipman çeklistleriyle ortak hale getirilmiş; enspektör kayıt numarası Yönetmelik Ek-III md.1.7.9 uyarınca EKİPNET olarak güncellenmiştir."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B7"], ["A8", "A9"], [], ["A4", "A12", "A13"], ["B1", "B2", "B5", "B6"], ["C17", "C18", "C19"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19"], ["D1", "B9"], ["D2", "D5", "E3", "E5", "E11", "B3", "B4", "B8"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.17.1", "name": "Yürüyen Merdiven", "method": "Kapsam Kodu: 1.A.17.1   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 115-1 · TS EN 115-2 (incelenen metin: BS EN 115-2:2021)", "refTitle": "1.A.17.1 Yürüyen Merdiven — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.17.1 – Yürüyen Merdiven"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (Yürüyen merdiven / eğimli yürüyen bant)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal Hız (m/s) - Eğim Açısı (°)"}, {"row": 24, "label": "Yükseklik h13 (m) - Nominal Genişlik z1 (m)"}, {"row": 25, "label": "Fren Tipi (elektromekanik / elektrikli frenleme) - Yardımcı Fren (var/yok) - Kumanda (elle / otomatik)"}, {"row": 26, "label": "Fren Testi Koşulu (yüksüz / yüklü) ve Ölçülen Durma Mesafesi (m)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.17.1 Yürüyen Merdiven) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Filler (yaprak) mastar ve kumpas (4 mm / 6 mm / 7 mm boşluk, tarak ve oluk ölçümü), çelik şerit metre veya lazer metre (durma mesafesi, korkuluk ve bina arayüzü mesafeleri), el veya optik takometre / kronometre (basamak ve küpeşte hızı) vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzak
