laştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Fren testi planlaması", "d": "Fren (durma mesafesi) testleri için yüksüz ve – gerekiyorsa – yüklü test koşulları, test alanının boşaltılması ve güvenlik cihazlarının deneme yöntemi muayene öncesi planlandı mı?", "ref": "TS EN 115-1 md.7.3.2 / 7.4.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Etiket ve işaretleme bilgileri", "d": "Yürüyen merdivenin en az bir inişinde dışarıdan görülebilir şekilde imalatçı adı ve açık adresi, seri/tip tanımı, seri numarası ve yapım yılı bulunuyor mu? Bilgiler ekipman kaydı, önceki rapor ve kılavuzla karşılaştırılıp kaydedildi mi?", "ref": "TS EN 115-1 md.7.5"}, {"row": 18, "no": "B2", "t": "2. Nominal değerler ve sınıflandırma verisi", "d": "Eğim açısı, nominal hız, nominal genişlik z1, yükseklik h13 ve basamak yükseltici yüksekliği x1 belirlenip kaydedildi mi? Değerlerin sınırlara uygunluğu değerlendirildi mi (eğim 30° üstü ise h13 6 m'yi ve hız 0,50 m/s'yi aşmamalı, eğim 35° üstü olamaz; hız 30°'ye kadar 0,75 m/s, 30°-35° arası 0,50 m/s'yi aşamaz; z1 0,58-1,10 m)?", "ref": "TS EN 115-1 md.5.2.2 / 5.4.1.2.2 / 5.3.2.1"}, {"row": 19, "no": "B3", "t": "3. Kullanım yeri ve bina arayüzü bilgisi", "d": "Kullanım yeri (toplu kullanım, iç/dış mekan, otomatik çalışma, yürüyen merdiven sırası/ara çıkış durumu) ve komşu yürüyen merdiven veya kat kesişimi durumu tespit edilip kayda alındı mı? Dış mekan ve deprem etkisi gibi özel koşulların kılavuzda tanımlı olup olmadığı kontrol edildi mi?", "ref": "TS EN 115-1 md.7.4.1 b) / Ek A"}, {"row": 20, "no": "B4", "t": "4. Talimat el kitabı ve imalatçı dokümanları", "d": "Kullanım, bakım, denetim, periyodik kontrol ve kurtarma talimatlarını içeren kullanım kılavuzu mevcut ve ekipman modeline özgü mü? Fren hesabı ve ayar verisi, durma mesafesi ve yavaşlama kanıtı gibi imalatçı kayıtlarına erişilebiliyor mu ve fren ayar verisi enspektör tarafından kayda alındı mı?", "ref": "TS EN 115-1 md.7.1 / 7.4.1 / 6.2"}, {"row": 21, "no": "B5", "t": "5. Önceki kontrol ve bakım kayıtları", "d": "Önceki periyodik kontrol raporları, bakım kayıtları, arıza ve kaza kayıtları incelendi mi? Açık kalan uygunsuzluklar, tarak-basamak-zincir değişimi, fren onarımı ve güvenlik cihazı arızası geçmişi tespit edilip bu kontrolde ilgili maddelere yönlendirildi mi?", "ref": "TS EN 115-1 md.7.4.1 e) / f)"}, {"row": 22, "no": "B6", "t": "6. Donanım tipinin belirlenmesi", "d": "Fren tipi (elektromekanik fren, elektrikli frenleme), operasyonel fren ile basamak tahriki arasındaki bağlantı türü (mil, dişli, çoklu zincir veya trapez kayış), yardımcı frenin gerekli olup olmadığı ve varlığı belirlendi mi? Yardımcı fren; bağlantı sürtünmeli değilse, fren elektromekanik değilse veya h13 6 m'yi aşıyorsa gereklidir; bu kontrol yapıldı mı?", "ref": "TS EN 115-1 md.5.4.1.3.1 / 5.4.2.2.1"}, {"row": 23, "no": "B7", "t": "7. Fren yükü ve durma mesafesi hazırlığı", "d": "Test edilecek basamak sayısı h13 / x1 (basamak yükselticisinin maksimum görünür yüksekliği) ile hesaplandı mı? Adım başına fren yükü nominal genişliğe göre belirlendi mi (z1 0,60 m'ye kadar 60 kg, 0,60-0,80 m 90 kg, 0,80-1,10 m 120 kg)? İzin verilen durma mesafesi aralığı nominal hızdan Tablo 3'e göre (ara hızlarda enterpolasyonla) hazırlandı mı?", "ref": "TS EN 115-1 md.5.4.2.1.3.1 / 5.4.2.1.3.2"}, {"row": 24, "no": "B8", "t": "8. Modernizasyon / iyileştirme durumu (eski tesis)", "d": "Ekipmanda daha önce TS EN 115-2 kapsamında iyileştirme veya değişiklik yapılmış mı sorgulandı mı? Yapıldıysa değişikliğin sadece değiştirilen parçayı değil etkilenen diğer bileşen ve sistemleri de kapsayan inceleme ve testlerinin kayıtları görüldü mü?", "ref": "TS EN 115-2 md.5.1 / 6"}, {"row": 25, "no": "B9", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 26, "no": "B10", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 27, "no": "B11", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 29, "no": "C1", "t": "Test alanının emniyete alınması", "d": "Kontrol/bakım sırasında yetkisiz kişilerin erişimi 'Erişim Yasaktır' uyarısı veya 'Giriş Yasak' işaretiyle engellendi mi? Testler yürüyen merdivende kullanıcı ve nesne bulunmadığı görsel olarak doğrulandıktan sonra başlatıldı mı?", "ref": "TS EN 115-1 md.7.2.1.2.3 / 5.12.3.2"}, {"row": 30, "no": "C2", "t": "Kullanıcı güvenlik işaretleri", "d": "Girişlerin yakınında 'Küçük çocuklar sıkıca tutulmalıdır', 'Köpekler taşınmalıdır', 'Tırabzanı kullanın' ve 'İtmeli sandalyelere izin verilmez' işaretleri mevcut, okunaklı, dayanıklı ve ülke dilinde mi? Otomatik çalışan ünitede hareket yönü/kullanıma hazır sinyali görülüyor mu?", "ref": "TS EN 115-1 md.7.2.1.1 / 7.2.1.2.1 / 7.2.2"}, {"row": 31, "no": "C3", "t": "Muhafaza, dış panel ve muayene kapakları", "d": "Hareketli parçalar deliksiz panellerle kapalı mı; havalandırma dışındaki boşluk ve açıklıklar 4 mm'yi aşmıyor mu? Havalandırma açıklığından 10 mm çaplı sert çubuk hareketli parçaya ulaşamıyor mu? Açılabilen dış paneller elektrikli güvenlik tertibatlı mı? Muayene kapakları yalnızca anahtar veya uygun aletle açılıyor mu ve açıldığında elektrikli güvenlik cihazı yürüyen merdiveni durduruyor mu (fiilen açılarak denendi mi)? Arkasındaki mahale girilebiliyorsa içeriden anahtarsız açılabiliyor mu?", "ref": "TS EN 115-1 md.5.2.1.1 / 5.2.1.2 / 5.2.1.5 / 5.2.1.6 / 5.2.4 / 5.12.2.7.14"}, {"row": 32, "no": "C4", "t": "Basamak yüzeyi ve oluklar", "d": "Tüm basamaklarda kırık, çatlak, aşınmış veya eksik oluk ve yükseltici var mı gözle kontrol edildi mi? Basamak yüksekliği x1 en fazla 0,24 m, adım derinliği y1 en az 0,38 m, oluk genişliği 5-7 mm, oluk derinliği en az 10 mm, ağ genişliği 2,5-5 mm sınırlarında olduğu ölçülerek doğrulandı mı? Basamak yüzeyi taşıma alanında yatay mı (±1°)?", "ref": "TS EN 115-1 md.5.3.2.2 / 5.3.1"}, {"row": 33, "no": "C5", "t": "Ardışık basamaklar arası boşluk", "d": "Sırt yüzeyinde ardışık iki basamak arasındaki boşluk, kullanılabilir tüm konumlarda mastarla ölçüldü mü ve 6 mm'yi aşmadığı doğrulandı mı (TS EN 115-2 kapsamında düz basamaklarda 5 mm)? Ölçüm değerleri kaydedildi mi?", "ref": "TS EN 115-1 md.5.3.5 / TS EN 115-2 md.5.3.4"}, {"row": 34, "no": "C6", "t": "Basamakların yönlendirilmesi (yanal/dikey oynama)", "d": "Basamakların kılavuz sisteminden yanal yer değiştirmesi her iki tarafta 4 mm'yi ve toplamda 7 mm'yi, dikey yer değiştirme 4 mm'yi aşmıyor mu? Ölçüm kullanılabilir alanda, basamak yatay ve eğimli bölgedeyken yapıldı mı?", "ref": "TS EN 115-1 md.5.3.4"}, {"row": 35, "no": "C7", "t": "Süpürgelik - basamak yanal boşluğu", "d": "Basamak ile süpürgelik arasındaki yatay açıklık her iki tarafta 4 mm'yi, her iki tarafta doğrudan iki noktada ölçülen açıklıkların toplamı 7 mm'yi aşmıyor mu? Ölçüm merdiven boyunca birden fazla noktada, iki yanda mastarla yapıldı mı ve süpürgelikte deformasyon, çıkıntı veya sıkışma izi kontrol edildi mi?", "ref": "TS EN 115-1 md.5.5.5.1 / 5.5.3.4 b)"}, {"row": 36, "no": "C8", "t": "Etek saptırıcılar (deflektör)", "d": "Etek deflektörleri var, bir sert ve bir esnek parçadan oluşuyor ve hasarsız mı? Etek panelinin dikey yüzünden çıkıntı 33-50 mm, sert parçanın yatay çıkıntısı 18-25 mm, esnek parça çıkıntısı 15-30 mm, eğimli bölümde sert parça alt kenarı ile basamak burnu hattı arasındaki mesafe 25-30 mm mı ölçüldü? Terminal ucu tarak kesişme çizgisinden 50-150 mm önce mi bitiyor? (Eski tesislerde bu ölçüler uygulanamıyorsa min. 8 mm koşulu değerlendirildi mi?)", "ref": "TS EN 115-1 md.5.5.3.4 c) / TS EN 115-2 md.5.5.3"}, {"row": 37, "no": "C9", "t": "Korkuluk yüksekliği ve iç paneller", "d": "Eğimli bölümde basamak burnundan tırabzan üstüne dikey yükseklik h1 0,90-1,10 m aralığında mı ölçüldü? İç panel derzleri 4 mm'yi aşmıyor, hareket yönünde olmayan kapak çıkıntısı 3 mm'yi aşmıyor, cam iç panel sertleştirilmiş ve tek katmanda en az 6 mm kalınlıkta mı? Alt iç kaplama eğimi yataya göre en az 25° mi?", "ref": "TS EN 115-1 md.5.5.2.1 / 5.5.2.4 / 5.5.2.6"}, {"row": 38, "no": "C10", "t": "Tırmanma, kayma ve erişim önleyici cihazlar", "d": "Tırmanma önleyici cihaz alt dış kaplamada zemin seviyesinden (1000±50) mm yükseklikte ve korkuluk kaplamasına paralel en az 1000 mm uzunlukta mı? Gerekli yerlerde (duvar aralığı b13 125 mm'yi, korkuluk merkez hattı-duvar mesafesi 300 mm'yi aştığında) erişim kısıtlama ve kayma önleyici cihazlar (yükseklik en az 20 mm, tırabzana en az 100 mm mesafede, aralık en fazla 1800 mm) mevcut mu?", "ref": "TS EN 115-1 md.5.5.2.2 / TS EN 115-2 md.5.5.2.3"}, {"row": 39, "no": "C11", "t": "Küpeşte hızı", "d": "Küpeşte hızı basamak hızına göre -%0 ile +%2 toleransında mı? Küpeşte hızı ve basamak hızı el/optik takometre ile her iki korkuluk için ölçülüp kaydedildi mi?", "ref": "TS EN 115-1 md.5.6.1"}, {"row": 40, "no": "C12", "t": "Küpeşte hız izleme cihazı", "d": "Küpeşte hız izleme cihazı mevcut mu ve küpeşte hız sapması (basamak hızına göre %15'ten fazla, 5-15 sn süreyle) benzetilerek yürüyen merdivenin durduğu fiilen denendi mi? (Standart metnindeki işaret bozuk okunuyor; imalatçı ayar değeri de kaydedildi mi?)", "ref": "TS EN 115-1 md.5.12.2.7.13 / TS EN 115-2 md.5.6.1"}, {"row": 41, "no": "C13", "t": "Küpeşte profili, konumu ve korkuluk uzantısı", "d": "Küpeşte genişliği 70-100 mm, küpeşte-korkuluk kenarı mesafesi en fazla 50 mm, küpeşte profili ile kılavuz/kapak profili arası en fazla 8 mm mı ölçüldü? Küpeşte bitişik yüzeylerden yatayda en az 80 mm, düşeyde en az 25 mm uzakta mı? Küpeşte kılavuzundan ayrılmayacak şekilde gergin ve yönlendirilmiş, yüzeyi yırtık/aşınmış değil mi? Korkuluk, küpeşteler dahil tarak kesişme çizgisinden en az 0,60 m çıkıntı yapıyor mu? Küpeştenin yatay kısmı tarak kesişme hattından sonra en az 0,30 m devam ediyor mu?", "ref": "TS EN 115-1 md.5.6.2 / 5.6.5 / 5.5.4.1 / 5.5.4.2"}, {"row": 42, "no": "C14", "t": "Küpeşte girişi ve sıkışma algılama", "d": "Küpeşte korkuluğa giriş noktası bitmiş zeminden 0,10-0,25 m yükseklikte mi? Girişte parmak/el sıkışmasına karşı koruma var mı ve girişe sıkışan cismi algılayan güvenlik cihazı yürüyen merdiveni durduruyor mu (fiilen denendi mi)?", "ref": "TS EN 115-1 md.5.6.4.1 / 5.6.4.3 / 5.12.2.7.9"}, {"row": 43, "no": "C15", "t": "Tarak dişleri ve tarak plakası", "d": "Tarak dişlerinde kırık, aşınma, eğilme var mı; tarak dişleri basamak olukları ile düzgün geçme yapıyor mu? Diş genişliği en az 2,5 mm, diş ucu yarıçapı en fazla 2 mm, ağ derinliği h8 en az 4 mm, açıklık h6 en fazla 4 mm mi ölçüldü? Tarak ayarı ve değişimi kolay, bağlantısı sağlam mı?", "ref": "TS EN 115-1 md.5.7.3.1 / 5.7.3.2 / 5.7.3.3"}, {"row": 44, "no": "C16", "t": "Tarakta tuzaklanma güvenlik cihazı", "d": "Tarak/basamak arasına cisim sıkışması (tarak kalkması veya kayması) benzetilerek tarakta tuzaklanmayı algılayan cihazın yürüyen merdiveni durdurduğu fiilen denendi mi? Her iki inişteki (üst ve alt) tarak için ayrı ayrı yapıldı mı?", "ref": "TS EN 115-1 md.5.12.2.7.7 / TS EN 115-2 md.5.7.3"}, {"row": 45, "no": "C17", "t": "İniş alanı yüzeyi ve bina arayüzü", "d": "Tarak plakası ve zemin plakası tarak dişi kökünden itibaren en az 0,85 m güvenli bir yüzeye sahip mi? Basamaklar üzerindeki net yükseklik en az 2,30 m mi? Çıkışta kısıtlanmamış alan derinliği korkuluk ucundan en az 2,50 m mi; kat kesişimi veya çapraz merdivende dikey saptırıcı mevcut mu?", "ref": "TS EN 115-1 md.5.7.1 / Ek A md.A.2.1 / A.2.4 / A.2.5"}, {"row": 46, "no": "C18", "t": "Eksik basamak algılama", "d": "Eksik basamağı algılayan cihaz sürüş ve dönüş istasyonlarının her birinde var mı ve algılama araçları geçiş eğrileri arasındaki düz kısma monte edilmemiş mi? Yürüyen merdivenin eksik basamaktan kaynaklanan boşluk taraktan çıkmadan durduğu, imalatçı/bakımcı yöntemiyle fiilen denendi mi?", "ref": "TS EN 115-1 md.5.3.6 / 5.12.2.7.11 / TS EN 115-2 md.5.3.5"}, {"row": 47, "no": "C19", "t": "Sarkan basamak algılama", "d": "Sarkan (çöken) basamak algılama cihazı, her geçiş eğrisinden önce tarak kesişme hattından yeterli mesafede mi? Cihazın tetiklenmesiyle yürüyen merdivenin durduğu fiilen denendi mi?", "ref": "TS EN 115-1 md.5.12.2.7.10 / 5.7.2.5 / TS EN 115-2 md.5.7.4"}, {"row": 48, "no": "C20", "t": "Basamak zinciri durumu ve gerginliği", "d": "Basamak zincirleri her iki tarafta (en az iki zincir) mevcut mu; aşınma, çatlak, korozyon, yağlama ve zincir gerginliği görsel olarak ve bakım kılavuzundaki değerlere göre kontrol edildi mi? Aşınma/uzama ölçümü imalatçı sınır değerine göre yapılıp kaydedildi mi?", "ref": "TS EN 115-1 md.5.4.3.1 / 7.4.1 f)"}, {"row": 49, "no": "C21", "t": "Zincir kopma / aşırı uzama ve gergi hareketi algılama", "d": "Basamak zinciri kopması veya aşırı uzamasını algılayan cihaz ve germe cihazının hareketini (tahrik ve gergi arasında 20 mm'den fazla uzama/kısalma) algılayan cihaz fiilen denendi mi? Gergi için gergin çalışan yay kullanılmadığı, ağırlıkla germede askının kopması durumunda ağırlığın tutulduğu doğrulandı mı?", "ref": "TS EN 115-1 md.5.12.2.7.5 / 5.12.2.7.6 / 5.4.3.3"}, {"row": 50, "no": "C22", "t": "Hız ölçümü (yüksüz)", "d": "Yüksüz yürüyen merdivenin hızı ölçüldü mü ve nominal hızdan ±%5'ten fazla sapmadığı doğrulandı mı? Ölçüm değeri ve nominal hız kaydedildi mi?", "ref": "TS EN 115-1 md.5.4.1.2.1"}, {"row": 51, "no": "C23", "t": "Servis freni - durma mesafesi (yüksüz)", "d": "Yukarı doğru yüksüz ve aşağı doğru yüksüz durma mesafeleri fiilen ölçüldü mü? Mesafe, elektrikli durdurma cihazının çalıştırıldığı andan itibaren ölçülüp nominal hıza karşılık gelen alt-üst sınırlar arasında mı (0,50 m/s: 0,20-1,00 m; 0,65 m/s: 0,30-1,30 m; 0,75 m/s: 0,40-1,50 m; ara hızlarda enterpolasyon)?", "ref": "TS EN 115-1 md.5.4.2.1.3.2 / 7.3.2 d) / TS EN 115-2 md.5.4.2.1.4"}, {"row": 52, "no": "C24", "t": "Servis freni - durma mesafesi (yüklü, aşağı yön)", "d": "Aşağı yönde fren yükü altında durma mesafesi test edildi mi? Yük, Tablo 2'ye göre (adım başına 60/90/120 kg) ve h13/x1 adım sayısına göre kalibre test ağırlıklarıyla yüklendi mi (toplam yükün adım sayısının üçte ikisine dağıtılmasına izin verilir)? Durma mesafesi Tablo 3 sınırlarında mı, ölçülebiliyorsa aşağı yönde yavaşlama 1 m/s²'yi aşmıyor mu?", "ref": "TS EN 115-1 md.5.4.2.1.3.1 / 5.4.2.1.3.2 / 7.3.2 d)"}, {"row": 53, "no": "C25", "t": "Fren yapısı, kaldırma izleme ve %20 aşım önleme", "d": "Elektromekanik frenin yay kuvvetiyle uygulandığı, fren elektriği kesildiğinde kasıtlı gecikme olmadan devreye girdiği doğrulandı mı? Fren balata aşınması, ayar ve fren kaldırılmadığını algılayan cihaz (çalışma frenine ait) kontrol edildi mi? Fren ayarı imalatçı hesabı/ayar verisiyle karşılaştırıldı mı? İzin verilen azami durma mesafesinin %20'den fazla aşılması durumunda yürüyen merdivenin çalışmasını önleyen cihaz mevcut ve arıza kilitli mi? Cihazın çalışması imalatçı yöntemiyle denendi veya ayar değeri kayda alındı mı?", "ref": "TS EN 115-1 md.5.4.2.1.2 / 5.12.3.5.2.1 / 5.12.2.7.12 / 6.2 c) / 5.12.3.10"}, {"row": 54, "no": "C26", "t": "Yardımcı fren (varsa / gerekli ise)", "d": "Yardımcı fren gerekli olan ünitelerde mevcut ve mekanik (sürtünmeli) tipte mi; basamak tahrik dişlisi ile bağlantısı mil, dişli veya çoklu zincirle mi (kavrama yok)? Yardımcı frenin devreye giriş koşulları (hız nominalin 1,4 katını aşmadan veya hareket yönü değişince) ve kaldırılmadığını algılayan güvenlik cihazı denendi mi?", "ref": "TS EN 115-1 md.5.4.2.2 / 5.12.3.5.3 / 5.12.2.7.4"}, {"row": 55, "no": "C27", "t": "Aşırı hız ve yön değişimi algılama", "d": "Hız nominal hızın 1,2 katını aşmadan aşırı hızı algılayan cihaz ve hareket yönünün kasıtsız değişimini algılayan cihaz mevcut mu? Her ikisinin yürüyen merdiveni durdurduğu imalatçı/bakımcı test yöntemiyle fiilen doğrulandı mı? (Tasarım aşırı hızı fiziksel olarak önlüyorsa bu belgelenmiş mi?)", "ref": "TS EN 115-1 md.5.4.2.3 / 5.12.2.7.2 / 5.12.2.7.3 / TS EN 115-2 md.5.4.2.1.1-5.4.2.1.2"}, {"row": 56, "no": "C28", "t": "Acil durdurma cihazları", "d": "Acil durdurma tertibatları her iki sahanlıkta veya yakınında göze çarpan, kolay ulaşılır konumda ve kırmızı renkte, 'STOP' yazılı mı? Aralarındaki mesafe 30 m'yi aşmıyor mu? Korkuluk yüksekliğinin yarısının altındaysa iç tarafta en az 80 mm çaplı kırmızı 'DUR' göstergesi var mı? Her birine basılarak yürüyen merdivenin durduğu ve yalnızca kullanıma alma anahtarıyla yeniden çalıştığı denendi mi?", "ref": "TS EN 115-1 md.5.12.3.8.1 / 7.2.1.2.2 / 5.12.2.7.15"}, {"row": 57, "no": "C29", "t": "Kullanıma alma ve yön seçimi", "d": "Çalıştırma anahtarı yalnızca yetkili kişilerin kullanabileceği türde (anahtarlı vb.), tarak kesişme hattı dışından erişilir, hareket yönü anahtar üzerinde açıkça gösterilen ve kullanıcı/nesne bulunmadığının görülebildiği yerde mi? Yön değiştirme yalnızca yürüyen merdiven dururken mümkün mü denendi mi?", "ref": "TS EN 115-1 md.5.12.3.2 / 5.12.3.11"}, {"row": 58, "no": "C30", "t": "Otomatik çalışma (varsa)", "d": "Otomatik çalışma yalnızca anahtarla kullanıma alma sonrası mümkün mü? Kullanıcı algılandığında yürüyen merdiven tarak kesişme hattında nominal hızın en az 0,2 katı ile hareket edip 0,5 m/s²'den az ivmelendiği, otomatik durdurmanın yeterli süre sonra (beklenen geçiş süresi artı 10 sn) olduğu ve yön/hazır sinyalinin çalıştığı kontrol edildi mi?", "ref": "TS EN 115-1 md.5.12.3.3 / 5.12.3.7 / 7.2.2"}, {"row": 59, "no": "C31", "t": "Arıza kilidi ve güvenlik cihazı sıfırlama", "d": "Güvenlik cihazı tetiklenip yürüyen merdiven durduktan sonra arıza kilidi yeniden çalıştırmayı engelliyor mu (aşırı hız, yön değişimi, yardımcı fren, zincir kopma/uzama, gergi hareketi, sarkan basamak, eksik basamak, çalışma freni kaldırılmama, el sarma cihazı için Tablo 8'de arıza kilidi gerekli)? Sıfırlama yalnızca yetkili kişi tarafından, uzaktan olmadan ve enerji gelmesinden sonra da kilit devam ederek mi yapılıyor?", "ref": "TS EN 115-1 md.5.12.2.8 / Tablo 8"}, {"row": 60, "no": "C32", "t": "Motor besleme ve fren besleme kontaktörleri", "d": "Motor beslemesi seri bağlı en az iki bağımsız kontaktörle ve fren beslemesi en az iki bağımsız elektrikli cihazla kesiliyor mu? Durma sonrası bu cihazlardan birinin açılmaması halinde yeniden çalıştırmanın engellendiği (imalatçı/bakımcı yöntemiyle) doğrulandı mı? Enerji kesildiğinde otomatik durdurma denendi mi?", "ref": "TS EN 115-1 md.5.12.3.5.1 / TS EN 115-2 md.5.4.1 / 5.4.2.1"}, {"row": 61, "no": "C33", "t": "Elektrik arızalarına karşı koruma ve motor koruması", "d": "Faz kaybı, gerilim kaybı ve faz değişimi durumlarında tehlikeli durum oluşmadığı (durma/çalışmama) denendi mi? Motor kısa devre ve aşırı yük koruması mevcut mu; aşırı yük koruması otomatik dönerse yeniden çalıştırma yalnızca kullanıma alma koşullarıyla mı mümkün?", "ref": "TS EN 115-1 md.5.12.1.2 / 5.12.1.3"}, {"row": 62, "no": "C34", "t": "Ana şalter ve yardımcı beslemeler", "d": "Ana şalter makinenin veya dönüş istasyonunun yakınında, motor-fren-kontrol besleme devresini kesiyor, asma kilitle emniyete alınabiliyor ve erişimi kolay mı? Aydınlatma ve prizleri kesmediği, birden fazla yürüyen merdivende hangi üniteye ait olduğunun net işaretlendiği kontrol edildi mi?", "ref": "TS EN 115-1 md.5.11.3.1 / 5.11.3.2 / 5.11.3.4 / 5.8.3.1"}, {"row": 63, "no": "C35", "t": "Yalıtım direnci ve topraklama sürekliliği", "d": "İletkenler arası ve iletkenler-toprak arası yalıtım direnci elektronik bileşenler ayrılarak ölçüldü mü? Sürüş istasyonundaki toprak terminalleri ile kazara gerilim alabilecek parçalar arası süreklilik ölçüldü mü? Kontrol/güvenlik devresi gerilimi 250 V'u aşmıyor mu? Ölçüm değerleri EN 60204-1'deki kabul değerleriyle karşılaştırılıp kaydedildi mi?", "ref": "TS EN 115-1 md.5.11.1.4 / 5.11.1.5 / 7.3.2 e) / 7.4.1 f)"}, {"row": 64, "no": "C36", "t": "Muayene kumandası (inspection control)", "d": "Taşınabilir muayene kumandası mevcut mu, yürütme için iki elle (bir elde yön, diğer elde RUN) sürekli ve eş zamanlı basmayı gerektiriyor mu ve kazara çalıştırmaya karşı korumalı mı? Kablo en az 3,00 m mi, muayene çıkışları yürüyen merdivenin her noktasına ulaşacak şekilde mi? Takılıyken diğer tüm kumandalar devre dışı kalıyor ve kumandadaki durdurma anahtarı çalıştırma freniyle durduruyor mu?", "ref": "TS EN 115-1 md.5.12.3.13 / 5.12.2.7.18"}, {"row": 65, "no": "C37", "t": "Makine mahali, koruyucular ve temizlik", "d": "Makas içi ve makine mahallerine erişim yalnızca yetkililere açık (kilitli) mi? Zincir, kayış, dişli, çıkıntılı motor milleri, el tekerleği ve fren kampanası gibi erişilebilir hareketli parçalar korunmuş mu? Ayakta durma alanı en az 0,30 m² ve kısa kenarı en az 0,50 m mi (dönüş hattı arasında düzenlenen tahrikte en az 0,12 m²)? Makas içinde gres, yağ, toz, kâğıt birikimi var mı; iç kısım temizlenmiş mi? Makine mahallinin yalnızca yürüyen merdiven işletimi, bakımı ve denetimi için kullanıldığı (depo amaçlı malzeme yok) doğrulandı mı?", "ref": "TS EN 115-1 md.5.2.3 / 5.8.1 / 5.8.2.1 / 5.8.2.3 / 5.2.1.4 / TS EN 115-2 md.5.2.2.1"}, {"row": 66, "no": "C38", "t": "Makine mahali: aydınlatma, priz ve bakım durdurma", "d": "Çalışma alanlarında aydınlatma en az 200 lx ölçüldü mü; sürüş/dönüş istasyonlarında portatif lamba ve priz mevcut mu? Sürüş ve dönüş istasyonunda işaretli bakım/onarım durdurma cihazı var mı? Makas dışı makine odalarında 'Makine alanı - tehlike, yetkisiz kişilerin erişimi yasaktır' uyarısı ve gerekli net yükseklik (en az 2,00 m) sağlanıyor mu?", "ref": "TS EN 115-1 md.5.8.3.2 / 5.12.2.7.17 / 7.2.1.4 / Ek A md.A.3.5"}, {"row": 67, "no": "C39", "t": "El sarma cihazı (varsa)", "d": "El sarma cihazı varsa kolay erişilebilir ve güvenli kullanılabilir mi; krank kolu veya delikli el çarkı kullanılmamış mı? Çıkarılabilir ise takıldığının algılandığı elektrikli güvenlik cihazı denendi mi? Kullanım talimatı ve hareket yönü işareti çevrede mevcut mu?", "ref": "TS EN 115-1 md.5.4.1.4 / 5.12.2.7.16 / 7.2.1.3"}, {"row": 68, "no": "C40", "t": "Test sonrası kontrol ve hizmete alma", "d": "Testler sonrasında devre dışı bırakılan tüm güvenlik cihazları ve kilitler eski konumuna alındı mı? Kapaklar kapatıldı, işaretler yerinde mi ve yürüyen merdiven hizmete verilmeden önce basamak bandının tam bir dönüşü kimse yokken gözlenerek olağandışı ses, titreşim veya basamak-tarak teması olmadığı doğrulandı mı? Bulgular ve ölçüm değerleri rapora işlendi mi?", "ref": "TS EN 115-1 md.7.4.1 e) / 5.12.3.2"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 70, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 71, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 72, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 73, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 74, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 76, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 77, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 78, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 80, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 81, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 82, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 83, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 84, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan fren testi koşulları ve ölçülen durma mesafeleri sahada fiilen ölçülen değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 85, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 86, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 87, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 88, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 89, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 90, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 91, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 92, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 115-1 — Yürüyen merdiven ve yürüyen bantlar için güvenlik - Bölüm 1: Yapım ve montaj (Aralık 2017, EN 115-1:2017)"], ["Standart 2", "TS EN 115-2 (incelenen metin: BS EN 115-2:2021) — Yürüyen merdiven ve yürüyen bantların güvenliği - Bölüm 2: Mevcut yürüyen merdivenlerin ve yürüyen bantların güvenliğinin iyileştirilmesine ilişkin kurallar"], ["Yük / fonksiyon testi notu", "Yürüyen merdivende TS EN 115-1'de statik/dinamik yük testi tanımlı değildir (md.5.3.3 basamak yük ve burulma testleri imalatçı tip doğrulamasıdır); saha kontrolündeki karşılığı fren testleridir. Md.7.3.2 d) ve md.7.4.1 f) uyarınca fren(ler) yüksüz durumda öngörülen durma mesafelerine göre denenir (yukarı yüksüz, aşağı yüksüz; Tablo 3: 0,50 m/s için 0,20-1,00 m, 0,65 m/s için 0,30-1,30 m, 0,75 m/s için 0,40-1,50 m, ara hızlarda enterpolasyon; mesafe elektrikli durdurma cihazının çalıştığı andan ölçülür) ve başka yöntemle doğrulanamıyorsa aşağı yönde fren yükü altında durma mesafesi de test edilir (Tablo 2: z1 0,60 m'ye kadar 60 kg, 0,60-0,80 m için 90 kg, 0,80-1,10 m için 120 kg adım başına; adım sayısı h13/x1, yük adım sayısının 2/3'üne dağıtılabilir; aşağı yönde yavaşlama 1 m/s²'yi aşmamalı). Elektrikli güvenlik cihazları (Tablo 8) tek tek denenir. Yönetmelik Ek-III 2.2.1'deki işletme kapasitesi/1,25-1,1 katsayılı yük testi mantığı bu ekipmanda uygulanmaz, çünkü incelenen metinde yürüyen merdiven için işletme kapasitesi veya yük testi katsayısı tanımlı değildir; bu husus tanık denetçi tarafından TÜRKAK L701-018 eşlemesi (TS EN 115) ile birlikte değerlendirilmelidir."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) Küpeşte hız sapması eşiği (md.5.12.2.7.13): Türkçe metinde '+%15/%15' şeklinde bozuk çıkıyor; işaret (+/-) doğrulanamadı, bu yüzden çeklistte 'sapma %15'ten fazla, 5-15 sn' yazıldı. 2) Tablo 3 başlığı çeviri metninde 'Tablo 'te' diye bozuk; içerik (durma mesafeleri) ve madde no (5.4.2.1.3.2) doğrulandı, Tablo 3 numarası bağlamdan çıkarıldı. 3) Arıza kilidi gerektiren cihaz listesi (md.5.12.2.8, Tablo 8) tablo düzeninden okundu; sütun kaymalarına karşı imalatçı devre şemasıyla teyit önerilir. 4) Metinde yalıtım direnci ve toprak sürekliliği için sayısal kabul değeri yok (EN 60204-1 md.18.3'e atıf), zincir aşınma/uzama sınırı ve basamak kırma testleri için de sayı yok; bu nedenle 'imalatçı/EN 60204-1 değeri' denildi. 5) Aşırı hız, yön değişimi, eksik basamak, sarkan basamak ve zincir kopması cihazlarının saha test yöntemi standartta tarif edilmemiş; 'imalatçı/bakımcı yöntemiyle' denildi. 7) TS EN 115-2 metni BS EN 115-2:2021 İngiliz yayını çevirisidir; madde numaraları oradan alındı (TS numarasıyla farklı olabilir). 8) Eğim/yükseklik sınırı (md.5.2.2): 35°'ye kadar izin h13 en fazla 6 m ve hız en fazla 0,50 m/s koşulludur; iniş düzlüğü ve eğrilik yarıçapı (md.5.7.2) ve Ek G işaretleri saha ölçümü zor olduğundan çeklistte ayrıntılı işlenmedi."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B9"], ["A8", "A9"], [], ["A4", "A12", "A13", "B4", "B5"], ["B1", "B2", "B3", "B6", "B7", "B8"], ["C1", "C40"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39", "C40"], ["D1", "B11"], ["D2", "D5", "E3", "E5", "E11", "B10"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.22", "name": "Hareketli Yükleme Rampası", "method": "Kapsam Kodu: 1.A.22   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 1398", "refTitle": "1.A.22 Hareketli Yükleme Rampası — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.22 – Hareketli Yükleme Rampası"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (Elle / Güçle çalışan; menteşeli / teleskopik dudak)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal Yük (Kapasite)"}, {"row": 24, "label": "Rampa Boyutları (Genişlik x Platform Uzunluğu) - Dudak Uzunluğu"}, {"row": 25, "label": "Tahrik / Besleme (hidrolik-elektrik: V - Hz - kW) - Kullanım Yeri (Rıhtım No)"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.22 Hareketli Yükleme Rampası) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Şerit metre/lazer mesafe ölçer (genişlik, yatak mesafesi, düşme mesafesi), dijital eğim ölçer/su terazisi (eğim), kalibre test ağırlıkları veya yük hücresi/dinamometre (yük testi, 300 N çalıştırma kuvveti), kronometre veya hız ölçüm düzeneği (0,05 m/s ve 0 vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "Etiket / plaka bilgileri", "d": "Rampa üzerinde kalıcı olarak sabitlenmiş ve kolay okunur etikette üretici adı-adresi, makine tanımı, kapasite, model tipi, seri/üretim no ve üretim yılı bulunuyor mu? Güçle çalışanlarda besleme bilgisi (gerilim, frekans, güç) de var mı? Değerler rapora kaydedildi mi?", "ref": "TS EN 1398 md.7.2"}, {"row": 18, "no": "B2", "t": "Nominal yük ve kısa kullanım talimatı", "d": "Nominal yük (kapasite) etikette okundu ve rapora yazıldı mı? Operatörün yakınında, kalıcı yapıştırılmış ve kolay görülen resimli kısa kullanım talimatı var mı ve nominal yükü içeriyor mu?", "ref": "TS EN 1398 md.3.16 / md.7.3.3"}, {"row": 19, "no": "B3", "t": "Rampa tipi ve sınıflandırma", "d": "Rampanın elle/güçle çalışan olduğu, dudak tipinin (menteşeli / teleskopik), çukura monteli mi rıhtım kenarına sabit mi olduğu tespit edilip kaydedildi mi? Hangi maddelerin uygulanacağı (md.5.3 elle, md.5.4 güçle çalışan) buna göre belirlendi mi?", "ref": "TS EN 1398 md.1.2 / md.3.1 / md.5.3 / md.5.4"}, {"row": 20, "no": "B4", "t": "Kullanım yeri ve kullanılan taşıma ekipmanı", "d": "Rampada geçen forklift/istif makinası cinsi ve iz genişliği, kullanılan araç tipi ve araç eğimi üretici talimatındaki izin verilen değerlerle karşılaştırıldı mı? Rampa ancak yayalar için kullanılıyorsa buna göre değerlendirme yapıldı mı?", "ref": "TS EN 1398 md.5.1.2.1 / md.5.2.4.1 / md.7.3.2 g, j"}, {"row": 21, "no": "B5", "t": "Üretici kılavuzu ve kontrol talimatı", "d": "Üreticinin kurulum, kullanım, bakım ve denetim talimatı (denetim aralıkları ve incelenecek öğeler dahil) Türkçe olarak mevcut ve enspektör tarafından temel alındı mı?", "ref": "TS EN 1398 md.7.1 / md.7.3 / md.7.4.1 / md.7.4.3"}, {"row": 22, "no": "B6", "t": "Önceki kontrol ve bakım kayıtları", "d": "Kullanıcının tuttuğu önceki denetim sonuç kayıtları (tarih, isim, adres, yetkili kişi imzası) ve düzenli bakım kayıtları incelendi mi? Önceki uygunsuzlukların giderildiği doğrulandı mı?", "ref": "TS EN 1398 md.7.4.2 / md.7.4.3"}, {"row": 23, "no": "B7", "t": "Onarım ve değişiklik geçmişi", "d": "Kaynaklı yapısal onarım gibi büyük onarım ya da tadilat yapılıp yapılmadığı sorgulandı mı? Yapıldıysa onarımın kapsamına uygun denetimin yapıldığı kayıtlarla doğrulandı mı?", "ref": "TS EN 1398 md.7.4.3"}, {"row": 24, "no": "B8", "t": "Ölçülecek veriler", "d": "Enspektör kontrol öncesi rampa genişliği, platform uzunluğu, çalışma konumlarındaki eğim, dudak yatak mesafesi ve (varsa) güvenlik cihazı değerlerini ölçüp kaydedecek şekilde hazırlandı mı? Ölçüm cihazları kalibrasyonlu mu?", "ref": "TS EN 1398 md.5.2.2 / md.5.2.4 / md.6 Tablo 3"}, {"row": 25, "no": "B9", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 26, "no": "B10", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 27, "no": "B11", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 29, "no": "C1", "t": "Yapısal elemanların görsel muayenesi", "d": "Köprü tabliyesi, taşıyıcı kirişler, çerçeve ve kaynak dikişlerinde çatlak, aşınma, korozyon, gözle görülür kalıcı deformasyon veya hasar aranarak gözle muayene edildi mi? Bulgular kaydedildi mi?", "ref": "TS EN 1398 md.7.4.3 a / Ek A.2"}, {"row": 30, "no": "C2", "t": "Menteşe, pim ve dudak mekanizması", "d": "Ana menteşe, dudak menteşesi, pimler ve (teleskopik dudakta) kılavuz/kızaklarda aşınma, boşluk, gevşeme ve emniyet elemanlarının eksikliği kontrol edildi mi?", "ref": "TS EN 1398 md.7.4.3 a, c"}, {"row": 31, "no": "C3", "t": "Sabitleme ve çukur/çerçeve bağlantısı", "d": "Rampa çerçevesinin bina/çukura sabitlenmesi (ankraj, kaynak, cıvata) gözle kontrol edilip gevşeme, çatlak veya hasar olmadığı doğrulandı mı?", "ref": "TS EN 1398 md.7.3.1 / md.7.4.3 a"}, {"row": 32, "no": "C4", "t": "Kayma önleyici yüzey", "d": "Kişi ve taşıma ekipmanının kullandığı yüzeyin profilli veya kaymaz işlemli olduğu, aşınma ile kayma direncini yitirmediği ve sıvıların akıp gidebileceği yapıda olduğu gözle doğrulandı mı?", "ref": "TS EN 1398 md.5.2.3"}, {"row": 33, "no": "C5", "t": "Rampa genişliği", "d": "Genişlik ölçülüp kaydedildi mi? En az 1,25 m ve üretici talimatındaki taşıma ekipmanı iz genişliğinden en az 0,70 m fazla olduğu doğrulandı mı?", "ref": "TS EN 1398 md.5.2.4.1"}, {"row": 34, "no": "C6", "t": "Azaltılmış genişlikli rampa", "d": "Genişliği 1,25 m'den az olan rampada işletmecinin düşme önlemi (örn. rıhtım ile araç arası boşluğun 0,20 m'den az olması, taşıma ekipmanının yönlendirilmesi) mevcut mu ve uygulanıyor mu? Araç en fazla 0,20 m uzakta konumlandırılıyor mu?", "ref": "TS EN 1398 md.5.2.4.2 / md.7.3.2 i"}, {"row": 35, "no": "C7", "t": "Eğim (gradyan)", "d": "Rampanın en yüksek ve en düşük çalışma konumundaki eğimi ölçüldü mü? Azami eğimin %12,5'i (yaklaşık 7°) aşmadığı ve taşıma ekipmanı için izin verilen eğimin de aşılmadığı doğrulandı mı?", "ref": "TS EN 1398 md.5.2.2 / md.7.3.2 g"}, {"row": 36, "no": "C8", "t": "Takılma ve tökezleme tehlikesi", "d": "Rampa ile rıhtım zemini ve araç yatağı arasında basamak, çıkıntı veya boşluk gibi takılma noktası bulunmadığı gözle ve yürüyerek kontrol edildi mi?", "ref": "TS EN 1398 md.5.2.6"}, {"row": 37, "no": "C9", "t": "Serbest yüzer durum", "d": "Dudak araç üzerine oturtulduktan sonra rampa aracın yükseklik değişimini (yükleme sırasında) otomatik olarak takip ediyor mu, fiilen denendi mi?", "ref": "TS EN 1398 md.5.2.6"}, {"row": 38, "no": "C10", "t": "Araç yatağının eğilmesine uyum", "d": "Araç yatağı eğik olduğunda dudağın yanal açıya otomatik uyum sağladığı veya platformun burulma esnekliğine sahip olduğu kontrol edildi mi? Platform uzunluğu 1,75 m'yi aşıyorsa, üretici verisiyle burulma esnekliğinin dudak ön kenarında ölçülen platform genişliğinin en az %3'ü olduğu doğrulandı mı?", "ref": "TS EN 1398 md.5.2.6 a, b"}, {"row": 39, "no": "C11", "t": "Dudağın araç üzerindeki oturması", "d": "Dudağın araç yatağına en az 0,10 m oturduğu (yatak mesafesi) ölçülerek doğrulandı mı? Dudak tam oturmadan yükleme yapılmasını engelleyen uygulama/talimat var mı?", "ref": "TS EN 1398 md.7.3.2 n"}, {"row": 40, "no": "C12", "t": "Depolanmış konumda destek", "d": "Rıhtım kenarına monteli, kullanılmadığında yukarı katlanan rampalarda, depolanmış konumdaki otomatik ve pozitif devreye giren mekanik destek (kanca, cıvata, çubuk) fiilen denendi mi? İstemeden devre dışı kalmayacağı doğrulandı mı?", "ref": "TS EN 1398 md.5.2.5"}, {"row": 41, "no": "C13", "t": "Trafik alanına entegre rampanın depo konumu", "d": "Trafik alanına entegre rampa, depolandığı konumda komşu yüzeylerle aynı seviyede düz bir yüzey oluşturuyor ve otomatik olarak destekleniyor mu?", "ref": "TS EN 1398 md.5.2.5"}, {"row": 42, "no": "C14", "t": "Bakım pervanesi (destek cihazı)", "d": "Bakım pervanesi/cihazı rampanın parçası mı ve yüksüz rampayı (dudak dahil) taşıyor mu? Güvenli konumdan devreye alınıp fiilen denendi mi? Cihazın istem dışı devre dışı kalmadığı doğrulandı mı? Bakım için dudağın serbestçe dönebildiği kontrol edildi mi?", "ref": "TS EN 1398 md.5.2.10 / md.7.4.2"}, {"row": 43, "no": "C15", "t": "Yan paneller (ayak koruması)", "d": "Rampa kenarları ile komşu trafik alanı arasındaki ezilme/kesilme tehlikesine karşı sert yan panellerin (ayak koruması) bulunduğu ve hasarsız olduğu kontrol edildi mi?", "ref": "TS EN 1398 md.5.2.9 / Şekil 5 a"}, {"row": 44, "no": "C16", "t": "Katlanmış dudak - çerçeve boşluğu", "d": "Destekli konumda dudak kenarı ile çerçeve bileşenleri arasında dikey veya yatay en az 25 mm boşluk olduğu ölçülerek doğrulandı mı? Gerekli statik genişlikteki destek blokları bu ölçünün dışında tutuldu mu?", "ref": "TS EN 1398 md.5.2.9 / Şekil 5 b"}, {"row": 45, "no": "C17", "t": "Rampa - araç arası ezilme/kesilme koruması", "d": "Güçle çalışan rampada, dudak ile araç arasındaki ezilme/kesilme tehlikesi için kumanda yerinin operatörü bu tehlikeden uzak tutacak şekilde olduğu doğrulandı mı? Elle çalışanlarda çalıştıran kişinin manuel hareketiyle korunma sağlanıyor mu?", "ref": "TS EN 1398 md.5.2.9 / md.5.4.2.2"}, {"row": 46, "no": "C18", "t": "Görünürlük işaretlemesi", "d": "Kaldırılmış veya indirilmiş konumda görünen yan bileşenler ve çerçeve yan alanları sarı/siyah veya kırmızı/beyaz renkle, dayanıklı ve net biçimde, en az 50 mm yükseklikte işaretlenmiş mi? Dudaklar bu şartın dışında tutuldu mu?", "ref": "TS EN 1398 md.5.2.11"}, {"row": 47, "no": "C19", "t": "Uyarı yazısı / piktogram", "d": "Rampada kalıcı ve kolay görülür biçimde, en az 15 mm harf yüksekliğinde \"MEKANİK OLARAK KİLİTLENMEDİĞİ SÜRECE BU RIHTIM DENGELEYİCİSİNİN ALTINA GİRMEYİN\" uyarısı (tercihen \"personel yasaktır\" piktogramı ile) bulunuyor mu?", "ref": "TS EN 1398 md.7.2"}, {"row": 48, "no": "C20", "t": "Kumanda paneli yeri", "d": "Güçle çalışan rampanın kumanda paneli, operatörün tüm hareketleri kolayca gözlemleyebileceği ve rampa ile araçtan kaynaklanan risklerden uzakta kalacağı yerde mi?", "ref": "TS EN 1398 md.5.4.2.2"}, {"row": 49, "no": "C21", "t": "Kumanda bırakma davranışı", "d": "Kumanda butonu bırakıldığında rampa duruyor mu (veya kendi ağırlığıyla en fazla 0,20 m/s hızla iniyor mu)? Yukarı ve aşağı hareketler için fiilen denendi mi?", "ref": "TS EN 1398 md.5.4.2.3"}, {"row": 50, "no": "C22", "t": "Kumanda tasarımı ve işaretleme", "d": "Kumandalar işlevleri kolay anlaşılacak şekilde işaretlenmiş (tercihen sembol/piktogram) ve istem dışı çalıştırmaya karşı gömme montaj gibi önlemlerle korunmuş mu?", "ref": "TS EN 1398 md.5.4.2.5"}, {"row": 51, "no": "C23", "t": "Acil durdurma", "d": "Acil durdurma kumanda panelinde, açıkça işaretli ve kolay erişilebilir mi? Rampa hareket halindeyken basılarak tüm hareketlerin durduğu fiilen denendi mi? Ana şalterle birleşikse AÇIK/KAPALI konum, KAPALI'da kilitlenebilme ve sarı zemin üzerinde kırmızı kontrol elemanı doğrulandı mı?", "ref": "TS EN 1398 md.5.4.2.6 / md.5.4.2.8"}, {"row": 52, "no": "C24", "t": "Ana şalter (besleme ayırma)", "d": "Besleme bağlantı kesme cihazı çalıştırıldığında ve enerji kesildiğinde rampanın tüm hareketlerinin durduğu fiilen denendi mi?", "ref": "TS EN 1398 md.5.4.2.7 / md.5.4.2.8"}, {"row": 53, "no": "C25", "t": "Otomatik yeniden başlamanın önlenmesi", "d": "Güç kaybı veya ana şalter/acil durdurma sonrası enerji geldiğinde rampa kendiliğinden hareket etmiyor, ancak elle çalıştırılan bir kumandayla yeniden başlıyor mu? Bu deneme fiilen yapıldı mı?", "ref": "TS EN 1398 md.5.4.2.9"}, {"row": 54, "no": "C26", "t": "Otomatik geri dönüş (varsa)", "d": "Otomatik geri dönüş varsa, sadece rampa boşken ve araç ayrıldıktan sonra devreye giriyor mu? Sesli ve görülür uyarı veriyor mu? Fiilen denendi mi?", "ref": "TS EN 1398 md.5.4.2.4"}, {"row": 55, "no": "C27", "t": "İstem dışı hareket", "d": "Yükleme sırasında rampanın istem dışı hareket etmediği, elle çalıştırılanlarda araç üzerindeki destekli konumdan ayrılamayacağı ve (elle çalışan rampada) tehlikeli hareketlere karşı sabitleme/destek olduğu kontrol edildi mi?", "ref": "TS EN 1398 md.5.2.8 / md.5.3.2"}, {"row": 56, "no": "C28", "t": "Elektrik donanımı", "d": "Elektrik panosu ve tesisatı gözle kontrol edilip hasar, gevşek bağlantı ve uygunsuzluk olmadığı doğrulandı mı? Muhafazaların en az IP 54 korumasında olduğu plaka/üretici beyanı veya gözle teyit edildi mi? Kontaktörler ve solenoid valflerin durumu kontrol edildi mi?", "ref": "TS EN 1398 md.5.4.3.1 / md.5.4.3.2 / md.5.4.3.3 / md.5.4.3.4"}, {"row": 57, "no": "C29", "t": "Hidrolik sistem (sızıntı, boru, hortum)", "d": "Silindir, boru, hortum ve bağlantılarda sızıntı, aşınma, sürtünme, bükülme hasarı ve uygunsuz koruma olmadığı gözle kontrol edildi mi? Hava tahliye/havalandırma imkânı ve pnömatik varsa hava beslemesi de kontrol edildi mi?", "ref": "TS EN 1398 md.5.4.4.5 / md.5.4.4.4 / md.5.4.4.6"}, {"row": 58, "no": "C30", "t": "Basınç tahliye valfi", "d": "Basınç tahliye valfi mevcut mu ve yetkisiz ayarlamaya karşı emniyete alınmış (mühürlü) mi? Ayar basıncının normal çalışma basıncının %115'inden fazla olmadığı üretici verisiyle doğrulandı mı?", "ref": "TS EN 1398 md.5.4.4.2"}, {"row": 59, "no": "C31", "t": "Silindir montajı ve bloke durumu", "d": "Silindirin sadece eksenel yüke maruz kalacak şekilde monte edildiği kontrol edildi mi? Platform inişi engellenirse konumlandırma mekanizmasının platformdan ayrılmayacağı ve sıvının silindirden dışarı akmayacağı doğrulandı mı?", "ref": "TS EN 1398 md.5.4.4.3"}, {"row": 60, "no": "C32", "t": "Otomatik güvenlik cihazı (kontrolsüz inişe karşı valf)", "d": "Desteklenmeyen güçle çalışan rampada, kontrolsüz ve tehlikeli inişi önleyen otomatik güvenlik cihazı (örn. kaldırma silindirine doğrudan monteli hidrolik valf) mevcut ve hasarsız mı? Eğik silindirli kompakt rampada %35'e kadar artırılmış değer varsa üretici tarafından belirtildi mi?", "ref": "TS EN 1398 md.5.4.1"}, {"row": 61, "no": "C33", "t": "Otomatik güvenlik cihazı fonksiyon testi", "d": "Rampa çalışma konumundaki dudak üzerinde yatay destekli ve güverte ortasında nominal yükün %25'i (üretici %35'e kadar belirtmişse o oran) yükü varken, destek kaldırılınca rampa durdu veya hızı düşürüldü mü? Düşme mesafesi ön kenarda ölçülen güverte uzunluğunun %6'sını, azaltılmış hız 0,05 m/s'yi aşmadığı ölçülerek doğrulandı mı? Ortam sıcaklığı 20 °C ± 10 °C mi?", "ref": "TS EN 1398 md.5.4.1 / Ek A.3"}, {"row": 62, "no": "C34", "t": "Yüksüz fonksiyon testi", "d": "Yüksüz olarak rampa depolanmış konumdan çalışma konumuna ve dudağın açılıp araç yatağına oturmasına kadar tüm hareketleri tam strok denendi mi? Anormal ses, takılma, düzensiz hareket ve sızıntı olmadığı doğrulandı mı?", "ref": "TS EN 1398 md.7.4.3 b / md.6 Tablo 3"}, {"row": 63, "no": "C35", "t": "Nominal yük ile yük testi", "d": "Etiketteki nominal yükü aşmayan test yüküyle (kalibre ağırlık veya nominal yüklü taşıma ekipmanı) rampa üzerinde yük testi fiilen yapıldı mı? Test yükü ve yöntemi kaydedildi, test sırasında hareket ve güvenlik tertibatları gözlemlendi mi? Nominal yükün üzerinde çalıştırma yapılmadığı doğrulandı mı?", "ref": "TS EN 1398 md.3.16 / md.7.3.2 f / Yön. Ek-III 2.2.1"}, {"row": 64, "no": "C36", "t": "Katsayılı (aşırı yüklü) test", "d": "Yönetmelik Ek-III 2.2.1 katsayılı testi (3 yılda bir/önemli onarım sonrası) uygulanıyorsa enspektör test yükünü standardın Ek A.2 yöntemi ve üretici talimatıyla uyumlu belirledi ve gerekçesini raporladı mı? Test yükü merkezde konumlandırılıp güverte üzerinde kaydırıldı mı? Yükün uygulanmasından sonra kalıcı deformasyon olmadığı doğrulandı mı?", "ref": "TS EN 1398 Ek A.2 / Yön. Ek-III 2.2.1"}, {"row": 65, "no": "C37", "t": "Elle çalışan rampa: kuvvet ve ayar", "d": "Elle çalıştırılan rampada çalıştırma kuvveti dinamometre veya kuvvet ölçerle ölçüldü mü (300 N'u aşmıyor mu)? Yaylı/karşı dengeli rampada ayar imkanı var mı ve çalışıyor mu? Taşınabilir plakada ağırlık (tek kişi 250 N, iki kişi 500 N sınırları) ve kaldırma kolları kontrol edildi mi?", "ref": "TS EN 1398 md.5.3.3 / md.5.3.4"}, {"row": 66, "no": "C38", "t": "Test sonrası kontrol", "d": "Testlerden sonra yapıda kalıcı deformasyon, çatlak, hidrolik sızıntı, pim/menteşe gevşemesi ve güvenlik cihazlarında değişiklik olup olmadığı yeniden gözle kontrol edildi mi?", "ref": "TS EN 1398 md.7.4.3 a, c / Ek A.2"}, {"row": 67, "no": "C39", "t": "Güvenlik tesisatlarının eksiksizliği ve rapor kaydı", "d": "Güvenlik tesisatlarının (acil durdurma, otomatik güvenlik cihazı, bakım pervanesi, destekler, korumalar) eksiksiz ve etkili olduğu sonuçlandırıldı mı? Sonuçlar tarih, isim, adres ve yetkili kişi imzasıyla yazılı kayda geçirilip kullanıcıya iletildi mi?", "ref": "TS EN 1398 md.7.4.3 c"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 69, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 70, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 71, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 72, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 73, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 74, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 76, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 77, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 79, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 80, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 81, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 82, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 83, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 84, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 85, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 86, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 87, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 88, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 89, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 90, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 91, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 1398 — Yükleme rampaları - Güvenlik gereksinimleri (EN 1398:2009; L701-018 eşlemesi)"], ["Yük / fonksiyon testi notu", "TS EN 1398 periyodik muayene için katsayılı yük testi tanımlamaz. Metinde rampanın nominal yükünün üzerinde çalıştırılmayacağı (md.7.3.2 f), otomatik güvenlik cihazı fonksiyon testinin nominal yükün %25'i (üretici belirtmişse %35'e kadar) ile yapılacağı, düşme mesafesinin ön kenarda ölçülen güverte uzunluğunun %6'sını veya azaltılmış hızın 0,05 m/s'yi aşmayacağı (md.5.4.1, Ek A.3; ortam 20 °C ± 10 °C), Ek A.2 (bilgilendirici, tip testi) stabilite testinde test yükünün nominal yük x dinamik faktör (1,4, md.5.1.2.2.3) x güvenlik faktörü (1,5, md.5.1.5.2) olduğu ve testten sonra gözle görülür kalıcı deformasyon kalmaması gerektiği belirtilir. Yönetmelik Ek-III 2.2.1 kapsamında yılda bir nominal yükle test ve 3 yılda bir/önemli onarım sonrası katsayılı test uygulanacaksa, standartta periyodik test için farklı katsayı yer almadığından yönetmelik katsayıları (statik 1,25; dinamik 1,1) geçerli kalır; elle çalışan rampada statik 1,5 uygulanır. Ancak rampa yük kaldırma makinesi olmayıp yalnızca yüksüz konum ayarı için hareket mekanizması bulunduğundan (md.3.1 Not 2-3) katsayılı testin kapsamı ve yükü üretici talimatı ile enspektörün gerekçesine göre belirlenmelidir."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) Standartta periyodik yük testi, test süresi (bekletme) veya statik/dinamik katsayıları yoktur; Yönetmelik 1,25/1,1/1,5 katsayılarının bu ekipmana uygulanışı standarttan değil yorumdan gelir (C35-C36 bu nedenle esnek yazıldı, karar kuruma/TÜRKAK'a aittir). 2) Denetim aralığı standartta sayısal verilmemiştir; üretici belirler (md.7.4.3). 3) Kayganlık için onaylı test yöntemi/değer yoktur (md.5.2.3 dipnot); yalnızca gözle kontrol yazıldı. 4) md.5.4.1'de güvenlik cihazı yükü 'nominal yükün %25'inden fazlasını taşırken' şeklinde, Ek A.3 ise test yükünü %25 olarak veriyor; sorularda A.3'e uyuldu. 5) 'Hortum kopma valfi' terimi metinde geçmez; md.5.4.1'deki silindire monteli hidrolik valf esas alındı. 6) md.5.2.11 Türkçe çevirisi bozuk (cümle tekrarı, 'platform sacı/jant'); 50 mm yükseklik ve renkler alındı, başlangıç noktası yazılmadı. 7) md.5.4.2.1 (PL c) ve IP 54 için saha ölçümü yok; Tablo 3'e göre 'veya üretici beyanı' yeterli. 8) md.5.1 tasarım hesaplarına dair sayılar (3 %, 1,33 vb.) saha muayenesine dahil edilmedi. 9) md.5.2.7 (elle çalışan rampada desteksiz konum: 100 mm/50 mm) çeklist maddesine alınmadı; elle çalışan rampalarda ayrıca sorgulanabilir."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B9"], ["A8", "A9"], [], ["A4", "A12", "A13", "B5", "B6", "B7"], ["B1", "B2", "B3", "B4"], ["C33", "C34", "C35", "C36", "C38"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39"], ["D1", "B11"], ["D2", "D5", "E3", "E5", "E11", "B8", "B10"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.23", "name": "Kuyruktan Kaldırıcı", "method": "Kapsam Kodu: 1.A.23   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 1756-1 · TS EN 1756-2", "refTitle": "1.A.23 Kuyruktan Kaldırıcı — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.23 – Kuyruktan Kaldırıcı"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (paralelkenar / sütun / teleskopik / katlanır platform)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal (Anma) Yükü (kg) - Platform Ölçüleri (mm)"}, {"row": 24, "label": "Araç Plakası / Tipi (montaj yapılan araç)"}, {"row": 25, "label": "Platformda Kişi Bulunmasına İzin / Askı Tipi (halat-zincir-hidrolik)"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.23 Kuyruktan Kaldırıcı) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Kalibrasyonlu test yükleri (nominal yükün %100 ve %125'i, ağırlıkları belgeli), kronometre/hız ölçer, metre/şerit metre ve kumpas (yükseklik, sapma, halat/zincir ölçümü), açı ölçer/dijital eğim ölçer, dinamometre (manuel çaba), manometre (hidrolik basınç) vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Ekipman tanımlama ve isim plakası", "d": "İmalatçı isim plakası kalıcı ve okunaklı mı? İmalatçı adı/adresi, model tipi, makine tanımı, seri/imalat no, imalat yılı ve nominal yük bilgileri plakadan okunarak rapor/kayıtlarla karşılaştırıldı ve rapora işlendi mi?", "ref": "TS EN 1756-1 md.7.4.1"}, {"row": 18, "no": "B2", "t": "2. Yük plakası ve platform ölçüleri", "d": "Azami yük platform üzerindeki konuma bağlıysa yük plakası (şema/tablo) ana kumanda yerinden görülüyor mu? Platform derinliği ölçüldü; 1 200 mm'yi aşıyorsa ağırlık merkezi sınır konumu işaretinin varlığı kaydedildi mi?", "ref": "TS EN 1756-1 md.7.4.1 / md.5.16.2"}, {"row": 19, "no": "B3", "t": "3. Kullanım amacı ve kişi taşıma durumu", "d": "Ekipmanın yalnız mal taşıma amaçlı mı, platformda operatör/kişi bulunmasına izin verilen tipte mi olduğu, bağlantı köprüsü olarak kullanılıp kullanılmadığı (imalatçı beyanı, kullanım yeri) sorgulanıp kayda geçirildi mi? Kişi/engelli taşıma amacı varsa TS EN 1756-2 kapsamı değerlendirildi mi?", "ref": "TS EN 1756-1 md.7.2 / md.7.3 / md.5.12"}, {"row": 20, "no": "B4", "t": "4. Kullanıcı el kitabı ve talimatlar", "d": "Kullanıcı el kitabı, kurulum ve bakım talimatları ile muayene (denetim) kaydının ekipmanla birlikte mevcut olduğu, güvenlik cihazlarının tanımını, ıskarta kriterlerini, denetim sıklığını ve tork/basınç ayar bilgilerini içerdiği kontrol edildi mi?", "ref": "TS EN 1756-1 md.7.4.2.2 / 7.4.2.3 / 7.4.2.4 / 7.4.3"}, {"row": 21, "no": "B5", "t": "5. Önceki rapor ve bakım-muayene kayıtları", "d": "Önceki periyodik kontrol raporundaki uygunsuzlukların giderildiği, muayene kaydında kurulum sonrası testlerin, düzenli denetimlerin, büyük onarım/değişiklik raporlarının bulunduğu ve büyük onarım sonrası Ek H testlerinin yapıldığı kayıtlardan doğrulandı mı?", "ref": "TS EN 1756-1 md.7.4.3 / md.7.4.2.4 / Ek H"}, {"row": 22, "no": "B6", "t": "6. İmalatçı test raporu ve uygunluk belgeleri", "d": "İmalatçı veya yetkili temsilcisince yapılan statik ve dinamik testleri içeren test raporu ile AT uygunluk beyanı/CE işaretinin bulunduğu ve ekipmanın seri numarasıyla uyumlu olduğu kontrol edildi mi?", "ref": "TS EN 1756-1 md.7.4.2.3 / md.7.4.1"}, {"row": 23, "no": "B7", "t": "7. Araç-asansör uyumu ve ekipmana özgü veri toplama", "d": "Araç ile kuyruk asansörü kombinasyonunun uyumu (araç tipi/plakası, montaj), asansör mekanizma tipi (paralelkenar/sütun/teleskopik vb.), askı tipi (halat/zincir/silindir), stabilizatör gerekliliği ve azami dikey hareket mesafesi saptanıp kaydedildi mi?", "ref": "TS EN 1756-1 md.7.4.2.2 / Ek A / Ek H.1"}, {"row": 24, "no": "B8", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 25, "no": "B9", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 26, "no": "B10", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 28, "no": "C1", "t": "Yapısal elemanlar ve araç bağlantısı", "d": "Kollar, makaslar, kolonlar, platform ve araç şasesine bağlantı elemanlarında çatlak, kalıcı deformasyon, aşırı korozyon, kaynak çatlağı veya onarım izi gözle kontrol edildi mi? Araç bağlantı cıvata/perçinlerinin eksiksiz olduğu, sıkma torkunun imalatçı değerine göre doğrulandığı kaydedildi mi?", "ref": "TS EN 1756-1 md.5.12 / md.7.4.2.2 / md.7.4.2.4"}, {"row": 29, "no": "C2", "t": "Pim, burç, mafsal ve yataklar", "d": "Pim, burç, mafsal ve yataklarda aşınma ve aşırı boşluk kontrol edildi mi? Boşluk imalatçının ıskarta kriterine göre değerlendirilip ölçüm değeri kaydedildi mi?", "ref": "TS EN 1756-1 md.7.4.2.4 (ıskarta kriterleri)"}, {"row": 30, "no": "C3", "t": "Platform yüzeyi ve kenarları", "d": "Platform yüzeyi kaymaya karşı dayanıklı (yükseltilmiş profil vb.), temizlenebilir ve aşınmamış mı? Yürünen/durulan alanda kalıcı takılma engeli yok mu (korkuluk, açık durdurma cihazı hariç; ışık/durdurma kumandası/ayak için engel yüksekliği en fazla 25 mm)? Yükseklik ölçüldü mü?", "ref": "TS EN 1756-1 md.5.13.1"}, {"row": 31, "no": "C4", "t": "Platform dış kenar ve köşeleri", "d": "Platformun sol, sağ ve arka dış kenarlarında keskin kenar/dar köşe olmadığı; köşe yarıçapı ve kenar körlüğünün 1,5 mm'den az olmadığı gözle ve ölçü (radyus mastarı) ile doğrulandı mı? Yürünmemesi gereken bölümler açıkça işaretli mi?", "ref": "TS EN 1756-1 md.5.13.2 / md.5.13.1 / md.7.4.1"}, {"row": 32, "no": "C5", "t": "Platform görünürlüğü", "d": "Çalışma konumunda platform aracın uç kısımlarının dışına taşıyorsa, gündüz ve gece tüm yaklaşım yönlerinden görülebilen uyarı donanımı (lamba, yansıtıcı bayrak, yansıtıcı etiket) mevcut ve çalışır durumda mı?", "ref": "TS EN 1756-1 md.5.13.4"}, {"row": 33, "no": "C6", "t": "Tekerlekli yük durdurma cihazları", "d": "Platform tekerlekli yük taşımak için kullanılıyorsa, yükün yükleme/boşaltma kenarından istemsiz yuvarlanmasını önleyen durdurma cihazları (rampa/tırmık vb.) mevcut ve fiilen çalıştırılarak denendi mi?", "ref": "TS EN 1756-1 md.5.5.2"}, {"row": 34, "no": "C7", "t": "Korkuluk varlığı ve ölçüleri", "d": "Düşme riski 2 m'yi aşıyorsa açıkta kalan taraflarda çıkarılabilir/katlanabilir korkuluk mevcut mu? Yükseklik en az 1,1 m, serbest dikey açıklık en fazla 0,5 m, kesintili korkulukta segmentler arası açıklık en fazla 120 mm (aşılıyorsa kendiliğinden kapanan kapı) olarak ölçülüp kaydedildi mi?", "ref": "TS EN 1756-1 md.5.2"}, {"row": 35, "no": "C8", "t": "Korkuluk yük testi ve bağlantısı", "d": "Korkuluğun en kritik konumda yatay 300 N yük altında sehiminin 30 mm'yi geçmediği ve yük kalkınca kalıcı deformasyon kalmadığı denendi mi (yoksa imalatçı test kaydı mı istendi)? Sabitleme sisteminin korkuluğu segmente/platforma bağlı tuttuğu kontrol edildi mi?", "ref": "TS EN 1756-1 md.5.2"}, {"row": 36, "no": "C9", "t": "İndirme uyarısı", "d": "İndirme kumandası çalıştırılır çalıştırılmaz görsel ve sesli uyarı cihazının devreye girdiği fiilen denendi mi (düşme riski 2 m'yi aşan platformlarda)?", "ref": "TS EN 1756-1 md.5.2"}, {"row": 37, "no": "C10", "t": "Hareket sonu mekanik sınırlama", "d": "Kuyruk asansörünün tüm hareketlerinin (kaldırma, indirme, açma-kapama, eğme) hareket sonunda mekanik yollarla (strok sonu dayamaları, stoperler) sınırlandırıldığı fonksiyonel olarak gözlendi mi?", "ref": "TS EN 1756-1 md.5.6"}, {"row": 38, "no": "C11", "t": "Yetkisiz kullanımı önleme", "d": "Operatör yokken yetkisiz çalıştırmayı önleyen sistem (anahtarlı/kodlu kilit, kilitlenebilir kabinde aç/kapa düğmesi) mevcut ve etkin mi? Fiilen kilitli konumda denendi mi?", "ref": "TS EN 1756-1 md.5.8"}, {"row": 39, "no": "C12", "t": "Çalıştırmak için tut ve istem dışı hareket", "d": "Tüm kumandalar çalıştırmak için tut prensibinde mi? Kumanda bırakıldığında hareket duruyor ve platform hareketsiz kalıyor mu (kaldırma, indirme, açma, kapama, eğme için ayrı ayrı denendi mi)?", "ref": "TS EN 1756-1 md.5.17.1 / md.5.14.1.1"}, {"row": 40, "no": "C13", "t": "Kumanda mantığı ve işaretleri", "d": "Kumanda yönü ile oluşan hareket yönü mantıksal olarak tutarlı mı? Kumanda üniteleri (mobil kumandalar dahil) hareket yönünü gösteren okunaklı ve dayanıklı sembol/metinle işaretli mi?", "ref": "TS EN 1756-1 md.5.17.2 / md.7.4.1"}, {"row": 41, "no": "C14", "t": "Kasıtsız çalıştırma ve çoklu hareket", "d": "Kumandalar kasıtsız çalıştırmaya karşı korunmu
