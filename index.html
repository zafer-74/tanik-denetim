r", "d": "Hidrolik yağ seviyesi min/maks göstergesiyle uygun mu? Yağ rengi/kirlilik, filtre durumu, rezervuar erişim ve tahliye tapası kontrol edildi mi? Her hidrolik devrede basıncı kontrol edecek araç (manometre/ölçüm noktası) mevcut mu?", "ref": "TS EN 12999 md.5.5.1 / 5.5.3"}, {"row": 43, "no": "C15", "t": "Hidrolik hortum, boru ve bağlantılar", "d": "Hortum ve borular sürtünme, ezilme, kabarma, çatlama, sızıntı ve yanlış yönlendirme açısından kontrol edildi mi? Hortum etiketindeki patlama basıncının işletme basıncının en az 4 katı (HD5 sürücülerde 3,5 kat) olduğu doğrulandı mı? Operatörün 1,0 m yakınındaki, 5 MPa üzeri basınç veya 50 °C üzeri sıcaklıktaki hortumlar korunuyor mu?", "ref": "TS EN 12999 md.5.5.5"}, {"row": 44, "no": "C16", "t": "Basınç sınırlama (emniyet) valfi", "d": "Basınç tahliye valflerinin ayarı üretici değerine göre kontrol edildi mi; ayar noktaları kurcalanmaya karşı mühürlü/kilitli mi? Sistemde yetkisiz basınç/akış değişikliği izi var mı?", "ref": "TS EN 12999 md.5.5.4 / 5.5.1 / Tablo 8"}, {"row": 45, "no": "C17", "t": "Yük tutma valfleri (hat kopma emniyeti)", "d": "Tüm yük taşıyan silindirlerde yük tutma valfi silindire entegre veya doğrudan/rijit flanşlı ya da kısa sert borularla bağlı mı? Hortum kopması simüle edilerek (üretici yöntemiyle) bomun kontrolsüz düşmediği doğrulandı mı?", "ref": "TS EN 12999 md.5.5.6.1 / Tablo 8"}, {"row": 46, "no": "C18", "t": "Nominal kapasite sınırlayıcı: varlık ve yapı", "d": "Nominal kapasite 1000 kg veya maks. net kaldırma momenti 40 000 Nm ve üzerindeyse nominal kapasite sınırlayıcı takılı mı; aracın stabilitesi ve (varsa) manuel uzatmalar, kaldırma tertibatı sınırlayıcı sistemine dahil mi? Küçük vinçlerde tahliye valfi ile aşırı yük koruması sağlanmış mı?", "ref": "TS EN 12999 md.5.6.1.1 / 5.6.1.2 / 5.6.1.7 / 5.6.1.8 / 5.6.2.2 / 5.6.2.3"}, {"row": 47, "no": "C19", "t": "Sınırlayıcı fonksiyon ve tolerans testi", "d": "Sınırlayıcının devreye girme toleransı nominal kapasitenin %100'ü ile %(100+Δ) arasında mı (Δ ≤ 8+0,5R ≤ 20; R m cinsinden hidrolik uzanım)? Tablo 8'deki yöntemle (uzanım-kapasite grafiği, farklı yükler ve hareketler) ölçüm yapıldı mı ve ölçülen uzanımlar/yüzdeler kaydedildi mi?", "ref": "TS EN 12999 md.5.6.2.1 / 6.1 (Tablo 8) / ISO 9927-1 md.6.3"}, {"row": 48, "no": "C20", "t": "Sınırlayıcı devreye girince hareket kontrolü", "d": "Sınırlayıcı devreye girince yük momentini artıran tüm hareketler (bom indirme/uzatma vb.) duruyor, momenti azaltan hareketler serbest kalıyor mu? Sınırlayıcıdaki tanınan arıza durumunda tüm vinç hareketleri durduruluyor mu (arıza simülasyonu yapıldı mı)?", "ref": "TS EN 12999 md.5.6.1.1 / 5.6.2.1"}, {"row": 49, "no": "C21", "t": "Sınırlayıcıyı devre dışı bırakma koruması", "d": "Sınırlayıcıyı engelleyebilecek herhangi bir anahtar/köprüleme/cihaz kurcalanmaya karşı korunmuş mu? Sınırlayıcı veya tahliye valfi köprülenmiş, ayarı kaçırılmış ya da mühür kırılmış izi var mı?", "ref": "TS EN 12999 md.5.6.2.4 / 5.5.1"}, {"row": 50, "no": "C22", "t": "Kapasite göstergesi ve uyarılar", "d": "Yük nominal kapasitenin %90'ını aştığında ön uyarı, aşıldığında ayrı bir aşırı yük uyarısı veriliyor mu ve ikisi net ayırt ediliyor mu? Erişimi 12 m ve üzeri vinçlerde tehlike bölgesindeki kişiler için uyarı var mı? Ön uyarı noktası Tablo 8 yöntemiyle ölçüldü mü?", "ref": "TS EN 12999 md.5.6.4 / 5.6.2.1 / Tablo 8"}, {"row": 51, "no": "C23", "t": "İndirme tesisi (varsa)", "d": "İndirme tesisi takılıysa açıkça tanımlı mı, yalnız kumanda operatör elindeyken çalışıyor mu ve en fazla 5 saniye süreyle, en az 30 saniye aralıklarla çalışıyor mu? Kullanımının kaydedildiği doğrulandı mı?", "ref": "TS EN 12999 md.5.6.3"}, {"row": 52, "no": "C24", "t": "Hareket ve hız sınırlayıcılar", "d": "Çevirme, kaldırma/indirme ve teleskop hareket sınırları silindir stroku veya uygun durdurucularla belirleniyor mu? Bom geometrisinin sabit kalmadığı konumlarda (dikeye yaklaşma) hareket sınırlayıcı çalışıyor mu? Halatlı vinçte üst kaldırma sınırlayıcısı denendi mi?", "ref": "TS EN 12999 md.5.6.5.1 / 5.6.5.2 / 5.6.1.7"}, {"row": 53, "no": "C25", "t": "Acil durdurma cihazı", "d": "Her kumanda yerinde (yalnız stabilizatör kumandası hariç) kırmızı mantar başlı durdurma cihazı var, kolay erişilir ve çalıştırıldığı yerde kilitleniyor mu? Basıldığında vinç tamamen duruyor ve başka tehlikeli hareket oluşmuyor mu? Fiilen denendi mi?", "ref": "TS EN 12999 md.5.6.8 / 6.1 (Tablo 8)"}, {"row": 54, "no": "C26", "t": "Kumanda kolları ve semboller", "d": "Tüm kumanda kolları bırakıldığında otomatik olarak nötr konuma dönüyor mu? Kollar kalıcı ve okunaklı sembollerle (sembol en az 15 mm'lik daireye sığacak boyutta; uzaktan kumandada 12 mm) işaretli ve hareket yönleriyle uyumlu mu?", "ref": "TS EN 12999 md.5.7.1 / 5.7.2 / 6.1 (Tablo 8)"}, {"row": 55, "no": "C27", "t": "Kumanda yerleri ve eşzamanlı çalışma", "d": "Kumanda yerleri tehlikeli ezilme/kesilme bölgelerine girmeden kullanılabiliyor mu? Birden fazla kumanda yerinde iki yerden aynı anda çalışmayı önleyen araç (kumandalar mekanik bağlı değilse) var mı? 1000 kg/40 000 Nm ve üzeri vinçlerde (uzaktan kumanda yoksa) en az iki sabit kumanda yeri var mı?", "ref": "TS EN 12999 md.5.8.1 / 5.7.1"}, {"row": 56, "no": "C28", "t": "Uzaktan kumanda (varsa)", "d": "Uzaktan kumandada aktüatörler istenmeden çalışmaya karşı korunuyor mu, kol kuvveti 2-20 N aralığında mı? Vinç çalışırken çevreyi uyaran sesli veya her yönden görülebilir yanıp sönen ışıklı uyarı sürekli veriliyor mu? Korna (12 m üzeri erişim veya uzaktan kumanda) çalışıyor mu?", "ref": "TS EN 12999 md.5.7.1 / 5.6.6 / 5.6.7"}, {"row": 57, "no": "C29", "t": "Yüksek koltuk/platform ve erişim (varsa)", "d": "Yükseltilmiş kumanda yerinde koltuk/platform, korkuluk, basamak, tutamak ve erişim sağlam ve kaymaz mı; koltuk maks. yük işaretli ve hareketli parçalara karşı korumalı mı? Merdiven açısı yataydan 75°-90° ve basamak genişliği en az 300 mm mi? Korkuluk deformasyonu var mı?", "ref": "TS EN 12999 md.5.8.2.2 / 5.8.2.3 / 5.8.2.4 / 7.3.8"}, {"row": 58, "no": "C30", "t": "Elektrik tesisatı ve korumalar", "d": "Elektrik kabloları, konnektörler, aküye/araç sistemine bağlantı noktaları ve elektrikli sınırlayıcı/algılayıcı bağlantıları hasar ve doğru bağlantı açısından kontrol edildi mi? Stabilizatör ve hareketli parçalardaki sıkışma/kesilme tehlike bölgeleri koruma veya uyarı işaretiyle güvence altında mı; 55 °C üzeri yüzeyler korunmuş mu?", "ref": "TS EN 12999 md.5.9.1 / 5.10.6.1 / 5.10.2.3"}, {"row": 59, "no": "C31", "t": "Çevirme merkezi ve uyarı işaretleri", "d": "Çevirme merkezi işareti taban her iki yanında görülüyor mu? Maksimum zemin yükü, uyarı levhaları (ör. havai hat yakınlığı) ve sembol levhaları eksiksiz, okunaklı ve kılavuzdaki konumlarda mı?", "ref": "TS EN 12999 md.7.3.6 / 7.3.7 / 7.2.3.1 c)"}, {"row": 60, "no": "C32", "t": "Yüksüz fonksiyon testi", "d": "Tüm vinç hareketleri ve stabilizatörler kumanda yerlerinden maksimum hızda ve tüm hareket aralığında yüksüz çalıştırıldı mı? Anormal ses, takılma, titreşim, sarsıntılı hareket, kumanda-hareket yönü uyumsuzluğu ve sızıntı gözlendi mi? Hidrolik yağ sıcaklığı takip edildi mi?", "ref": "TS EN 12999 md.6.2.2 / ISO 9927-1 md.6.4"}, {"row": 61, "no": "C33", "t": "Batma (çökme) oranı testi", "d": "Maksimum hidrolik erişimde (manuel uzatmasız) nominal kapasiteyle bom ucundaki batma ölçüldü mü? Batma oranı dakikada erişimin %0,5'ini (erişim 12 m'den fazlaysa %0,2'sini) aşmıyor mu; ölçülen değer, süre ve yağ sıcaklığı kaydedildi mi?", "ref": "TS EN 12999 md.5.5.7 / 6.1 (Tablo 8)"}, {"row": 62, "no": "C34", "t": "Test öncesi koşullar ve hazırlık", "d": "Rüzgar hızı 8,3 m/s (30 km/h) değerini aşmıyor, araç lastikleri önerilen basınçta, zemin sağlam ve yatay mı? Vinç üretici talimatına göre kurulmuş mu? Test yükü ve askı/kaldırma donanımı hasarsız, yük değerleri belgeli ve sınırlayıcıyı devre dışı bırakma/geri devreye alma planı var mı?", "ref": "TS EN 12999 md.6.2.1 / ISO 9927-1 Ek C"}, {"row": 63, "no": "C35", "t": "Statik yük testi (1,25 x nominal kapasite)", "d": "Test yükü nominal kapasitenin en az 1,25 katı olarak (a) manuel uzatmalarla maks. yarıçapta, (b) maks. hidrolik uzanımda, (c) maks. çalışma yüküne karşılık gelen yarıçapta uygulandı mı? Yük yerden yaklaşık 100 mm yükseltilip tam hizmet içi dönüş yayı boyunca yavaşça döndürüldü ve yarıçaplar/yükler kaydedildi mi?", "ref": "TS EN 12999 md.6.2.3.2 / 6.2.3.1"}, {"row": 64, "no": "C36", "t": "Dinamik yük testi (1,1 x nominal kapasite)", "d": "Test yükü nominal kapasitenin en az 1,1 katı olarak, her hareket için ayrı ve eşzamanlı hareketlerle, hizmet hızlarında, hareket aralığı boyunca tekrarlı kalkış-duruşlarla uygulandı mı? Sınırlayıcı ayarı gerekirse yalnız geçici olarak en fazla %15 artırıldı ve test sonrası eski ayarına döndürülüp yeniden test edildi mi?", "ref": "TS EN 12999 md.6.2.4.1 / 6.2.1"}, {"row": 65, "no": "C37", "t": "Stabilite kontrolü (yük/basınç yöntemi)", "d": "Stabilite, araç yüksüz ve sürücüsüz olarak; test yükü TL = Ks x P + (Ks-1) x Gb x Yb / R (Ks = 1,2) veya test basıncı Tp = Ks x pcw yöntemiyle, stabilizatörler tam açık ve gerekli diğer konfigürasyonlarda, dönüş açıları arası en fazla 10° ile doğrulandı mı? Yoksa montajcının test raporu esas mı alındı, enspektör bunu açıkça kaydetti mi?", "ref": "TS EN 12999 md.6.2.5.2 / 6.2.5.3 / 6.2.5.4 / 6.2.6"}, {"row": 66, "no": "C38", "t": "Stabilite kabul kriteri", "d": "Test yükü statik olarak tutuldu veya test basıncına ulaşıldı mı? Bir veya daha fazla ayak ya da tekerlek yerden kalksa bile park frenli en az bir tekerlek zeminle temasta kaldı mı? Stabilite sonrası, aracın az stabil yönünde nominal kapasiteyle maksimum hızda dönerken stabil kaldığı doğrulandı mı?", "ref": "TS EN 12999 md.6.2.5.5 / 6.2.2"}, {"row": 67, "no": "C39", "t": "Test sonrası muayene ve kabul kriteri", "d": "Statik testte vincin ve kurulumun işlevini/güvenliğini etkileyen çatlak, kalıcı deformasyon, boya dökülmesi, hasar, bağlantı gevşemesi yok mu? Dinamik testte mekanizma/yapıda hasar yok ve bileşenler işlevini yerine getiriyor mu? Test sonrası sızıntı, yağ sıcaklığı ve bağlantı kontrolü yapıldı mı?", "ref": "TS EN 12999 md.6.2.3.3 / 6.2.4.2"}, {"row": 68, "no": "C40", "t": "Cihazların yeniden devreye alınması ve rapor", "d": "Test için devre dışı bırakılan/ayarı değiştirilen sınırlama ve güvenlik cihazları yeniden bağlanıp kalibre edilerek yeniden test edildi mi? Bulgular, ölçüm değerleri ve sonuç yazılı rapora işlendi; güvenliği etkileyen kusurlar kullanımdan önce giderilmek üzere bildirildi mi?", "ref": "TS EN 12999 md.6.2.1 / ISO 9927-1 md.5.1 / 5.4"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 70, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 71, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 72, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 73, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 74, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 76, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 77, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 78, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 80, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 81, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 82, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 83, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 84, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 85, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 86, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 87, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 88, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 89, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 90, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 91, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 92, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 12999 — Vinçler - Yükleyici vinçler (BS EN 12999:2020, Türkçe çeviri metni esas alınmıştır)"], ["Standart 2", "TS ISO 9927-1 — Vinçler - Muayene - Bölüm 1: Genel (ISO 9927-1:2013)"], ["Standart 3", "TS ISO 4309 — Vinçler - Tel halatlar - Bakım, muayene ve ıskarta (ISO 4309:2017; halatlı/vinçli yükleyici krenler için)"], ["Yük / fonksiyon testi notu", "TS EN 12999 md.6.2.3.2 uyarınca statik yük testi nominal kapasitenin en az 1,25 katıyla (manuel uzatmalı maks. yarıçap, maks. hidrolik uzanım ve maks. çalışma yüküne karşılık gelen yarıçap; yük yerden yaklaşık 100 mm yükseltilip tam dönüş yayı boyunca yavaşça döndürülerek), md.6.2.4.1 uyarınca dinamik test en az 1,1 katıyla yapılır; kabul kriterleri md.6.2.3.3 ve 6.2.4.2, stabilite kontrolü md.6.2.5 (Ks = 1,2, test yükü veya test basıncı; kabul md.6.2.5.5), test şartı rüzgar en fazla 8,3 m/s (md.6.2.1). Bu katsayılar Yönetmelik Ek-III 2.2.1'deki statik 1,25 / dinamik 1,1 katsayılarıyla örtüşür; ancak standart, statik yükte bekletme süresi vermez. Yılda bir yapılacak işletme kapasitesi testinde yük, yük diyagramındaki ilgili yarıçapın nominal kapasitesi olarak alınmalıdır (kapasite yarıçapla değişir, Ek-III 2.2.1.2 ile ilişkisi dikkate alınmalı). ISO 9927-1 md.5.4 periyodik muayene aralığını en fazla 12 ay, md.6.5 ise yük testinde ulusal mevzuat gerektirmedikçe test yükünün nominal kapasiteyi aşmamasını belirtir."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) EN 12999 statik/dinamik testte yük bekletme süresi vermiyor (süre yazılmadı; üretici kılavuzuna bırakıldı). 2) md.6.2.3-6.2.5 ve Tablo 8 esasen imalatçı/montajcı doğrulamasıdır; saha periyodik kontrolde stabilite testi uygulanıp uygulanmayacağı standartta açık değil, C37 bunu 'test veya montajcı raporu' olarak sorgular. 3) Tablo 3/4 kırık tel sayıları çeviri metninde RCN'ye bağlı olduğundan sayısal değer yazılmadı. 4) ISO 9927-1 md.6.6 statik/dinamik/stabilite testlerini ISO 4310'a yönlendirir; ISO 4310 metni verilmediğinden doğrulanamadı. 5) Ek-III 2.2.1.2 yorumu (yarıçapa göre değişen kapasite) yükleyici krene birebir uygulanabilirliği dikkatle değerlendirilmeli (hüküm kişi kaldıran ekipmanla birlikte düzenlenmiştir). Çeviri metninde bazı sözcükler bozuk (ör. 'sosyal yardım' = reach/uzanım, 'kablo kopması' = tel kopması); değerler bağlamdan doğrulandı."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B9"], ["A8", "A9"], [], ["A4", "A12", "A13", "B2", "B4", "B5", "B6"], ["B1", "B3", "B7", "B8"], ["C19", "C32", "C33", "C34", "C35", "C36", "C39"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39", "C40"], ["D1", "B11"], ["D2", "D5", "E3", "E5", "E11", "B10"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.6.3", "name": "Dikme Kollu Kren", "method": "Kapsam Kodu: 1.A.6.3   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 14492-2 · TS EN 14985 · TS ISO 9927-1 · TS ISO 4309 · TS EN 818-7", "refTitle": "1.A.6.3 Dikme Kollu Kren — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.6.3 – Dikme Kollu Kren"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (Dikme kollu kren - zincirli / halatlı elektrikli palanga)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal Kapasite (kg) - Azami Yarıçap / Kol Boyu (m)"}, {"row": 24, "label": "Palanga Tipi (zincirli / halatlı) - Kaldırma Yüksekliği (m) - Kaldırma Hızı (m/dk)"}, {"row": 25, "label": "Montaj Şekli (ankraj / temel) - Kol Dönme Açısı (°) - Görev Sınıfı"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.6.3 Dikme Kollu Kren) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Sertifikalı/kalibre test yükü (ağırlık veya su torbası) ve kalibre dinamometre/yük hücresi; kumpas ve halat çap ölçer (halat çapı, kanca ağzı, zincir bakla/adım ölçümü); şerit metre/lazer metre (kol yarıçapı, kaldırma yüksekliği vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1 / ISO 9927-1 Ek C"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Ekipman etiketi ve işaretleme bilgileri", "d": "Ekipman/palanga üzerindeki kalıcı etiketten imalatçı adı-adresi, tip tanımı, imalat yılı, nominal kapasite, görev sınıfı, halat/zincir bilgisi (halat: min. kopma kuvveti-çap-yapı; zincir: çap-adım-sınıf), güç kaynağı özellikleri ve nominal kaldırma hızı okunup rapora kaydedildi mi? Nominal kapasite kanca/alt blok üzerinde ve kol/yapı üzerinde göze çarpan yerde işaretli mi?", "ref": "TS EN 14492-2 md.7.3 / TS EN 14985 md.7.6"}, {"row": 18, "no": "B2", "t": "2. Kullanım kılavuzu ve imalatçı talimatı", "d": "İmalatçı kullanım/bakım kılavuzu mevcut ve ekipmanın model-seri numarası ile eşleşiyor mu? Kılavuzda muayene aralıkları, aşınan parçaların hurdaya ayırma kriterleri, sınırlayıcıların kontrol yöntemi ve destek yapısına (kolon-temel) etkiyen kuvvetler yer alıyor mu? Kılavuz yoksa yetkin kişice hazırlanmış talimat var mı?", "ref": "ISO 9927-1 md.4.2 / Ek A 0.1 / TS EN 14492-2 md.7.2"}, {"row": 19, "no": "B3", "t": "3. Önceki periyodik kontrol raporu ve kayıtlar", "d": "Önceki periyodik kontrol raporu, seyir defteri/kayıt defteri, bakım-onarım ve parça değişim kayıtları istenip incelendi mi? Önceki muayene aralığının 12 ayı aşmadığı ve önceki raporda 'özel dikkat gerektiren bileşenler' ile açık kusurların takip edildiği doğrulandı mı?", "ref": "ISO 9927-1 md.5.4 / md.10.2 / md.10.3"}, {"row": 20, "no": "B4", "t": "4. Sınıflandırma, çalışma ömrü ve değişiklik geçmişi", "d": "Görev sınıfı (EN 13001-1) ve tasarım ömrüne göre ekipmanın kullanım süresi/çalışma döngüsü sorgulandı mı? Nominal kapasite değişikliği, yapısal değişiklik veya yer değiştirme olup olmadığı sorgulandı; varsa bunun tasarım değişikliği sayılıp büyük denetim ve yeni ekipman yük testi prosedürüne tabi tutulduğu doğrulandı mı?", "ref": "ISO 9927-1 md.3.2 / md.11 / md.5.6.1"}, {"row": 21, "no": "B5", "t": "5. Kullanım yeri ve montaj (kolon/temel) bilgisi", "d": "Ekipmanın montaj yeri ve şekli (betonarme temele ankrajlı, tabla plakası vb.), kolon yüksekliği, kol uzunluğu/azami yarıçap, kol dönme sektörü ve dönme alanındaki engeller (duvar, makine, yaya yolu, komşu alan, aynı alandaki diğer vinçler) tespit edilip kaydedildi mi? Üreticinin destek yapısına etkiyen kuvvet/moment verisi ile temel projesi/ankraj detayı talep edildi mi?", "ref": "TS EN 14492-2 md.7.2 / ISO 9927-1 md.5.5 b) / Ek C"}, {"row": 22, "no": "B6", "t": "6. Ekipmana özgü ölçülecek ve kaydedilecek veriler", "d": "Nominal kapasite, azami yarıçap, kaldırma yüksekliği, nominal hızlar, tahrik tipi (zincir/halat), sınırlayıcı tipi (doğrudan/dolaylı etkili) ve önceki kayıtlı aşırı yük sınırlayıcı tetikleme değeri/toleransı ile motor plaka akımı değerleri kayıttan alındı mı? Bu değerler saha ölçümleriyle karşılaştırılmak üzere çeklistin ilgili satırlarına işlendi mi?", "ref": "TS EN 14985 md.7.4 / md.6.2.2.1 f) / ISO 9927-1 md.10.3"}, {"row": 23, "no": "B7", "t": "7. Denetim güvenlik önlemleri ve ölçüm cihazları", "d": "Muayene öncesi saha güvenliği (elektrik izolasyonu-etiketleme, kıstırma/ezilme bölgelerine girmeme, kol dönme alanının boşaltılması, uygun hava/zemin koşulları, yüksekte çalışma korunması) sağlandı mı? Yükün/alan koşullarının güvenli olduğu ve ölçüm/test cihazlarının kalibrasyon kayıtlarının güncel olduğu doğrulandı mı?", "ref": "ISO 9927-1 md.8 / Ek C"}, {"row": 24, "no": "B8", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 25, "no": "B9", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 26, "no": "B10", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 28, "no": "C1", "t": "Kolon (dikme) gövdesi görsel muayene", "d": "Kolon gövdesinde çatlak, kalıcı deformasyon, çarpma hasarı, korozyon ve kaynak dikişi kusurları gözle/çekiçle kontrol edildi mi? Kritik alanlarda (kolon-taban plakası kaynağı, kol-kolon bağlantısı) çatlak şüphesi varsa tahribatsız muayene (PT/MT vb.) istendi mi?", "ref": "ISO 9927-1 md.6.1 / md.6.2"}, {"row": 29, "no": "C2", "t": "Kolon ankraj cıvataları ve taban plakası bağlantısı", "d": "Tüm ankraj cıvata ve somunları eksiksiz mi (adet, pul/kontra somun/emniyet), gevşeme, kırık/çatlak cıvata, dişlerde ve cıvata boyunda korozyon veya uzama var mı gözle ve gerekirse çekiçle kontrol edildi mi? Tork kontrolü yapılacaksa üreticinin verdiği tork değeri esas alınarak (Ek A 2.5) uygulanıp kaydedildi mi? Taban plakası ile temel arası boşluk/grout kırığı ve plaka deformasyonu kontrol edildi mi?", "ref": "ISO 9927-1 md.6.1 / Ek A 2.5 / md.5.5 b) 7)"}, {"row": 30, "no": "C3", "t": "Temel/zemin durumu ve kolon dikeyliği", "d": "Beton temelde çatlak, ufalanma, oturma, ankraj çevresinde ayrılma veya su/korozyon izi var mı kontrol edildi mi? Kolon dikeyliği su terazisi/şakül ile ölçülüp değer kaydedildi ve önceki rapor/üretici sınırı ile karşılaştırıldı mı (sınır değeri üretici verisinden alınır)?", "ref": "ISO 9927-1 md.5.5 b) 7) / md.6.1"}, {"row": 31, "no": "C4", "t": "Kol (jib) yapısı ve troley yolu", "d": "Kol profilinde, kaynaklarda, kol-kolon bağlantı ve pimlerinde çatlak, deformasyon, korozyon ve gevşeklik gözle kontrol edildi mi? Troley yürüme yolunun (alt flanş) aşınması, deformasyonu ve kol ucu stoperlerinin sağlamlığı kontrol edilip kol sehimi/yapısal deformasyon açısından değerlendirildi mi?", "ref": "TS EN 14985 md.6.2.2.1 h) (kıyasen) / ISO 9927-1 md.6.1"}, {"row": 32, "no": "C5", "t": "Döner yatak/dönüş mafsalı ve sabitleme cıvataları", "d": "Kolun kolon üzerindeki dönüş yatağı/burcu ve sabitleme cıvataları eksiksiz, sıkı ve hasarsız mı? Yatakta aşırı boşluk, sıkışma, gıcırtı ve yağlama eksikliği kontrol edildi mi? Yatak aşınma limiti ve bakım aralığı imalatçı talimatına göre değerlendirildi mi?", "ref": "TS EN 14985 md.5.4.5.2 (kıyasen) / md.7.4 b) 5)"}, {"row": 33, "no": "C6", "t": "Kol dönüş freni / dönüş kilidi (park)", "d": "Motorlu dönüşte kumanda nötre dönünce, acil durdurmada ve güç kesildiğinde dönüş freni otomatik devreye giriyor mu fiilen denendi mi? Elle döndürülen kolda ve hizmet dışı durumda kolun rüzgâr/eğim/yük dengesizliği ile kendiliğinden dönmediği, kilit veya fren ile tutulduğu gözlendi mi?", "ref": "TS EN 14985 md.5.4.2.1 / md.5.4.5.1 (kıyasen)"}, {"row": 34, "no": "C7", "t": "Kol dönüş sınırı (dönme açısı sınırlayıcı/stoper)", "d": "Kolun dönme sınırlarında mekanik durdurucu veya elektrikli hareket sınırlayıcı bulunuyor mu, kol sınıra yaklaştırılarak fiilen çalıştığı ve sınır değerinin üretici/kullanım yeri (duvar, makine, yaya yolu, besleme kablosu) sınırına uygun olduğu doğrulandı mı? Sınırlayıcı devreye girdikten sonra ters yönde hareketin mümkün olduğu kontrol edildi mi? (Dönme açısı sayısal değeri standartta verilmemiştir; imalatçı değeri esas alınır.)", "ref": "ISO 9927-1 md.6.3 b) / TS EN 14492-2 md.5.13.9.1"}, {"row": 35, "no": "C8", "t": "Troley yürüyüşü ve raydan çıkma emniyeti", "d": "Troley/palanga arabası tekerlek ve flanşlarında aşınma-çatlak, kılavuz makaraların durumu, troley düşme/devrilme önleyici ve kol ucu tampon/stoperleri kontrol edildi mi? Troleyin kol boyunca tüm strok boyunca takılmadan ve raydan çıkmadan hareket ettiği ve uç limitlerinin çalıştığı gözlendi mi?", "ref": "TS EN 14492-2 md.5.12.4 / md.5.12.1"}, {"row": 36, "no": "C9", "t": "Troley freni ve el zinciri", "d": "Motorlu troleyde kumanda nötre dönünce, acil durdurmada ve güç kesildiğinde troley freni otomatik devreye giriyor mu denendi mi? Elle itilen troleyde kendiliğinden yürüme olmadığı, mekanik tahrikli troleyde el zincirinin kılavuzdan çıkmadığı kontrol edildi mi?", "ref": "TS EN 14492-2 md.5.12.2 / md.5.12.3"}, {"row": 37, "no": "C10", "t": "Palanga gövdesi, dişli kutusu, motor ve kaplinler", "d": "Palanga gövdesi, askı/troley bağlantı pimleri, dişli kutusu, motor ve kaplinlerde çatlak, yağ sızıntısı, anormal ses/ısınma ve gevşeklik kontrol edildi mi? Kaldırma kuvveti akışındaki kaplinlerin plastik/kauçuk parça arızasında metal parçaların kenetlendiği (imalatçı tasarımına göre) doğrulandı mı?", "ref": "TS EN 14492-2 md.5.5 / md.5.3"}, {"row": 38, "no": "C11", "t": "Kaldırma zinciri (zincirli ise)", "d": "Zincirde bakla/bağlantı deformasyonu, çentik, çatlak, korozyon, burulma ve aşınma gözle kontrol edildi mi? Uzama/aşınma ölçümü (bakla adımı) yapıldı ve değerin imalatçının belirlediği hurdaya ayırma sınırını aşmadığı doğrulanarak kaydedildi mi (sınır değer imalatçı talimatındandır)? Zincir sınıf işareti (T, DAT veya DT) ve izlenebilirlik işaretinin (en az her 80 baklada bir) okunabilir olduğu kontrol edildi mi?", "ref": "TS EN 14492-2 md.5.8.2 / md.7.2 / TS EN 818-7 md.7"}, {"row": 39, "no": "C12", "t": "Zincir kılavuzu, dişli, uç emniyeti ve sabitleme", "d": "Zincirin dişli ve kılavuzlar üzerinde düzgün çalıştığı, dışarı atma/bükülme/sıkışmaya karşı kılavuz bulunduğu ve giriş noktalarında elin girmesini önleyici özelliğin olduğu kontrol edildi mi? Zincirin yük taşımayan ucunun dişliden çıkmaya karşı emniyette (uç stoperi) olduğu ve zincir sabitleme vidalı bağlantılarının kilitli/kontrol edilebilir olduğu doğrulandı mı?", "ref": "TS EN 14492-2 md.5.8.3 / md.5.8.4 / md.5.8.5"}, {"row": 40, "no": "C13", "t": "Çelik halat - kırık tel ve kritik bölgeler (halatlı ise)", "d": "Halat tüm uzunluğu boyunca (tamburda en az beş sargı dahil) muayene edildi; tambur ankrajı, halat ucu, kanca bloğu ve kasnak geçişleri gibi kritik bölgelere özel dikkat edildi mi? Görünür kırık teller 6d ve 30d uzunluklarında sayılıp Tablo 3/4 ıskarta değerleri ile karşılaştırıldı mı (örn. sıradan sarımlı tek katmanlı halatta RCN 01 için 6d'de 2, 30d'de 4 tel)? Vadi teli kopması (2 veya daha fazla) ve sonlandırmada 2 veya daha fazla kopuk tel ıskarta nedeni olarak değerlendirildi mi?", "ref": "TS ISO 4309 md.5.3.3 / md.6.2.1 / md.6.2.4"}, {"row": 41, "no": "C14", "t": "Çelik halat - çap azalması, korozyon ve deformasyon", "d": "Halat çapı üniform azalma hesabı [(dref - dm)/d x 100] ile ölçülüp kaydedildi mi (çelik çekirdekli tek katmanlı halatta %7,5 ve üzeri, fiber çekirdekli %10 ve üzeri, dönmeye dayanıklı halatta %5 ve üzeri ıskarta)? Dış korozyon (pürüzlü tel yüzeyi/çukurlaşma), iç korozyon belirtisi, dalgalılık, sepet deformasyonu, çekirdek çıkıntısı, ezik/bükülme ve ısı-ark hasarı kontrol edilip ıskarta kriterlerine göre karar verildi mi?", "ref": "TS ISO 4309 md.6.4 / md.6.6 / md.6.7"}, {"row": 42, "no": "C15", "t": "Halat sonlandırma, tambur ve kasnaklar (halatlı ise)", "d": "Halat ucu sonlandırması ve tambura bağlantısı (kama soket, metal/reçine soket, kelepçe) hasarsız ve kelepçe/kıskaç halat ucu olarak kullanılmamış mı? Kanca en alt konumdayken tamburda en az iki halat sargısı kalıyor mu; tambur flanşı en üst sargıdan en az 1,5 x halat çapı yüksekte mi; oluk hasarı, halatın oluktan çıkması ve kasnak/koruyucu durumu kontrol edildi mi?", "ref": "TS EN 14492-2 md.5.7.2 / md.5.7.6 / md.5.7.9 / TS ISO 4309 md.5.3.4"}, {"row": 43, "no": "C16", "t": "Kanca ve alt blok", "d": "Kancada çatlak, deformasyon, aşınma ve ağız açıklığında artış (ölçülerek, imalatçı sınırına göre) kontrol edildi mi? Emniyet mandalının bulunduğu, yay etkisiyle tam kapandığı ve fiilen çalıştığı denendi mi? Kanca sertifikası/işaretleri ve nominal kapasitenin kanca veya alt blok üzerinde okunur olduğu doğrulandı mı?", "ref": "TS EN 14492-2 md.5.6 / md.7.3 e)"}, {"row": 44, "no": "C17", "t": "Kaldırma freni (servis freni) fonksiyon testi", "d": "Kaldırma freninin kumanda nötre dönünce, acil durdurma basılınca ve güç kesilince otomatik devreye girdiği fiilen denendi mi? Fren balata aşınmasının sökmeden kontrol edilebildiği ve ayarın imalatçı talimatına uygun olduğu doğrulandı mı? Nominal yükte yük tutuldu ve indirmede durdurma sırasında yükün aşırı hızlanmadan (nominal indirme hızının 1,5 katını aşmadan) durduğu gözlendi mi?", "ref": "TS EN 14492-2 md.5.4"}, {"row": 45, "no": "C18", "t": "Aşırı yük sınırlayıcı varlığı ve ayarı", "d": "Nominal kapasitesi 1 000 kg ve üzeri palangada nominal kapasite sınırlayıcı bulunuyor mu (TS EN 14985'e göre kapasite 1 000 kg veya yük nedeniyle devrilme momenti 40 000 Nm ve üzeriyse de zorunlu)? Sınırlayıcının kayıtlı ayar/tetikleme değeri ile uyumlu olduğu, üretici prosedürüne göre kontrol edilip sonucun kaydedildiği doğrulandı mı? Sınırlayıcı devreye girince yükü kaldırma yönündeki hareketin engellendiği, indirme yönünün açık kaldığı görüldü mü?", "ref": "TS EN 14492-2 md.5.2.2.1 / md.7.2 / TS EN 14985 md.5.5.1.1 (kıyasen)"}, {"row": 46, "no": "C19", "t": "Sürtünme tork sınırlayıcı (kaymalı kavrama) - varsa", "d": "Sınırlayıcı olarak sürtünme tork sınırlayıcı kullanılıyorsa nominal kapasiteli yük ile kaldırma hareketi durdurulduktan sonra yükün tutulduğu ve kayma algılamalı tiplerde (1B, 2B) kayma algılama fonksiyonunun kaldırmayı kapattığı denendi mi? Kavrama ayarının imalatçının belirlediği değerde olduğu doğrulandı mı?", "ref": "TS EN 14492-2 md.5.2.2.4"}, {"row": 47, "no": "C20", "t": "Üst/alt kaldırma limitleri (hareket sınırlayıcılar)", "d": "Kanca üst ve alt konuma yaklaştırılarak kaldırma ve indirme sınırlayıcılarının hareketi otomatik durdurduğu denendi mi? Elektromekanik sınırlayıcıların pozitif açmalı olduğu, çalıştıktan sonra ters yönde hareketin mümkün olduğu ve alt limitte halat/zincirin minimum bağlantısının (tamburda en az iki sargı) korunduğu doğrulandı mı? Varsa ikinci (yedek) sınırlayıcı ayrı devre ile çalışıyor mu?", "ref": "TS EN 14492-2 md.5.2.4.1 / md.5.2.4.2 / md.5.13.9"}, {"row": 48, "no": "C21", "t": "Acil durdurma", "d": "Acil durdurma tertibatı çalışma modundan bağımsız olarak erişilebilir mi ve basıldığında tüm hareketleri durdurup frenleri devreye alıyor mu fiilen denendi mi? Sıfırlamanın hareketi kendiliğinden başlatmadığı doğrulandı mı? (Birden fazla kumanda istasyonu varsa her istasyonda mantar başlı, kendinden mandallı tip olduğu kontrol edildi mi?)", "ref": "TS EN 14492-2 md.5.2.3 / md.5.13.7 / TS EN 14985 md.5.3.9.4 (kıyasen)"}, {"row": 49, "no": "C22", "t": "Kumanda cihazları (sarkıt/kablosuz)", "d": "Kumanda elemanları basılı tut tipinde mi ve bırakılınca tahrik enerjisi kesiliyor mu denendi mi? Butonların fonksiyon/yön işaretleri (piktogram) okunur, kazara çalışmaya karşı korumalı mı; kablosuz kumandada durdurma fonksiyonu çalışıyor mu kontrol edildi mi?", "ref": "TS EN 14492-2 md.5.2.1 / md.5.2.5"}, {"row": 50, "no": "C23", "t": "Elektrik ekipmanı, izolasyon ve koruma dereceleri", "d": "Ana kesme/izolasyon cihazı (şalter, fiş-priz) çalışıyor mu; pano ve muhafaza kapakları sağlam, açık dış ortamda motor hariç muhafazalar en az IP 55, motor en az IP 54 mi? Koruyucu topraklama devre sürekliliği ve yalıtım direnci ölçüldü, değerler EN 60204-32'deki sınırlara göre değerlendirilip kaydedildi mi?", "ref": "TS EN 14492-2 md.5.13.4 / md.5.13.3.2 / md.5.13.1 (Tablo 5)"}, {"row": 51, "no": "C24", "t": "Besleme kablosu, faz sırası ve faz kaybı", "d": "Besleme/sarkıt kablo ve kolon içi/kol boyunca kablo yönlendirmesi, kablo askıları ve gerilim azaltıcılar hasarsız mı; kol dönerken kablonun gerilmediği ve sıkışmadığı gözlendi mi? Faz sırası doğru mu (yanlış faz dizilişinin etkisi kılavuza göre) ve faz arızasında yükün kontrolsüz düşmediği (frenin devrede kaldığı) doğrulandı mı?", "ref": "TS EN 14492-2 md.5.13.8.2 / md.7.2"}, {"row": 52, "no": "C25", "t": "Koruyucular ve kıstırma/ezilme noktaları", "d": "Hareketli aktarma parçaları (dişli, zincir girişi, kasnak) için koruyucular yerinde mi; halat/zincir girişlerinde elin sıkışması riskine karşı önlem var mı (kasnak kenarı ile koruyucu arası halat çapının 0,5 katından az)? Kolun dönme alanında kol-duvar/kolon/makine arası kıstırma noktalarının önlendiği veya işaretlendiği kontrol edildi mi?", "ref": "TS EN 14492-2 md.5.1 / md.5.7.4 / md.5.8.3 / TS EN 14985 md.5.7.2 (kıyasen)"}, {"row": 53, "no": "C26", "t": "Uyarı işaretleri ve sesli uyarı", "d": "Uyarı etiketleri ve güvenlik işaretleri (ISO 3864 uyarınca zıt renkli) okunur durumda mı; nominal kapasite işareti kanca/alt blokta ve yapıda görülüyor mu? Yer kumandalı olmayan palangada operatörün çalıştırdığı akustik uyarı cihazı bulunuyor ve çalışıyor mu (sarkıt kumandalı yer kumandası bu şarttan muaftır)?", "ref": "TS EN 14492-2 md.5.16.2 / md.5.16.4 / md.7.3 e) / TS EN 14985 md.7.6"}, {"row": 54, "no": "C27", "t": "Yüksüz fonksiyon testi (tüm hareketler)", "d": "Kaldırma, indirme, troley yürüyüşü ve kol dönmesi tüm hareket aralığında yüksüz, nominal hızlarda denendi mi? Anormal ses/titreşim/takılma, salınım ve hız uyumsuzluğu, motor akımlarının plaka değerleri içinde kaldığı ve sınırlayıcı/gösterge cihazlarının doğru çalıştığı gözlenip kaydedildi mi?", "ref": "ISO 9927-1 md.6.4 / md.6.3 / TS EN 14985 md.6.2.2.1 a) c) f)"}, {"row": 55, "no": "C28", "t": "Sınırlayıcı/gösterge ayarlarının doğrulanması ve kayıt", "d": "Aşırı yük ve hareket sınırlayıcılarının ayarı ve kalibrasyonu yetkin kişice, cihaz talimatı/ISO 10245-1 toleranslarına uygun olarak yapıldı mı? Kontrol ve ayar test sonucu ile tetikleme değeri (toleransı ile birlikte) kayıt defterine işlendi mi?", "ref": "ISO 9927-1 md.12 / TS EN 14492-2 md.7.2 / TS EN 14985 md.7.4"}, {"row": 56, "no": "C29", "t": "Yük testi öncesi hazırlık ve güvenlik", "d": "Test yükünün kütlesi belgeli/kalibre mi, yük kaldırma aparatları uygun kapasitede mi ve yük testinden önce zararlı bir kusur bulunmadığı ve yükün güvenli olduğu doğrulandı mı? Kol dönme alanında kamusal alan/komşu bina için tehlike varsa dönüşlü test o alanlara yasaklanmış, personel dönme/kıstırma alanı dışına alınmış mı?", "ref": "ISO 9927-1 Ek C m) o) / md.6.5"}, {"row": 57, "no": "C30", "t": "Nominal kapasite ile yük testi (yıllık kontrol)", "d": "Nominal kapasiteye eşit test yükü ile kaldırma, indirme, troley yürüyüşü ve kol dönmesi hareketleri, yük yerden minimum hızda ve halat/zincir gergin olarak kaldırılarak yapıldı mı? Test kritik konumda (troley kol ucunda, azami yarıçapta) ve yük asılıyken frenler/sınırlayıcılar gözlenerek tekrarlandı ve test yükünün nominal kapasiteyi aşmadığı doğrulandı mı?", "ref": "ISO 9927-1 md.6.5 / TS EN 14985 md.6.2.2.1 b) / TS EN 14492-2 md.7.2"}, {"row": 58, "no": "C31", "t": "Dinamik yük testi (nominal kapasitenin 1,1 katı)", "d": "Dinamik test nominal kapasitenin 1,1 katı yük ile, hareketler maksimum çalışma hızlarında ve uç konumlarda özellikle dikkatle yapıldı mı? Sınırlayıcı ayarı değiştirilmeden yük kaldırılabildiği, frenlerin yükü tuttuğu ve testin ardından mekanizmalarda hasar/aşınma ve yapıda deformasyon olmadığı doğrulandı mı?", "ref": "TS EN 14492-2 md.5.2.2.2.2 / Tablo 5 / TS EN 14985 md.6.2.2.3"}, {"row": 59, "no": "C32", "t": "Aşırı yük sınırlayıcının yük ile denenmesi", "d": "Yük kademeli artırılarak aşırı yük sınırlayıcının devreye girdiği yük değeri ölçülüp kaydedildi mi? Sınırlayıcının nominal kapasitenin 1,1 katını kaldırmaya izin verdiği, doğrudan etkili tipte nominal kapasitenin %160'ından fazlasının kaldırılmasını engellediği ve dolaylı etkili tipte tetikleme faktörünün üretici tolerans aralığında (tipik olarak 1,25 veya altı) kaldığı doğrulandı mı?", "ref": "TS EN 14492-2 md.5.2.2.2 / Tablo 5 (5.2.2.2) / TS EN 14985 md.5.5.1.3.1 (kıyasen)"}, {"row": 60, "no": "C33", "t": "Statik yük testi (3 yılda bir / önemli onarım sonrası)", "d": "Statik test yükü katsayısı ve dayandığı standart rapora yazıldı mı (TS EN 14492-2 Tablo 5: kaldırma tertibatı için nominal kapasitenin 1,25 katı; TS EN 14985 md.6.2.2.2 Tablo 5: mRC 20 t ve altında ψ = 1,50; Yönetmelik: elle işletilenlerde 1,5)? Yük kademeli uygulanıp en kritik kol konumunda (troley kol ucunda) tutuldu; kalıcı deformasyon, kolon/ankraj/temel hareketi, döner yatak, frenler ve stabilite izlenerek bekletme süresi imalatçı talimatına göre uygulandı mı?", "ref": "TS EN 14492-2 md.6 (Tablo 5, md.5.1) / TS EN 14985 md.6.2.2.2 (kıyasen)"}, {"row": 61, "no": "C34", "t": "Test sonrası kontrol", "d": "Testlerin ardından kolon, kol, ankraj cıvataları, döner yatak, zincir/halat, kanca ve frenlerde kalıcı deformasyon, çatlak, gevşeme, yağ sızıntısı ve aşınma kontrol edildi mi? Statik testin sonunda durma yükü ve aşırı yük sınırlayıcılarının tasarım değerlerine sıfırlanıp doğrulandığı ve ölçüm değerlerinin (tetikleme yükü, motor akımı) kaydedildiği görüldü mü?", "ref": "TS EN 14985 md.6.2.2.2 / ISO 9927-1 md.6.1 / md.6.5"}, {"row": 62, "no": "C35", "t": "Sonuç değerlendirmesi ve rapor", "d": "Bulunan kusurlar (açık/kapatılması gereken) ve sonraki periyodik muayenede özel dikkat gerektiren bileşenler (ankraj cıvataları, döner yatak, halat/zincir vb.) raporda belirtildi mi? Güvenliği etkileyen kusurlar giderilmeden ekipmanın kullanılmaması gerektiği kullanıcıya bildirildi ve raporun kayıt defteri ile birlikte muhafaza edildiği belirtildi mi?", "ref": "ISO 9927-1 md.5.1 / md.5.4 / md.10.3"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 64, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 65, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 66, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 67, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 68, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 69, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 70, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 71, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 72, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 74, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 75, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 76, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 77, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 78, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 79, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 80, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 81, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 82, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 83, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 84, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 85, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 86, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 14492-2 — Vinçler - Motorlu vinçler ve kaldırma tertibatları - Bölüm 2: Motorlu kaldırma tertibatları (palanga)"], ["Standart 2", "TS EN 14985 — Vinçler - Döner pergel vinçler (kapsam notu: md.1'e göre sütun tipi pergel vinçleri kapsam dışı bırakır; yalnızca kıyasen/tamamlayıcı olarak kullanıldı)"], ["Standart 3", "TS ISO 9927-1 — Vinçler - Denetimler - Bölüm 1: Genel"], ["Standart 4", "TS ISO 4309 — Vinçler - Çelik halatlar - Bakım ve onarım, muayene ve ıskarta (halatlı ise)"], ["Standart 5", "TS EN 818-7 — Kısa halkalı zincirler - Kaldırma zincirleri (T, DAT ve DT tipi) (zincirli ise, yalnızca işaretleme)"], ["Yük / fonksiyon testi notu", "Yönetmelik Ek-III 2.2.1: yılda bir nominal kapasite ile yük testi; en fazla 3 yılda bir veya önemli bakım-onarım sonrası statik (1,25; elle işletilenlerde 1,5) ve dinamik (1,1) test. TS EN 14492-2 Tablo 5 (md.5.1) palanga için dinamik 1,1 x nominal kapasite ve statik 1,25 x nominal kapasite verir (fren md.5.4 ve sınırlayıcı md.5.2.2.2 de 1,1 x ile dinamik testte doğrulanır; sınırlayıcı ayarı test sırasında değiştirilmez). TS EN 14985 md.6.2.2.2 Tablo 5 ise döner kolun statik testi için ψ = 1,50 (mRC 20 t ve altı; test yükü = ψ x mRC + mLA veya ϕ2 x (mRC + mLA), hangisi büyükse), md.6.2.2.3 dinamik için en az %110 verir; statik test en kritik kol konumunda yapılır. ISO 9927-1 md.6.5: yük testi hareketlerde (kaldırma, hareket, dönüş) yapılır ve test yükü nominal kapasiteyi aşmamalıdır (ulusal mevzuat gerektirirse fazlası uygulanır), md.6.6: statik/dinamik/stabilite testleri ISO 4310'a göre."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) KAPSAM: TS EN 14985 md.1 duvara monte, sütun, derrick, demiryolu, kule ve atölye pergel vinçlerini kapsam dışı bırakır; dikme kollu (pillar/sütun) kren bu standardın doğrudan kapsamında değildir, ilgili maddeler (md.5.4.5.2, 5.4.2, 5.3.9.4, 6.2.2.x, 7.4) yalnızca 'kıyasen' kullanılmış ve ref sütununda işaretlenmiştir. Bu eşleme (TÜRKAK L701-018 / Tablo-2) tanık denetçisince teyit edilmelidir. 2) Sütun tipi krene özgü ankraj cıvata/temel şartı, cıvata tork değeri, kolon dikeylik toleransı ve kol dönme açısı sınırı sağlanan metinlerde YOKTUR; bu maddeler ISO 9927-1 (md.5.5 b)7, md.6.1, Ek A 2.5, md.6.3 b) genel hükümleri) ve üretici verisine dayandırılmıştır, sayısal değer yazılmamıştır. 3) Statik test katsayısında çelişki: TS EN 14492-2 = 1,25, TS EN 14985 = 1,50 (mRC <= 20 t), Yönetmelik = 1,25/1,5; hangisinin uygulanacağı ekipmana/imalatçı talimatına göre belirlenmelidir. Test yükü bekletme süresi iki standartta da belirtilmemiştir (yazılmadı). 4) Aşırı yük sınırlayıcı tetikleme faktörü: TS EN 14492-2 md.5.2.2.2.3 tipik alfa <= 1,25, TS EN 14985 md.5.5.1.3.1 alfa <= 1,1 (farklı standart, farklı değer). 5) Zincir aşınma/uzama sınırı (ör. %3) sağlanan metinlerde (TS EN 14492-2, TS EN 818-7) bulunamadı; 'imalatçı sınırına göre' yazıldı. TS EN 818-7 yalnızca imalat/işaretleme md.7 içeriyor. 6) Kanca ağzı açıklık artış sınırı, fren balata aşınma sınırı, yalıtım direnci/süreklilik limitleri (EN 60204-32 md.19) sağlanan metinlerde yok; sayısal değer yazılmadı. 7) TS EN 14492-2 ve TS EN 14985 tasarım/tip doğrulama standartlarıdır; saha periyodik kontrol için kesin prosedür ISO 9927-1'dedir. Tablo 5 değerleri (1,1/1,25) hizmete alma doğrulaması içindir, Yönetmelik katsayılarıyla uyumlu okunmuştur. 8) TS ISO 4309 Tablo 3 değeri yalnızca RCN 01 satırı için örnek verilmiştir; gerçek halat için RCN Ek H'den belirlenmelidir. 9) TS EN 14492-2 md.5.2.2.1 nominal kapasite sınırlayıcı zorunluluğu 1 000 kg ve üzeri içindir; daha küçük kapasitelerde zorunlu değildir (md.5.2.2.1'e göre); C18'deki 1 000 kg veya 40 000 Nm eşiği TS EN 14985 md.5.5.1.1'den (kıyasen) alınmıştır."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B8"], ["A8", "A9", "B7"], [], ["A4", "A12", "A13", "B2", "B3", "B4"], ["B1", "B5"], ["C17", "C27", "C29", "C30", "C31", "C33", "C34"], ["A6", "E6"], ["A7", "B7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35"], ["D1", "B10"], ["D2", "D5", "E3", "E5", "E11", "B6", "B9"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.8.1", "name": "Zincir Aksamlı El Tahrikli Vinç", "method": "Kapsam Kodu: 1.A.8.1   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 13157 (EN 13157:2004+A1:2009) · EN 818-7 (BS EN 818-7:2002+A1:2008)", "refTitle": "1.A.8.1 Zincir Aksamlı El Tahrikli Vinç — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.8.1 – Zincir Aksamlı El Tahrikli Vinç"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (El zincirli palanga / yük zincirli)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal Kapasite (kg / t)"}, {"row": 24, "label": "Yük Zinciri Boyutu / Kalitesi ve Kaldırma Yüksekliği (m)"}, {"row": 25, "label": "Kullanım Yeri / Bağlama Noktası"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.8.1 Zincir Aksamlı El Tahrikli Vinç) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Kalibrasyonlu test yükü (ağırlık/yük hücresi veya dinamometre, nominal kapasitenin 1,5 katını kapsayan), el kuvveti ölçümü için dinamometre (daN), kumpas ve çelik cetvel/şerit metre (zincir adım ve malzeme çapı ölçümü), kronometre (10 dakika bekletme) vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Etiket / tanıtım plakası", "d": "Kalıcı ve okunabilir plakada üretici adı ve adresi, seri/tip tanımı, seri no, nominal kapasite (kapak ve alt blokta), üretim yılı ile yük zincirinin boyutu ve kalitesi mevcut ve rapordaki bilgilerle uyumlu mu? Plaka yoksa/okunamıyorsa tespit ve kayıt yapıldı mı?", "ref": "TS EN 13157 md.7.1.3"}, {"row": 18, "no": "B2", "t": "2. Kapasite ve ekipman sınıfı tespiti", "d": "Nominal kapasite (kg/t) plakadan okunarak kayda alındı mı? Ekipmanın elle işletilen, yük zincirli el zincirli palanga olduğu (motorlu/kollu/tamburlu değil) doğrulandı mı? Elle işletilen ekipman olduğu için statik test katsayısının 1,5 uygulanacağı belirlendi mi?", "ref": "TS EN 13157 md.1 / md.3.2 / md.6.3.2.2"}, {"row": 19, "no": "B3", "t": "3. Kullanım kılavuzu ve üretici bilgileri", "d": "Türkçe kullanım talimatı mevcut mu? Kullanım amacı, teknik veriler, yük tablosu, ortam sıcaklığı, bağlama noktası azami yüksekliği, bakım talimatları ve zincir değişim kriterleri kılavuzda yer alıyor mu?", "ref": "TS EN 13157 md.7.1.1"}, {"row": 20, "no": "B4", "t": "4. Üretici periyodik muayene bilgisi", "d": "Üreticinin belirttiği muayene/test sıklığı (devreye almadan önce, onarım/yeniden montaj veya uzun süreli durdurma sonrası, kullanım süresince) ve özel kullanım/test gerektiren orijinal parça listesi temin edilip muayene kapsamına yansıtıldı mı?", "ref": "TS EN 13157 md.7.1.2"}, {"row": 21, "no": "B5", "t": "5. Önceki rapor ve bakım kayıtları", "d": "Önceki periyodik kontrol raporu, bakım-onarım, parça (zincir, fren balatası vb.) değişim ve önceki uygunsuzluk kayıtları incelendi mi? Önemli onarım sonrası test gereksinimi değerlendirildi mi?", "ref": "Yönetmelik Ek-III md.2.2.1"}, {"row": 22, "no": "B6", "t": "6. Zincir sertifikası ve özellikleri", "d": "Yük zincirinin üretici sertifikası/kalite işareti kontrol edildi mi? Yük zincirinin ince toleranslı kısa bağlantılı T sınıfı olduğu, zincir boyutu ve kalitesinin plakadaki bilgiyle uyumu doğrulandı mı?", "ref": "TS EN 13157 md.5.1.10 / EN 818-7 md.7, md.8"}, {"row": 23, "no": "B7", "t": "7. Kullanım yeri ve ortam koşulları", "d": "Bağlama/askı noktası ve taşıyıcı yapı, kullanım ortamı (sıcaklık, aşındırıcı/patlayıcı ortam, asit vb.) belirlenip üretici sınırlarıyla karşılaştırıldı mı? Ortam sıcaklığının -10 C ile +50 C aralığında veya üretici belirttiği aralıkta olduğu doğrulandı mı?", "ref": "TS EN 13157 md.5.1.12 / md.7.1.1 / EN 818-7 md.9.3"}, {"row": 24, "no": "B8", "t": "8. Test ekipmanı ve ölçülecek veriler", "d": "Test yükü (kütle/dinamometre) ve zincir ölçüm aleti için kalibrasyon geçerliliği kontrol edildi mi? Nominal kapasite, test yükleri (1,5 x ve 1,1 x), el zinciri çekme kuvveti ve zincir ölçüleri için ölçüm planı yapıldı mı?", "ref": "TS EN 13157 md.6.3.2 / md.5.1.6"}, {"row": 25, "no": "B9", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 26, "no": "B10", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 27, "no": "B11", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 29, "no": "C1", "t": "Genel görsel muayene ve yağlama", "d": "Gövde, kapak ve muhafazalarda çatlak, kalıcı deformasyon, korozyon, kırık veya eksik parça, gevşek bağlantı elemanı gözle kontrol edildi mi? Yağlama ve temizlik durumu değerlendirildi mi?", "ref": "TS EN 13157 md.7.1.1 (k)"}, {"row": 30, "no": "C2", "t": "Kanca emniyet mandalı (alt ve üst)", "d": "Alt ve üst kancada emniyet mandalı mevcut, yayı sağlam ve kapalı konuma otomatik dönüyor mu? Mandal kancanın ağzını kapatarak yükün istem dışı ayrılmasını engelliyor mu?", "ref": "TS EN 13157 md.5.1.8"}, {"row": 31, "no": "C3", "t": "Kanca aşınma ve deformasyon kontrolü", "d": "Kancalarda ağız açıklığında artış, boğaz aşınması, bükülme, çatlak ve yüzey hasarı gözle ve (uygunsa) ölçümle kontrol edildi mi? Ölçüm değeri üretici/kanca standardı sınırıyla karşılaştırılıp kaydedildi mi? Sınır değer için üretici kriterine başvuruldu mu?", "ref": "TS EN 13157 md.5.1.8 / Ek A"}, {"row": 32, "no": "C4", "t": "Üst kanca dönüşü", "d": "Üst kanca (askı kancası) doğru konumlanma için serbestçe dönebiliyor mu ve rulman/dönme mekanizmasında sıkışma, boşluk veya hasar var mı?", "ref": "TS EN 13157 md.5.1.8"}, {"row": 33, "no": "C5", "t": "Yük zinciri bakla ve bağlantı kontrolü", "d": "Yük zincirinin tüm boyunca bakla ve bağlantılarda deformasyon, çatlak, kesik/çentik, korozyon, ısı izi, kaynak bölgesi hasarı ve aşırı aşınma gözle kontrol edildi mi? Zincir bütün uzunluğu boyunca (kancadan uç durdurucuya) incelendi mi?", "ref": "TS EN 13157 md.5.1.10 / EN 818-7 md.9.6"}, {"row": 34, "no": "C6", "t": "Yük zinciri uzama/aşınma ölçümü", "d": "Zincir uzaması ve baklalardaki malzeme çapı aşınması kumpasla ölçülerek kaydedildi mi? Bulgu, zincir üreticisinin ıskarta/değişim kriteriyle karşılaştırıldı mı? (Standart metinde sayısal ıskarta sınırı verilmemiştir; üretici kriteri esas alınmalıdır.)", "ref": "TS EN 13157 md.7.1.1 (k) / EN 818-7 md.9.6"}, {"row": 35, "no": "C7", "t": "Zincirde dönme/burulma ve serbest hareket", "d": "Yük zinciri palanga içinde burulmadan (kıvrılmadan) ve bağlantılar birbirini kilitlemeden geçiyor, zincir tekerleğine sorunsuz giriş çıkış yapıyor mu? Zincirin kir/kum nedeniyle sıkışması var mı?", "ref": "EN 818-7 md.9.5 / TS EN 13157 md.5.1.9"}, {"row": 36, "no": "C8", "t": "Yük zinciri sabit uç bağlantısı", "d": "Yük zincirinin sabit ucundaki bağlantı (ankraj) elemanında deformasyon, çatlak, gevşeme, aşınma ve eksik bağlantı elemanı var mı? Sabit uç bağlantısı gözle kontrol edildi mi?", "ref": "TS EN 13157 md.5.1.11"}, {"row": 37, "no": "C9", "t": "Yük zinciri uç durdurucu", "d": "Yük zincirinin serbest ucunda uç durdurucu mevcut, sağlam ve yerine emniyetli sabitlenmiş mi? Zincirin tamamen geçip çıkmasını engelliyor mu (uç durdurucu palanga gövdesine temas edebiliyor mu)?", "ref": "TS EN 13157 md.5.1.11"}, {"row": 38, "no": "C10", "t": "Yük zinciri tekerleği ve zincir kılavuzu", "d": "Yük zinciri tekerleği (tek parça) ve el zinciri tekerleğinde diş/cep aşınması, kırık, çatlak; zincir kılavuzunun mevcudiyeti, sağlamlığı ve zincirin çarktan atlamasını engelleme fonksiyonu kontrol edildi mi?", "ref": "TS EN 13157 md.5.1.9"}, {"row": 39, "no": "C11", "t": "El zinciri durumu ve emniyeti", "d": "El zincirinde deformasyon, aşınma, paslanma, kaynak çevresinde keskin kenar ve hasarlı bağlantı var mı? El zincirinin el zinciri tekerleğinden kasıtsız ayrılmaya karşı emniyette olduğu gözle ve fiili çalıştırmada kontrol edildi mi?", "ref": "TS EN 13157 md.5.1.5 / md.5.1.10"}, {"row": 40, "no": "C12", "t": "El zinciri sarkma yüksekliği", "d": "El zincirinin alt kısmının yerden 500 mm ile 1000 mm arasında olacak şekilde ayarlanabildiği/ayarlı olduğu kontrol edildi mi (üretici talimatı doğrultusunda)?", "ref": "TS EN 13157 md.7.1.1 (n)"}, {"row": 41, "no": "C13", "t": "Koruma kapağı ve dişli korumaları", "d": "Dişli ve hareketli parçaları koruyan kapak(lar) mevcut ve sağlam mı? Vücut parçalarının kazara girmesi engelleniyor mu? Erişilebilir yüzeylerde keskin kenar, sivri köşe ve yaralanma riski yaratan pürüzlü yüzey yok mu?", "ref": "TS EN 13157 md.5.1.7"}, {"row": 42, "no": "C14", "t": "Fren mekanizması görsel kontrol", "d": "Fren kapağı açılmadan erişilebilen kısımlarda ve (üretici talimatı/yetkinlik dahilinde) fren balataları, mandal-dişli (cırcır) ve yaylarda aşınma, yağlanma, korozyon, hasar var mı? Fren balatalarının aşınma durumu üretici kriteriyle değerlendirildi mi?", "ref": "TS EN 13157 md.5.1.3 / md.7.1.1 (k)"}, {"row": 43, "no": "C15", "t": "Yaylar", "d": "Palanga emniyet elemanlarındaki yaylarda kırık, deformasyon, gevşeme veya korozyon var mı? Yay arızasının emniyet elemanının (fren) işlevini bozmaması esası kapsamında değerlendirme yapıldı mı?", "ref": "TS EN 13157 md.5.1.4"}, {"row": 44, "no": "C16", "t": "Güvenlik cihazlarının müdahaleye karşı korunması", "d": "Fren sistemi ve varsa aşırı yük koruma sistemi yalnızca alet kullanılarak sökülebilir yapıda mı? Bunlara müdahale edildiğine, devre dışı bırakıldığına veya bypass edildiğine dair iz var mı?", "ref": "TS EN 13157 md.5.1.13"}, {"row": 45, "no": "C17", "t": "Aşırı yük koruma sistemi (varsa)", "d": "Palanga aşırı yük koruma sistemi (ör. sürtünmeli kavrama) ile donatılmış mı? Varsa fiili çalışması kontrol edildi mi (tetiklendiğinde yükün kontrol altında kaldığı ve el zincirinin ani serbest kalmadığı)? Sistem yoksa, nominal kapasitede el zinciri kuvvetinin alt sınır değerin altında olmadığı doğrulandı mı?", "ref": "TS EN 13157 md.5.1.6"}, {"row": 46, "no": "C18", "t": "Yüksüz fonksiyon testi", "d": "Palanga yüksüz veya çok hafif yükle kaldırma ve indirme yönünde tam kurs boyunca çalıştırılarak zincir, tekerlekler ve dişlilerde düzgün, takılmasız ve anormal ses/titreşimsiz çalışma doğrulandı mı? Kanca ve zincir hareketi izlendi mi?", "ref": "TS EN 13157 md.6.3.2.4"}, {"row": 47, "no": "C19", "t": "Hafif yük ve fren tutma testi", "d": "Nominal kapasitenin %2 ila %10'u arasında bir yükle, 250 mm ile 500 mm arasında bir yüksekliğe kaldırma ve indirme yapıldı mı? Kaldırma/indirme sırasında herhangi bir noktada el zinciri bırakıldığında frenin yükü tuttuğu fiilen doğrulandı mı?", "ref": "TS EN 13157 md.6.3.3.1 / md.5.1.3"}, {"row": 48, "no": "C20", "t": "Otomatik fren fonksiyonu", "d": "Kaldırma ve indirme sırasında el zincirine uygulanan kuvvet kesildiğinde fren otomatik devreye giriyor ve yük kayma olmadan tutuluyor mu? İndirmede yükün kontrollü ve düzenli inişi, yükün konumundan bağımsız olarak sağlanıyor mu?", "ref": "TS EN 13157 md.5.1.3"}, {"row": 49, "no": "C21", "t": "El zinciri çekme kuvveti ölçümü", "d": "Nominal kapasitedeki yükü kaldırırken el zincirinde gereken çekme kuvveti dinamometre ile ölçüldü mü? Değerin 55 daN'ı aşmadığı ve nominal kapasiteye göre alt sınırın (nominal kapasite 1000 kg ve altı: 20 daN; 1000 kg üstü ve 5000 kg altı: 40 daN; 5000 kg ve üzeri: 45 daN) altına düşmediği doğrulanıp ölçüm değeri kaydedildi mi?", "ref": "TS EN 13157 md.5.1.6"}, {"row": 50, "no": "C22", "t": "Statik yük testi (1,5 x nominal kapasite)", "d": "Elle işletilen ekipmanda nominal kapasitenin 1,5 katı test yükü kaldırılıp asılı halde en az 10 dakika bekletildi mi? Test yükünün kaldırma yüksekliği, bekleme süresi ve yük değeri kaydedildi mi? Yük kaydırılmadan, frenin yükü kaymadan tuttuğu izlendi mi?", "ref": "TS EN 13157 md.6.3.2.2 / Yönetmelik Ek-III md.2.2.1"}, {"row": 51, "no": "C23", "t": "Statik test kabul kriterleri", "d": "Statik test sonunda çatlak, kalıcı deformasyon veya hasar, gevşeyen/hasar gören bağlantı olmadığı; frenin yükü kaymadan tuttuğu ve aynı palanga ile dinamik testin yapılabildiği doğrulandı mı?", "ref": "TS EN 13157 md.6.3.2.2"}, {"row": 52, "no": "C24", "t": "Dinamik yük testi (1,1 x nominal kapasite)", "d": "Nominal kapasitenin 1,1 katı yükle her hareket için (kaldırma/indirme) en elverişsiz koşullarda ve tekrarlı durdurma ve başlatma ile dinamik test yapıldı mı? Test sonrası mekanizmalarda ve yapısal elemanlarda hasar ve gevşeme olmadığı doğrulandı mı?", "ref": "TS EN 13157 md.6.3.2.3 / Yönetmelik Ek-III md.2.2.1"}, {"row": 53, "no": "C25", "t": "Test sırası ve statik sonrası dinamik test", "d": "Statik testten sonra aynı palanga ile dinamik testin gerçekleştirilebildiği (statik testin kabul koşulu) doğrulandı mı? Hafif yük/fren kontrolü ile statik ve dinamik testler kayıtlı bir sırayla uygulandı mı?", "ref": "TS EN 13157 md.6.3.2.2 / md.6.3.2.3"}, {"row": 54, "no": "C26", "t": "İşletme kapasitesi (nominal yük) ile fonksiyon testi", "d": "Yıllık kontrolde nominal (işletme) kapasitesinde kaldırma-indirme ve fren fonksiyonu denendi mi? Tüm fonksiyonların gereklilik ve teknik dokümanla uyumu doğrulandı mı?", "ref": "TS EN 13157 md.6.3.2.4 / Yönetmelik Ek-III md.2.2.1"}, {"row": 55, "no": "C27", "t": "Test yükü ve askı donanımı", "d": "Test yükü, bağlama noktası ve yardımcı donanımın (sapan, şekel vb.) test yüküne uygun kapasitede ve muayeneli olduğu doğrulandı mı? Test sırasında personel güvenliği (yük altında bulunmama, emniyet alanı) sağlandı mı?", "ref": "Yönetmelik Ek-III md.2.2.1"}, {"row": 56, "no": "C28", "t": "Test sonrası kontrol", "d": "Test sonrasında yük zinciri, kanca, mandal, sabit uç ve uç durdurucu, gövde ve kapaklarda kalıcı deformasyon, çatlak, gevşeme ve zincirde uzama tekrar gözle kontrol edildi mi? Sonuçlar rapora işlendi mi?", "ref": "TS EN 13157 md.6.3.2.2 / md.6.3.2.3"}, {"row": 57, "no": "C29", "t": "Bağlama/askı noktası ve taşıyıcı yapı", "d": "Palangayı taşıyan yapı/kiriş/araba ve bağlantı elemanlarının uygunluğu ve kapasitesi gözle kontrol edildi mi? Palangaya kombine el arabası bağlıysa arabanın ayrıca muayenesi yapıldı mı?", "ref": "TS EN 13157 md.5.1.1 / md.5.1.14"}, {"row": 58, "no": "C30", "t": "Uygunsuzluk ve sonuç değerlendirmesi", "d": "Tespit edilen uygunsuzluklar, ölçülen değerlerle (zincir, kanca, el kuvveti, test yükleri) birlikte kayıt altına alındı mı? Güvenliği etkileyen kusurlarda ekipmanın kullanımdan kaldırılması ve uygunluk kararının kriterlere dayandırıldığı doğrulandı mı?", "ref": "Yönetmelik Ek-III md.2.2"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 60, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 61, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 62, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 63, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 64, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 65, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği son
