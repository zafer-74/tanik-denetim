ş mu (gömme, kapaklı, iki el/iki ayak, işlem sırası)? Tek kumanda ile birden fazla hareket başlatılıyorsa tehlikeli çakışan hareketleri önleyen tertibat çalışıyor mu?", "ref": "TS EN 1756-1 md.5.17.3 / md.5.17.4"}, {"row": 42, "no": "C15", "t": "İki elli / çoklu kumanda", "d": "Platformu tam açma/kapamada sabit kumandalar kullanılıyorsa iki elli kumanda tipinde, eşzamanlı çalıştırma gerektiriyor ve bir kumandanın sabitlenerek (bloke edilerek) güvenlik özelliğinin devre dışı bırakılması engellenmiş mi? Denendi mi?", "ref": "TS EN 1756-1 md.5.17.5 / EN ISO 13851"}, {"row": 43, "no": "C16", "t": "Mobil ve kablosuz kumanda", "d": "Mobil/kablosuz kumanda varsa: aktivasyon için birden fazla kumandanın çalıştırılması gerekiyor mu, ayrı durdurma kumandası var mı, aktif mod göstergesi var mı, çalıştırılmadığında en fazla 10 dakikada inaktif moda geçiyor mu, bağlantı kesilince platform duruyor ve 100 mm'den fazla hareket etmiyor mu? Fiilen denendi mi?", "ref": "TS EN 1756-1 md.5.17.6 / md.5.17.7"}, {"row": 44, "no": "C17", "t": "Ezilme ve kesilme koruması", "d": "Ezilme/kesilme riskine karşı imalatçının seçtiği koruyucu önlem (ayak koruması, güvenlik sensörü, iki elli kumanda, atanmış operatör konumu) mevcut, hasarsız ve fiilen etkin mi? Güvenlik sensörü varsa tetiklenince hareketi durduruyor mu? Korkuluk ile araç gövdesi arasındaki ezilme/kesilme riski giderilmiş mi?", "ref": "TS EN 1756-1 md.5.11 / Ek B / Ek J"}, {"row": 45, "no": "C18", "t": "Dikey hız ölçümü", "d": "Platformun dikey hızı, en kötü yükleme koşulunda (azami yük) kronometre/mesafe ölçümü veya hız ölçerle ölçüldü mü? Değerin 0,15 m/s'yi aşmadığı (±%10 sınır sapması ile en çok 0,165 m/s) doğrulanıp ölçüm kaydedildi mi?", "ref": "TS EN 1756-1 md.5.4.1 / md.5.4.2 / Ek H.5"}, {"row": 46, "no": "C19", "t": "Açma-kapama hızları", "d": "Manuel çaba dışında istiflenen/açılan platformda açısal kapanma-açılma hızı 10°/s'yi aşmıyor mu (engele çarpınca otomatik durdurma yoksa)? Yerden 1,5 m'nin altındaki kısımlarda en hızlı kenar hızı en çok 0,7 m/s, korumasız erişilebilir diğer motorlu hareketler en çok 0,3 m/s mi? Ölçüldü mü?", "ref": "TS EN 1756-1 md.5.4.3"}, {"row": 47, "no": "C20", "t": "Eğme (devirme) hızı ve açısı", "d": "Platformdan/operatörün erişebileceği kumandalarla eğme hızı 4°/s'yi, diğer kumandalarla 10°/s'yi aşıyor mu? Platformdaki operatöre erişilebilir kumanda platformu yataydan 10°'den fazla eğiyor mu (zemine ulaşmak için gerekli durum hariç)? Ölçüldü mü?", "ref": "TS EN 1756-1 md.5.4.4 / md.5.5.1 / Ek H.5"}, {"row": 48, "no": "C21", "t": "Seyahat konumu göstergesi ve kilitleme", "d": "Sürücü kabininde (dahili montajlı tipler hariç) asansörün seyahat konumunda istiflendiğini gösteren gösterge çalışıyor mu? İstif konumunda platform, kendinden kilitlemeli valf veya otomatik devreye giren mekanik mandalla güvenle tutuluyor mu? Denendi mi?", "ref": "TS EN 1756-1 md.5.10.1 / md.5.10.2"}, {"row": 49, "no": "C22", "t": "Hidrolik sızıntı ve hortumlar", "d": "Silindir, valf, rakor, hortum ve depoda sızıntı, hortumlarda çatlak/hasar/ömrünü doldurma kontrol edildi mi? Hortum ve bağlantıların derecelendirmesinin (patlama basıncı, azami basıncın en az 4 katı) etiket/dokümandan doğrulandığı ve boruların hareketle zarar görmeyecek biçimde sabitlendiği kontrol edildi mi?", "ref": "TS EN 1756-1 md.5.14.3.2 / md.5.7 / md.5.14.1.2"}, {"row": 50, "no": "C23", "t": "Hidrolik sızıntı halinde hareket sınırı", "d": "Kumanda bırakıldıktan sonra platformun hiçbir kısmının 100 mm'den fazla hareket etmediği (kendinden kilitlemeli valfler silindire rijit bağlı mı) kontrol edildi mi? Sızıntı halinde hızın normal çalışma hızını %50'den fazla aşmayacağına dair imalatçı verisi/tasarımı incelendi mi?", "ref": "TS EN 1756-1 md.5.14.1.2"}, {"row": 51, "no": "C24", "t": "Basınç sınırlama ve ayar emniyeti", "d": "Basınç sınırlama cihazı mevcut mu ve çalışma basıncının 1,25 katından yüksek basıncı önleyecek şekilde imalatçı ayarında mı (ayar basıncı manometre ile okunup kaydedildi mi)? Cihaz yükseltilmiş platformdaki yüke tepki vermiyor mu? Basınç sınırlama, akış regülatörü ve yük kontrol cihazlarının ayarları mühürlü/kurşun contalı veya özel alet gerektirir durumda mı?", "ref": "TS EN 1756-1 md.5.14.3.3 / md.5.14.3.1"}, {"row": 52, "no": "C25", "t": "Basınç göstergesi noktası ve rezervuar", "d": "Her hidrolik devrede basınç göstergesi bağlanabilecek erişilebilir nokta var mı? Rezervuarın sıvı seviyesi kolay kontrol edilebiliyor (gözetleme camı/daldırma çubuğu), havalandırma filtresi/nefesliği sağlam ve sıvı tipi/seviyesi imalatçı önerisine uygun mu?", "ref": "TS EN 1756-1 md.5.14.3.4 / md.5.14.3.5 / md.7.4.2.2"}, {"row": 53, "no": "C26", "t": "Çelik tel halat kontrolü", "d": "Halatlarda kopuk tel, korozyon, ezilme, kink, çap incelmesi imalatçı ıskarta kriterlerine göre kontrol edildi ve ölçüm kaydedildi mi? Sonlandırmalar (ek, dökme/dövme soket) uygun mu, halkalarda yüksük var mı, U cıvatalı kelepçe kullanılmışsa eşdeğerlik kanıtı var mı?", "ref": "TS EN 1756-1 md.5.14.2.1 / md.7.4.2.4"}, {"row": 54, "no": "C27", "t": "Halat makara, tambur ve sarım", "d": "Makara çapı (yiv altından) halat çapının 12 katından, tambur çapı halat çapının 16 katından az değil mi? Platform en alçak konumdayken tamburda en az iki tur halat kalıyor mu ve sarım düzgün (dolanma yok) mu? Halat çalışma katsayısının (kişi için 7 veya 8; kişisiz 5) imalatçı dokümanında sağlandığı doğrulandı mı?", "ref": "TS EN 1756-1 md.5.14.2.1"}, {"row": 55, "no": "C28", "t": "Zincir kontrolü", "d": "Zincirler yaprak veya makaralı tipte mi? Aşınma, uzama, korozyon ve hasar imalatçı sınırları içinde mi (uzama ölçülüp kaydedildi mi)? Zincir dişlisi/kasnağı hatve dairesi çapı zincir hatvesinin 4,8 katından az değil mi? Zincir çalışma katsayısı (kişi için 8; kişisiz 6) dokümandan doğrulandı mı?", "ref": "TS EN 1756-1 md.5.14.2.2 / md.7.4.2.4"}, {"row": 56, "no": "C29", "t": "Halat/zincir tutma, filo açısı ve ayar", "d": "Kasnak/dişli montajı halat/zinciri yerinde tutuyor mu? Sapma (filo) açıları halat-kasnak 5°, halat-tambur 2,5°, zincir 1,5°'yi aşmıyor mu? Birden fazla halat/zincirde en az birinin etkin boyunu ayarlayan cihaz var ve gerginlikler eşit mi?", "ref": "TS EN 1756-1 md.5.14.2.3 / md.5.14.2.4 / md.5.14.2.5"}, {"row": 57, "no": "C30", "t": "Askı arızasına karşı güvenlik tertibatı", "d": "Halat/zincir/vidalı askı arızasında platformun inişini arıza konumundan 100 mm içinde durduran cihaz (gevşek halat/zincir dedektörü veya ikincil askı) mevcut ve fonksiyonel olarak denendi mi? Tamburlu halat askısında halat gevşeyince indirme devre dışı kalıyor, kaldırma kullanılabilir kalıyor mu? İkincil askı varsa birincil kopunca seyahat konumu dışına hareket engelleniyor mu?", "ref": "TS EN 1756-1 md.5.14.1.3 / md.5.14.2.6 / md.5.14.2.7"}, {"row": 58, "no": "C31", "t": "Güvenlik cihazları genel", "d": "Tüm güvenlik cihazları mevcut, devre dışı bırakılmamış (köprülenmemiş, bypass yok) ve etkin çalışıyor mu? Mekanik cihazlar aktif pozitif hareketle çalışıyor, yaylarda kırık/deformasyon yok mu? Güvenlikle ilgili kontrol parçalarının PLr b seviyesi imalatçı dokümanından doğrulandı mı?", "ref": "TS EN 1756-1 md.5.15.1 / md.5.15.2 / md.5.15.3 / md.7.4.2.4"}, {"row": 59, "no": "C32", "t": "Elektrik: sigorta, ayırıcı, akü", "d": "Kontrol ve ana güç devrelerinde akım sınırlama cihazı (sigorta vb.; ana devrede aküye mümkün olduğunca yakın) var mı? Elektrik beslemesini kesme imkânı (ayırıcı şalter/akü bağlantısı ayırma) mevcut ve erişilebilir mi? Kablo, terminal, akü ve topraklama bağlantıları hasarsız, sıkı ve korozyonsuz mu?", "ref": "TS EN 1756-1 md.5.9.1 / md.5.7 / Ek K"}, {"row": 60, "no": "C33", "t": "İşaretleme ve uyarı etiketleri", "d": "Güvenlik etiketleri ve operatör talimatları eksiksiz, okunaklı ve yerinde mi? Bağlantı köprüsü kullanımına izin veriliyorsa azami yük kapasitesi çalışma alanından görülecek şekilde kalıcı işaretli mi? Kişi taşıma yasağı/izni konusunda etiket var mı?", "ref": "TS EN 1756-1 md.7.4.1 / md.7.2 / md.7.3"}, {"row": 61, "no": "C34", "t": "Yüksüz fonksiyon testi", "d": "Yük uygulanmadan önce kaldırma, indirme, açma, kapama, eğme hareketleri tüm aralıkta çalıştırılarak anormal ses, titreme, takılma, sızıntı ve kumanda işlevleri gözlendi mi? Test sırasında platformun altı ve tehlike bölgesi boşaltılmış mıydı?", "ref": "TS EN 1756-1 md.5.17 / md.5.6 / Ek H.5"}, {"row": 62, "no": "C35", "t": "Statik deformasyon testi (%125)", "d": "Platform zemin ile araç zemini seviyesinin ortasında iken yükseklik ve araca göre açısal duruş ölçüldü mü? Azami yükün %125'i uygulanıp kaldırıldıktan sonra ölçümler tekrarlanarak kuyruk asansörünün herhangi bir parçasında veya araç bağlantısında işlevi etkileyecek kalıcı deformasyon olmadığı doğrulandı mı? Test yükü kütlesi ve ölçüm değerleri kaydedildi mi?", "ref": "TS EN 1756-1 Ek H.3.1 / md.5.12"}, {"row": 63, "no": "C36", "t": "Sürüklenme (drift) testi (%125, 15 dk)", "d": "Platform araç zemini seviyesinde iken azami yükün %125'i uygulanıp yükseklik ve açısal duruş ölçüldü, 15 dakika sonra tekrarlandı mı? İki ölçüm arasındaki dikey sapma en çok 15 mm, açısal sapma en çok 2° olarak doğrulandı ve süre fiilen tutuldu mu?", "ref": "TS EN 1756-1 Ek H.3.2"}, {"row": 64, "no": "C37", "t": "Dinamik test (azami yük)", "d": "Platforma azami yük (nominal yükün %100'ü) uygulanarak normal kaldırma, indirme ve varsa eğme hareketlerinin tüm aralık boyunca sorunsuz yapıldığı doğrulandı mı? İndirme ve yatırma hızları bu yükle ölçüldü mü?", "ref": "TS EN 1756-1 Ek H.4 / Ek H.5"}, {"row": 65, "no": "C38", "t": "Aşırı yük kaldırmama testi (%125)", "d": "Zemin seviyesindeki platforma azami yükün %125'i uygulanıp 'YUKARI' kumandası çalıştırılarak platformun kalkmadığı (yukarı eğime izin verilir) doğrulandı mı? Bu test, dinamik testte yük sınırlama ayarı değiştirilmeden yapıldı mı?", "ref": "TS EN 1756-1 Ek H.6 / md.5.16.1"}, {"row": 66, "no": "C39", "t": "Test sonrası fonksiyon ve güvenlik kontrolü", "d": "Statik ve dinamik testlerden sonra tüm işlevlerin ve tüm güvenlik cihazlarının çalışması yeniden doğrulandı mı (boru kırma valfi, sigorta gibi sıfırlanamayan cihazlar hariç)? Test sonrası hidrolik sızıntı, yapısal deformasyon, çatlak, halat/zincir ve bağlantı gevşemesi kontrolü yapıldı mı? Diğer hız ölçümleri yüksüz yapıldı mı?", "ref": "TS EN 1756-1 Ek H.5 / md.5.14.3"}, {"row": 67, "no": "C40", "t": "Kişi taşıma amaçlıysa TS EN 1756-2", "d": "Ekipman platformda kişi/engelli taşıma amaçlı ise TS EN 1756-2 hükümlerinin de uygulandığı (ilgili ek kontrol ve testlerin yapıldığı) enspektör tarafından değerlendirildi ve rapora yansıtıldı mı?", "ref": "TS EN 1756-2"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 69, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 70, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 71, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 72, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 73, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 74, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 76, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 77, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 79, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 80, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 81, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 82, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 83, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 84, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 85, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 86, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 87, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 88, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 89, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 90, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 91, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 1756-1 — Kuyruk asansörleri — Tekerlekli araçlara montaj için platform asansörleri — Güvenlik gereklilikleri — Bölüm 1: Mallar için kuyruk asansörleri"], ["Standart 2", "TS EN 1756-2 — Kuyruk asansörleri — Tekerlekli araçlara montaj için platform asansörleri — Güvenlik gereklilikleri — Bölüm 2: Yolcular için kuyruk asansörleri"], ["Yük / fonksiyon testi notu", "Yük testleri TS EN 1756-1 Ek H'ye göredir: statik deformasyon (H.3.1) ve sürüklenme (H.3.2) testleri azami yükün %125'i ile (sürüklenme için 15 dakika; dikey sapma en çok 15 mm, açısal sapma en çok 2°), dinamik test (H.4) azami yükün %100'ü ile, aşırı yük kaldırmama testi (H.6) zeminde %125 yük ve 'YUKARI' kumandası ile yapılır; ardından H.5'e göre tüm işlevler ve güvenlik cihazları doğrulanır (indirme/yatırma hızları azami yükle, diğer hızlar yüksüz ölçülür). Yönetmelik Ek-III 2.2.1'deki statik 1,25 katsayısı standartla uyumludur; dinamik testte standart (H.4) aksini öngördüğünden 1,1 yerine %100 yük esas alınır (yönetmelikteki 'standartta aksi yoksa' ifadesi gereği)."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "Metinde Ek B'nin alt madde numaraları (B.2.4, B.2.5, B.2.6, B.4.3) ve Ek D/Ek C ayrıntıları metinden doğrulanamadığı için yalnız 'Ek B' olarak anıldı. TS EN 1756-2 metni yok; ilgili madde numarası verilmedi ve sayısal değer yazılmadı. Halat/zincir çalışma katsayıları ve statik yük katsayıları (5.12) periyodik kontrolde ölçülemez; imalatçı dokümanından doğrulama maddesi olarak yazıldı. Hortum patlama basıncı 4 kat ifadesi metinde 'hortumun maruz kalabileceği maksimum basıncın' 4 katıdır (19_Kuyruktan kaldırıcı klasöründeki EN_1756-1 kontrol listesinde 'çalışma basıncı' yazılıdır; düzeltilmesi önerilir). Aynı kontrol listesindeki 'H.5 – yüksüz düşey hız ölçümü' satırı standarda aykırıdır: H.5'e göre indirme ve yatırma hızı azami yükle ölçülür. Metinde Yönetmelik 2.2.1.2 kapsamına dair bir hüküm yok."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B8"], ["A8", "A9"], [], ["A4", "A12", "A13", "B4", "B5", "B6"], ["B1", "B2", "B3"], ["C8", "C34", "C /* Yerel: IndexedDB (yoksa bellek). Bulut: claude db, kişiye özel data/users/<id>/ alanı. Her kayıt önce yerele yazılır. */
const Local = (()=>{
  let dbp=null; const mem={audits:new Map(),photos:new Map()};
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(res=>{
      try{
        const r=indexedDB.open("tanik-saha",1);
        r.onupgradeneeded=()=>{const d=r.result; d.createObjectStore("audits",{keyPath:"id"}); const p=d.createObjectStore("photos",{keyPath:"id"}); p.createIndex("audit","auditId");};
        r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null);
      }catch(e){res(null)}
    });
    return dbp;
  }
  function tx(store,mode,fn){
    return open().then(d=>new Promise((res)=>{
      if(!d){ res(fn(null)); return; }
      try{ const t=d.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>res(null); }catch(e){ res(null); }
    }));
  }
  return {
    async all(){ const d=await open(); if(!d) return [...mem.audits.values()];
      return new Promise(res=>{ try{ const r=d.transaction("audits").objectStore("audits").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]);}catch(e){res([])} }); },
    async put(a){ const d=await open(); if(!d){mem.audits.set(a.id,a);return;} await tx("audits","readwrite",s=>s.put(a)); },
    async del(id){ const d=await open(); if(!d){mem.audits.delete(id);return;} await tx("audits","readwrite",s=>s.delete(id)); },
    async photos(auditId){ const d=await open(); if(!d) return [...mem.photos.values()].filter(p=>p.auditId===auditId);
      return new Promise(res=>{ try{ const r=d.transaction("photos").objectStore("photos").index("audit").getAll(auditId); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]);}catch(e){res([])} }); },
    async putPhoto(p){ const d=await open(); if(!d){mem.photos.set(p.id,p);return;} await tx("photos","readwrite",s=>s.put(p)); },
    async delPhoto(id){ const d=await open(); if(!d){mem.photos.delete(id);return;} await tx("photos","readwrite",s=>s.delete(id)); }
  };
})();

const Cloud = { db:null, uid:null, ok:false, chains:{} };
function cloudAudits(){ return Cloud.db.collection("data/users/"+Cloud.uid); }
function cloudPhotos(auditId){ return Cloud.db.doc("data/users/"+Cloud.uid+"/"+auditId).collection("photos"); }
function serial(key,fn){ const p=(Cloud.chains[key]||Promise.resolve()).then(fn,fn); Cloud.chains[key]=p.catch(()=>{}); return p; }
function cloudFail(e){
  if(e && (e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted"||e.code==="capability_disabled"||e.code==="capability_removed")){
    Cloud.ok=false; toast("Hesap senkronu kullanılamıyor; kayıtlar bu cihazda tutuluyor."); renderChip();
  } else if(e && e.code==="quota_exceeded"){ toast("Bulut depolama dolu. Eski denetimleri silin; kayıt cihazda duruyor."); }
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id();
    if(!id) return;
    if(typeof user.can==="function"){ const w=await user.can("data.write"); if(w===false) return; }
    Cloud.db=db; Cloud.uid=id; Cloud.ok=true;
  }catch(e){ Cloud.ok=false; }
}

const Store = {
  async list(){
    const loc=await Local.all(); const map=new Map(loc.map(a=>[a.id,a]));
    if(Cloud.ok){
      try{
        const snap=await cloudAudits().get();
        for(const d of snap.docs){ const a=d.data(); if(!a||!a.id) continue; const l=map.get(a.id);
          if(!l||(a.updatedAt||0)>(l.updatedAt||0)){ const c=JSON.parse(JSON.stringify(a)); map.set(a.id,c); Local.put(c); }
          else if(l && (l.updatedAt||0)>(a.updatedAt||0)){ Store.pushCloud(l); }
        }
        for(const l of loc){ if(!snap.docs.some(d=>d.id===l.id) && !l.deleted) Store.pushCloud(l); }
      }catch(e){ cloudFail(e); }
    }
    return [...map.values()].filter(a=>!a.deleted).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  },
  pushCloud(a){
    if(!Cloud.ok) return Promise.resolve(false);
    return serial("a:"+a.id,()=>cloudAudits().doc(a.id).set(JSON.parse(JSON.stringify(a)))).then(()=>true,e=>{cloudFail(e);return false;});
  },
  async save(a){ await Local.put(a); return Store.pushCloud(a); },
  async remove(a){
    await Local.del(a.id);
    const ph=await Store.photos(a.id); for(const p of ph) await Store.delPhoto(p);
    if(Cloud.ok){ try{ await serial("a:"+a.id,()=>cloudAudits().doc(a.id).delete()); }catch(e){cloudFail(e);} }
  },
  async photos(auditId){
    const loc=await Local.photos(auditId); const map=new Map(loc.map(p=>[p.id,p]));
    if(Cloud.ok){
      try{ const snap=await cloudPhotos(auditId).get();
        for(const d of snap.docs){ const p=d.data(); if(p&&p.id&&!map.has(p.id)){ const c=Object.assign({},p); map.set(p.id,c); Local.putPhoto(c);} }
        const ids=new Set(snap.docs.map(d=>d.id)); for(const l of loc){ if(!ids.has(l.id)) Store.pushPhoto(l); }
      }catch(e){ cloudFail(e); }
    }
    return [...map.values()].sort((a,b)=>a.at-b.at);
  },
  pushPhoto(p){ if(!Cloud.ok) return Promise.resolve(false); return serial("p:"+p.id,()=>cloudPhotos(p.auditId).doc(p.id).set(Object.assign({},p))).then(()=>true,e=>{cloudFail(e);return false;}); },
  async putPhoto(p){ await Local.putPhoto(p); return Store.pushPhoto(p); },
  async delPhoto(p){ await Local.delPhoto(p.id); if(Cloud.ok){ try{ await serial("p:"+p.id,()=>cloudPhotos(p.auditId).doc(p.id).delete()); }catch(e){cloudFail(e);} } }
};

let photoTarget=null;
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const M=1400; if(Math.max(w,h)>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      let q=.72, d=cv.toDataURL("image/jpeg",q); while(d.length>230000 && q>.3){ q-=.1; d=cv.toDataURL("image/jpeg",q); }
      if(d.length>230000){ const c2=document.createElement("canvas"); c2.width=Math.round(w*.7); c2.height=Math.round(h*.7); c2.getContext("2d").drawImage(cv,0,0,c2.width,c2.height); d=c2.toDataURL("image/jpeg",.6); }
      res(d); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("okunamadı"));}; img.src=url;
  });
}
async function onPhotos(files){
  const no=photoTarget; if(!no||!S.cur) return; let n=0;
  for(const file of files){ try{ const data=await compress(file); const p={id:"p"+uid(),auditId:S.cur.id,itemNo:no,data,caption:"",at:Date.now()}; S.photos.push(p); Store.putPhoto(p); n++; }catch(e){ toast("Fotoğraf okunamadı. JPEG veya PNG seçin."); } }
  if(n){ const st=S.cur.items[no]||(S.cur.items[no]={}); st.at=st.at||Date.now(); touch(); repaintItem(no); toast(n+" fotoğraf "+no+" maddesine eklendi"); }

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function ensureExcel(){ if(window.ExcelJS) return; if(PWA){ await loadScript("exceljs.min.js"); return; } try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"); }catch(e){ await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"); } }
function b64buf(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
function safeName(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/İ/g,"I").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40); }
async function buildXlsx(a,photos){
  await ensureExcel();
  const f=FORM_BY[a.code]; const wb=new ExcelJS.Workbook(); await wb.xlsx.load(b64buf(TPL[a.code]));
  const k=wb.getWorksheet("Kapak ve Özet"), c=wb.getWorksheet("Çeklist");
  f.cover.forEach(x=>{ if(x.row && x.row!==8){ const v=a.cover[x.row]; if(v) k.getCell("C"+x.row).value=DATE_ROWS[x.row]?isoToTr(v):v; } });
  const pc={}; photos.forEach(p=>pc[p.itemNo]=(pc[p.itemNo]||0)+1);
  allItems(f).forEach(it=>{ const st=a.items[it.no]||{}; if(st.v) c.getCell("E"+it.row).value=st.v; let note=st.note||""; if(pc[it.no]) note+=(note?" ":"")+"[Foto: "+pc[it.no]+" adet – Fotoğraflar sayfası]"; if(note) c.getCell("G"+it.row).value=note; });
  if(a.kanaat) k.getCell("B42").value=a.kanaat;
  if(a.sonuc) k.getCell("C48").value=a.sonuc;
  if(a.tanik) k.getCell("C49").value=a.tanik;
  const ens=a.enspImza||a.cover[14]; if(ens) k.getCell("C50").value=ens;
  // özet formüllerinin sonuçları (Excel açılışta yeniden hesaplar)
  const cn=counts(a); const secIds=f.sections.map(s=>s.id);
  const put=(addr,res)=>{ const cell=k.getCell(addr); const fm=cell.formula; if(fm) cell.value={formula:fm,result:res}; };
  secIds.forEach((sid,i)=>{ const r=32+i, b=cn.bySec[sid]; put("C"+r,b.U); put("D"+r,b.UD); put("E"+r,b.G); put("F"+r,b.KD); });
  put("C37",cn.U); put("D37",cn.UD); put("E37",cn.G); put("F37",cn.KD); put("C38",cn.total); put("D38",cn.empty); put("C39",cn.ratio===null?"-":cn.ratio);
  if(photos.length){
    const ws=wb.addWorksheet("Fotoğraflar");
    ws.columns=[{header:"Madde",key:"no",width:9},{header:"Tarih / Saat",key:"t",width:18},{header:"Açıklama",key:"c",width:34},{header:"Fotoğraf",key:"p",width:48}];
    ws.getRow(1).font={bold:true};
    for(let i=0;i<photos.length;i++){ const p=photos[i], r=i+2;
      ws.getRow(r).values=[p.itemNo,fmtDate(p.at)+" "+fmtTime(p.at),p.caption||"",""]; ws.getRow(r).height=190; ws.getRow(r).alignment={vertical:"top",wrapText:true};
      const im=new Image(); im.src=p.data; try{ await im.decode(); }catch(e){}
      const ratio=(im.naturalWidth&&im.naturalHeight)?im.naturalWidth/im.naturalHeight:4/3;
      let hgt=240, wdt=hgt*ratio; if(wdt>330){ wdt=330; hgt=wdt/ratio; }
      const id=wb.addImage({base64:p.data,extension:"jpeg"});
      ws.addImage(id,{tl:{col:3,row:r-1},ext:{width:Math.round(wdt),height:Math.round(hgt)},editAs:"oneCell"}); }
  }
  wb.calcProperties.fullCalcOnLoad=true;
  return wb.xlsx.writeBuffer();
}
const MIME={xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",json:"application/json"};
function shareSheet(filename,data){
  const ext=filename.split(".").pop(); const blob=data instanceof Blob?new Blob([data],{type:MIME[ext]||"application/octet-stream"}):new Blob([data],{type:MIME[ext]||"text/plain"});
  const file=new File([blob],filename,{type:blob.type});
  const kb=blob.size>1048576?(blob.size/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(blob.size/1024))+" KB";
  const v=document.createElement("div"); v.className="sheet-back";
  v.innerHTML=`<div class="sheet" role="dialog" aria-label="Dosya hazır"><b>Dosya hazır</b><span class="fname">${esc(filename)}</span><span class="muted num">${kb}</span><button class="btn primary" data-sh="go">${ICON.up}Paylaş / Dosyalara kaydet</button><button class="btn" data-sh="x">Kapat</button></div>`;
  document.body.appendChild(v);
  v.addEventListener("click",async e=>{ const b=e.target.closest("[data-sh]"); if(e.target===v||(b&&b.dataset.sh==="x")){ v.remove(); return; } if(!b) return;
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); v.remove(); return; } }catch(err){ if(err&&err.name==="AbortError") return; }
    const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000); v.remove(); toast("İndirildi: "+filename); });
}
async function saveFile(filename,data){
  if(PWA){ shareSheet(filename,data); return; }
  if(!S.downloads){ toast("Dosya indirme bu görünümde kullanılamıyor."); return; }
  try{ await S.downloads.save({filename,data}); toast("Dosya hazır: "+filename); }
  catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited"){ toast("Önceki indirme onayı hâlâ açık."); return; } toast("Dosya kaydedilemedi ("+(e&&e.code||"hata")+")."); }
}

/* ================= F701-056 raporu ================= */
function rep(a){ if(!a.rep) a.rep={rows:{}}; if(!a.rep.rows) a.rep.rows={}; return a.rep; }
function secRange(nos){
  const by={}; nos.forEach(n=>{ const L=n[0], k=+n.slice(1); (by[L]=by[L]||[]).push(k); });
  return Object.keys(by).map(L=>{ const v=by[L].sort((x,y)=>x-y); let out=[],i=0; while(i<v.length){ let j=i; while(j+1<v.length&&v[j+1]===v[j]+1) j++; out.push(j-i>=2?L+v[i]+"–"+L+v[j]:v.slice(i,j+1).map(x=>L+x).join(", ")); i=j+1; } return out.join(", "); }).join(", ");
}
const ST_LABEL={U:"U",UD:"UD",G:"G",KD:"KD"};
function autoRow(a,i){
  const f=FORM_BY[a.code]; const nos=f.map[i]||[];
  const sts=nos.map(n=>{const x=a.items[n]||{}; return {no:n,v:x.v||"",note:(x.note||"").trim()};});
  let s="";
  if(sts.some(x=>x.v==="UD")) s="YD"; else if(sts.some(x=>x.v==="U") && sts.every(x=>x.v)) s="Y"; else if(sts.length&&sts.every(x=>x.v==="KD")) s="UD";
  if(!nos.length){
    if(i===4) return {s:"UD",c:"Periyodik kontrolde her ekipman tek tek muayene edildiğinden numune alma uygulanmamaktadır."};
    return {s:"",c:""};
  }
  const done=sts.filter(x=>x.v);
  let head;
  if(!done.length) head="Çeklist "+secRange(nos)+": tanık denetimi sırasında henüz değerlendirilmedi.";
  else if(done.every(x=>x.v==="G")&&done.length===sts.length) head="Çeklist "+secRange(nos)+": tanık denetimi sırasında gözlenmedi (G).";
  else if(nos.length>6){ const c={U:0,UD:0,G:0,KD:0}; done.forEach(x=>c[x.v]++); const e=sts.length-done.length;
    head="Çeklist "+secRange(nos)+" ("+nos.length+" madde): "+[c.U+" U",c.UD+" UD",c.G+" G",c.KD+" KD"].join(", ")+(e?", "+e+" değerlendirilmemiş":"")+"."; }
  else head="Çeklist: "+sts.map(x=>x.no+" "+(x.v||"–")).join(", ")+".";
  const notes=sts.filter(x=>x.note||x.v==="UD").map(x=>x.no+(x.v==="UD"?" (uygun değil)":x.v==="KD"?" (kapsam dışı)":"")+": "+(x.note||"bulgu notu girilmedi"));
  const pre = s==="YD" ? "YD gerekçesi – " : "";
  return {s, c: head + (notes.length? "\n"+pre+notes.join("\n"):"")};
}
function effRow(a,i){ const r=rep(a).rows[i]||{}; const au=autoRow(a,i); return {s:r.s||au.s, c:(r.c!==undefined&&r.c!==null)?r.c:au.c, auto:au, sEdited:!!r.s, cEdited:(r.c!==undefined&&r.c!==null)}; }
function autoGenel(a){
  const f=FORM_BY[a.code], c=counts(a); const parts=[];
  if(a.kanaat) parts.push(a.kanaat.trim());
  const lab={D8:"Muayene süresinin gerçeğe uygunluğu",E12:"Bulguların müşteriye iletilmesi",E13:"Gizlilik ve rapor teslimi"};

  const ratio=c.ratio===null?"–":"%"+(c.ratio*100).toFixed(1).replace(".",",");

  if(a.sonuc) parts.push("Tanık denetim sonucu: "+a.sonuc+".");
  return parts.join("\n");
}
function autoAlan(a){ const f=FORM_BY[a.code]; const eq=[a.cover[21],a.cover[22]].filter(Boolean).join(", "); return "Kaldırma ve iletme ekipmanları – "+f.name+" ("+f.code+")\nPeriyodik kontrol"+(eq?"\n"+eq:""); }

/* --- Word üretimi (JSZip + OOXML) --- */
async function ensureZip(){ if(window.JSZip) return; if(PWA){ await loadScript("jszip.min.js"); return; } try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"); }catch(e){ await loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"); } }
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main", XMLNS="http://www.w3.org/XML/1998/namespace";
const kids=(n,name)=>[...n.childNodes].filter(x=>x.nodeType===1&&x.localName===name);
function wEl(doc,name,attrs){ const e=doc.createElementNS(WNS,"w:"+name); if(attrs) for(const k in attrs) e.setAttributeNS(WNS,"w:"+k,attrs[k]); return e; }
function wRun(doc,text,o={}){
  const r=wEl(doc,"r"), p=wEl(doc,"rPr");
  p.appendChild(wEl(doc,"rFonts",{ascii:"Calibri Light",hAnsi:"Calibri Light",cs:"Calibri Light"}));
  if(o.b) p.appendChild(wEl(doc,"b")); p.appendChild(wEl(doc,"sz",{val:String(o.sz||18)})); p.appendChild(wEl(doc,"szCs",{val:String(o.sz||18)})); p.appendChild(wEl(doc,"lang",{val:"tr-TR"}));
  r.appendChild(p);
  String(text).split("\n").forEach((ln,i)=>{ if(i) r.appendChild(wEl(doc,"br")); const t=wEl(doc,"t"); t.setAttributeNS(XMLNS,"xml:space","preserve"); t.textContent=ln; r.appendChild(t); });
  return r;
}
function setCell(doc,tc,text,o={}){
  const ps=kids(tc,"p"); const ppr=ps[0]&&kids(ps[0],"pPr")[0]; ps.forEach(p=>tc.removeChild(p));
  const lines=String(text||"").split("\n"); 
  lines.forEach(ln=>{ const p=wEl(doc,"p"); if(ppr){ const c=ppr.cloneNode(true); kids(c,"rPr").forEach(x=>c.removeChild(x)); if(o.center){ kids(c,"jc").forEach(x=>c.removeChild(x)); c.appendChild(wEl(doc,"jc",{val:"center"})); } p.appendChild(c);} else if(o.center){ const c=wEl(doc,"pPr"); c.appendChild(wEl(doc,"jc",{val:"center"})); p.appendChild(c);} if(ln) p.appendChild(wRun(doc,ln,o)); tc.appendChild(p); });
}
function appendTo(doc,p,text,o={}){ if(p&&text) p.appendChild(wRun(doc," "+text,o)); }
function cellAt(tbl,r,c){ const tr=kids(tbl,"tr")[r]; return tr&&kids(tr,"tc")[c]; }
async function buildDocx(a){
  await ensureZip();
  const zip=await JSZip.loadAsync(b64buf(REPORT_DOCX));
  const parse=async path=>new DOMParser().parseFromString(await zip.file(path).async("string"),"application/xml");
  const ser=d=>{ let x=new XMLSerializer().serializeToString(d); if(!/^<\?xml/.test(x)) x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+x; return x; };
  const doc=await parse("word/document.xml"); const T=[...doc.getElementsByTagNameNS(WNS,"tbl")];
  const r=rep(a);
  // Kuruluş / tarih / no
  appendTo(doc,kids(cellAt(T[1],0,0),"p")[0],a.cover[7]||"",{b:false,sz:20});
  appendTo(doc,kids(cellAt(T[1],1,0),"p")[0],isoToTr(a.cover[9]),{sz:20});
  appendTo(doc,kids(cellAt(T[1],1,1),"p")[0],repVal(a,"denetimNo"),{sz:20});
  const adr=kids(cellAt(T[2],0,0),"p"); if(a.cover[10]) (adr[1]||adr[0]).appendChild(wRun(doc,a.cover[10],{sz:20}));
  // tanık olunan
  setCell(doc,cellAt(T[3],2,0),repVal(a,"alan"),{sz:18});
  setCell(doc,cellAt(T[3],2,1),r.kapsamGen?"☒":"☐",{center:true,sz:22});
  setCell(doc,cellAt(T[3],2,2),a.cover[14]||"",{sz:18});
  setCell(doc,cellAt(T[3],2,3),repVal(a,"std"),{sz:18});
  // 15 kriter
  CRITERIA.forEach((_,i)=>{ const e=effRow(a,i); setCell(doc,cellAt(T[4],i+1,2),e.s,{center:true,b:true,sz:20}); setCell(doc,cellAt(T[4],i+1,3),e.c,{sz:16}); });
  setCell(doc,cellAt(T[4],16,1),repVal(a,"genel"),{sz:17});
  // imzalar
  const sig=(tc,name,date)=>{ const ps=kids(tc,"p"); if(ps[3]) ps[3].appendChild(wRun(doc,name,{sz:20})); else appendTo(doc,ps[2],name,{sz:20}); appendTo(doc,ps[6],date,{sz:20}); };
  const dt=isoToTr(repVal(a,"tarih"));
  sig(cellAt(T[5],0,1),repVal(a,"teknik"),dt); sig(cellAt(T[5],0,2),repVal(a,"lider"),dt);
  zip.file("word/document.xml",ser(doc));
  // üstbilgi: Dosya No AB - xxxx - Y
  const dn=(repVal(a,"dosyaNo")||"").trim();
  if(dn){ const h=await parse("word/header1.xml"); const tcs=[...h.getElementsByTagNameNS(WNS,"tc")];
    const m=dn.match(/^(?:AB\s*-?\s*)?([0-9A-Za-z]+)\s*-\s*([A-Za-zÇĞİÖŞÜçğıöşü0-9]+)$/);
    if(tcs.length>=4){ if(m){ setCell(h,tcs[2],m[1],{sz:20}); setCell(h,tcs[3],"- "+m[2],{sz:20}); } else { setCell(h,tcs[1],"",{}); setCell(h,tcs[2],dn,{sz:20}); setCell(h,tcs[3],"",{}); } }
    zip.file("word/header1.xml",ser(h)); }
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
async function exportDocx(){
  const a=S.cur; await flush(); const btn=$("#docBtn"); if(btn){btn.disabled=true; btn.lastChild.textContent="Rapor hazırlanıyor…";}
  try{ const blob=await buildDocx(a); const f=FORM_BY[a.code];
    const name=["F701-056",f.code,safeName(a.cover[14]),isoToTr(a.cover[9]).replace(/\./g,"")].filter(Boolean).join("_")+".docx";
    await saveFile(name,blob);
  }catch(e){ console.error(e); toast("Rapor oluşturulamadı. İnternet bağlantısını kontrol edip tekrar deneyin."); }
  if(btn){btn.disabled=false; btn.lastChild.textContent="F701-056 raporunu indir (Word)";}
}


/* ================= kapak bilgilerini kopyalama ================= */
const COPY_GROUPS=[
  {id:"den",title:"Denetim bilgileri",fields:[7,9,10,11].map(r=>({k:"c"+r,row:r}))},
  {id:"ens",title:"Denetlenen enspektör",fields:[14,15,16,17].map(r=>({k:"c"+r,row:r}))},
  {id:"rap",title:"Rapor başlığı ve imzalar (F701-056)",fields:[{k:"r:dosyaNo",label:"Dosya No"},{k:"r:denetimNo",label:"Denetim No"},{k:"t:tanik",label:"Tanık denetçisi"},{k:"r:lider",label:"Ekip lideri / denetçi"}]}
];
const ALL_FIELDS=COPY_GROUPS.flatMap(g=>g.fields);
function fLabel(f){ if(f.row){ const x=FORMS[0].cover.find(c=>c.row===f.row); return x?x.label:""; } return f.label; }
function fGet(a,f,raw){ if(f.row) return a.cover[f.row]||""; const [t,k]=f.k.split(":"); if(t==="t") return a[k]||""; const r=rep(a); if(raw) return r[k]||""; return (k==="lider")?(r[k]||""):(r[k]||""); }
function fSet(a,f,v){ if(f.row) a.cover[f.row]=v; else { const [t,k]=f.k.split(":"); if(t==="t") a[k]=v; else rep(a)[k]=v; } }
function fShow(f,v){ return f.row&&DATE_ROWS[f.row]?isoToTr(v):v; }
function copyInto(src,dst,keys,overwrite){ let n=0; ALL_FIELDS.forEach(f=>{ if(!keys.has(f.k)) return; const v=fGet(src,f); if(!v) return; const cur=fGet(dst,f,true); if(cur===v || (cur && !overwrite)) return; fSet(dst,f,v); n++; }); if(n) dst.updatedAt=Date.now(); return n; }
function auditLine(a){ const f=FORM_BY[a.code]; return `<b>${esc(f.code)}</b> ${esc(f.name)}<br><span class="num">${[a.cover[14],a.cover[10],isoToTr(a.cover[9])||fmtDate(a.createdAt)].filter(Boolean).map(esc).join(" · ")}</span>`; }
function othersOf(a){ return S.audits.filter(x=>x.id!==a.id && FORM_BY[x.code]).sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0)); }
function coverEmpty(a){ return ![7,10,11,14,15,16].some(r=>(a.cover[r]||"").trim()); }

function fieldsHTML(src,keys){
  return COPY_GROUPS.map(g=>{ const avail=g.fields.filter(f=>fGet(src,f)); const allOn=avail.length&&avail.every(f=>keys.has(f.k));
    return `<h3>${esc(g.title)}</h3><label class="chk grp${avail.length?"":" off"}"><input type="checkbox" data-cg="${g.id}" ${allOn?"checked":""} ${avail.length?"":"disabled"}><span class="l">Tümünü seç</span></label>`+
      g.fields.map(f=>{ const v=fGet(src,f); return `<label class="chk${v?"":" off"}"><input type="checkbox" data-cf="${f.k}" ${v&&keys.has(f.k)?"checked":""} ${v?"":"disabled"}><span class="l">${esc(fLabel(f))}</span><span class="v">${v?esc(fShow(f,v)):"boş"}</span></label>`; }).join(""); }).join("");
}
function openSheet(html){ const v=document.createElement("div"); v.className="sheet-back"; v.innerHTML=`<div class="sheet tall" role="dialog">${html}</div>`; document.body.appendChild(v); return v; }

async function openCopyOut(){
  await flush(); S.audits=await Store.list(); const a=S.audits.find(x=>x.id===S.cur.id)||S.cur;
  const others=othersOf(a); const keys=new Set(ALL_FIELDS.filter(f=>fGet(a,f)).map(f=>f.k)); const targets=new Set(); const newForms=new Set(); let over=false;
  const v=openSheet(""); const sh=v.firstElementChild;
  const draw=()=>{ sh.innerHTML=`<b>Bilgileri diğer denetimlere kopyala</b><span class="muted" style="font-size:13.5px">Kaynak: ${auditLine(a)}</span>
    ${fieldsHTML(a,keys)}
    <h3>Mevcut denetimler</h3>${others.length?others.map(o=>`<label class="chk"><input type="checkbox" data-tg="${o.id}" ${targets.has(o.id)?"checked":""}><span class="l">${auditLine(o)}</span></label>`).join(""):`<p class="hint" style="margin:4px 0">Başka kayıtlı denetim yok.</p>`}
    <h3>Yeni denetim başlat</h3><p class="hint" style="margin:2px 0">Seçilen ekipmanlar için bu bilgilerle yeni denetim açılır.</p>
    <div class="chips">${FORMS.map(f=>`<button data-nf="${esc(f.code)}" aria-pressed="${newForms.has(f.code)}">${esc(f.code)} ${esc(f.name.replace(/\s*\(.*\)/,""))}</button>`).join("")}</div>
    <h3>Seçenek</h3><label class="chk"><input type="checkbox" data-ov ${over?"checked":""}><span class="l">Dolu alanların üzerine yaz</span><span class="v">İşaretli değilse hedefte yalnızca boş alanlar doldurulur.</span></label>
    <div class="btns"><button class="btn" data-x>Vazgeç</button><button class="btn primary" data-go>Kopyala${targets.size+newForms.size?" ("+(targets.size+newForms.size)+")":""}</button></div>`; };
  draw();
  v.addEventListener("change",e=>{ const el=e.target, d=el.dataset;
    if(d.cf){ el.checked?keys.add(d.cf):keys.delete(d.cf); }
    else if(d.cg){ COPY_GROUPS.find(g=>g.id===d.cg).fields.forEach(f=>{ if(fGet(a,f)) el.checked?keys.add(f.k):keys.delete(f.k); }); }
    else if(d.tg){ el.checked?targets.add(d.tg):targets.delete(d.tg); }
    else if(d.ov!==undefined){ over=el.checked; }
    const y=sh.scrollTop; draw(); sh.scrollTop=y; });
  v.addEventListener("click",async e=>{ if(e.target===v){ v.remove(); return; } const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
    if(d.x!==undefined){ v.remove(); return; }
    if(d.nf){ newForms.has(d.nf)?newForms.delete(d.nf):newForms.add(d.nf); const y=sh.scrollTop; draw(); sh.scrollTop=y; return; }
    if(d.go!==undefined){
      if(!keys.size){ toast("Kopyalanacak alan seçin."); return; }
      if(!targets.size&&!newForms.size){ toast("Hedef denetim veya yeni ekipman seçin."); return; }
      let changed=0, made=0;
      for(const id of targets){ const o=S.audits.find(x=>x.id===id); if(o && copyInto(a,o,keys,over)){ await Store.save(o); changed++; } }
      for(const code of newForms){ const n=newAudit(code); copyInto(a,n,keys,true); await Store.save(n); made++; }
      S.audits=await Store.list(); v.remove();
      toast([changed?changed+" denetim güncellendi":"", made?made+" yeni denetim açıldı":"", (!changed&&!made)?"Değişen alan olmadı":""].filter(Boolean).join(", "));
    } });
}

async function openCopyIn(srcId){
  await flush(); S.audits=await Store.list(); const a=S.audits.find(x=>x.id===S.cur.id)||S.cur; S.cur=a;
  const others=othersOf(a); if(!others.length){ toast("Bilgi alınabilecek başka denetim yok."); return; }
  let src=others.find(o=>o.id===srcId)||others[0]; let keys=new Set(ALL_FIELDS.filter(f=>fGet(src,f)).map(f=>f.k)); let over=false;
  const v=openSheet(""); const sh=v.firstElementChild;
  const draw=()=>{ sh.innerHTML=`<b>Başka denetimden bilgi al</b>
    <h3>Kaynak denetim</h3>${others.map(o=>`<label class="chk"><input type="radio" name="srcA" data-src="${o.id}" ${o.id===src.id?"checked":""}><span class="l">${auditLine(o)}</span></label>`).join("")}
    ${fieldsHTML(src,keys)}
    <h3>Seçenek</h3><label class="chk"><input type="checkbox" data-ov ${over?"checked":""}><span class="l">Bu denetimdeki dolu alanların üzerine yaz</span><span class="v">İşaretli değilse yalnızca boş alanlar doldurulur.</span></label>
    <div class="btns"><button class="btn" data-x>Vazgeç</button><button class="btn primary" data-go>Bilgileri al</button></div>`; };
  draw();
  v.addEventListener("change",e=>{ const el=e.target, d=el.dataset;
    if(d.src){ src=others.find(o=>o.id===d.src); keys=new Set(ALL_FIELDS.filter(f=>fGet(src,f)).map(f=>f.k)); }
    else if(d.cf){ el.checked?keys.add(d.cf):keys.delete(d.cf); }
    else if(d.cg){ COPY_GROUPS.find(g=>g.id===d.cg).fields.forEach(f=>{ if(fGet(src,f)) el.checked?keys.add(f.k):keys.delete(f.k); }); }
    else if(d.ov!==undefined){ over=el.checked; }
    const y=sh.scrollTop; draw(); sh.scrollTop=y; });
  v.addEventListener("click",e=>{ if(e.target===v){ v.remove(); return; } const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.x!==undefined){ v.remove(); return; }
    if(b.dataset.go!==undefined){ if(!keys.size){ toast("Alınacak alan seçin."); return; } const n=copyInto(src,S.cur,keys,over); v.remove(); if(n){ touch(); renderTab(); } toast(n?n+" alan dolduruldu":"Değişen alan olmadı (dolu alanlar korunuyor)"); } });
}
function quickCopyIn(){ const a=S.cur; const o=othersOf(a)[0]; if(!o) return; const n=copyInto(o,a,new Set(ALL_FIELDS.map(f=>f.k)),false); if(n){ touch(); } renderTab(); toast(n?n+" alan "+FORM_BY[o.code].code+" denetiminden alındı":"Alınacak yeni bilgi yok"); }

/* ================= olaylar ================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if(d.new){ const a=newAudit(d.new); S.audits.unshift(a); S.tab="cover"; Store.save(a); openAudit(a); return; }
  if(d.open){ const a=S.audits.find(x=>x.id===d.open); if(a){ S.tab="list"; S.filter="all"; openAudit(a);} return; }
  if(t.id==="backBtn"){ await flush(); S.cur=null; S.audits=await Store.list(); renderHome(); window.scrollTo(0,0); return; }
  if(d.tab){ setTab(d.tab); return; }
  if(t.id==="searchToggle"){ S.searchOpen=!S.searchOpen; if(!S.searchOpen) S.q=""; renderTab(); if(S.searchOpen){ const i=$("#listQ"); if(i) i.focus(); } return; }
  if(t.id==="listQClear"){ S.q=""; const i=$("#listQ"); if(i){ i.value=""; i.focus(); } $("#itemsBox").innerHTML=itemsBodyHTML(); paintListCount(); t.remove(); return; }
  if(t.id==="homeQClear"){ S.hq=""; S.hopen={}; const i=$("#homeQ"); if(i){ i.value=""; i.focus(); } paintHomeRes(); t.remove(); return; }
  if(d.sr){ S.hopen[d.sr]=!S.hopen[d.sr]; paintHomeRes(); return; }
  if(d.set){ const no=t.closest(".item").dataset.no; const st=S.cur.items[no]||(S.cur.items[no]={}); st.v=(st.v===d.set)?"":d.set; st.at=Date.now(); if(!st.v&&!st.note) delete S.cur.items[no]; touch(); repaintItem(no);
    if(st.v==="UD"||st.v==="KD"){ const n=document.getElementById("note-"+no); if(n&&!n.value) n.focus({preventScroll:true}); } return; }
  if(d.exp){ const cur=document.querySelector("#it-"+CSS.escape(d.exp)+" .exp"); S.openExp[d.exp]=!(cur&&cur.classList.contains("open")); repaintItem(d.exp); return; }
  if(d.addnote){ S.openNote[d.addnote]=true; repaintItem(d.addnote); const n=document.getElementById("note-"+d.addnote); if(n) n.focus(); return; }
  if(d.addphoto){ photoTarget=d.addphoto; const i=$("#photoInput"); i.value=""; i.click(); return; }
  if(d.photo){ openViewer(d.photo); return; }
  if(d.jump){ const el=document.getElementById("sec-"+d.jump); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(d.goto){ S.filter="all"; setTab("list"); requestAnimationFrame(()=>{ const el=document.getElementById("it-"+d.goto); if(el) el.scrollIntoView({block:"start"}); }); return; }
  if(d.time){ const inp=$("#cv28"); const now=fmtTime(Date.now()); const parts=(inp.value||"").split(/\s*-\s*/); if(d.time==="start") parts[0]=now; else { parts[0]=parts[0]||""; parts[1]=now; } inp.value=parts.filter((x,i)=>i===0||x).join(" - "); S.cur.cover[28]=inp.value; touch(); return; }
  if(d.sonuc){ S.cur.sonuc=(S.cur.sonuc===d.sonuc)?"":d.sonuc; touch(); document.querySelectorAll("[data-sonuc]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sonuc===S.cur.sonuc)); return; }
  if(t.id==="xlsBtn"){ exportXlsx(); return; }
  if(t.id==="copyOut"){ openCopyOut(); return; }
  if(t.id==="copyIn"||t.id==="copyIn2"){ openCopyIn(); return; }
  if(t.id==="quickIn"){ quickCopyIn(); return; }
  if(t.id==="docBtn"){ exportDocx(); return; }
  if(d.rs!==undefined){ const i=+d.rs; const rr=rep(S.cur).rows[i]||(rep(S.cur).rows[i]={}); const au=autoRow(S.cur,i).s; const cur=rr.s||au;
    if(cur===d.v){ rr.s = rr.s ? "" : "-"; } else rr.s = (d.v===au)?"":d.v;
    if(rr.s==="-"){ rr.s=""; }
    touch(); const y=window.scrollY; renderTab(); window.scrollTo(0,y); return; }
  if(d.rreset!==undefined){ const rr=rep(S.cur).rows[+d.rreset]; if(rr) delete rr.c; touch(); const y=window.scrollY; renderTab(); window.scrollTo(0,y); return; }
  if(d.greset){ delete rep(S.cur).genel; touch(); const y=window.scrollY; renderTab(); window.scrollTo(0,y); return; }
  if(t.id==="jsonBtn"){ await flush(); exportJSON([S.cur]); return; }
  if(t.id==="backupAll"){ exportJSON(S.audits); return; }
  if(t.id==="importBtn"){ const i=$("#importInput"); i.value=""; i.click(); return; }
  if(t.id==="delBtn"){ S.confirmDel=true; renderTab(); return; }
  if(t.id==="delNo"){ S.confirmDel=false; renderTab(); return; }
  if(t.id==="delYes"){ const a=S.cur; clearTimeout(saveT); S.cur=null; await Store.remove(a); S.audits=await Store.list(); renderHome(); toast("Denetim silindi"); return; }
});
let qT=null;
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="homeQ"){ S.hq=el.value; clearTimeout(qT); qT=setTimeout(()=>{ paintHomeRes(); const bar=el.parentElement; const has=bar.querySelector(".clr"); if(S.hq&&!has){ bar.insertAdjacentHTML("beforeend",'<button class="clr" id="homeQClear">Temizle</button>'); } else if(!S.hq&&has) has.remove(); },150); return; }
  if(el.id==="listQ"){ S.q=el.value; clearTimeout(qT); qT=setTimeout(()=>{ $("#itemsBox").innerHTML=itemsBodyHTML(); paintListCount(); const bar=el.parentElement; const has=bar.querySelector(".clr"); if(S.q&&!has){ bar.insertAdjacentHTML("beforeend",'<button class="clr" id="listQClear">Temizle</button>'); } else if(!S.q&&has) has.remove(); },150); return; }
  if(!S.cur) return;
  if(el.dataset.cv){ S.cur.cover[el.dataset.cv]=el.value; touch(); }
  else if(el.dataset.note){ const no=el.dataset.note; const st=S.cur.items[no]||(S.cur.items[no]={}); st.note=el.value; if(!st.at) st.at=Date.now(); touch();
    const item=el.closest(".item"); const need=item&&item.querySelector(".need"); if(need&&el.value) need.remove(); }
  else if(el.dataset.top){ S.cur[el.dataset.top]=el.value; touch(); }
  else if(el.dataset.rep){ rep(S.cur)[el.dataset.rep]=el.value; touch(); }
  else if(el.dataset.rc!==undefined){ const rr=rep(S.cur).rows[+el.dataset.rc]||(rep(S.cur).rows[+el.dataset.rc]={}); rr.c=el.value; touch(); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="filterSel"){ S.filter=e.target.value; renderTab(); }
  else if(e.target.dataset && e.target.dataset.repchk){ rep(S.cur)[e.target.dataset.repchk]=e.target.checked; touch(); }
  else if(e.target.id==="photoInput"){ onPhotos([...e.target.files]); }
  else if(e.target.id==="importInput" && e.target.files[0]){ importJSON(e.target.files[0]); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.target.id==="homeQ"||e.target.id==="listQ")){ e.preventDefault(); e.target.blur(); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); else if(S.view==="audit"){ try{ navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){} } });
window.addEventListener("pagehide",()=>{ flush(); });

/* ================= açılış ================= */
async function start(hot){
  if(PWA){ S.downloads={pwa:true}; try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
    if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} } }
  S.audits=await Store.list(); renderHome();
  await initCloud();
  if(!PWA && window.claude && window.claude.use){ try{ S.downloads=await window.claude.use("downloads"); }catch(e){} }
  const fresh=await Store.list(); S.audits=fresh;
  if(hot && hot.auditId){ const a=fresh.find(x=>x.id===hot.auditId); if(a){ S.tab=hot.tab||"list"; openAudit(a); return; } }
  if(S.view==="home") renderHome();
}
try{ window.claude?.hot?.snapshot?.(()=>({auditId:S.cur&&S.cur.id,tab:S.tab})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
