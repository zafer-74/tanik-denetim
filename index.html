uç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 66, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 67, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 68, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 70, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 71, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 72, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 73, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 74, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 75, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 76, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 77, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 78, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 79, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 80, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 81, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 82, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 13157 (EN 13157:2004+A1:2009) — Vinçler — Güvenlik — Elle çalıştırılan vinçler"], ["Standart 2", "EN 818-7 (BS EN 818-7:2002+A1:2008) — Kaldırma amaçlı kısa bağlantı zinciri — Güvenlik — Bölüm 7: İnce toleranslı kaldırma zinciri, Sınıf T (Tip T, DAT ve DT)"], ["Yük / fonksiyon testi notu", "TS EN 13157 md.6.3.2.2: statik test nominal kapasite 20 t altında 1,5 katı, en az 10 dakika; kabul: çatlak/kalıcı deformasyon/hasar yok, bağlantılar gevşememiş, fren yükü kaymadan tutuyor ve statik test sonrası dinamik test yapılabiliyor. Md.6.3.2.3: dinamik test nominal kapasitenin 1,1 katı, en elverişsiz koşullarda tekrarlı durdur-başlat ile; md.6.3.3.1: hafif yük testi (nominal kapasitenin %2-10'u, 250-500 mm yükseklik) ile fren yük tutma kontrolü. Yönetmelik Ek-III md.2.2.1 ile uyumlu olarak elle işletilen palangada statik test katsayısı 1,5 (azami 3 yılda bir veya önemli bakım-onarım sonrası), dinamik 1,1; yıllık kontrolde nominal (işletme) kapasitesi ile yük testi yapılır. Kırılma (4 x) ve dayanıklılık (1500 çevrim, %110) testleri tip/üretim doğrulama testleridir, periyodik kontrolde uygulanmaz."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) Yük zinciri uzama/aşınma için sayısal ıskarta sınırı (ör. %) EN 13157 ve EN 818-7 metinlerinde YOKTUR; EN 818-7 md.9.6 yalnızca üretici talimatında muayene prosedürü/imha kriterleri verilmesini ister (ISO 7592 atfı), md.7.1.1(k) zincir değişim kriterlerini üreticiye bırakır. Bu nedenle ilgili maddelerde üretici kriterine atıf yapıldı (C6). 2) Md.5.1.6'daki el kuvveti alt sınırları (20/40/45 daN) çevirinin pdftotext düzeninden sıra ile eşlendi (a: 1000 kg ve altı, b: 1000-5000 kg, c: 5000 kg ve üzeri); tablo düzeni bozuk olduğundan orijinal EN metniyle teyit önerilir. Ayrıca metinde aşırı yük koruması 'nominal kapasitede 20 daN altındaysa' diye çevrilmiş; orijinalde alt sınırın (kapasiteye göre) altı anlamına gelmesi olası olduğundan C17 ve C21'de bu ihtimal kapsayıcı yazıldı. 3) Statik test süresi (10 dk) ve 1,5 katsayısı standartta imalat/bireysel doğrulama için tanımlıdır; periyodik kontrolde uygulama Yönetmelik Ek-III md.2.2.1'e dayanır. Standartta nominal kapasite 20 t ve üzeri için 1,25 verilse de Yönetmelik elle işletilen ekipmanda 1,5 belirlediğinden 1,5 esas alındı. 4) Kanca ağız açıklığı/aşınma için sayısal sınır metinde yok (kanca standartları Ek A'da yalnızca listelenmiş); üretici/kanca standardı değerine atıf yapıldı. 5) Standartta aşırı yük koruması (sürtünmeli kavrama) zorunlu değil; sadece md.5.1.6 koşuluna bağlı. C25-C30 içerikleri (test sırası, test yükü/askı donanımı, sonuç değerlendirmesi) doğrudan md.6.3.2.2 ve Yönetmelik atfına dayanan uygulama önerileridir. Md.5.1.14 ve 5.1.1 atıfları (C29) bağlama/kombine ünite hükümleridir; 'md.5.1.14' metni el tutma/askı araçlarına ilişkindir."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B9"], ["A8", "A9"], [], ["A4", "A12", "A13", "B3", "B4", "B5", "B6"], ["B1", "B2", "B7"], ["C18", "C19", "C22", "C23", "C24", "C25", "C26", "C27", "C28"], ["A6", "E6"], ["A7", "B8"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30"], ["D1", "B11"], ["D2", "D5", "E3", "E5", "E11", "B10"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.9", "name": "Yükseltilebilen Seyyar İş Platformu", "method": "Kapsam Kodu: 1.A.9   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 280-1:2022 · TS EN 280-2 (BS EN 280-2:2022) · TS ISO 4309", "refTitle": "1.A.9 Yükseltilebilen Seyyar İş Platformu — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.9 – Yükseltilebilen Seyyar İş Platformu"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (makaslı / eklemli bomlu / teleskopik bomlu / araç üstü sepetli)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Beyan (anma) yükü (kg) - İzin verilen kişi sayısı"}, {"row": 24, "label": "Azami platform (çalışma) yüksekliği (m) - Yatay erişim (m)"}, {"row": 25, "label": "Grup (A/B) - Tip (1/2/3) - Güç kaynağı - İzin verilen azami eğim ve rüzgâr hızı"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.9 Yükseltilebilen Seyyar İş Platformu) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Sertifikalı/kalibre test ağırlıkları (kütlesi belgeli) veya kalibre yük hücresi-dinamometre; şerit metre/lazer metre (mesafe, korkuluk yüksekliği); kumpas (halat çapı vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. İmalatçı plakası (etiket) bilgileri", "d": "İmalatçı plakası kolay görülür yerde kalıcı sabitlenmiş ve silinmez mi? İmalatçı adı/adresi, model, seri/üretim no, yapım yılı, yüksüz kütle (kg), anma yükü (kg), izin verilen kişi sayısı, azami manuel kuvvet (N), azami rüzgâr hızı (m/s), şasi izin verilen eğim(ler) ve varsa harici hidrolik/elektrik güç bilgisi okunup rapordaki değerlerle karşılaştırıldı mı?", "ref": "TS EN 280-1 md.6.2.1"}, {"row": 18, "no": "B2", "t": "2. Platform üzerindeki işaretler", "d": "Her çalışma platformunda anma yükü (kg), kişi sayısı ve donanım kütlesi, azami manuel kuvvet (N) ve azami rüzgâr hızı (m/s) kalıcı ve net işaretli mi? Uzanan/genişleyen platformda tüm konfigürasyonlarda taşınabilen yükler konfigürasyonla ilişkili çizelge olarak verilmiş mi? Yalnız iç mekânda kullanım için tasarlanmışsa bu işaret var mı?", "ref": "TS EN 280-1 md.6.2.2 / 6.2.4 / 6.2.7"}, {"row": 19, "no": "B3", "t": "3. Grup ve tip sınıflandırması", "d": "MEWP'nin Grup (A/B) ve Tip (1: seyir yalnız nakliye konumunda, 2: yükseltilmiş seyir şasiden kumandalı, 3: yükseltilmiş seyir platformdan kumandalı) sınıfı belirlenip kapağa yazıldı mı? Sınıfa göre uygulanacak emniyet işlevleri (yük algılama + konum kontrolü, moment algılama vb.) ve seyir/dinamik hükümleri bu sınıfa göre seçildi mi?", "ref": "TS EN 280-1 md.1.4 / 4.4.1.1"}, {"row": 20, "no": "B4", "t": "4. Kullanım kılavuzu ve imalatçı deney raporu", "d": "Talimat el kitabı ve imalatçının aşırı yük ile işlevsel deneyleri içeren deney raporu mevcut ve ekipmanın modeline ait mi? Kılavuzdaki periyodik muayene/deney kapsamı (yapı, emniyet aygıtları, fren/aşırı yük aygıtı deneyi, işlevsel deney) ve izin verilen eğim, rüzgâr, kişi/yük değerleri enspektörce çıkarılıp muayene planına alındı mı?", "ref": "TS EN 280-1 md.6.1.1.1 / 6.1.1.5"}, {"row": 21, "no": "B5", "t": "5. Önceki muayene, bakım ve onarım kayıtları", "d": "Önceki periyodik kontrol raporları, muayene/deney sonuçları ile büyük değişiklik ve onarım kayıtları incelendi mi? Stabiliteyi, dayanımı veya performansı etkileyen büyük değişiklik/onarım yapılmışsa bunun sonrası muayene ve deney yapılmış mı, açık uygunsuzluklar kapatılmış mı?", "ref": "TS EN 280-1 md.6.1.2 / 6.1.1.6"}, {"row": 22, "no": "B6", "t": "6. Kullanım yeri ve koşulları", "d": "Kullanım yeri (iç/dış mekân), zemin eğimi ve taşıma kapasitesi, rüzgâr maruziyeti ve enerji hatlarına yakınlık sorgulandı mı? Kullanıcının günlük kullanım öncesi işlevsel kontrol kaydı (yağ sızıntısı, gevşek bağlantı, hortum/kablo, lastik/fren/batarya durumu, hasar) var mı?", "ref": "TS EN 280-1 md.6.1.1.2 (b, g, m) / Giriş"}, {"row": 23, "no": "B7", "t": "7. Sertifikalar ve sökülebilir/ilave parçalar", "d": "Halat, zincir ve hidrolik hortum deney sertifikaları (asgari kopma kuvveti/patlama basıncı) sorgulandı mı? Sökülebilir parçalar (ör. stabilizatör), değiştirilebilir platform ve varsa yük kaldırma aparatı üzerindeki imalatçı/model/seri bilgisi ekipmanla eşleşiyor, platform uzantısı-değiştirilebilir platform onaylı mı?", "ref": "TS EN 280-1 md.5.1.3 (c) / 6.2.9 / 6.2.10"}, {"row": 24, "no": "B8", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 25, "no": "B9", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 26, "no": "B10", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 28, "no": "C1", "t": "Yapının görsel muayenesi", "d": "Yük taşıyan kısımlar ve kaynaklar korozyon, çatlak, deformasyon ve diğer hasar yönünden gözle muayene edildi mi? Genişleyen yapının döner/mafsallı kısımlarındaki pim bağlantıları özellikle kontrol edilip gevşeklik, aşınma ve eksik emniyet elemanı aranıp bulgular kaydedildi mi?", "ref": "TS EN 280-1 md.6.1.1.5 (b.1)"}, {"row": 29, "no": "C2", "t": "Kilitleme pimleri ve bağlantı emniyetleri", "d": "Kilitleme pimleri istemeden serbest kalmaya (yaylı pim, cıvata vb.) ve kayba (zincir vb.) karşı emniyette mi? Yaya kontrollü tipte kontrol ve çeki demirlerinin şasiye bağlantısı sağlam mı?", "ref": "TS EN 280-1 md.4.3.1.3 / 4.3.1.4"}, {"row": 30, "no": "C3", "t": "Koruyucular ve ezilme/makaslama noktaları", "d": "Erişilebilir hareketli parçalar arasındaki sıkışma-makaslama noktalarında güvenli boşluk veya koruma var mı? Sıcak/tehlikeli parçaların korumaları yerinde ve yalnız alet/anahtarla açılıyor mu? Boşluk sağlanamayan yerde kalıcı uyarı şeridi ve uzak durma işareti var mı?", "ref": "TS EN 280-1 md.4.4.3 / 4.3.1.12 / 6.2.15"}, {"row": 31, "no": "C4", "t": "Platform korkulukları ve ayak korumaları", "d": "Platformun her tarafında sağlam bağlı koruma var mı? Korkuluk yüksekliği en az 1,1 m, ayak parmaklığı en az 0,15 m (erişim noktasında 0,1 m'ye düşebilir), ara korkuluk korkuluk/ayak parmaklığından en fazla 0,55 m mesafede ölçüldü mü? Katlanır korkuluklar dışa açılmıyor, kilitleri emniyetli mi, zincir/halat korkuluk olarak kullanılmıyor mu? Deformasyon ve gevşeklik gözle/elle kontrol edildi mi?", "ref": "TS EN 280-1 md.4.6.2 / 4.6.5"}, {"row": 32, "no": "C5", "t": "Platform giriş kapısı ve kilitlemesi", "d": "Giriş kapısı/koruması dışa açılmıyor, otomatik kapanıyor veya kilitleniyor mu? Kapı açıkken MEWP'nin çalışması engelleniyor mu (varsa emniyet işlevi denendi mi)? Erişim açıklığı ölçüldü mü (asgari genişlik 420 mm; sabit korkuluklu platformda en az 920 mm yükseklik ve 645 mm genişlik, sağlanamıyorsa 420 mm ve 800 mm altına inmemeli)?", "ref": "TS EN 280-1 md.4.6.3"}, {"row": 33, "no": "C6", "t": "Platform zemini ve erişim merdiveni", "d": "Platform zemini ve kapakları kaymaz, kendinden drenajlı ve hasarsız mı? Zemindeki/zemin ile ayak parmaklığı arasındaki açıklıklar 15 mm çaplı kürenin geçişini engelliyor mu? Kapaklar yanlışlıkla açılmayacak şekilde sabit mi? Erişim seviyesi ile platform zemini arası 0,4 m'yi aşıyorsa erişim merdiveni kaymaz basamaklı ve tutamaklı mı?", "ref": "TS EN 280-1 md.4.6.4 / 4.6.8 / 4.6.6 / 4.6.7"}, {"row": 34, "no": "C7", "t": "Düşmeye karşı koruma ankraj noktaları", "d": "Ankraj noktaları görünür hasarsız, düşmeye karşı koruma sistemi bağlantısı için uygun ve beyan edilen kişi sayısına yeterli sayıda mı? Ankrajlar kişisel koruma sistemi ve bağlanabilecek kişi sayısı ile işaretli mi? (Bom yapısına monte değilse platform zemininden en fazla 750 mm yukarıda mı?)", "ref": "TS EN 280-1 md.4.6.14 / 6.2.3"}, {"row": 35, "no": "C8", "t": "Platform seviyelenme sistemi", "d": "Genişleyen yapı hareket ederken platform seviyesi yataydan (veya şasi/döner tabla düzleminden) 5°'den fazla sapmıyor mu? Platformu kaldırıp indirerek seviye değişimi gözlendi mi? Master-slave tesviye sistemi varsa arıza halinde platformun seviyesini korumaya yönelik emniyet işlevi denendi mi?", "ref": "TS EN 280-1 md.4.6.1"}, {"row": 36, "no": "C9", "t": "Tel halat ve halat sonlandırmaları", "d": "Kaldırma halatları ve sonlandırmaları (ek yok - uçlar hariç, preslenmiş yüksük/kama soket vb.) tüm uzunlukta görsel muayene edildi mi? Halat çapı en az 8 mm olarak ölçüldü ve sertifikadaki değerle karşılaştırıldı mı? U-cıvata tutucu kullanılmadığı doğrulandı mı? Kırık tel, korozyon, deformasyon, aşınma değerlendirmesi halat muayene standardındaki (TS ISO 4309) hurda kriterlerine göre yapıldı mı?", "ref": "TS EN 280-1 md.4.5.2.2 / 4.5.2.5 / 4.5.2.6 / TS ISO 4309"}, {"row": 37, "no": "C10", "t": "Halat tambur ve makaraları", "d": "Tambur yivli, tek kat sarım ve flanşlar yerinde mi (flanş en üst tabakanın üzerinde halat çapının en az iki katı)? Genişleyen yapı/platform en uç konumundayken tamburda en az 2 tur halat kalıyor mu (fiilen uç konumda kontrol edildi mi)? Halat makaradan çıkmaya karşı emniyette, tambur sabitlemesi sağlam mı?", "ref": "TS EN 280-1 md.4.5.2.8 / 4.5.2.9 / 4.5.2.10 / 4.5.2.11 / 4.5.2.12"}, {"row": 38, "no": "C11", "t": "Halat/zincir arıza emniyeti ve gevşeklik işlevi", "d": "Halat veya zincirli tahrikte, tahrik sistemi arızalanırsa tam yüklü platformun dikey hareketini 0,2 m ile sınırlayan tertibat (mekanik emniyet cihazı veya ikinci halat/zincir sistemi) mevcut ve muayene edildi mi? Halat/zincir gevşekliğine yol açan harekette sistem hareketi kesiyor, ters yön hareket mümkün mü (gevşeklik ihtimali yoksa gerekmez)?", "ref": "TS EN 280-1 md.4.5.2.1 / 4.5.2.7 / 4.5.3.1 / 4.5.3.7"}, {"row": 39, "no": "C12", "t": "Zincirli tahrik elemanları", "d": "Zincirlerde yuvarlak bakla olmadığı, bakla ve pimlerde deformasyon, aşınma, korozyon ve çatlak bulunmadığı, zincir uzamasının gözle ve imalatçı sınırına göre ölçülerek kontrol edildiği doğrulandı mı? Zincir sonlandırmaları ve zincirin dişli/makaradan çıkmaya karşı emniyeti sağlam mı?", "ref": "TS EN 280-1 md.4.5.3.2 / 4.5.3.6 / 4.5.3.8"}, {"row": 40, "no": "C13", "t": "Vidalı mil ve kremayer-pinyon tahrikleri", "d": "Vidalı milli tahrikte yük taşıyan somun ve yüksüz emniyet somunu ile ilgili aşınma/boşluk kontrol edildi mi? Kremayer-pinyon tahrikinde aşırı hız regülatörü çalıştırılan fren mevcut ve muayene edildi mi? (Ekipmanda yoksa 'uygulanamaz' yazıldı mı?)", "ref": "TS EN 280-1 md.4.5.4.3 / 4.5.5.2"}, {"row": 41, "no": "C14", "t": "Tahrik frenleri (kaldırma/indirme)", "d": "Tüm tahriklerde fren sistemi var, tahrik enerjisiz kaldığında otomatik uygulanıyor mu? Kaldırma hareketinde otomatik kilit veya kendinden tutan tertibat var mı? Platform yüklü olarak farklı konumlarda durdurulup tutulduğunda kayma/kendiliğinden inme gözlendi ve kaydedildi mi?", "ref": "TS EN 280-1 md.4.5.1.6 / 6.1.1.5 (b.3)"}, {"row": 42, "no": "C15", "t": "Seyir frenleri ve park freni", "d": "Kendinden tahrikli MEWP'de frenler, aynı eksendeki en az iki tekerlekte olup güç kesildiğinde/arızada otomatik devreye giriyor mu ve frenlerin devrede kalması hidrolik/pnömatik basınç veya elektrik gücüne bağlı değil mi? Fren, ekipmanı durduruyor ve durdurulmuş konumda tutuyor mu (rampa/eğimde ve üretici izin verdiği azami eğimde denendi mi)?", "ref": "TS EN 280-1 md.4.3.1.6 / 4.3.1.10 / 6.1.1.5 (b.3)"}, {"row": 43, "no": "C16", "t": "Seyir hızı ve fren mesafesi ölçümü", "d": "Platform nakliye konumunda değilken seyir hızı otomatik kısıtlanıyor mu? Ölçülen hız sınırı aşmıyor mu (tip 2 ve 3 kendinden tahrikli için 0,7 m/s; araç üstü kabin içi kumandada 1,5 m/s; raylı için 3,0 m/s)? Yaya kontrollü MEWP'de nakliye konumunda seyir hızı 1,7 m/s'yi geçmiyor mu? Hız ölçülü mesafe ve kronometre ile ölçülüp kaydedildi mi; fren mesafesi standarttaki şekil değerinin üzerinde değil mi?", "ref": "TS EN 280-1 md.4.3.1.1 / 4.3.1.9 / 4.3.1.10 / 4.3.1.11"}, {"row": 44, "no": "C17", "t": "Kaldırma/indirme, teleskop ve sapma hızları", "d": "Platformun kaldırma-alçaltma hızı 0,4 m/s'yi, bomun teleskobik hareketi 0,4 m/s'yi, sapma/döndürme (azami aralıkta platformun dış kenarındaki yatay hız) 0,7 m/s'yi aşmıyor mu? Hızlar ölçülü mesafe/kronometre ile fiilen ölçülüp kaydedildi mi?", "ref": "TS EN 280-1 md.4.4.5"}, {"row": 45, "no": "C18", "t": "Şasi eğim alarmı / eğim sınırı", "d": "Şasi eğimi imalatçının izin verdiği sınıra ulaştığında görsel veya sesli uyarı veriyor mu (uyarı cihazı mühürlü/kilitli, ayarı korunuyor mu)? Tip 2 (araç üstü hariç) ve tip 3'te eğim sınırına gelince seçilen yönde seyir engelleniyor mu? Eğim, dijital eğim ölçer ile oluşturulup alarm eşiği fiilen denendi mi?", "ref": "TS EN 280-1 md.4.3.1.2"}, {"row": 46, "no": "C19", "t": "Stabilizatörler ve stabilizatör kilitleri", "d": "Stabilizatörler talimata göre ayarlanmadan platform izin verilen konum dışında çalışmıyor mu (emniyet işlevi denendi mi)? Tahrikli stabilizatör, platform nakliye konumunda değilken hareket etmiyor mu? Stabilizatör hareketi mekanik durdurucularla sınırlı mı; nakliye konumunda en az biri otomatik iki ayrı kilitleme cihazıyla kilitli mi? Stabilizatör ayakları ve tesviye (izin verilen eğimde şasiyi/yapıyı sınır içinde dengeleme) hasarsız ve çalışır mı, ayaklar azami zemin yüküyle işaretli mi?", "ref": "TS EN 280-1 md.4.3.2.1.1 / 4.3.2.1.3 / 4.3.2.1.5 / 4.3.2.2.1 / 6.2.13"}, {"row": 47, "no": "C20", "t": "Yük algılama sistemi (aşırı yük) testi", "d": "Yük algılama sistemi, platform yükü beyan yükünün %100'ünü aştıktan sonra ve %120'sine ulaşmadan devreye giriyor mu? Kontrollü test ağırlıklarıyla kademeli yükleme yapılıp devreye girme yükü kaydedildi mi? Devrede her kumanda konumunda görsel uyarı ve sesli sinyal veriliyor ve MEWP'nin tüm hareketleri engelleniyor mu? Grup A tip 1'de hareket erişim konumundan başlarken algılama çalışıyor mu? (Geliştirilmiş aşırı yük kriterli ≤2 kişilik MEWP'de sistem olmayabilir; bu durum plaka/kılavuzdan doğrulandı mı?)", "ref": "TS EN 280-1 md.4.4.1.2 / 4.4.1.6 / 6.1.1.5 (b.3)"}, {"row": 48, "no": "C21", "t": "Konum kontrolü ve moment algılama", "d": "Genişleyen yapının izin verilen konumları mekanik durdurucularla veya emniyet işleviyle sınırlanıyor mu; sınıra gelince hareket fiilen duruyor mu? Grup B'de moment algılama sistemi izin verilen devrilme momentine ulaşınca görsel sinyal verip devrilme momentini azaltanlar dışındaki hareketleri engelliyor mu? Belirli sırayla açılma gerektiren yapıda sıralama otomatik mi?", "ref": "TS EN 280-1 md.4.4.1.3 / 4.4.1.4 / 4.4.2"}, {"row": 49, "no": "C22", "t": "Makaslı platformda ilk alçaltma sınırı", "d": "Makaslı platformlarda koruma yerine ilk alçaltma sınırı çözümü kullanılıyorsa, inişte platform ilk alçaltma sınırında otomatik durup sonraki inişe en az 3 s gecikmeyle izin veriyor mu? Alçaltma komutu sonrası en az 1,5 s önce sesli/görsel sinyal başlıyor ve sınırın altında devam ediyor mu? Alçaltma hızı ortalama hızın %50'sini (ortalama hız 0,2 m/s'yi aşmıyorsa sınırlama gerekmez) geçmiyor mu? Süreler kronometre ile ölçüldü mü?", "ref": "TS EN 280-1 md.4.4.3"}, {"row": 50, "no": "C23", "t": "Kumanda düzeni ve ölü adam işlevi", "d": "Tüm hareketler yalnız kumanda çalıştırılırken oluyor ve bırakılınca kumandalar otomatik nötre dönüyor mu? Kumandalar kazara çalışmaya karşı korunmuş, pedallı kumandalar kapatılmış ve kaymaz mı? Hareket yönleri kumandalar üstünde/yakınında kelime veya sembolle net işaretli ve okunaklı mı?", "ref": "TS EN 280-1 md.4.7.1 / 4.7.3"}, {"row": 51, "no": "C24", "t": "Kumanda konumları önceliği (yer/platform)", "d": "Yerden (yedek) kumandalar ve platform kumandaları iç içe geçmiş (kilitli) mi, yani MEWP yalnız seçilen kumanda konumundan çalışıyor mu? Kablosuz kumanda varsa yalnız platformdaki imalatçı belirlemeli konumda iken genişleyen yapı ve yükseltilmiş seyir çalışıyor mu? Tip 2 ve 3'te platform nakliye/alçaltılmış seyir konumu dışındayken seyir kumandası başka kumandayla aynı anda çalıştırılamıyor mu?", "ref": "TS EN 280-1 md.4.7.4 / 4.7.2"}, {"row": 52, "no": "C25", "t": "Acil durdurma tertibatları", "d": "Her kumanda konumunda (platform ve yer) acil durdurma tertibatı bulunuyor ve fiilen basıldığında tüm hareketler duruyor mu? Yeniden çalışma ancak kasıtlı işlemle mi oluyor (güç kesilip yeniden gelince otomatik hareket yok mu)? Tertibatlar sağlam, işaretli ve erişilebilir mi?", "ref": "TS EN 280-1 md.4.7.5 / 4.7.7"}, {"row": 53, "no": "C26", "t": "Acil indirme (yardımcı sistem) ve kurtarma", "d": "Birincil güç kesildiğinde çalışma zarfının herhangi bir yerinden platformu erişim konumuna indirebilen yardımcı sistem (el pompası/akü vb.) mevcut ve yerden kolay erişilebilir kumandayla fiilen denendi mi? Platformdaki acil durdurma devredeyken yerden acil durdurma geçersiz kılınıp yer kumandalarıyla kurtarma yapılabiliyor, platform kumandaları devre dışı kalıyor mu? Kullanım talimatları kumandaların yanına sabitlenmiş mi?", "ref": "TS EN 280-1 md.4.7.8 / 4.7.9 / 6.2.5"}, {"row": 54, "no": "C27", "t": "Geçersiz kılma (override) cihazları", "d": "Emniyet işlevlerini geçersiz kılan cihaz yer seviyesinde, bas-çalıştır tipinde, bir seferde tek harekete izin veriyor ve hareketler düşük hızda mı? Emniyet işlevleri (ör. yük algılama) kalıcı köprülenmemiş, jumper/mühür ihlali yok mu?", "ref": "TS EN 280-1 md.4.7.9.1 / 4.4.1.2.3"}, {"row": 55, "no": "C28", "t": "Yetkisiz kullanım engeli ve uyarı cihazları", "d": "Yetkisiz kullanımı engelleyen cihaz (kilitlenebilir anahtar vb.) çalışıyor mu? Tip 3'te platformdan çalıştırılan sesli uyarı cihazı (korna), tip 2'de platform ile sürücü arasındaki kalıcı iletişim aracı çalışıyor mu? Araç üstü MEWP'de nakliye konumunda olmayan bileşeni gösteren kabin içi gösterge çalışıyor mu?", "ref": "TS EN 280-1 md.4.3.1.8 / 4.6.10 / 4.6.11 / 4.3.1.7"}, {"row": 56, "no": "C29", "t": "Elektrik donanımı ve akü", "d": "Ana şalter kolay erişilebilir yerde ve asma kilitle izole konumda sabitlenebiliyor mu? Kablolar hasarsız, gerektiğinde çok damarlı ve yağa dayanıklı, bağlantılar sağlam mı? Aküler kısa devre ve mekanik hasara karşı korunuyor, alet kullanmadan bağlantısı kesilebiliyor mu? Mahfazaların koruma sınıfı uygun mu?", "ref": "TS EN 280-1 md.4.8.2 / 4.8.3 / 4.8.4 / 4.8.5 / 6.1.1.5 (b.2)"}, {"row": 57, "no": "C30", "t": "Hidrolik sistem: hortum, boru, seviye, basınç", "d": "Hortum, boru ve bağlantılarda sızıntı, aşınma, çatlak, yanlış bağlantı riski var mı; hortumlar tanımlı/işaretli mi? Basınç sınırlama vanası ayarı alet gerektiriyor, mühürlü ve kayıt değerinde mi? Basınç göstergesi bağlantı noktalarından basınç okunup üretici değeriyle karşılaştırıldı mı? Tank seviye göstergesi max/min seviyeyi gösteriyor, yağ seviyesi uygun mu, hava giriş filtresi var mı? Gaz yüklü akümülatörde 'Dikkat – Basınçlı kap. Sökmeden önce boşaltın' etiketi var mı?", "ref": "TS EN 280-1 md.4.9.1 / 4.9.5 / 4.9.7 / 4.9.8 / 4.9.10 / 4.9.11"}, {"row": 58, "no": "C31", "t": "Hidrolik silindirler ve yük tutma valfleri", "d": "Yük tutan silindirlerde boru/hortum arızasında istenmeyen hareketi önleyen valf silindire entegre veya flanşlı/sert boruyla bağlı mı (sıkıştırmalı bağlantı yok mu)? Silindir kovan, rot ve bağlantı noktalarında sızıntı, çizik, deformasyon var mı? Yüklü platform belirli süre bekletilip kendiliğinden inme (kayma) gözlendi ve kaydedildi mi?", "ref": "TS EN 280-1 md.4.10.2 / 6.1.1.5 (b.2)"}, {"row": 59, "no": "C32", "t": "Tutucu takoz ve uyarı işaretleri", "d": "Bakım için platformun kaldırılması gerekiyorsa yüksüz platformu destekleyecek tutucu takoz mevcut mu ve takoz yerinde değilken kaldırılmış platform/yapı altına girme yasağı uyarısı var mı? Çıkıntı yapan uzantılar tehlike renkleriyle işaretli mi? Kısaltılmış kullanım talimatı ve pnömatik lastik basıncı bilgisi uygun konumda mı?", "ref": "TS EN 280-1 md.4.4.4 / 6.2.16 / 6.2.12 / 6.2.11 / 6.2.14"}, {"row": 60, "no": "C33", "t": "Platforma ek kaldırma aparatı (varsa)", "d": "Tip 1 Grup B MEWP'de yük kaldırma cihazı (vinç) varsa: nominal yük işareti, 'İnsanların kaldırılması yasaktır!' işareti ve temel güvenlik bilgi levhası (azami rüzgâr hızı dahil) mevcut mu? Kaldırma hızı 0,25 m/s'yi aşmıyor, indirme hızı kaldırma hızının 1,5 katını ve platform indirme hızını aşmıyor mu (ölçüldü mü)? Nominal kapasite sınırlayıcı çalışıyor, güç kaybında yük kontrollü indirilebiliyor, yerden acil kumanda var mı?", "ref": "TS EN 280-2 md.6.2.1 / 4.2.3 / 4.4.3 / 4.2.12 / 4.2.11"}, {"row": 61, "no": "C34", "t": "Yüksüz işlevsel deney (tüm hareketler)", "d": "Platform yüksüz ve düz zeminde iken tüm hareketler (kaldırma/alçaltma, sapma, teleskop, seyir, direksiyon, stabilizatör) tam menzilde denendi mi? Hareketler sarsıntısız, uç durdurucular ve sınır anahtarları etkili, sürüş engelleme (platform yükseltilmiş iken seyir/kumanda kısıtları) çalışıyor, anormal ses/titreşim yok mu? Tüm gösterge ve uyarılar çalışıyor mu?", "ref": "TS EN 280-1 md.5.1.4.4 (b, c, d) / 6.1.1.5 (b.4)"}, {"row": 62, "no": "C35", "t": "Yük testi: yük ve işletme kapasitesi kuralı", "d": "Kişi kaldıran ve yük/erişime göre kapasitesi değişen MEWP'de yıllık 'işletme kapasitesi ile yük testi' yapılmayıp işletme kapasitesi belirlenemez kabul edilerek test beyan yükü (plaka/platform üzerindeki kg) esas alınarak yapıldı mı? Kullanılan test ağırlıklarının kütlesi sertifikalı/kalibreli mi ve ağırlıklar platformda 80 kg/kişi + alet-malzeme dağılımını temsil edecek şekilde yerleştirildi mi? Tüm test yükleri ve konumlar rapora yazıldı mı?", "ref": "Yön. Ek-III 2.2.1.2 / TS EN 280-1 md.4.2.3.1"}, {"row": 63, "no": "C36", "t": "Yük testi: aşırı yük (statik) deneyi", "d": "Test yükü güçle çalışan MEWP'de beyan yükünün %125'i; tamamen manuel, A grubu tip 1 ve geliştirilmiş aşırı yük kriterli MEWP'de %150'si olarak uygulandı mı? MEWP düz zeminde, genişleyen yapı yük taşıyan kısımlarda en fazla gerilmeyi oluşturan her konuma getirilerek, hareketler ayrı ayrı ve titreşim yatıştıktan sonra yapıldı mı? Yük altında frenlerin yükü durdurup tuttuğu doğrulandı mı? Standartta bekletme süresi verilmediği için süre imalatçı/kuruluş prosedürüne göre kayıtlandı mı?", "ref": "TS EN 280-1 md.5.1.4.3 / 6.1.1.5 (b.3) / Yön. Ek-III 2.2.1"}, {"row": 64, "no": "C37", "t": "Yük testi: %110 yükle işlevsel/dinamik deney", "d": "Beyan yükünün %110'u ile tüm hareketler beyan hızlarında sarsıntısız yapıldı mı? Tüm işlevsel aygıtlar düzgün çalıştı, izin verilen azami hızlar ve ivme/yavaşlamalar aşılmadı mı? (Yönetmelik dinamik katsayısı 1,1 ile uyumlu.) Platforma ek kaldırma aparatı varsa aparat nominal yükünün %110'u ve platformun kalan nominal yükünün %110'u ile denendi mi?", "ref": "TS EN 280-1 md.5.1.4.4 (a) / TS EN 280-2 md.5.3"}, {"row": 65, "no": "C38", "t": "Aparat varsa aşırı yük deneyi", "d": "Kaldırma aparatı olan MEWP'de aşırı yük deneyi, aparat nominal yükünün %125'i ile ve ayrıca bu konfigürasyonda platformun kalan nominal yükünün %125'i platforma eklenerek yapıldı mı? (Aparat yoksa 'uygulanamaz'.)", "ref": "TS EN 280-2 md.5.2"}, {"row": 66, "no": "C39", "t": "Test sonrası kontroller", "d": "Yük testinden sonra MEWP'de kalıcı deformasyon olup olmadığı gözle ve ölçümle (korkuluk, bom, mafsallar, kaynaklar) kontrol edildi mi? Hidrolik sistemde sızıntı, silindir kaçağı, halat/zincir/pim/bağlantılarda gevşeme veya hasar aranıp sonuç kaydedildi mi? Emniyet aygıtları test sonrası yeniden çalışır durumda mı?", "ref": "TS EN 280-1 md.5.1.4.3 / 6.1.1.5 (b.1, b.2)"}, {"row": 67, "no": "C40", "t": "Rapor ve kayıtlar", "d": "Muayene ve deney sonuçları, muayeneyi yapan kişi/kişilerin adı ve adresiyle imzalı raporda, ölçülen değerlerle (hız, test yükü, devreye girme yükü, eğim alarm değeri) birlikte kayıtlı mı? Sonuçlar ve büyük değişiklik/onarımlar belgelerle saklanmak üzere ekipman dosyasına eklendi mi?", "ref": "TS EN 280-1 md.5.1.1 / 6.1.2"}]}, {"id": "D", "title": "BÖLÜM D — ÖLÇÜM, KAYIT VE KUSUR DEĞERLENDİRME", "items": [{"row": 69, "no": "D1", "t": "Anlık kayıt", "d": "Gözlem ve ölçümler saha kayıt formuna anında, okunaklı ve silinmez şekilde kaydediliyor mu; sonradan hafızadan tamamlanmıyor mu?", "ref": "17020 md.7.3.1"}, {"row": 70, "no": "D2", "t": "Ölçüm izlenebilirliği", "d": "Her ölçüm; değeri, birimi ve hangi cihazla (cihaz adı/seri no) alındığı ile birlikte izlenebilir şekilde kayıt altına alınıyor mu?", "ref": "17020 md.7.3.1 / İş Ekip. Yön. Ek-III md.1.7.4"}, {"row": 71, "no": "D3", "t": "Sınır değerle kıyaslama", "d": "Ölçülen/tespit edilen değerler, etiket bilgileri ve standart/teknik literatürdeki sınır değerlerle kıyaslanarak mı 'uygun / uygun değil' kararı veriliyor?", "ref": "İş Ekip. Yön. Ek-III md.1.7.5"}, {"row": 72, "no": "D4", "t": "Kusur derecelendirmesi", "d": "Kusurlar hafif / ağır kusur ayrımına uygun ve tutarlı olarak sınıflandırılıyor mu (Bakanlık kriteri yoksa kuruluş prosedürüne göre)?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 73, "no": "D5", "t": "Değerlendirme bütünlüğü", "d": "Her kriter 'Uygun / Uygun Değil / Uygulanamaz' olarak işaretleniyor; boş bırakılan veya toplu işaretlenen kriter var mı?", "ref": "17020 md.7.1.5"}, {"row": 74, "no": "D6", "t": "Gözlem-karar tutarlılığı", "d": "Enspektörün sahada gözlediği durum ile forma işaretlediği sonuç birebir örtüşüyor mu? (Tanık denetçisinin bağımsız gözlemi ile karşılaştırın.)", "ref": "17020 md.7.1.5"}, {"row": 75, "no": "D7", "t": "Danışmanlık sınırı", "d": "Enspektör muayene sırasında tasarım/çözüm önerisi vererek tarafsızlığını riske atıyor mu? Tespit bildirimi ile danışmanlık ayrımı korunuyor mu?", "ref": "17020 md.4.1.6 / Ek A"}, {"row": 76, "no": "D8", "t": "Süre yeterliliği", "d": "Muayene başlangıç-bitiş saati gerçekçi kaydediliyor mu; ayrılan süre tüm kriterlerin ve testlerin fiilen uygulanması için yeterli mi?", "ref": "17020 md.7.1.1"}, {"row": 77, "no": "D9", "t": "Operatör desteği ve karar sahipliği", "d": "Testlerde işletme operatöründen/bakımcısından destek alınırken hareketlerin yönlendirmesi ve nihai karar enspektörde kalıyor mu?", "ref": "17020 md.4.1 / 6.1"}]}, {"id": "E", "title": "BÖLÜM E — RAPORLAMA, KARAR VE KAPANIŞ", "items": [{"row": 79, "no": "E1", "t": "Rapor formatı", "d": "Rapor Ek-III md.1.7'deki bölümlerin tamamını (Genel Bilgiler ve periyodik kontrol metodu, Ekipman / Etiket / Tespit Edilen Bilgiler, Test Değerleri, Ölçüm Aletleri, Muayene Kriterleri ve Testler, Kusur Açıklamaları, Notlar, Sonuç ve Kanaat, Yetkili Kişi Bilgileri) içeriyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7"}, {"row": 80, "no": "E2", "t": "Periyodik kontrol metodu", "d": "Raporda uygulanan standart numarası ve adı (yoksa üretici metodu / risk değerlendirmesi) açıkça belirtildi mi; sahada uygulanan metotla aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1.1"}, {"row": 81, "no": "E3", "t": "Tarih ve saat bilgileri", "d": "Periyodik kontrol başlangıç/bitiş tarih-saati ve bir sonraki periyodik kontrol başlangıç tarihi eksiksiz ve gerçeğe uygun mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.1"}, {"row": 82, "no": "E4", "t": "Periyot belirleme", "d": "Bir sonraki kontrol tarihi Tablo-2'ye uygun mu (standartta süre belirtilmemişse azami 1 yıl)? Kullanım koşulları/risk nedeniyle sıklığın artırılması değerlendirildi mi?", "ref": "İş Ekip. Yön. Ek-III Tablo-2 / md.1.4 / 1.10"}, {"row": 83, "no": "E5", "t": "Test değerlerinin gerçekliği", "d": "Raporda yazan test yükü/katsayısı, test konumu ve test sonuçları sahada fiilen uygulanan değerlerle aynı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.3"}, {"row": 84, "no": "E6", "t": "Ölçüm aletleri bölümü", "d": "Kullanılan cihazların adı, seri numarası ve kalibrasyon bilgileri rapora yazıldı mı; sahada kullanılan cihazlarla birebir örtüşüyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.7.4 / 17020 md.6.2"}, {"row": 85, "no": "E7", "t": "Kusur açıklamaları", "d": "Her 'Uygun Değil' kriteri için kusur açıklaması; kriter numarasıyla ilişkilendirilmiş, ölçülebilir ve anlaşılır şekilde yazıldı mı? Notlar bölümüne uygunsuzluk yazılmamış mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.6 / 1.7.7"}, {"row": 86, "no": "E8", "t": "Sonuç ve kanaat tutarlılığı", "d": "Kanaat, tespit edilen kusurların derecesiyle tutarlı mı? Güvenli kullanıma engel kusur varsa 'uygunsuzluk giderilene kadar kullanılamaz' ifadesi açıkça yazıldı mı?", "ref": "İş Ekip. Yön. Ek-III md.1.7.8 / 1.9"}, {"row": 87, "no": "E9", "t": "Hafif kusur ifadesi", "d": "Sadece hafif kusur tespitinde, kusurların bir sonraki periyodik kontrol başlangıç tarihine kadar giderilmesi gerektiği ifadesi rapora eklendi mi?", "ref": "İş Ekip. Yön. Ek-III md.1.9.1"}, {"row": 88, "no": "E10", "t": "Yetkili kişi bilgileri ve imza", "d": "Ad-soyad, meslek, EKİPNET kayıt numarası, nüsha sayısı ve imza eksiksiz mi? (İmzasız rapor geçersizdir.)", "ref": "İş Ekip. Yön. Ek-III md.1.7.9"}, {"row": 89, "no": "E11", "t": "Sahada düzenleme ve izlenebilirlik", "d": "Saha kaydı ile nihai rapor arasında izlenebilirlik kurulabiliyor mu; raporu onaylayan ile muayeneyi yapan kişi ayrımı prosedüre uygun mu?", "ref": "17020 md.7.3 / 7.4 / 8.4"}, {"row": 90, "no": "E12", "t": "Kapanış bilgilendirmesi", "d": "Muayene sonunda işletme yetkilisine tespitler ve varsa kullanım kısıtı (ağır kusurda ekipmanın kullanılmayacağı ve uyarı işaretlemesi) sözlü olarak aktarıldı mı?", "ref": "17020 md.7.4 / İş Ekip. Yön. Ek-III md.1.9"}, {"row": 91, "no": "E13", "t": "Gizlilik ve teslim", "d": "Rapor nüshalarının teslimi ve muayene sırasında edinilen işletme bilgilerinin gizliliği korunuyor mu?", "ref": "17020 md.4.2"}]}], "refs": [["Mevzuat", "İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği, Ek-III md.1 (genel hükümler, rapor içeriği md.1.7, kusur derecelendirme md.1.9) ve md.2.2 (kaldırma ve iletme ekipmanları, Tablo-2)."], ["Akreditasyon", "TS EN ISO/IEC 17020 · TÜRKAK L701-018 Rev.02 (kapsam kodu ve standart eşlemesi, Ek.1 referans tablo)."], ["Standart 1", "TS EN 280-1:2022 — Yükseltilebilen seyyar iş platformları - Bölüm 1: Tasarım hesapları - Denge kriterleri - Yapım - Güvenlik - Muayene ve deneyler (TS EN 280+A1 yerine geçen güncel baskı; TÜRKAK L701-018 eşlemesi: TS EN 280)"], ["Standart 2", "TS EN 280-2 (BS EN 280-2:2022) — Yükseltilebilen seyyar iş platformları - Bölüm 2: Platforma monte yük kaldırma cihazlı Tip 1 Grup B MEWP'ler için ek güvenlik gereklilikleri (yalnız platformda malzeme kaldırma aparatı varsa)"], ["Standart 3", "TS ISO 4309 — Vinçler - Tel halatlar - Bakım ve onarım, inceleme ve hizmet dışı bırakmak için uygulama kuralları (halat muayenesi için atıf)"], ["Yük / fonksiyon testi notu", "TS EN 280-1 md.5.1.4.3'e göre aşırı yük deneyi yükü, güçle çalışan MEWP'de beyan yükünün %125'i; tamamen manuel, A grubu tip 1 ve geliştirilmiş aşırı yük kriterli MEWP'de %150'sidir (düz zeminde, en fazla gerilme oluşturan konumlarda, hareketler ayrı ayrı; fren yükü tutmalı, kalıcı deformasyon olmamalı). md.5.1.4.4'e göre işlevsel deney beyan yükünün %110'u ile beyan hızlarında yapılır (Yönetmelik dinamik katsayısı 1,1 ile uyumlu); md.6.1.1.5'e göre periyodik muayene yapının görsel muayenesi, emniyet aygıtlarına özel dikkatle sistem muayenesi, fren ve/veya aşırı yük aygıtı etkinlik deneyi ile işlevsel deneyi kapsar. Yönetmelik Ek-III 2.2.1.2 gereği kişi kaldıran ve kapasitesi konfigürasyona göre değişen MEWP'de işletme kapasitesi belirlenemez; yıllık işletme kapasitesi testi yerine beyan yükü esas alınır, Yönetmeliğin 3 yılda bir/önemli onarım sonrası statik 1,25 ve dinamik 1,1 katsayıları standardın %125 ve %110 değerleriyle örtüşür; elle işletilenlerde 1,5 ile standartın %150 değeri de uyumludur."], ["Yönetmelik test kuralı", "Ek-III md.2.2.1: standartlarda aksi belirtilmedikçe her periyodik kontrolde muayene; a) azami yılda bir işletme kapasitesi (belirlenmemişse kaldırma kapasitesi) ile yük testi; b) azami üç yılda bir veya her önemli bakım-onarım sonrası kaldırma kapasitesi ile md.2.2.1.1 katsayıları gözetilerek yük testi (genel kural: statik 1,25 — elle işletilenlerde 1,5; dinamik 1,1). Md.2.2.1.2: karşı ağırlıklı denge prensibi ve/veya kapasitesi yük koluna göre değişen ve kişi kaldıran ekipmanlarda işletme kapasitesi belirlenemez."], ["Dikkat / teyit edilecek noktalar", "1) TS EN 280-1'de yük testi için bekletme süresi verilmemiştir; süre yazılmadı. 2) Standardın periyodik muayene maddesi (md.6.1.1.5) aşırı yük deneyinin kendisini açıkça sıralamaz, 'frenlerin ve/veya aşırı yük aygıtlarının etkililiğini kanıtlamak üzere deney' der; aşırı yük deneyi yüzdeleri md.5.1.4.3'ten (imalat doğrulaması) alınmış olup periyodik uygulama Yönetmelik Ek-III 2.2.1 ile birleştirilmiştir. 3) md.5.1.4.2 stabilite deneyleri (statik +0,5° eğim, bordür/girinti, frenleme) tip/imalat deneyidir, periyodik kontrol maddesi yapılmadı. 4) Fren mesafesi sınırları Şekil 13 grafiğindedir, sayısal değer yazılmadı. 5) Kabul edilebilir kayma/kendiliğinden inme değeri standartta yoktur ('üretici sınırı'). 6) Güncel numaralandırma: doğrulama md.5, kullanım bilgileri md.6. 7) Halat hurda kriterleri TS ISO 4309'dan sayısal alınmadı (madde no verilmedi). 8) TS EN 280-2 çevirisinde bazı maddelerde çeviri bozuklukları var; yalnız net okunan maddeler kullanıldı."], ["Hazırlanış", "Madde numaraları ve sayısal değerler, klasördeki Türkçe standart metinlerinden (TSE / BSI çevirileri) alınmıştır. Çeviri kaynaklı belirsizlikler yukarıdaki 'Dikkat' satırında listelenmiştir; resmi TS metni ile teyit edilmesi önerilir."]], "note": "AÇIKLAMA: Sarı zeminli hücreler doldurulacak alanlardır. Değerlendirme kısaltmaları — U: Uygun (faaliyet doğru ve eksiksiz gözlendi) · UD: Uygun Değil (yapılmadı veya hatalı yapıldı) · G: Gözlenmedi (tanık denetimi sırasında gerçekleşmedi) · KD: Kapsam Dışı (ekipman tipi/donanımı nedeniyle aranmayan kriter — gerekçesi Bulgu sütununa yazılır). Örnek: C bölümündeki bir test maddesinde enspektör test yükünü tartı belgesi olmadan kabul ettiyse E sütununa 'UD', G sütununa 'Test yükü kütlesi doğrulanmadı' yazılır. Standart madde no ve sınır değerleri 'Referanslar' sayfasındaki notlarla birlikte okunmalıdır.", "map": [["A3"], ["A2"], ["A5", "B8"], ["A8", "A9"], [], ["A4", "A12", "A13", "B4", "B5", "B7"], ["B1", "B2", "B3", "B6"], ["C20", "C34", "C35", "C36", "C37", "C38", "C39"], ["A6", "E6"], ["A7"], ["A10", "A11", "D7", "D9"], ["A1", "D3", "C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22", "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30", "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38", "C39", "C40"], ["D1", "B10"], ["D2", "D5", "E3", "E5", "E11", "B9"], ["D4", "D6", "E1", "E2", "E4", "E7", "E8", "E9", "E10"]]}, {"code": "1.A.10", "name": "Hareket Engelliler İçin Güç Tahrikli Kaldırma Platformu", "method": "Kapsam Kodu: 1.A.10   |   Metot: İş Ekipmanlarının Kullanımında Sağlık ve Güvenlik Şartları Yönetmeliği Ek-III Tablo-2 · TS EN 81-40 · TS EN 81-41", "refTitle": "1.A.10 Hareket Engelliler İçin Güç Tahrikli Kaldırma Platformu — Referans Dokümanlar ve Uygulama Notları", "cover": [{"h": "1. DENETİM BİLGİLERİ"}, {"row": 7, "label": "Muayene Kuruluşu"}, {"row": 8, "label": "Akreditasyon No / Kapsam Kodu", "value": "1.A.10 – Hareket Engelliler İçin Güç Tahrikli Kaldırma Platformu"}, {"row": 9, "label": "Tanık Denetim Tarihi"}, {"row": 10, "label": "Denetim Yeri (İşletme / Adres)"}, {"row": 11, "label": "Baş Denetçi / Teknik Uzman"}, {"h": "2. DENETLENEN ENSPEKTÖR"}, {"row": 14, "label": "Adı Soyadı"}, {"row": 15, "label": "Ünvanı / Mesleği"}, {"row": 16, "label": "EKİPNET Kayıt Numarası"}, {"row": 17, "label": "Kuruluş İçi Yetkilendirme Tarihi"}, {"h": "3. TANIK OLUNAN EKİPMAN"}, {"row": 20, "label": "Ekipman Tipi (Merdiven asansörü: koltuklu / ayakta platformlu / tekerlekli sandalye platformlu; Eğik kaldırma platformu; Düşey kaldırma platformu)"}, {"row": 21, "label": "Marka - Model"}, {"row": 22, "label": "Seri / Üretim No - İmalat Yılı"}, {"row": 23, "label": "Nominal Yük (kg) / Maks. Kişi Sayısı / Nominal Hız (m/s)"}, {"row": 24, "label": "Tahrik Tipi (halat / zincir / kremayer-pinyon / vida-somun / hidrolik / çekiş / akülü) ve Emniyet Tertibatı Tipi"}, {"row": 25, "label": "Durak Sayısı - Seyir Mesafesi (m) - Kullanım Yeri (kamusal / özel; iç / dış mekan)"}, {"row": 26, "label": "Uygulanan Test Yükü (kg) / Katsayı ve Test Türü (yıllık / 3 yıllık-onarım sonrası)"}, {"row": 27, "label": "Uygulanan Standart ve Baskısı (rapordaki metot)"}, {"row": 28, "label": "Muayene Başlangıç - Bitiş Saati"}], "sections": [{"id": "A", "title": "BÖLÜM A — MUAYENE ÖNCESİ HAZIRLIK, YETKİNLİK VE TARAFSIZLIK", "items": [{"row": 3, "no": "A1", "t": "Enspektörün yetkili kişi niteliği", "d": "Periyodik kontrolü yapan kişi Ek-III md.2.2.2'de sayılan mesleklerden (makine / mekatronik / metalürji ve malzeme / imalat mühendisi; makine veya metal eğitimi bölümü mezunu teknik öğretmen; makine tekniker / yüksek tekniker) mi? EKİPNET kayıt numarası var ve geçerli mi?", "ref": "İş Ekip. Yön. Ek-III md.2.2.2 / 1.7.9"}, {"row": 4, "no": "A2", "t": "Kuruluş içi yetkilendirme", "d": "Enspektör bu kapsam (1.A.10 Hareket Engelliler İçin Güç Tahrikli Kaldırma Platformu) için kuruluşça yetkilendirilmiş mi? Eğitim, gözetim ve yetkinlik izleme (saha gözetimi) kayıtları güncel mi?", "ref": "17020 md.6.1.5 / 6.1.6 / 6.1.7 / 6.1.8"}, {"row": 5, "no": "A3", "t": "Talep/sözleşme gözden geçirme", "d": "Muayene kapsamı, ekipman tipi ve uygulanacak metot (standart ve baskısı) muayene öncesi netleştirildi mi? Ekipmanın akreditasyon kapsamındaki doğru koda karşılık geldiği teyit edildi mi?", "ref": "17020 md.7.1.1"}, {"row": 6, "no": "A4", "t": "Ön bilgi ve doküman temini", "d": "Önceki periyodik kontrol raporu, kullanım/bakım kılavuzu, bakım kayıtları, üretici yük diyagramı/test bilgileri ve (varsa) önemli onarım/değişiklik kayıtları talep edildi mi?", "ref": "17020 md.7.1.2 / İş Ekip. Yön. Ek-III md.1.3.4"}, {"row": 7, "no": "A5", "t": "Muayene metodu/talimatı", "d": "Sahaya güncel revizyonlu muayene talimatı ve kontrol listesi getirildi mi? Enspektör metoda hâkim mi; ezbere değil dokümana bakarak mı ilerliyor?", "ref": "17020 md.7.1.1 / 7.1.3"}, {"row": 8, "no": "A6", "t": "Ölçüm cihazlarının kalibrasyonu", "d": "Kullanılan cihazların (Kalibre test ağırlıkları (nominal yük, 1,25 x nominal yük ve aşırı yük algılama testi için, kademeli) veya kalibre yük hücresi; itme-çekme kuvvet ölçer / dinamometre (N: hassas kenar, kapı, bariyer, rampa vb.) kalibrasyon sertifikaları geçerli mi, cihaz üzerinde kalibrasyon/tanımlama etiketi var mı?", "ref": "17020 md.6.2.4 / 6.2.6 / 6.2.7"}, {"row": 9, "no": "A7", "t": "Cihaz-ölçüm uygunluğu", "d": "Cihazların ölçüm aralığı ve çözünürlüğü, standartta tanımlı sınır değerlerin (mm, %, m/s, N vb.) doğrulanması için yeterli mi? Cihaz kullanılmadan önce hasar/sıfır kontrolü yapıldı mı?", "ref": "17020 md.6.2.1 / 6.2.10"}, {"row": 10, "no": "A8", "t": "KKD ve saha İSG uyumu", "d": "Enspektör baret, koruyucu ayakkabı, yelek vb. KKD kullanıyor mu; yüksekte çalışmada düşmeye karşı koruma alıyor mu; işletmenin İSG kurallarına uyuyor mu?", "ref": "17020 md.6.1.2 / 6.2.2"}, {"row": 11, "no": "A9", "t": "Muayene ve test alanı güvenliği", "d": "Test alanı çevre emniyeti alındı, yük düşme/devrilme/sıkışma bölgesinden personel uzaklaştırıldı mı? Enerji kesme–kilitleme–etiketleme gerektiğinde uygulandı mı?", "ref": "17020 md.7.1.1"}, {"row": 12, "no": "A10", "t": "Tarafsızlık beyanı", "d": "Enspektörün ekipman veya işletme ile bakım/satış/danışmanlık türü çıkar ilişkisi sorgulanmış ve beyan alınmış mı?", "ref": "17020 md.4.1.3 / 4.1.5"}, {"row": 13, "no": "A11", "t": "Baskıya karşı bağımsızlık", "d": "Saha sırasında işletmeden gelen 'geçir/uygun ver' baskısı, ücret pazarlığı veya kişisel yakınlık kararı etkiliyor mu?", "ref": "17020 md.4.1.6"}, {"row": 14, "no": "A12", "t": "Test planlaması", "d": "Uygulanacak test yükü (yıllık: işletme/kaldırma kapasitesi; azami 3 yılda bir veya önemli bakım-onarım sonrası: statik ve dinamik katsayılı test) ve standarttaki katsayı muayene öncesi belirlendi mi? Test yükünün gerçek kütlesi (tartı belgesi, kalibre yük hücresi vb.) doğrulanabiliyor mu?", "ref": "İş Ekip. Yön. Ek-III md.2.2.1 / 2.2.1.1"}, {"row": 15, "no": "A13", "t": "Tahribatsız muayene (uygulanıyorsa)", "d": "Tahribatsız muayene uygulanıyorsa TS EN ISO 9712'ye göre en az Seviye 2 belgeli personelce yapılıyor ve raporu periyodik kontrol raporuna ekleniyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.12 / 2.2.3"}]}, {"id": "B", "title": "BÖLÜM B — EKİPMAN TANIMLAMA VE VERİ TOPLAMA", "items": [{"row": 17, "no": "B1", "t": "1. Ekipman tipi ve uygulanacak standart tayini", "d": "Ekipmanın tipi (koltuklu / ayakta platformlu / tekerlekli sandalye platformlu merdiven asansörü, eğik kaldırma platformu veya düşey kaldırma platformu) gözle ve etiketle belirlenip rapora yazıldı mı? Eğik ray üzerinde hareket edenlere TS EN 81-40, düşey kılavuzlu yolda (kapalı kaldırma yolu, dikey eğim en fazla 15°) hareket edenlere TS EN 81-41 uygulanarak tipe özgü maddelerin hangileri uygulanamaz (KD) olduğu önceden belirlendi mi? Nominal hızın 0,15 m/s'yi aşmadığı beyan/etiket üzerinden kontrol edildi mi?", "ref": "TS EN 81-40 md.1.1 / TS EN 81-41 md.1.1"}, {"row": 18, "no": "B2", "t": "2. Üretici plakası ve işaretlemelerin doğrulanması", "d": "Taşıyıcı üzerindeki/ekipman üzerindeki plaka okunaklı ve silinmez mi? 81-40'ta nominal yük (kg), imalatçı unvanı/adresi, tip/seri tanımı, seri no ve inşaat yılı; 81-41'de imalatçı unvanı ve tam adresi, üretim yılı, tip, seri/kimlik no, gerilim-frekans-güç-nominal yük bilgileri okundu, kapak sayfası verileriyle karşılaştırılıp kaydedildi mi?", "ref": "TS EN 81-40 md.7.4.1 / TS EN 81-41 md.7.9.3"}, {"row": 19, "no": "B3", "t": "3. Nominal yük, kişi sayısı ve taşıyıcı boyutlarının kaydı", "d": "Nominal yük plakadan okunup kayda geçirildi mi ve şu sınırlarla karşılaştırıldı mı: 81-40'ta oturan/ayakta kullanıcı için en az 115 kg, tekerlekli sandalye platformunda net yük alanının 250 kg/m²'sinden az olmayan yük (en fazla 350 kg; tek kullanıcı manuel sandalyede 150 kg); 81-41'de en az 250 kg/m², en fazla 500 kg (tek kullanıcı 250 kg, refakatçili 315 kg)? 81-41'de taşıyıcının net yükleme alanı şerit metre ile ölçülerek 2 m²'yi aşmadığı ve Tablo 3'teki alan/yük ilişkisine uygun olduğu doğrulandı mı? Maksimum kişi sayısı bilgisi kayda geçti mi?", "ref": "TS EN 81-40 md.5.1.6.1 / md.5.6.4.2 / TS EN 81-41 md.5.1.6 / md.5.1.8 / Tablo 3"}, {"row": 20, "no": "B4", "t": "4. Kullanım kılavuzu, şemalar ve bakım kayıtları", "d": "Üretici kullanım/talimat kılavuzu sahada mevcut mu ve acil durum/manuel çalıştırma adımlarını, rutin muayene/servis aralıklarını, test raporunu ve elektrik devre şemasını (81-41'de hidroliklerde hidrolik devre şeması ve tam yük basıncı) içeriyor mu? Bakım kayıtlarında üreticinin belirttiği aralıklar ve periyodik muayenenin en fazla 12 ay aralıkla yapıldığı (bilgilendirici ek; ulusal düzenleme farklı aralık gerektirebilir) doğrulandı mı?", "ref": "TS EN 81-40 md.7.3.1 / Ek F.1 / TS EN 81-41 md.7.9.1.1 / Ek D.1"}, {"row": 21, "no": "B5", "t": "5. Montaj sonrası muayene/test belgesi ve önceki raporlar", "d": "İlk kullanımdan önce yetkili kişi tarafından yapılan kapsamlı muayene ve test belgesi (81-40 md.6.4.1 a)-p); 81-41 md.6.3.1 a)-u)) ile üreticinin statik ve dinamik test raporu görüldü mü? Halat/zincir test sertifikaları ve önceki periyodik kontrol raporundaki uygunsuzlukların kapatılma durumu kontrol edildi mi?", "ref": "TS EN 81-40 md.6.4.1 / md.6.4.2 / md.7.1 / TS EN 81-41 md.6.3.1 / md.6.3.2"}, {"row": 22, "no": "B6", "t": "6. Tahrik ve güvenlik bileşenleri veri toplama", "d": "Tahrik tipi (halat, zincir, kremayer-pinyon, vida-somun, hidrolik, çekiş, kılavuzlu halat/bilyalı vb.), süspansiyon eleman sayısı ve çapı, emniyet tertibatı ve aşırı hız regülatörü tipi ve üzerinde yazılı devreye girme hızı, hidroliklerde tam yük basıncı ve esnek hortum işaretleri, yükselen taşıyıcı aşırı hız koruması veri plakası (çekişli) kayda geçirildi mi?", "ref": "TS EN 81-41 md.5.4.13.11 / md.7.9.1.1 a) / TS EN 81-40 md.5.3 / md.5.4"}, {"row": 23, "no": "B7", "t": "7. Kurulum yeri, kullanım şekli ve bina arayüzü", "d": "Kullanım yeri (kamusal/özel, iç/dış mekan) belirlendi mi? Dış mekanda elektrikli ekipmanın koruma derecesinin 81-40'ta en az IP44, 81-41'de en az IP54 olduğu plaka/dokümandan doğrulandı mı? Yangın halinde kaçış yolunu tıkamadığı ve katlanmış merdiven asansörü ile karşı yüzey arasında ambulans erişimi için genel kural olarak 400 mm bulunduğu (81-40 Ek C.3) gözle kontrol edildi mi?", "ref": "TS EN 81-40 md.5.1.8.2 / Ek C.3 / TS EN 81-41 md.5.1.12"}, {"row": 24, "no": "B8", "t": "Uygulanacak standart baskısı", "d": "Periyodik kontrol, ekipmanın imal yılında yürürlükte olan standarda göre mi yürütülüyor? Sonradan yürürlüğe giren standarda uyumlaştırma varsa yeni baskı dikkate alınıyor mu?", "ref": "İş Ekip. Yön. Ek-III md.1.4.1 / 1.11"}, {"row": 25, "no": "B9", "t": "Uygulanamaz kararının gerekçesi", "d": "'Uygulanamaz' işaretlenen kriterler, ekipman tipi/donanımı ve atıf yapılan standart maddesine dayandırılarak mı kapsam dışı bırakılıyor?", "ref": "17020 md.7.1.1"}, {"row": 26, "no": "B10", "t": "Kanıt kaydı", "d": "Tespit edilen kusurlar ve ölçümler fotoğraf/saha formu ile kanıtlanıyor mu; kayıtlar ekipmanla ilişkilendirilebiliyor mu?", "ref": "17020 md.7.3.1 / 8.4"}]}, {"id": "C", "title": "BÖLÜM C — SAHA MUAYENESİ, FONKSİYON VE YÜK TESTLERİNİN UYGULANIŞI", "items": [{"row": 28, "no": "C1", "t": "Kılavuz raylar, bağlantı ve sabitlemeler (81-40/81-41)", "d": "Kılavuz ray, birleşim yerleri ve ankraj/braketler gözle kontrol edildi mi (çatlak, gevşeme, korozyon, deformasyon, aşınma)? Kılavuz pabuçları/makaralarının aşınması incelendi mi? 81-41'de yük altında taşıyıcı bileşenleri ile kapalı kaldırma yolu iç yüzeyi arasındaki erişilebilir açık kenarlarda yatay açıklığın en fazla 20 mm olduğu şerit metre/sonda ile ölçülüp kaydedildi mi? 81-40'ta bir ray üzerinde yalnızca bir taşıyıcı bulunduğu doğrulandı mı?", "ref": "TS EN 81-40 md.5.2.1 / Ek F.1 i) / TS EN 81-41 md.5.2.1 / md.5.2.4 / Ek D.1 j)"}, {"row": 29, "no": "C2", "t": "Katlanır ray bölümü (81-40)", "d": "Katlanır kılavuz ray katlanmış konumda merdiveni/biniş noktasını engellemiyor mu? Manuel katlama bölümü dengeli mi ve konumlandırma kuvveti dinamometre ile ölçülerek en fazla 30 N olduğu doğrulandı mı? Katlanır bölüm doğru konumda değilken taşıyıcının ilerlemesini önleyen elektrikli güvenlik cihazı fiilen denenip çalışma engellendi mi? Motorlu ise sesli/görsel sinyal ve acil manuel çalıştırma (en fazla 50 N) kontrol edildi mi? Katlanır ray yoksa KD işaretlendi mi?", "ref": "TS EN 81-40 md.5.2.2.1 - 5.2.2.6"}, {"row": 30, "no": "C3", "t": "Mekanik uç durdurucular ve ray uzunluğu", "d": "Taşıyıcının aşırı hareketi mümkünse mekanik uç durdurucular (81-40) ve kılavuz ray uçları sağlam ve yerinde mi? 81-41'de taşıyıcı (aşırı hareket dahil) en üst konumdayken kılavuz ray uzunluğunun en az 0,05 m ek kılavuzlu hareket karşıladığı ölçülerek doğrulandı mı? Uç durdurucuların deformasyon/hasar durumu kontrol edildi mi?", "ref": "TS EN 81-40 md.5.2.3 / TS EN 81-41 md.5.2.5 / md.5.2.6"}, {"row": 31, "no": "C4", "t": "Taşıyıcı ve koltuk seviyesi/eğimi (81-40/81-41)", "d": "81-40'ta nominal yük altında platformun yataydan 5°'den fazla eğilmediği ve koltuk seviyesinin tüm seyir boyunca yataydan ±5° içinde kaldığı dijital eğim ölçerle ölçülüp kaydedildi mi? 81-41'de nominal yük taşıyıcı zemininin en elverişsiz yarısına (uzunluk ve genişlik için ayrı ayrı) dağıtıldığında taşıyıcı kenarlarının yataydan ±10 mm'den fazla eğilmediği ölçüldü mü?", "ref": "TS EN 81-40 md.5.2.1.2 / md.5.6.2.6.2 / TS EN 81-41 md.5.2.2"}, {"row": 32, "no": "C5", "t": "Halat askısı, sonlandırmalar ve tambur (81-40/81-41)", "d": "Halatlarda tel kopması, ezilme, korozyon, çap azalması, yağlama durumu gözle/ölçümle incelenip üretici kılavuzundaki atılma kriterleriyle karşılaştırıldı mı? En az iki bağımsız halat, gerginlik eşitleme düzeni ve halat sonlandırmaları (soket/kelepçe) sağlam mı? Tamburda tek kat sarım ve taşıyıcı en alt konumdayken tamburda en az 1,5 ölü halat dönüşü kaldığı sayılarak doğrulandı mı? Halat sapma (filo) açısının 4°'yi aşmadığı ve halat/tambur-kasnak çap oranının en az 25 olduğu (tip plaka/doküman ile) kontrol edildi mi?", "ref": "TS EN 81-40 md.5.4.4.1 / 5.4.4.2 / 5.4.4.4 / TS EN 81-41 md.5.4.5.2 / 5.4.5.3 / 5.4.5.4.1 / 5.4.5.4.3"}, {"row": 33, "no": "C6", "t": "Zincir / dişli kayış askısı ve dişliler (81-40/81-41)", "d": "Zincir baklaları, pimler, bağlantılar ve dişli kayışta deformasyon, aşınma, çatlak, korozyon ve yağlama durumu gözle kontrol edildi mi? En az iki bağımsız zincir/kayış ve gerginlik eşitleme düzeni mevcut mu? Zincir çarkı/dişli sayısı (81-40'ta en az 16 diş, 81-41'de tahrik dişlisinde en az 16 diş ve en az 8 diş kavrama) ve zincir güvenlik faktörü (en az 10) ile 81-40'ta minimum kopma yükünün en az 8 kN olduğu plaka/sertifikadan doğrulandı mı? Zincir uzama sınırı için üretici kılavuz değeri kullanılıp ölçüm kaydedildi mi?", "ref": "TS EN 81-40 md.5.4.6.2 / 5.4.6.3 / TS EN 81-41 md.5.4.5.2.5 / 5.4.5.4.5 / 5.4.5.4.6"}, {"row": 34, "no": "C7", "t": "Gevşek halat/zincir ve anormal uzama cihazı", "d": "Askı elemanında gevşeme veya anormal uzama halinde motor ve fren beslemesini kesen elektrikli güvenlik cihazı fiilen çalıştırılarak (gevşetme simülasyonu veya anahtar tahriki ile) taşıyıcının durduğu ve halat/zincir yeniden gerilene kadar hareket edemediği doğrulandı mı? Halat/zincirin kasnak veya dişliden çıkmasını ve sıkışmasını önleyen koruyucular yerinde mi?", "ref": "TS EN 81-40 md.5.4.1.6 / md.5.4.1.7 / md.5.4.8.4 / TS EN 81-41 md.5.4.1.5 / md.5.4.1.6"}, {"row": 35, "no": "C8", "t": "Kremayer-pinyon kavraması (81-40/81-41)", "d": "Kremayer bağlantıları hizalı ve sağlam sabitlenmiş mi, diş hasarı/aşınma var mı? Her yük koşulunda doğru kavramanın (pinyon hatve dairesinin kremayer hatve çizgisiyle çakışması veya sapmanın modülün 1/3'ünü aşmaması) sağlandığı ve kılavuz makara/pabuçlara dayanmayan bir tutma düzeni bulunduğu kontrol edildi mi? Pinyon-mil sabitlemesi ve yabancı cisim girişine karşı koruma incelendi mi? Uygulanmıyorsa KD.", "ref": "TS EN 81-40 md.5.4.5.2 / TS EN 81-41 md.5.4.4.4 / md.5.4.4.5.1"}, {"row": 36, "no": "C9", "t": "Vida-somun tahriki ve emniyet somunu (81-41)", "d": "Vida bağlantıları ve yük taşıyan somun aşınması, üretici kılavuzunda belirtilen kontrol kriteriyle ölçülüp kaydedildi mi? Emniyet somununun döndüğü, yük taşıyan somun ile emniyet somunu arasındaki mesafenin doğru olduğu ve emniyet somunu elektrik kontağının doğru konumda çalıştığı fiilen kontrol edildi mi? Birden fazla vida varsa taşıyıcı zemin eğimi 1°'yi aştığında platformun durduğu denendi mi? Vidanın yağlama durumu ve durdurma emniyet cihazının son ayar mührü sağlam mı?", "ref": "TS EN 81-41 md.5.4.6.1.4 / 5.4.6.2.1 / 5.4.6.2.3.2 / 6.3.1 r) / 6.3.1 t)"}, {"row": 37, "no": "C10", "t": "Hidrolik devre bileşenleri ve sızıntı (81-41)", "d": "Kriko, borular, esnek hortumlar ve bağlantılarda sızıntı/deformasyon yok mu; hortumun üzerinde üretici adı, test basıncı ve test tarihi işareti okunuyor mu? Kapatma valfi, geri dönüşsüz valf, basınç tahliye valfi, basınç göstergesi, tank seviye kontrolü ve hava tahliye cihazı mevcut mu? Basınç tahliye valfinin tam yük basıncının en fazla %140'ına (yüksek iç kayıp gerekçesiyle en fazla %170'ine) ayarlı ve mühürlü olduğu manometreyle kontrol edildi mi? Hidrolik değilse KD.", "ref": "TS EN 81-41 md.5.4.9.5 / 5.4.9.8 - 5.4.9.10 / 5.4.9.14 / 5.4.9.15"}, {"row": 38, "no": "C11", "t": "Patlama valfi, kayma önleme, süre sınırlayıcı (81-41)", "d": "Hidroliklerde, taşıyıcının iniş seviyesinden 20 mm'den fazla kaymasının önlendiği (kayma önleme cihazı/mandal) ve son komuttan 15 dakika içinde en alt kata otomatik dönüş sağlandığı denendi mi? Patlama valfi/kısıtlayıcının silindir çıkışına doğrudan bağlı olduğu ve nominal iniş hızı + 0,15 m/s'de devreye girmek üzere tasarlandığı doğrulandı mı? Motor çalışma süresi sınırlayıcı (tam hareket süresini aşmayan süre; tam hareket süresi 10 s'den kısa ise en az 20 s) çalıştırılıp ancak yetkili personelin elle sıfırlamasıyla normale döndüğü görüldü mü?", "ref": "TS EN 81-41 md.5.4.9.12.2 / 5.4.9.17.1 / 5.4.9.17.3 / 5.4.9.21"}, {"row": 39, "no": "C12", "t": "Fren sistemi ve durma mesafesi (81-40/81-41)", "d": "Elektro-mekanik fren enerji/kontrol besleme kesilince otomatik devreye giriyor mu ve nominal hızdan durdurup yükü tutuyor mu? Güvenlik devresi açılarak yapılan hareket testinde durma mesafesinin en fazla 20 mm, yön sinyalinin bitiminde en fazla 50 mm (81-40) olduğu işaretli ölçümle bulunup kaydedildi mi? 81-41'de frenin mekanik parçalarının iki takım olduğu, durma doğruluğunun ±10 mm ve yeniden seviyelemenin ±20 mm olduğu ölçüldü mü? Elle açılan frenin açık kalması sürekli çaba gerektiriyor mu? Fren balatası aşınması/yağlanması kontrol edildi mi?", "ref": "TS EN 81-40 md.5.4.2.1 / 5.4.2.2 / 5.5.3.3 / TS EN 81-41 md.5.4.2.1 / 5.4.2.2 / 5.4.2.3"}, {"row": 40, "no": "C13", "t": "Emniyet tertibatı (paraşüt) durumu ve çalışması", "d": "Emniyet tertibatı taşıyıcıya takılı, muayene ve test için erişilebilir, ray/kremayerle temas parçaları hasarsız ve mühürleri (varsa) sağlam mı? Devreye girdiğinde elektrikli güvenlik cihazının derhal durdurma başlatıp yeniden çalışmayı engellediği, serbest bırakmanın yalnızca taşıyıcı yönü tersine hareket ettirilerek (81-40'ta yukarı) ve yetkili kişiyle yapıldığı doğrulandı mı? Devreye girme sonrası taşıyıcı eğiminin 81-40'ta sandalyede en çok 10°, platformda en çok 5°, 81-41'de en çok 5° olduğu ölçüldü mü? Test yöntemi üretici talimatına göre (ilk kullanım testinde nominal hız; 81-41'de nominal yük) uygulandı mı? Gerekmeyen tahrik tipinde KD.", "ref": "TS EN 81-40 md.5.3.1 / 5.3.3 / 5.3.5 / 6.4.1 i) / TS EN 81-41 md.5.3.1 / 6.3.1 j)"}, {"row": 41, "no": "C14", "t": "Aşırı hız regülatörü ve devreye girme hızı", "d": "Regülatörün ana tahrikten bağımsız, kontrol için erişilebilir olduğu ve dönüş yönünün işaretli olduğu, ayarının mühürlü olduğu görüldü mü? Devreye girme hızının 81-40'ta nominal hızın en az %115'i olup 0,3 m/s'yi aşmadığı, 81-41'de taşıyıcı 0,3 m/s'yi aşmadan emniyet tertibatının devreye alındığı kronometre/takometre ile kontrol edildi mi? Regülatör halatı kopma/aşırı gerilme anahtarı ve elektrikli güvenlik cihazı denenip makinenin durduğu görüldü mü? Sürtünme tahrikli regülatörde dönüşün durması halinde 10 s içinde besleme kesildiği (81-40) doğrulandı mı?", "ref": "TS EN 81-40 md.5.3.2 / 5.3.6 / 5.3.7 / TS EN 81-41 md.5.3.1.2 / 5.3.2.1 / 5.3.2.3"}, {"row": 42, "no": "C15", "t": "Yukarı yönde aşırı hız koruması (81-41 çekiş tahriki)", "d": "Karşı ağırlıklı çekiş tahrikli düşey platformlarda yükselen taşıyıcı aşırı hız koruma aracının veri plakası (üretici adı, gerçek devre kesme hızı, tip) okunuyor mu, aracın devreye girmesiyle elektrikli güvenlik cihazı çalışıyor mu ve serbest bırakma sonrası yetkili bakım müdahalesi gerekiyor mu? Çekiş tahrikli değilse KD.", "ref": "TS EN 81-41 md.5.4.13.4 / 5.4.13.6 / 5.4.13.11 / 6.3.1 s)"}, {"row": 43, "no": "C16", "t": "Terminal ve son limit cihazları", "d": "Terminal limit ve son limit cihazları taşıyıcının hareketiyle çalışacak şekilde mevcut mu ve taşıyıcı uç durdurucuya temas etmeden önce alt ve üst durak seviyelerinin ötesinde devreye girecek şekilde ayarlı mı? Son limit açıldığında her iki yönde hareketin engellendiği ve hizmete dönüşün otomatik olmayıp yetkili bakım müdahalesi gerektirdiği fiilen denendi mi? (Hidroliklerde veya gevşek halat/zincir cihazlı tahriklerde alt son limitin bulunmaması standart istisnasıdır.)", "ref": "TS EN 81-40 md.5.5.15.1 / md.5.5.15.2 / TS EN 81-41 md.5.5.15.5 / md.5.5.15.7"}, {"row": 44, "no": "C17", "t": "Acil durdurma (stop) cihazı", "d": "Taşıyıcı üzerindeki durdurma/acil stop cihazı (81-41'de ayrıca çukurda EN ISO 13850'ye uygun) kullanıcı tarafından açıkça görülebilir, erişilebilir ve kolay kullanılabilir mi? Cihaz çalıştırıldığında hareketin durduğu, cihaz kilitli konumdayken yeniden çalışmanın engellendiği ve kazara çalıştırmaya karşı korunduğu (81-40'ta çift kararlı şalter) test edildi mi?", "ref": "TS EN 81-40 md.5.5.14.2 / TS EN 81-41 md.5.5.15.4 / md.5.9.6"}, {"row": 45, "no": "C18", "t": "Elektrik güvenlik devresi ve güvenlik kontakları", "d": "Güvenlik zincirindeki her elektrikli güvenlik cihazı (kapı/kilit, emniyet tertibatı, regülatör, gevşek halat, hassas kenar, son limit, tuzak/denetim kapısı, çukur erişimi vb.) tek tek çalıştırılıp devrenin açıldığı ve hareketin engellendiği kanıtlandı mı? Güvenlik kontakları pozitif ayrılma ilkesine göre, dönüş/koruyucu iletkene konmamış, ehil olmayanlarca basit yollarla devre dışı bırakılamaz ve paralel bağlı (köprülenmiş) kayıt yok mu (izin verilen istisnalar hariç) gözle kontrol edilip kaydedildi mi?", "ref": "TS EN 81-40 md.5.5.6 / Ek F.1 b) / TS EN 81-41 md.5.5.11 / Tablo 9 / Ek D.1 b)"}, {"row": 46, "no": "C19", "t": "Yalıtım direnci, topraklama ve kaçak akım koruması", "d": "Her gerilimli iletken ile toprak arasında yalıtım direnci uygun test geriliminde ölçülüp kaydedildi mi (81-40: SELV 250 V DC ≥0,25 MΩ; ≤500 V 500 V DC ≥0,5 MΩ; >500 V 1 000 V DC ≥1,0 MΩ; 81-41: SELV/PELV 250 V DC ≥0,5 MΩ; ≤500 V 500 V DC ≥1,0 MΩ; >500 V 1 000 V DC ≥1 MΩ), elektronik devrede faz ve nötr birbirine bağlanarak ölçüldü mü? Topraklama sürekliliği ölçüldü mü? 81-40'ta prizler ve besleme 30 mA RCD ile korunuyor, RCD açma süresi (nominal akımda en fazla 200 ms, 5 katında en fazla 40 ms) test edildi mi; 81-41'de priz beslemesinin 30 mA RCD ile yapıldığı doğrulandı mı?", "ref": "TS EN 81-40 md.5.5.1.5 / md.5.5.11 / Ek F.1 c) / TS EN 81-41 md.5.5.3 / Tablo 8 / md.5.5.1.1 / Ek D.1 c)"}, {"row": 47, "no": "C20", "t": "Ana şalter, besleme, motor koruma ve akü sistemi", "d": "Ana şalter tanımlı, kilitlenebilir ve (81-41'de) aydınlatma ve bakım prizi devrelerini kesmiyor mu; etiketleri okunuyor mu (81-40 'Merdiven asansörü beslemesi'; 81-41 ana şalter tanımı, hidroliklerde 'Taşıyıcı en alt seviyedeyken kapatın')? Tahrik ünitesi gerilimi 500 V'u, kontrol devresi gerilimi (81-41) 250 V'u aşmıyor mu; motor aşırı akım/aşırı yük koruması var mı? Akülüyse kontrol gerilimi 60 V'u aşmıyor, akü terminalleri korunmuş, akü izolasyon anahtarı ve şarj noktası göstergesi var, akü sızıntı/duman yok mu?", "ref": "TS EN 81-40 md.5.5.1 / 5.5.12 / 7.4.5 / TS EN 81-41 md.5.5.1 / 5.5.12 / 5.5.14 / 7.5"}, {"row": 48, "no": "C21", "t": "Kumanda cihazları ve basılı tutarak çalışma", "d": "Taşıyıcı ve biniş noktası kumandaları çalışıyor mu; taşıyıcı üzerindeki hareket kumandaları basılı tutarak çalışma (basıldığı sürece hareket) özelliğinde mi ve etiketli mi? Düğme çalışma kuvvetinin 2,5-5,0 N aralığında ve düğmelerin aktif alanının çapı 20 mm'lik daireyi içerdiği kontrol edildi mi? Yükseklikler: 81-40 tekerlekli sandalye platformunda 800-1 100 mm; 81-41'de düğme merkezi zeminden en az 850 mm, taşıyıcıda en fazla 1 200 mm, katta en fazla 1 100 mm? Taşıyıcı işleminin kat çağrısını geçersiz kıldığı (81-41'de taşıyıcı doluyken kat çağrısı yok) ve 81-40'ta anahtarlı açma/kapama kilidi denendi mi?", "ref": "TS EN 81-40 md.5.5.14.1 / 5.5.14.3 / 5.5.14.4 / 5.5.14.5 / TS EN 81-41 md.5.5.15.1 / Tablo 10 / 5.5.15.2 / 5.5.15.3"}, {"row": 49, "no": "C22", "t": "Taşıyıcıda kişi algılama (81-41)", "d": "Taşıyıcı üzerinde bir kişiyi algılayan araç, kişi (veya eşdeğer test yükü) taşıyıcıdayken kat çağrılarını engelliyor mu? Algılama aracının arızası (bağlantı kesilmesi/simülasyon) izlenip arıza durumunda kat çağrılarının engellendiği ve algılama arızalı olsa da elektrikli güvenlik cihazlarının devre dışı kalmadığı doğrulandı mı? 81-40 kapsamında uygulanmaz (KD).", "ref": "TS EN 81-41 md.5.5.15.2.3 / 6.3.1 u)"}, {"row": 50, "no": "C23", "t": "Aşırı yük algılama cihazı (81-40 platform / 81-41)", "d": "Kalibre test ağırlıklarıyla kademeli yükleme yapılarak aşırı yük cihazının devreye girdiği yük değeri kaydedildi mi? 81-40 tekerlekli sandalye platformunda yük A noktası çevresinde eşit dağıtılırken nominal yükün %25 aşımında, 81-41'de nominal yükün 75 kg veya daha fazla aşımında normal çalışmayı engellediği, taşıyıcıda sesli ve görsel sinyal verildiği ve 81-41'de taşıyıcı kilit açma bölgesindeyken kat kapılarının kilitli kalmadığı görüldü mü? Oturan/ayakta platformlu merdiven asansörlerinde uygulanmaz (KD).", "ref": "TS EN 81-40 md.5.1.6.2 / md.6.4.1 n) / TS EN 81-41 md.5.1.7 / md.6.3.1 o)"}, {"row": 51, "no": "C24", "t": "Hassas kenar, fotosel ve ışık perdesi", "d": "Hassas kenarların/yüzeylerin (ayaklık alt ve üst kenarı, taşıyıcı alt yüzü, ray ile taşıyıcı arası boşluklar; 81-41'de açık kenarlarda ilk ışını zeminden en fazla 35 mm olan hassas kenar/fotosel/ışık perdesi) çalıştırıldığında taşıyıcının hareket yönünde durduğu ve karşı yönde hareketle engelin temizlenebildiği gösterildi mi? Çalıştırma kuvveti dinamometreyle ölçüldü mü (kenar en fazla 30 N; 81-40 hassas yüzey: 0,15 m² ve altında en fazla 50 N, üstünde en fazla 100 N; 81-41'de uçlarda ve orta noktada ortalama en fazla 30 N)? 81-41'de hassas kenar ile muhafaza/kat eşiği arasındaki yatay mesafenin en fazla 20 mm olduğu ölçüldü mü?", "ref": "TS EN 81-40 md.5.6.2.5 / 5.6.4.9 / Ek A.5 / Ek F.1 h) / TS EN 81-41 md.5.9.2 / Ek D.1 h)"}, {"row": 52, "no": "C25", "t": "Koltuk, ayaklık, kemer ve alt bariyer (81-40 koltuklu)", "d": "Koltuk, sırtlık, kolçak ve ayaklık sağlam, ayaklık yüzeyi kaymaz mı; ayaklığın kat zemininden yüksekliği en fazla 170 mm ve ayaklığın merdiven kenar çizgisine açıklığı en fazla 400 mm mi? Alt taraf bariyeri/emniyet kemeri/bariyer kolları açık konumdayken asansörün çalışmadığı (kilit anahtarı) ve kolçak/ayaklık açık değilken çalışmadığı denendi mi? Kayar/döner koltuk tam çalışma konumunda değilken elektrikli güvenlik cihazıyla hareketin engellendiği ve manuel koltuk kilidi serbest bırakma kuvvetinin en fazla 13,5 N olduğu ölçüldü mü?", "ref": "TS EN 81-40 md.5.6.2.1 / 5.6.2.2 / 5.6.2.3 / 5.6.2.4"}, {"row": 53, "no": "C26", "t": "Koltuk seviyeleme sistemi ve emniyeti (81-40 koltuklu)", "d": "Koltuk seviyesinin tüm hareket uzunluğunda yataydan ±5° içinde kaldığı, seviye yataydan ±10°'ye ulaşmadan elektrikli güvenlik cihazının makineyi durdurduğu ve dengeleme sürücüsü arızasında koltuğun 15°'den fazla eğilmesi mümkünse seviyeleme emniyet tertibatının koltuk 17°'ye ulaşmadan durdurduğu (yalnız üretici test yöntemi/yeterli güvenli düzenekle) kontrol edildi mi? Seviyeleme emniyetinin kontrol için erişilebilir olduğu görüldü mü? Koltuk seviyelemesiz tipte KD.", "ref": "TS EN 81-40 md.5.6.2.6.2 - 5.6.2.6.6 / md.5.6.2.6.9 / Ek A.4"}, {"row": 54, "no": "C27", "t": "Bariyer kolları, rampalar ve kilitleri (81-40 platform)", "d": "Alt kat ucunda (ve gereken hallerde üst uçta) bariyer kolu mevcut ve platform seviyesinden yüksekliği ayakta duran platformda 900-1 100 mm, tekerlekli sandalye platformunda 800-1 000 mm mi; bitişik bariyer kolları arasındaki boşluk 100-150 mm arasında mı? Bariyer kolları uzatılmış/rampalar kalkık konumda değilken çalışmanın engellendiği denendi mi? Platform biniş seviyesinden 50 mm'den (veya ray boyunca 150 mm'den) fazla uzaktayken bariyerin açılamadığı, bariyer hareket kuvvetinin en fazla 70 N ve acil durum kilit açmanın yalnızca alet/eşdeğer cihazla yapılabildiği doğrulandı mı? Rampa eğimi 1:4 (50 mm'ye kadar) / 1:6 (75 mm'ye kadar) sınırlarında mı?", "ref": "TS EN 81-40 md.5.6.3.2 / 5.6.4.4 / 5.6.4.5.3 / 5.6.4.6 / 5.6.4.7 / 5.6.4.8"}, {"row": 55, "no": "C28", "t": "Platform zemini, korkuluk ve tırabzan (81-40 platform)", "d": "Platform zemini kaymaz malzemeyle kaplı ve eşik biniş zemininden renk olarak ayrışıyor mu? Platformun kılavuz tarafında en az 1 000 mm yüksekliğe uzanan sağlam yan yapı ve zeminden 800-1 000 mm yükseklikte, yan panelden en az 30 mm aralıklı tırabzan var mı? Erişim olmayan kenarlarda en az 75 mm yüksekliğinde yuvarlanma koruması bulunuyor mu? Ayakta duran platformda temel boyutun en az 325 mm x 350 mm ve el tutamağı bulunuyor mu? Tekerlekli sandalye platformunda net yükleme alanı ve platform ölçüleri (ör. tavsiye edilen en az 700 mm x 900 mm) ölçülerek kaydedildi mi?", "ref": "TS EN 81-40 md.5.6.3.1 / 5.6.4.1 / 5.6.4.2 / 5.6.4.4.3 / 5.6.4.5"}, {"row": 56, "no": "C29", "t": "Kat kapıları ve kapı kilitleme cihazları (81-41)", "d": "Kat kapısı açıkken platformun çalışmaya başlamasının veya hareketini sürdürmesinin engellendiği, kapı kapalı konumunu izleyen elektrikli güvenlik cihazı çalıştırılarak doğrulandı mı? Taşıyıcı zemini kapı eşiğinden dikey olarak 50 mm'den fazla uzaktayken kapının açılamadığı denendi mi? Kilit elemanlarının en az 7 mm kavrama yaptıktan sonra güvenlik kontağının kapandığı (kontak/kavrama ölçümü) ve kilit mekanizmasının yerçekimi/yay/mıknatısla çalıştığı, kirlenme ve aşınmaya karşı sağlam olduğu kontrol edildi mi? Kilitin açılma yönünde en az 3 000 N'a dayanacak yapıda olduğu tip doğrulama belgesinden teyit edildi mi?", "ref": "TS EN 81-41 md.5.8.5.1 - 5.8.5.9 / Ek D.1 a)"}, {"row": 57, "no": "C30", "t": "Kat kapısı acil kilit açma, ölçü ve boşlukları (81-41)", "d": "Kat kapısı yalnızca özel anahtar/kilit açma üçgeni ile kuyu dışından açılabiliyor ve alet kullanmadan kapatılıp kilitlenebiliyor mu; kilit açma anahtarı üzerinde uyarı etiketi var mı? Girişin net genişliği en az 800 mm (istisna 500 mm) ve net yüksekliği en az 2 000 mm mi (mevcut binalarda en az 1,80 m); kapı açma kuvveti tutamakta en fazla 40 N mi; kapı çevresindeki boşluklar en fazla 6 mm mi; elektrikli kapılarda bekleme süresi ayarı 2-20 s aralığında ve kullanıcıya kapalı mı? Kapı kendi kendine kapanıyor ve kaldırma yoluna açılmıyor mu?", "ref": "TS EN 81-41 md.5.8.2 / 5.8.3 / 5.8.4.4 / 5.8.6 / 5.8.7.2 / 7.9.2"}, {"row": 58, "no": "C31", "t": "Kapalı kaldırma yolu, çukur ve mekanik engelleme (81-41)", "d": "Muhafaza duvarları düz, sürekli ve 5 mm'yi aşan girinti/çıkıntı içermiyor mu; muhafaza yüksekliği en üst kat zemininden yükselme yüksekliği 3 m'ye kadar en az 1,1 m, 3 m'den fazlada en az 2,0 m mi? Üst açıklık (taşıyıcı üst durdurucuya temas ederken) en az 2 m mi? Havalandırma açıklığı net yükleme alanının en az %2'si ve 10 mm çubuk geçirmiyor mu? Denetim kapıları/tuzaklar anahtarla açılıyor ve kapalı konumu elektrikli güvenlik cihazıyla izleniyor mu? Taşıyıcı altında çalışma için gereken mekanik engelleme cihazı mevcut, elektrikle
